<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORNINGS IN AMERICA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scale(0.995);
        background: #000;
      }
      #unmute-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.6);
        font-size: 22px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      #unmute-btn:hover {
        background: rgba(0, 0, 0, 0.7);
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <video
      id="mornings"
      src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/MORNINGS.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>
    <button id="unmute-btn" title="Toggle sound">🔇</button>
    <script>
      const vid = document.getElementById("mornings");
      const btn = document.getElementById("unmute-btn");
      btn.addEventListener("click", () => {
        vid.muted = !vid.muted;
        btn.textContent = vid.muted ? "🔇" : "🔊";
      });
      vid.addEventListener("ended", () => {
        window.location.href = "/landing.html";
      });
    </script>
  </body>
</html>
