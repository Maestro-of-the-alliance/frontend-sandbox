<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ALLIANCE — FIELD TEST</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff;
      }

      /* ── PHASE CONTAINERS ── */
      .phase {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }
      .phase.active {
        display: flex;
      }

      /* ── PROMPT PHASE ── */
      #phase-prompt {
        background: #0d1117;
      }

      .prompt-eyebrow {
        font-size: 11px;
        letter-spacing: 0.35em;
        color: rgba(215, 168, 75, 0.6);
        text-transform: uppercase;
        margin-bottom: 48px;
        text-align: center;
      }
      .prompt-counter {
        font-size: 11px;
        letter-spacing: 0.25em;
        color: rgba(255, 255, 255, 0.2);
        text-transform: uppercase;
        margin-bottom: 28px;
        text-align: center;
      }
      .prompt-question {
        font-size: clamp(20px, 4vw, 34px);
        font-weight: 300;
        color: #fff;
        line-height: 1.35;
        margin-bottom: 48px;
        text-align: center;
        max-width: 540px;
      }
      .prompt-question em {
        font-style: normal;
        color: #d7a84b;
        font-weight: 400;
      }

      .prompt-input {
        background: transparent;
        border: none;
        border-bottom: 2px solid rgba(215, 168, 75, 0.4);
        color: #d7a84b;
        font-size: clamp(20px, 4vw, 32px);
        font-family: inherit;
        text-align: center;
        width: min(320px, 90%);
        padding: 8px 0;
        outline: none;
        transition: border-color 0.2s;
        display: block;
        margin: 0 auto 16px;
      }
      .prompt-input:focus {
        border-color: #d7a84b;
      }
      .prompt-input::placeholder {
        color: rgba(215, 168, 75, 0.22);
      }

      .btn-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
      }

      .btn-af-one {
        background: transparent;
        border: 1px solid rgba(215, 168, 75, 0.25);
        color: rgba(215, 168, 75, 0.55);
        font-family: inherit;
        font-size: 11px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        padding: 8px 20px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-af-one:hover {
        border-color: rgba(215, 168, 75, 0.6);
        color: rgba(215, 168, 75, 0.9);
      }

      .btn-next {
        background: rgba(215, 168, 75, 0.1);
        border: 1px solid rgba(215, 168, 75, 0.35);
        color: #d7a84b;
        font-family: inherit;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        padding: 12px 32px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-next:hover {
        background: rgba(215, 168, 75, 0.2);
      }
      .btn-next:disabled {
        opacity: 0.3;
        cursor: default;
        pointer-events: none;
      }

      .btn-af-all {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.18);
        font-family: inherit;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        cursor: pointer;
        transition: color 0.2s;
        padding: 4px;
      }
      .btn-af-all:hover {
        color: rgba(255, 255, 255, 0.5);
      }

      /* ── REVEAL PHASE ── */
      #phase-reveal {
        background: #0d1117;
        justify-content: flex-start;
        overflow-y: auto;
        padding-top: 60px;
        padding-bottom: 100px;
      }

      .word-list-container {
        width: min(700px, 100%);
        margin: 0 auto 56px;
        text-align: center;
      }
      .word-list-label {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: rgba(215, 168, 75, 0.4);
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .word-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .word-chip {
        font-size: clamp(13px, 2vw, 16px);
        color: #d7a84b;
        padding: 6px 14px;
        border: 1px solid rgba(215, 168, 75, 0.3);
        border-radius: 2px;
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
        background: rgba(215, 168, 75, 0.05);
      }
      .word-chip.used {
        opacity: 0.08;
      }

      /* quote stage */
      .quote-stage {
        width: min(700px, 100%);
        margin: 0 auto;
        min-height: 280px;
        position: relative;
      }

      canvas#quoteCanvas {
        display: block;
        width: 100%;
      }

      /* choice bar */
      .choice-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 20px 24px;
        background: linear-gradient(transparent, rgba(13, 17, 23, 0.98));
        opacity: 0;
        transition: opacity 0.8s ease;
        pointer-events: none;
        z-index: 50;
      }
      .choice-bar.visible {
        opacity: 1;
        pointer-events: all;
      }
      .choice {
        font-family: inherit;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(215, 168, 75, 0.45);
        cursor: pointer;
        padding: 10px 20px;
        border: 1px solid transparent;
        background: transparent;
        transition: all 0.2s;
      }
      .choice.primary {
        color: #d7a84b;
        border-color: rgba(215, 168, 75, 0.4);
      }
      .choice:hover {
        color: #eee2bd;
        border-color: rgba(215, 168, 75, 0.5);
      }
    </style>
  </head>
  <body>
    <!-- PROMPT PHASE -->
    <div class="phase active" id="phase-prompt">
      <div class="prompt-eyebrow">A quick exercise before we continue</div>
      <div class="prompt-counter" id="promptCounter">Word 1 of —</div>
      <div class="prompt-question" id="promptQuestion"></div>
      <input
        class="prompt-input"
        id="promptInput"
        type="text"
        placeholder="your answer"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <div class="btn-row">
        <button class="btn-af-one" id="btnAfOne">autofill this one</button>
        <button class="btn-next" id="btnNext" disabled>Next →</button>
        <button class="btn-af-all" id="btnAfAll">autofill all remaining</button>
      </div>
    </div>

    <!-- REVEAL PHASE -->
    <div class="phase" id="phase-reveal">
      <div class="word-list-container">
        <div class="word-list-label">Your words</div>
        <div class="word-list" id="wordList"></div>
      </div>
      <div class="quote-stage">
        <canvas id="quoteCanvas"></canvas>
      </div>
    </div>

    <div class="choice-bar" id="choiceBar">
      <button class="choice" id="btnRestart">Try Again</button>
      <button class="choice" id="btnBackHS">↩ Handshake</button>
      <button class="choice primary" id="btnProceed">Proceed ▶▶</button>
    </div>

    <script>

          ],
          attribution: "Arthur Summerfield, U.S. Postmaster General — 1959",
        },
        {
          id: "goldwyn_pay",
          parts: [
            "I include myself among the ",
            { b: 0, real: "millions" },
            " who will be unable to ",
            { b: 1, real: "pay" },
            " for ",

            ".",
          ],
          prompts: [
            {
              q: "a once large sum of money",
              af: [
                "billions",
                "thousands",
                "a fortune",
                "untold masses",
                "seventy-seven percent",
              ],
            },
            {
              q: "a man traditionally does this on a date",
              af: ["pay", "propose", "cry", "brag", "overcook"],
            },
            {
              q: "piece of tech that's both a noun and a verb",
              af: ["Google", "Zoom", "Uber", "TiVo", "Snapchat"],
            },
          ],
          attribution: "Samuel Goldwyn, co-founder of MGM",
        },
        {
          id: "ericksen",
          parts: [
            "The abdomen, the ",
            { b: 0, real: "chest" },
            ", and the ",
            { b: 1, real: "brain" },
            " will forever be shut from the ",
            { b: 2, real: "intrusion" },
            " of the wise and humane surgeon.",
          ],
          prompts: [
            {
              q: "a place for keepsakes",
              af: ["chest", "trunk", "vault", "attic", "hope chest"],
            },
            {
              q: "tenant outreach",
              af: [
                "landlord",
                "super",
                "management",
                "building brain",
                "property oversight",
              ],
            },
            {
              q: "what targeted ads begin to feel like",
              af: [
                "intrusion",
                "invasion",
                "harassment",
                "surveillance",
                "ambush",
              ],
            },
          ],
          attribution:
            "Sir John Eric Ericksen, Surgeon to Queen Victoria — 1873",
        },
      ];

      // ── STORAGE ─────────────────────────────────────────────────────────
      const ML_SEEN = "atf_ml_seen";
      const COMP = "atf_completion";

      function getSeen() {
        try {
          return JSON.parse(localStorage.getItem(ML_SEEN) || "[]");
        } catch (e) {
          return [];
        }
      }
      function markSeen(ids) {
        let s = getSeen();
        ids.forEach((id) => {
          if (!s.includes(id)) s.push(id);
        });
        if (s.length >= QUOTES.length) s = [];
        localStorage.setItem(ML_SEEN, JSON.stringify(s));
        try {
          let c = JSON.parse(localStorage.getItem(COMP) || "{}");
          if (!c.madlib) c.madlib = [];
          ids.forEach((id) => {
            if (!c.madlib.includes(id)) c.madlib.push(id);
          });
          localStorage.setItem(COMP, JSON.stringify(c));
        } catch (e) {}
      }
      function pickThree() {
        const seen = getSeen();
        const unseen = QUOTES.filter((q) => !seen.includes(q.id));
        const pool = unseen.length >= 3 ? unseen : QUOTES;
        return [...pool].sort(() => Math.random() - 0.5).slice(0, 3);
      }

      // ── STATE ────────────────────────────────────────────────────────────
      let selectedQuotes = [];
      let allBlanks = []; // {qi, bi, prompt, autofills}
      let answers = [];
      let currentB = 0;

      function init() {
        selectedQuotes = pickThree();
        allBlanks = [];
        answers = [];
        selectedQuotes.forEach((q, qi) => {
          q.parts.forEach((p, pi) => {
            if (p && typeof p === "object") {
              allBlanks.push({
                qi,
                pi,
                prompt: q.prompts[p.b].q,
                autofills: q.prompts[p.b].af,
                real: p.real,
              });
              answers.push(null);
            }
          });
        });
        // shuffle blanks
        for (let i = allBlanks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allBlanks[i], allBlanks[j]] = [allBlanks[j], allBlanks[i]];
          [answers[i], answers[j]] = [answers[j], answers[i]];
        }
        currentB = 0;
        showPromptPhase();
      }

      // ── PROMPT PHASE ─────────────────────────────────────────────────────
      function showPromptPhase() {
        document.getElementById("phase-prompt").classList.add("active");
        document.getElementById("phase-reveal").classList.remove("active");
        document.getElementById("choiceBar").classList.remove("visible");
        renderPrompt();
      }

      function renderPrompt() {
        const b = allBlanks[currentB];
        document.getElementById("promptCounter").textContent =
          `Word ${currentB + 1} of ${allBlanks.length}`;
        const q = b.prompt;
        document.getElementById("promptQuestion").innerHTML =
          q.charAt(0).toUpperCase() + q.slice(1);
        const inp = document.getElementById("promptInput");
        inp.value = "";
        inp.focus();
        document.getElementById("btnNext").disabled = true;
      }

      document
        .getElementById("promptInput")
        .addEventListener("input", function () {
          document.getElementById("btnNext").disabled =
            this.value.trim().length === 0;
        });
      document
        .getElementById("promptInput")
        .addEventListener("keydown", (e) => {
          if (
            e.key === "Enter" &&
            document.getElementById("promptInput").value.trim()
          )
            advance();
        });
      document.getElementById("btnNext").addEventListener("click", advance);

      function advance() {
        const val = document.getElementById("promptInput").value.trim();
        if (!val) return;
        answers[currentB] = val;
        currentB++;
        if (currentB >= allBlanks.length) showRevealPhase();
        else renderPrompt();
      }

      document.getElementById("btnAfOne").addEventListener("click", () => {
        const af = allBlanks[currentB].autofills;
        document.getElementById("promptInput").value =
          af[Math.floor(Math.random() * af.length)];
        document.getElementById("btnNext").disabled = false;
      });

      document.getElementById("btnAfAll").addEventListener("click", () => {
        for (let i = currentB; i < allBlanks.length; i++) {
          if (!answers[i])
            answers[i] =
              allBlanks[i].autofills[
                Math.floor(Math.random() * allBlanks[i].autofills.length)
              ];
        }
        document.getElementById("promptInput").value = answers[currentB];
        document.getElementById("btnNext").disabled = false;
        setTimeout(showRevealPhase, 300);
      });

      // ── REVEAL PHASE ─────────────────────────────────────────────────────
      function showRevealPhase() {
        markSeen(selectedQuotes.map((q) => q.id));
        document.getElementById("phase-prompt").classList.remove("active");
        document.getElementById("phase-reveal").classList.add("active");

        // build answer lookup: {qi: {bi: answer}}
        const ansMap = {};
        allBlanks.forEach((b, i) => {
          if (!ansMap[b.qi]) ansMap[b.qi] = {};
          ansMap[b.qi][b.bi] = answers[i];
        });

        // render word list chips
        const wordList = document.getElementById("wordList");
        wordList.innerHTML = "";
        // show answers in the order they were answered (shuffled order)
        allBlanks.forEach((b, i) => {
          const chip = document.createElement("div");
          chip.className = "word-chip";
          chip.id = `chip-${i}`;
          chip.textContent = answers[i];
          wordList.appendChild(chip);
        });

        // setup canvas
        const canvas = document.getElementById("quoteCanvas");
        const stage = canvas.parentElement;
        canvas.width = stage.offsetWidth * window.devicePixelRatio;
        canvas.height = 380 * window.devicePixelRatio;
        canvas.style.height = "380px";
        const ctx = canvas.getContext("2d");
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        const W = stage.offsetWidth;
        const H = 380;

        // run the three-quote sequence
        runQuoteSequence(ctx, W, H, ansMap, 0);
      }

      // ── CANVAS SEQUENCE ───────────────────────────────────────────────────
      function runQuoteSequence(ctx, W, H, ansMap, qi) {
        if (qi >= selectedQuotes.length) {
          // all done
          document.getElementById("choiceBar").classList.add("visible");
          return;
        }

        const q = selectedQuotes[qi];

        // build token list for this quote
        // each token: {text, isBlank, blankIdx (into allBlanks), answer, real}
        const tokens = [];
        q.parts.forEach((p, pi) => {
          if (typeof p === "string") {
            tokens.push({ text: p, isBlank: false });
          } else {
            // find which allBlanks entry corresponds to this qi/pi
            const bIdx = allBlanks.findIndex((b) => b.qi === qi && b.pi === pi);
            tokens.push({
              text: answers[bIdx],
              isBlank: true,
              bIdx,
              real: p.real,
            });
          }
        });

        // STEP 1: fade blank words from chip list, fade in at positions
        // STEP 2: diffuse rest of mad lib quote around them (left to right)
        // STEP 3: hold 1s
        // STEP 4: diffuse real quote in (left to right) replacing answers
        // STEP 5: hold 1s
        // STEP 6: fade in attribution
        // STEP 7: hold 1.5s then fade everything, next quote

        const FONT_SIZE = Math.min(18, W / 28);
        const LINE_H = FONT_SIZE * 1.7;
        const GOLD = "#d7a84b";
        const WHITE = "#e8e0cc";
        const DIM = "rgba(232,224,204,0.55)";
        const ATTR_COLOR = "rgba(215,168,75,0.7)";

        // layout tokens into wrapped lines
        ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;
        const MARGIN = 32;
        const maxW = W - MARGIN * 2;

        function layoutTokens(toks, useReal) {
          // returns array of {x,y,text,isBlank} positioned
          const words = [];
          toks.forEach((t) => {
            const txt = useReal && t.isBlank ? t.real : t.text;
            // split on spaces but keep them
            const parts = txt.split(/(\s+)/);
            parts.forEach((p) => {
              if (p) words.push({ text: p, isBlank: t.isBlank, bIdx: t.bIdx });
            });
          });

          const placed = [];
          let x = MARGIN,
            y = FONT_SIZE + 20;
          words.forEach((w) => {
            const tw = ctx.measureText(w.text).width;
            if (x + tw > MARGIN + maxW && w.text.trim()) {
              x = MARGIN;
              y += LINE_H;
            }
            placed.push({
              x,
              y,
              text: w.text,
              isBlank: w.isBlank,
              bIdx: w.bIdx,
              w: tw,
            });
            x += tw;
          });
          return placed;
        }

        // diffusion particle effect for a single word appearing at position
        function diffuseWord(ctx, text, tx, ty, color, progress) {
          // progress 0→1
          // at low progress: scattered random chars around position, blurry
          // at high progress: clear text at position
          const p = Math.max(0, Math.min(1, progress));
          const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p; // ease in out

          ctx.save();
          ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;

          if (ease < 0.85) {
            // scatter phase — draw noisy chars around target
            const scatter = (1 - ease) * 28;
            const numParts = Math.floor(8 * (1 - ease));
            const chars = "▓▒░█▄▀■□▪▫◆◇○●";
            ctx.globalAlpha = Math.min(1, ease * 2) * 0.6;
            ctx.fillStyle = color;
            for (let i = 0; i < numParts; i++) {
              const nx = tx + (Math.random() - 0.5) * scatter * 2;
              const ny = ty + (Math.random() - 0.5) * scatter * 0.6;
              ctx.fillText(
                chars[Math.floor(Math.random() * chars.length)],
                nx,
                ny,
              );
            }
          }

          // draw actual text fading in
          ctx.globalAlpha = ease;
          ctx.fillStyle = color;
          ctx.fillText(text, tx, ty);
          ctx.restore();
        }

        // full sequence animation
        let phase = "blank-fade-in"; // phases: blank-fade-in, madlib-diffuse, hold-madlib, real-diffuse, hold-real, attribution, hold-attr, fade-out
        let phaseStart = performance.now();
        let madlibLayout = null;
        let realLayout = null;
        let attrAlpha = 0;
        let overallAlpha = 1;

        // mark chips as used for this quote
        allBlanks.forEach((b, i) => {
          if (b.qi === qi) {
            const chip = document.getElementById(`chip-${i}`);
            if (chip) chip.classList.add("used");
          }
        });

        function frame(now) {
          const elapsed = now - phaseStart;
          ctx.clearRect(0, 0, W, H);
          ctx.save();
          ctx.globalAlpha = overallAlpha;

          if (!madlibLayout) madlibLayout = layoutTokens(tokens, false);
          if (!realLayout) realLayout = layoutTokens(tokens, true);

          // total diffuse duration spreads words left to right
          const DIFFUSE_TOTAL = 2200; // ms for all words to appear
          const HOLD = 1000;
          const ATTR_FADE = 600;
          const ATTR_HOLD = 1200;
          const FADE_OUT = 700;

          if (phase === "blank-fade-in") {
            // show blank words already in position (they faded from list)
            // duration: 600ms
            const p = Math.min(1, elapsed / 600);
            madlibLayout.forEach((w) => {
              if (w.isBlank) {
                ctx.save();
                ctx.globalAlpha = p;
                ctx.fillStyle = GOLD;
                ctx.font = `500 ${FONT_SIZE}px -apple-system, sans-serif`;
                ctx.fillText(w.text, w.x, w.y);
                ctx.restore();
              }
            });
            if (p >= 1) {
              phase = "madlib-diffuse";
              phaseStart = now;
            }
          } else if (phase === "madlib-diffuse") {
            // diffuse non-blank words left to right around the blanks
            // blanks stay solid
            const nonBlanks = madlibLayout.filter(
              (w) => !w.isBlank && w.text.trim(),
            );
            const perWord = DIFFUSE_TOTAL / Math.max(1, nonBlanks.length);

            // draw blanks solid
            madlibLayout.forEach((w) => {
              if (w.isBlank) {
                ctx.save();
                ctx.fillStyle = GOLD;
                ctx.font = `500 ${FONT_SIZE}px -apple-system, sans-serif`;
                ctx.fillText(w.text, w.x, w.y);
                ctx.restore();
              }
            });

            // diffuse each non-blank in sequence
            let anyPending = false;
            nonBlanks.forEach((w, wi) => {
              const wordStart = wi * perWord * 0.7; // overlap slightly
              const wordElapsed = elapsed - wordStart;
              const wordDur = perWord * 1.4;
              const p = Math.min(1, Math.max(0, wordElapsed / wordDur));
              if (p < 1) anyPending = true;
              diffuseWord(ctx, w.text, w.x, w.y, DIM, p);
            });

            if (!anyPending && elapsed > DIFFUSE_TOTAL) {
              phase = "hold-madlib";
              phaseStart = now;
            }
          } else if (phase === "hold-madlib") {
            // draw complete mad lib
            madlibLayout.forEach((w) => {
              ctx.save();
              ctx.font = w.isBlank
                ? `500 ${FONT_SIZE}px -apple-system, sans-serif`
                : `${FONT_SIZE}px -apple-system, sans-serif`;
              ctx.fillStyle = w.isBlank ? GOLD : DIM;
              ctx.globalAlpha = 1;
              ctx.fillText(w.text, w.x, w.y);
              ctx.restore();
            });
            if (elapsed >= HOLD) {
              phase = "real-diffuse";
              phaseStart = now;
            }
          } else if (phase === "real-diffuse") {
            // diffuse real quote in, replacing everything left to right
            const allWords = realLayout.filter((w) => w.text.trim());
            const perWord = DIFFUSE_TOTAL / Math.max(1, allWords.length);

            allWords.forEach((w, wi) => {
              const wordStart = wi * perWord * 0.65;
              const wordElapsed = elapsed - wordStart;
              const wordDur = perWord * 1.5;
              const p = Math.min(1, Math.max(0, wordElapsed / wordDur));
              const color = w.isBlank ? WHITE : WHITE;
              ctx.save();
              ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;
              diffuseWord(ctx, w.text, w.x, w.y, color, p);
              ctx.restore();
            });

            const lastWordStart = (allWords.length - 1) * perWord * 0.65;
            if (elapsed > lastWordStart + perWord * 1.5 + 200) {
              phase = "hold-real";
              phaseStart = now;
            }
          } else if (phase === "hold-real") {
            realLayout.forEach((w) => {
              ctx.save();
              ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;
              ctx.fillStyle = WHITE;
              ctx.fillText(w.text, w.x, w.y);
              ctx.restore();
            });
            if (elapsed >= HOLD) {
              phase = "attribution";
              phaseStart = now;
            }
          } else if (phase === "attribution") {
            // draw real quote
            realLayout.forEach((w) => {
              ctx.save();
              ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;
              ctx.fillStyle = WHITE;
              ctx.fillText(w.text, w.x, w.y);
              ctx.restore();
            });
            // fade in attribution below
            attrAlpha = Math.min(1, elapsed / ATTR_FADE);
            const attrY =
              (realLayout[realLayout.length - 1]?.y || 80) + LINE_H * 1.4;
            ctx.save();
            ctx.globalAlpha = attrAlpha;
            ctx.fillStyle = ATTR_COLOR;
            ctx.font = `11px -apple-system, sans-serif`;
            ctx.letterSpacing = "0.15em";
            ctx.fillText(
              ("— " + selectedQuotes[qi].attribution).toUpperCase(),
              MARGIN,
              attrY,
            );
            ctx.restore();
            if (elapsed >= ATTR_FADE + ATTR_HOLD) {
              phase = "fade-out";
              phaseStart = now;
            }
          } else if (phase === "fade-out") {
            overallAlpha = Math.max(0, 1 - elapsed / FADE_OUT);
            // draw real quote + attr at fading alpha
            realLayout.forEach((w) => {
              ctx.save();
              ctx.font = `${FONT_SIZE}px -apple-system, sans-serif`;
              ctx.fillStyle = WHITE;
              ctx.fillText(w.text, w.x, w.y);
              ctx.restore();
            });
            const attrY =
              (realLayout[realLayout.length - 1]?.y || 80) + LINE_H * 1.4;
            ctx.save();
            ctx.fillStyle = ATTR_COLOR;
            ctx.font = `11px -apple-system, sans-serif`;
            ctx.fillText(
              ("— " + selectedQuotes[qi].attribution).toUpperCase(),
              MARGIN,
              attrY,
            );
            ctx.restore();

            if (overallAlpha <= 0) {
              ctx.restore();
              overallAlpha = 1;
              madlibLayout = null;
              realLayout = null;
              // next quote
              setTimeout(
                () => runQuoteSequence(ctx, W, H, ansMap, qi + 1),
                400,
              );
              return;
            }
          }

          ctx.restore();
          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      // ── CHOICES ──────────────────────────────────────────────────────────
      document.getElementById("btnProceed").addEventListener("click", () => {
        window.location.href = "/flyby.html";
      });
      document.getElementById("btnRestart").addEventListener("click", init);
      document.getElementById("btnBackHS").addEventListener("click", () => {
        window.location.href = "/handshake.html";
      });

      // ── START ─────────────────────────────────────────────────────────────
      window.addEventListener("load", init);
    </script>
  </body>
</html>
