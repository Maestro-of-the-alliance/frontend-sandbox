<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART — The Alliance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #050508;
        --gallery-wall: #0a0a0f;
        --cyan: #00e5ff;
        --cyan-dim: rgba(0, 229, 255, 0.15);
        --warm-spot: rgba(255, 240, 200, 0.92);
        --spot-glow: rgba(255, 230, 160, 0.18);
        --plaque-text: #b8a880;
        --nw-page-accent: var(--cyan);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--void);
        color: #e8e4dc;
        font-family: "Rajdhani", sans-serif;
        overflow: hidden;
      }
      .art-view {
        position: fixed;
        inset: 0;
        display: none;
      }
      #view-storefront.active {
        display: block;
      }

      /* ── STOREFRONT ── */
      .art-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(0.9) contrast(1.05);
      }
      .art-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(5, 5, 8, 0.6) 88%,
          rgba(5, 5, 8, 0.94) 100%
        );
        pointer-events: none;
      }
      .art-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 24px;
        font-family: "Share Tech Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.3em;
        color: var(--plaque-text);
        text-transform: uppercase;
        z-index: 3;
      }
      .art-header .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 8px var(--cyan);
        margin-right: 8px;
        vertical-align: middle;
        animation: artBlink 2.2s ease-in-out infinite;
      }
      @keyframes artBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      .art-doors-hotspot {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        width: min(36vw, 320px);
        height: min(48vh, 420px);
        cursor: pointer;
        border: none;
        background: transparent;
        z-index: 2;
      }
      .art-doors-hint {
        position: absolute;
        left: 50%;
        bottom: 10%;
        transform: translateX(-50%);
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        z-index: 3;
        pointer-events: none;
        animation: artHintPulse 2.4s ease-in-out infinite;
        text-align: center;
      }
      @keyframes artHintPulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      .art-flash {
        position: fixed;
        inset: 0;
        background: var(--warm-spot);
        opacity: 0;
        pointer-events: none;
        z-index: 50;
      }
      .art-flash.firing {
        animation: artFlash 0.5s ease-out forwards;
      }
      @keyframes artFlash {
        0% {
          opacity: 0;
        }
        35% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
        }
      }

      /* ── CHOICE VIEW ── */
      #view-choice {
        background: radial-gradient(
          ellipse at center 40%,
          var(--gallery-wall) 0%,
          var(--void) 75%
        );
        padding: 24px;
      }
      #view-choice.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .art-choice-wrap {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .art-eyebrow {
        font-family: "Share Tech Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.4em;
        color: var(--plaque-text);
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .art-choice-wrap h1 {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        font-size: clamp(28px, 6vw, 42px);
        letter-spacing: 0.03em;
        color: #f2ede0;
        margin-bottom: 44px;
        text-shadow: 0 0 24px var(--spot-glow);
      }
      .art-choice-wrap h1 span {
        color: var(--cyan);
      }
      .art-choice-buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
      }
      .art-choice-btn {
        font-family: "Share Tech Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 18px 36px;
        border: 1px solid rgba(184, 168, 128, 0.35);
        background: rgba(255, 255, 255, 0.02);
        color: #e8e4dc;
        cursor: pointer;
        transition: all 0.25s;
        min-width: 280px;
      }
      .art-choice-btn:hover {
        border-color: var(--cyan);
        box-shadow: 0 0 20px var(--cyan-dim);
        color: var(--cyan);
      }
      .art-choice-btn-primary {
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 0 0 14px var(--cyan-dim);
      }
      .art-choice-btn-primary:hover {
        box-shadow: 0 0 26px rgba(0, 229, 255, 0.4);
      }
      .art-exit {
        margin-top: 36px;
        background: transparent;
        border: none;
        color: var(--plaque-text);
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 10px;
        opacity: 0.7;
      }
      .art-exit:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="art-flash" id="art-flash"></div>

    <!-- STOREFRONT -->
    <div class="art-view active" id="view-storefront">
      <img class="art-photo" src="/art-images/storefront.jpg" alt="ART of the Alliance gallery entrance" />
      <div class="art-vignette"></div>
      <div class="art-header"><span class="dot"></span>ART of The ALLIANCE</div>
      <button class="art-doors-hotspot" id="art-doors" aria-label="Enter the gallery"></button>
      <div class="art-doors-hint">Tap the doors to enter</div>
    </div>

    <!-- CHOICE -->
    <div class="art-view" id="view-choice">
      <div class="art-choice-wrap">
        <div class="art-eyebrow">ART of The ALLIANCE</div>
        <h1>What brings <span>you</span> in?</h1>
        <div class="art-choice-buttons">
          <button class="art-choice-btn" id="art-what-is">What Is Art?</button>
          <button class="art-choice-btn art-choice-btn-primary" id="art-proceed">
            Proceed to Gallery
          </button>
        </div>
        <button class="art-exit" id="art-exit-store">&larr; Back outside</button>
      </div>
    </div>

    <script>
      (function () {
        const flash = document.getElementById("art-flash");
        const viewStorefront = document.getElementById("view-storefront");
        const viewChoice = document.getElementById("view-choice");

        function showView(view) {
          [viewStorefront, viewChoice].forEach((v) => v.classList.remove("active"));
          view.classList.add("active");
        }

        function fireFlash(then) {
          flash.classList.add("firing");
          setTimeout(() => flash.classList.remove("firing"), 500);
          setTimeout(then, 220);
        }

        document.getElementById("art-doors").addEventListener("click", () => {
          fireFlash(() => showView(viewChoice));
        });

        document.getElementById("art-exit-store").addEventListener("click", () => {
          showView(viewStorefront);
        });

        document.getElementById("art-what-is").addEventListener("click", () => {
          window.location.href = "/entries/art";
        });

        document.getElementById("art-proceed").addEventListener("click", () => {
          window.location.href = "/entries/art?skipIntro=1";
        });
      })();
    </script>

    <script src="/portal-transition.js"></script>
    <script src="/nav-wheel.js"></script>
    <script src="/hub-menu.js"></script>
  </body>
</html>
