<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART — The Alliance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --void: #050508;
        --gallery-wall: #0a0a0f;
        --cyan: #00e5ff;
        --cyan-dim: rgba(0, 229, 255, 0.15);
        --warm-spot: rgba(255, 240, 200, 0.92);
        --spot-glow: rgba(255, 230, 160, 0.18);
        --plaque-text: #b8a880;
        --nw-page-accent: var(--cyan);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--void);
        color: #e8e4dc;
        font-family: "Rajdhani", sans-serif;
        overflow: hidden;
      }
      .art-view {
        position: fixed;
        inset: 0;
        display: none;
      }
      #view-storefront.active {
        display: block;
      }

      /* ── STOREFRONT ── */
      .art-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* The "ART of the Alliance" marquee sign sits near the top of the
           source photo (1600x1999, a portrait image). On a wide, short
           desktop viewport, cover scales the image up until it overflows
           vertically, and a centered crop was slicing the sign clean off
           the top. Anchoring the crop to the top means any cropping trims
           the floor/bench at the bottom instead, so the sign is always
           in frame, on desktop and mobile alike. */
        object-position: 50% 0%;
        filter: saturate(0.9) contrast(1.05);
      }
      .art-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(5, 5, 8, 0.6) 88%,
          rgba(5, 5, 8, 0.94) 100%
        );
        pointer-events: none;
      }
      .art-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 24px;
        font-family: "Share Tech Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.3em;
        color: var(--plaque-text);
        text-transform: uppercase;
        z-index: 3;
      }
      .art-header .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 8px var(--cyan);
        margin-right: 8px;
        vertical-align: middle;
        animation: artBlink 2.2s ease-in-out infinite;
      }
      @keyframes artBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      .art-doors-hotspot {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        width: min(36vw, 320px);
        height: min(48vh, 420px);
        cursor: pointer;
        border: none;
        background: transparent;
        z-index: 2;
      }
      .art-doors-hint {
        position: absolute;
        left: 50%;
        bottom: 10%;
        transform: translateX(-50%);
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        z-index: 3;
        pointer-events: none;
        animation: artHintPulse 2.4s ease-in-out infinite;
        text-align: center;
      }
      @keyframes artHintPulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      .art-flash {
        position: fixed;
        inset: 0;
        background: var(--warm-spot);
        opacity: 0;
        pointer-events: none;
        z-index: 50;
      }
      .art-flash.firing {
        animation: artFlash 0.5s ease-out forwards;
      }
      @keyframes artFlash {
        0% {
          opacity: 0;
        }
        35% {
          opacity: 0.85;
        }
        100% {
          opacity: 0;
        }
      }

      /* ── CHOICE VIEW ── */
      #view-choice {
        background: radial-gradient(
          ellipse at center 40%,
          var(--gallery-wall) 0%,
          var(--void) 75%
        );
        padding: 24px;
      }
      #view-choice.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #050505;
      }
      /* The board image (1448x1086) sits in its own frame, sized down to
         fit the screen with object-fit: contain, so the two invisible hit
         areas below -- placed by percentage of the image itself -- always
         land exactly on "What is ART?" and "Proceed to Gallery" no matter
         the viewport. */
      .board-frame {
        position: relative;
        width: min(92vw, calc(88vh * 1448 / 1086));
        aspect-ratio: 1448 / 1086;
      }
      .board-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.6));
      }
      .board-hit {
        position: absolute;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      /* Coordinates measured directly off choice-board.png's own pixels
         (a bright-pixel scan of each text line), with a small pad added
         around each so the tap target is a bit more forgiving than the
         letters themselves. */
      .board-hit-whatis {
        left: 15.5%;
        top: 38.5%;
        width: 69.5%;
        height: 14.5%;
      }
      .board-hit-proceed {
        left: 17.5%;
        top: 62.5%;
        width: 66.0%;
        height: 11.5%;
      }
      .art-exit {
        background: transparent;
        border: none;
        color: var(--plaque-text);
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 10px;
        opacity: 0.7;
      }
      .art-exit:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="art-flash" id="art-flash"></div>

    <!-- STOREFRONT -->
    <div class="art-view active" id="view-storefront">
      <img class="art-photo" src="/art-images/storefront.jpg" alt="ART of the Alliance gallery entrance" />
      <div class="art-vignette"></div>
      <div class="art-header"><span class="dot"></span>ART of The ALLIANCE</div>
      <button class="art-doors-hotspot" id="art-doors" aria-label="Enter the gallery"></button>
      <div class="art-doors-hint">Tap the doors to enter</div>
    </div>

    <!-- CHOICE -->
    <div class="art-view" id="view-choice">
      <div class="board-frame">
        <img class="board-img" src="/art-images/choice-board.png" alt="The ALLIANCE presents: What is ART? Proceed to Gallery" />
        <button class="board-hit board-hit-whatis" id="art-what-is" aria-label="What is ART?"></button>
        <button class="board-hit board-hit-proceed" id="art-proceed" aria-label="Proceed to Gallery"></button>
      </div>
      <button class="art-exit" id="art-exit-store">&larr; Back outside</button>
    </div>

    <script>
      (function () {
        const flash = document.getElementById("art-flash");
        const viewStorefront = document.getElementById("view-storefront");
        const viewChoice = document.getElementById("view-choice");

        function showView(view) {
          [viewStorefront, viewChoice].forEach((v) => v.classList.remove("active"));
          view.classList.add("active");
        }

        function fireFlash(then) {
          flash.classList.add("firing");
          setTimeout(() => flash.classList.remove("firing"), 500);
          setTimeout(then, 220);
        }

        document.getElementById("art-doors").addEventListener("click", () => {
          fireFlash(() => showView(viewChoice));
        });

        document.getElementById("art-exit-store").addEventListener("click", () => {
          showView(viewStorefront);
        });

        document.getElementById("art-what-is").addEventListener("click", () => {
          window.location.href = "/art/what-is/";
        });

        document.getElementById("art-proceed").addEventListener("click", () => {
          window.location.href = "/art/what-is/?skipIntro=1";
        });
      })();
    </script>

    <script src="/portal-transition.js"></script>
    <script src="/nav-wheel.js"></script>
    <script src="/hub-menu.js"></script>
    <script src="/command-panel.js"></script>
  </body>
</html>
