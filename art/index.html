<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART — The Coalition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/art-images/scene/marquee.jpg" />
    <style>
      :root {
        --void: #050508;
        --cyan: #00e5ff;
        --plaque-text: #b8a880;
        --nw-page-accent: var(--cyan);
        /* The marquee photo's own wall color, top and bottom edge, so the
           contained image melts into the fill around it. */
        --wall-top: #e4c392;
        --wall-bottom: #f3cf9b;
        --push-ms: 1500ms;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: var(--void);
        color: #e8e4dc;
        font-family: "Rajdhani", sans-serif;
        overflow: hidden;
      }

      /* ── HOW THE WALK-IN WORKS ──────────────────────────────────────────
         The storefront photo sits on a "stage" box with the photo's exact
         aspect ratio. Everything placed on it (the door hotspot, the point
         the camera walks toward) uses percentages of the photo itself, so
         it lines up at any screen size. Tapping the doors scales the stage
         up around the small letter board inside the doorway and moves that
         board to the center of the screen, while the close-up marquee
         fades in over it: a walk forward that dissolves into the sign. */
      .view {
        position: fixed;
        inset: 0;
      }

      /* ── STOREFRONT ── */
      #view-storefront {
        overflow: hidden;
        background: #0b0a09;
      }
      /* Blurred copy fills the sides on wide screens, where the whole
         storefront is shown instead of cropped. */
      .store-fill {
        position: absolute;
        inset: -40px;
        background: url("/art-images/scene/storefront.jpg") center / cover no-repeat;
        filter: blur(28px) brightness(0.45) saturate(0.9);
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .stage img {
        display: block;
        width: 100%;
        height: 100%;
        filter: saturate(0.9) contrast(1.05);
        user-select: none;
        -webkit-user-drag: none;
      }
      .stage.walking {
        transition: transform var(--push-ms) cubic-bezier(0.55, 0.05, 0.35, 1);
      }
      .doors-hotspot {
        position: absolute;
        /* The open doorway, measured off the photo (x 480–1130, y 760–1620
           of 1600×1999). */
        left: 30%;
        top: 38%;
        width: 40.6%;
        height: 43%;
        border: none;
        background: transparent;
        cursor: pointer;
      }
      .doors-hotspot:focus-visible {
        outline: 1px dashed rgba(0, 229, 255, 0.6);
        outline-offset: -6px;
      }
      .store-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 45%,
          rgba(5, 5, 8, 0.55) 88%,
          rgba(5, 5, 8, 0.9) 100%
        );
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .art-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 24px;
        font-family: "Share Tech Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.3em;
        color: var(--plaque-text);
        text-transform: uppercase;
        z-index: 3;
        transition: opacity 0.5s ease;
      }
      .art-header .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 8px var(--cyan);
        margin-right: 8px;
        vertical-align: middle;
        animation: artBlink 2.2s ease-in-out infinite;
      }
      @keyframes artBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .doors-hint {
        position: absolute;
        left: 50%;
        bottom: 7%;
        transform: translateX(-50%);
        font-family: "Share Tech Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
        z-index: 3;
        pointer-events: none;
        animation: hintPulse 2.4s ease-in-out infinite;
        text-align: center;
        white-space: nowrap;
        transition: opacity 0.4s ease;
      }
      @keyframes hintPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      #view-storefront.walking .doors-hint,
      #view-storefront.walking .art-header,
      #view-storefront.walking .store-vignette {
        opacity: 0;
        animation: none;
      }

      /* ── MARQUEE ── */
      #view-marquee {
        background: linear-gradient(var(--wall-top), var(--wall-bottom));
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        z-index: 10;
        transition: opacity 0.9s ease, visibility 0s linear 0.9s;
      }
      #view-marquee.shown {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.9s ease, visibility 0s;
      }
      /* The marquee photo (575×940) is shown whole, never cropped, so the
         two hit areas below, placed by percentage of the photo, always
         land on "What is ART?" and "Proceed to Gallery". */
      .marquee-frame {
        position: relative;
        height: min(100%, calc(100vw * 940 / 575));
        aspect-ratio: 575 / 940;
        transform: scale(1.015);
        transition: transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      #view-marquee.shown .marquee-frame {
        transform: scale(1);
      }
      .marquee-frame img {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }
      .board-hit {
        position: absolute;
        border: none;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      .board-hit:focus-visible {
        outline: 1px dashed rgba(255, 255, 255, 0.7);
        outline-offset: 2px;
      }
      /* Measured off marquee.jpg's own pixels (a bright-pixel scan of each
         line of letters), padded so the tap target is forgiving. */
      .hit-whatis {
        left: 14%;
        top: 43%;
        width: 72%;
        height: 9%;
      }
      .hit-proceed {
        left: 16%;
        top: 54%;
        width: 68%;
        height: 7.5%;
      }
      .back-outside {
        position: absolute;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: transparent;
        border: none;
        color: #6b5434;
        font-family: "Share Tech Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        padding: 12px;
        opacity: 0.75;
        white-space: nowrap;
      }
      .back-outside:hover,
      .back-outside:focus-visible {
        opacity: 1;
      }

      @media (prefers-reduced-motion: reduce) {
        :root { --push-ms: 1ms; }
        .marquee-frame { transform: none !important; transition: none; }
        .art-header .dot, .doors-hint { animation: none; }
      }
    </style>
  </head>
  <body>
    <!-- STOREFRONT -->
    <div class="view" id="view-storefront">
      <div class="store-fill" aria-hidden="true"></div>
      <div class="stage" id="stage">
        <img src="/art-images/scene/storefront.jpg" alt="ART of the Coalition gallery entrance at night, doors open" />
        <button class="doors-hotspot" id="doors" aria-label="Walk inside"></button>
      </div>
      <div class="store-vignette"></div>
      <div class="art-header"><span class="dot"></span>ART of The COALITION</div>
      <div class="doors-hint">Tap the doors to enter</div>
    </div>

    <!-- MARQUEE -->
    <div class="view" id="view-marquee" aria-hidden="true">
      <div class="marquee-frame">
        <img src="/art-images/scene/marquee.jpg" alt="Letter board on an easel: The COALITION presents “What is ART?” Proceed to Gallery" />
        <button class="board-hit hit-whatis" id="what-is" aria-label="What is ART?" tabindex="-1"></button>
        <button class="board-hit hit-proceed" id="proceed" aria-label="Proceed to Gallery" tabindex="-1"></button>
      </div>
      <button class="back-outside" id="back" tabindex="-1">&larr; Back outside</button>
    </div>

    <script>
      (function () {
        const IMG_W = 1600, IMG_H = 1999;
        // The small letter board standing inside the doorway (measured off
        // storefront.jpg): center and width, in photo pixels.
        const SIGN = { x: 972 / IMG_W, y: 1336 / IMG_H, w: 141 / IMG_W };
        // The same board in the close-up (marquee.jpg, 575x940): its width
        // and the height of its center, as fractions of the photo.
        const BOARD = { w: 505 / 575, y: 462 / 940 };

        const store = document.getElementById("view-storefront");
        const stage = document.getElementById("stage");
        const marquee = document.getElementById("view-marquee");
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let box = { left: 0, top: 0, w: 0, h: 0 };
        let inside = false;

        // Phones (tall screens): fill the screen, cropping the sides.
        // Wide screens: show the whole storefront, with a blurred fill.
        function layout() {
          const vw = innerWidth, vh = innerHeight;
          const cover = Math.max(vw / IMG_W, vh / IMG_H);
          const contain = Math.min(vw / IMG_W, vh / IMG_H);
          const s = vw / vh < 0.9 ? cover : contain;
          const w = IMG_W * s, h = IMG_H * s;
          box = { left: (vw - w) / 2, top: (vh - h) / 2, w, h };
          stage.style.width = w + "px";
          stage.style.height = h + "px";
          if (!inside) stage.style.transform = `translate(${box.left}px, ${box.top}px)`;
        }
        layout();
        addEventListener("resize", layout);

        function setInteractive(el, on) {
          el.setAttribute("aria-hidden", on ? "false" : "true");
          el.querySelectorAll("button").forEach((b) => (b.tabIndex = on ? 0 : -1));
        }

        function walkIn() {
          if (inside) return;
          inside = true;
          // Walk until the doorway board is exactly the size and position of
          // the close-up board, so the dissolve lands on top of itself.
          const frame = document.querySelector(".marquee-frame");
          const fw = frame.offsetWidth, fh = frame.offsetHeight;
          const PUSH = Math.min(16, (fw * BOARD.w) / (SIGN.w * box.w));
          const targetX = innerWidth / 2;
          const targetY = (innerHeight - fh) / 2 + fh * BOARD.y;
          const px = SIGN.x * box.w, py = SIGN.y * box.h;
          const tx = targetX - PUSH * px;
          const ty = targetY - PUSH * py;
          store.classList.add("walking");
          stage.classList.add("walking");
          stage.style.transform = `translate(${tx}px, ${ty}px) scale(${PUSH})`;
          setTimeout(() => {
            marquee.classList.add("shown");
            setInteractive(marquee, true);
            setInteractive(store, false);
            document.getElementById("what-is").focus({ preventScroll: true });
          }, reduced ? 0 : 900);
        }

        function walkOut() {
          inside = false;
          marquee.classList.remove("shown");
          setInteractive(marquee, false);
          setInteractive(store, true);
          stage.style.transform = `translate(${box.left}px, ${box.top}px)`;
          store.classList.remove("walking");
          setTimeout(() => stage.classList.remove("walking"), reduced ? 0 : 1500);
        }

        document.getElementById("doors").addEventListener("click", walkIn);
        document.getElementById("back").addEventListener("click", walkOut);
        document.getElementById("what-is").addEventListener("click", () => {
          location.href = "/art/what-is/";
        });
        document.getElementById("proceed").addEventListener("click", () => {
          location.href = "/art/gallery/?skipIntro=1";
        });
        addEventListener("keydown", (e) => {
          if (e.key === "Escape" && inside) walkOut();
        });
        // Coming back from the entry or the gallery with the browser's Back
        // button: restore the page at the storefront, not mid-walk.
        addEventListener("pageshow", (e) => {
          if (e.persisted && inside) {
            stage.classList.remove("walking");
            walkOut();
          }
        });
      })();
    </script>

    <script src="/portal-transition.js"></script>
    <script src="/nav-wheel.js"></script>
    <script src="/hub-menu.js"></script>
    <script src="/command-panel.js"></script>
  </body>
</html>
