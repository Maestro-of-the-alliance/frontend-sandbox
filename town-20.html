<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PapaDomo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

      #town-canvas { position: fixed; inset: 0; display: block; cursor: grab; }
      #town-canvas:active { cursor: grabbing; }

      #loading-overlay {
        position: fixed; inset: 0; z-index: 40;
        background: #000; color: #ccc;
        display: flex; align-items: center; justify-content: center;
        font-family: "Courier New", monospace; font-size: 13px;
        letter-spacing: 0.1em; text-transform: uppercase;
        transition: opacity 0.8s ease;
      }

      /* Same visual language as the HOLOSPHERE's own hotspot markers --
         a soft pulsing glow, no text, invisible until tapped. */
      .hotspot-marker {
        position: fixed; width: 70px; height: 70px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        cursor: pointer;
        pointer-events: auto;
        z-index: 20;
      }
      .hotspot-marker.pulsing::before {
        content: "";
        position: absolute; inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 210, 130, 0.55);
        box-shadow:
          0 0 24px rgba(255, 200, 120, 0.35),
          inset 0 0 24px rgba(255, 200, 120, 0.2);
        animation: hotspotPulse 1.8s ease-in-out infinite;
      }
      @keyframes hotspotPulse {
        0%, 100% { transform: scale(0.92); opacity: 0.45; }
        50% { transform: scale(1.08); opacity: 0.9; }
      }

      #skip-btn {
        position: fixed; top: 20px; right: 20px; z-index: 100;
        background: rgba(0, 0, 0, 0.55);
        border: 1.5px solid #00e5ff; color: #00e5ff;
        font-family: "Courier New", monospace; font-size: 11px;
        letter-spacing: 0.15em; text-transform: uppercase;
        padding: 7px 12px; border-radius: 3px; cursor: pointer;
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }
      #skip-btn:hover, #skip-btn:focus-visible {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
      }

      /* Under-construction placeholder, shown on Visitor Center tap.
         Full-screen, holds for a few seconds, then hands off to
         foundation.html -- same role the old office.mp4's "ended"
         event played, just with a static image instead of video. */
      #construction-panel {
        position: fixed; inset: 0; z-index: 80;
        background: #111;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #construction-panel.showing { opacity: 1; }
      #construction-panel img {
        max-width: 80vw; max-height: 80vh;
        object-fit: contain;
      }

      /* Visitor Center video pool -- same full-screen black-background
         approach as the construction panel, playing actual footage
         instead. Structured as a pool (even with one entry today)
         since more variants are planned, same shape as the HOLOSPHERE
         boat pool. */
      #vc-video-panel {
        position: fixed; inset: 0; z-index: 80;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #vc-video-panel.showing { opacity: 1; }
      #vc-video-panel video {
        max-width: 100vw; max-height: 100vh;
        width: auto; height: auto;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">Loading&hellip;</div>
    <canvas id="reveal-fx" style="position:fixed; inset:0; z-index:41; pointer-events:none;"></canvas>
    <canvas id="town-canvas"></canvas>

    <div id="visitor-center-hotspot" class="hotspot-marker" style="display:none;"></div>

    <!-- Kept but no longer the default path -- see VC_VIDEO_POOL below. -->
    <div id="construction-panel">
      <img src="papadomo-under-construction.png" alt="Sequence under construction" />
    </div>

    <div id="vc-video-panel">
      <video id="vc-video" playsinline></video>
    </div>

    <button id="skip-btn" title="Skip">skip</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
(function () {
  "use strict";

  const canvas = document.getElementById("town-canvas");
  const loadingOverlay = document.getElementById("loading-overlay");
  const skipBtn = document.getElementById("skip-btn");
  const visitorCenterEl = document.getElementById("visitor-center-hotspot");
  const constructionPanel = document.getElementById("construction-panel");
  const vcVideoPanel = document.getElementById("vc-video-panel");
  const vcVideo = document.getElementById("vc-video");

  // Visitor Center video pool -- "one of a number of videos" per the
  // original plan, structured as a pool from the start even with a
  // single entry so more variants drop in cleanly later (same pattern
  // as the HOLOSPHERE boat pool). Hosted on R2 (nce-media bucket),
  // not committed to git -- at ~27.5MB this is over Cloudflare Pages'
  // hard 25 MiB per-file deploy limit, which is exactly why the boat
  // pool videos live on R2 in the first place. Picked randomly each
  // time the Visitor Center is tapped.
  const R2_BASE = "https://pub-bb8a474a69904ed98a408132316f149b.r2.dev";
  const VC_VIDEO_POOL = [
    `${R2_BASE}/town-20-visitor-center.mp4`,
  ];

  function goNext() {
    window.location.replace("/foundation.html");
  }
  skipBtn.addEventListener("click", goNext);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  camera.position.set(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1);

  const loader = new THREE.TextureLoader();
  let sphere = null;

  // --- Shimmer-in reveal ---
  //
  // Same gold-neon shimmer sweep as the HOLOSPHERE's door->town
  // transition, adapted for a first reveal rather than a scene swap:
  // no texture to preload-and-swap invisibly, just a stylized cover
  // while the initial texture loads, holding at peak brightness until
  // it's actually ready, then fading to reveal -- replacing what was
  // a flat opacity fade on a plain loading screen.
  const fxCanvas = document.getElementById("reveal-fx");
  const fxCtx = fxCanvas.getContext("2d");
  let textureReady = null;

  function runShimmerReveal() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
    const W = fxCanvas.width, H = fxCanvas.height;
    const startTime = performance.now();
    const BUILD_MS = 900;
    const PEAK_MS = 300;
    const FADE_MS = 700;

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / BUILD_MS);
      fxCtx.clearRect(0, 0, W, H);
      fxCtx.fillStyle = "#000";
      fxCtx.fillRect(0, 0, W, H);

      const sweepX = -W * 0.3 + t * W * 1.6;
      const grad = fxCtx.createLinearGradient(sweepX - W * 0.25, 0, sweepX + W * 0.25, H);
      grad.addColorStop(0, "rgba(212, 175, 55, 0)");
      grad.addColorStop(0.5, `rgba(255, 223, 130, ${0.15 + t * 0.55})`);
      grad.addColorStop(1, "rgba(212, 175, 55, 0)");
      fxCtx.fillStyle = grad;
      fxCtx.fillRect(0, 0, W, H);

      fxCtx.fillStyle = `rgba(20, 16, 8, ${1 - t * t * 0.4})`;
      fxCtx.fillRect(0, 0, W, H);

      if (elapsed < BUILD_MS) {
        requestAnimationFrame(frame);
        return;
      }

      const peakElapsed = elapsed - BUILD_MS;
      if (peakElapsed < PEAK_MS || !textureReady) {
        requestAnimationFrame(frame);
        return;
      }

      // Texture's ready and the minimum peak hold has elapsed --
      // build the actual scene now, hidden under the shimmer, then
      // fade to reveal it.
      const material = new THREE.MeshBasicMaterial({ map: textureReady });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);
      visitorCenterEl.style.display = "block";
      loadingOverlay.style.display = "none";
      fadeReveal(now);
    }

    function fadeReveal(peakEndTime) {
      function fadeFrame(now) {
        const t = Math.min(1, (now - peakEndTime) / FADE_MS);
        fxCanvas.style.opacity = String(1 - t);
        if (t < 1) {
          requestAnimationFrame(fadeFrame);
        } else {
          fxCanvas.style.display = "none";
        }
      }
      requestAnimationFrame(fadeFrame);
    }

    requestAnimationFrame(frame);
  }

  loader.load(
    "holosphere/panorama-town-20.png",
    function (texture) {
      textureReady = texture;
    },
    undefined,
    function (err) {
      fxCanvas.style.display = "none";
      loadingOverlay.textContent = "Couldn't load the scene. Please refresh.";
      loadingOverlay.style.opacity = "1";
      console.error(err);
    }
  );
  runShimmerReveal();

  // --- Drag-to-look-around -- identical pattern to the HOLOSPHERE's
  // own camera control, copied deliberately rather than reinvented,
  // since that implementation is already proven working. ---
  let lon = -165, lat = -2; // starting view -- looking down the main
                            // street toward the town's depth, rather
                            // than straight at the Visitor Center sign.
                            // Pixel-estimated like everything else here,
                            // not crosshair-confirmed.
  let isDragging = false;
  let prevX = 0, prevY = 0;

  function onPointerDown(x, y) { isDragging = true; prevX = x; prevY = y; }
  function onPointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - prevX, dy = y - prevY;
    lon -= dx * 0.15;
    lat += dy * 0.15;
    lat = Math.max(-85, Math.min(85, lat));
    prevX = x; prevY = y;
  }
  function onPointerUp() { isDragging = false; }

  canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener("touchend", onPointerUp);

  // Same hotspot-also-starts-a-drag pattern as the HOLOSPHERE, so a
  // touch starting on the hotspot doesn't create a dead zone for
  // camera dragging -- only fires the tap action if the gesture
  // stayed within a small movement threshold.
  const TAP_MOVE_THRESHOLD = 8;
  function makeHotspotInteractive(el, activate) {
    let startX = 0, startY = 0, moved = false;
    function start(x, y) { startX = x; startY = y; moved = false; onPointerDown(x, y); }
    function move(x, y) {
      if (Math.hypot(x - startX, y - startY) > TAP_MOVE_THRESHOLD) moved = true;
      onPointerMove(x, y);
    }
    function end() { onPointerUp(); if (!moved) activate(); }
    el.addEventListener("mousedown", (e) => { e.stopPropagation(); start(e.clientX, e.clientY); });
    el.addEventListener("mousemove", (e) => { if (isDragging) move(e.clientX, e.clientY); });
    el.addEventListener("mouseup", (e) => { e.stopPropagation(); end(); });
    el.addEventListener("touchstart", (e) => {
      e.stopPropagation();
      if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (isDragging && e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    el.addEventListener("touchend", (e) => { e.stopPropagation(); end(); }, { passive: true });
  }

  function lonLatToVector3(lonDeg, latDeg, radius) {
    const phi = THREE.MathUtils.degToRad(90 - latDeg);
    const theta = THREE.MathUtils.degToRad(lonDeg);
    return new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  // Pixel-measured from panorama-town-20.png (sign centered ~x=620,
  // y=390 of 1774x887) -- same estimation method, same live-
  // confirmation caveat as every other guessed coordinate in this
  // project. Expect to nudge after actually seeing it live.
  const visitorCenterPos = lonLatToVector3(-219, 2, 480);

  function projectToScreen(vec3, el) {
    const projected = vec3.clone().project(camera);
    if (projected.z > 1) { el.style.display = "none"; return; }
    el.style.display = "block";
    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
    el.style.left = x + "px";
    el.style.top = y + "px";
  }

  let visitorCenterRetired = false;

  makeHotspotInteractive(visitorCenterEl, () => {
    if (visitorCenterRetired) return;
    visitorCenterRetired = true;

    const choice = VC_VIDEO_POOL[Math.floor(Math.random() * VC_VIDEO_POOL.length)];
    vcVideo.src = choice;
    vcVideo.currentTime = 0;
    vcVideoPanel.classList.add("showing");
    // Direct in-gesture play() call -- same pattern already proven
    // working for audio-bearing video elsewhere in the project
    // (welcome.mp4, office.mp4) -- satisfies the browser autoplay
    // policy since it's called synchronously within the tap handler.
    const playPromise = vcVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch((err) => console.warn("Visitor Center video play was blocked:", err));
    }
    vcVideo.addEventListener("ended", () => {
      vcVideoPanel.classList.remove("showing");
      setTimeout(goNext, 700);
    }, { once: true });
  });

  function animate() {
    requestAnimationFrame(animate);
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    const target = new THREE.Vector3(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);
    if (!visitorCenterRetired) projectToScreen(visitorCenterPos, visitorCenterEl);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
    </script>
  </body>
</html>
