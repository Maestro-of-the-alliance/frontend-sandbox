<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCESS DENIED</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #fff;
        font-family: "Courier New", monospace;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #screen-video {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #screen-video video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #screen-dialup {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        gap: 24px;
      }
      .dialup-status {
        font-family: "Courier New", monospace;
        font-size: clamp(12px, 2.5vw, 18px);
        color: #00e5ff;
        letter-spacing: 0.2em;
        text-align: center;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
      }
      .dialup-bar-wrap {
        width: min(400px, 80vw);
        height: 4px;
        background: rgba(0, 229, 255, 0.15);
        position: relative;
        overflow: hidden;
      }
      .dialup-bar-fill {
        height: 100%;
        width: 0%;
        background: #00e5ff;
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
        transition: width 0.1s linear;
      }
      .dialup-label {
        font-family: "Courier New", monospace;
        font-size: clamp(9px, 1.5vw, 12px);
        color: rgba(0, 229, 255, 0.5);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      #vcr-controls {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .vcr-btn {
        background: rgba(0, 0, 0, 0.55);
        border: 1.5px solid #00e5ff;
        color: #00e5ff;
        font-family: "Courier New", monospace;
        font-size: 15px;
        padding: 7px 12px;
        border-radius: 3px;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease;
        line-height: 1;
      }
      .vcr-btn:hover {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
      }
      .vcr-btn-label {
        font-family: "Courier New", monospace;
        font-size: 9px;
        letter-spacing: 0.2em;
        color: rgba(0, 229, 255, 0.8);
        text-transform: uppercase;
        text-align: center;
        display: block;
        margin-top: 3px;
      }
      .vcr-btn-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #glitch-overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        pointer-events: none;
        background: #fff;
        opacity: 0;
      }
      #screen-gate {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        gap: 18px;
        cursor: pointer;
      }
      .gate-label {
        font-family: "Courier New", monospace;
        font-size: clamp(11px, 2.2vw, 15px);
        color: rgba(0, 229, 255, 0.55);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
      }
      .gate-action {
        font-family: "Courier New", monospace;
        font-size: clamp(16px, 3.4vw, 24px);
        color: #00e5ff;
        letter-spacing: 0.25em;
        text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
        animation: gate-blink 1.4s step-start infinite;
        text-align: center;
      }
      @keyframes gate-blink {
        50% {
          opacity: 0.25;
        }
      }
    </style>
  </head>
  <body>
    <div id="vcr-controls">
      <div class="vcr-btn-wrap">
        <button class="vcr-btn" onclick="skipIntro()" title="Skip intro">
          &#9654;&#9654;
        </button>
        <span class="vcr-btn-label">skip</span>
      </div>
    </div>

    <div id="screen-gate">
      <div class="gate-label">Incoming Transmission Detected</div>
      <div class="gate-action">&#9654; Tap To Intercept</div>
    </div>

    <div id="screen-video">
      <video
        id="warning-video"
        src="/warning.mp4"
        playsinline
      ></video>
      <audio id="voice-track"></audio>
    </div>

    <div id="screen-dialup">
      <div class="dialup-status" id="dialup-status">
        ESTABLISHING CONNECTION...
      </div>
      <div class="dialup-bar-wrap">
        <div class="dialup-bar-fill" id="dialup-bar"></div>
      </div>
      <div class="dialup-label" id="dialup-label">0%</div>
    </div>

    <div id="glitch-overlay"></div>

    <script>
      console.log("FIRING: index.html");
      let introActive = true;
      let introPhase = "video";

      const VOICE_COUNT = 11;
      function pickVoiceFile() {
        const last = sessionStorage.getItem("lastVoiceFile");
        let pick;
        do {
          pick =
            "voice-" +
            String(Math.floor(Math.random() * VOICE_COUNT) + 1).padStart(2, "0") +
            ".MP3";
        } while (pick === last && VOICE_COUNT > 1);
        sessionStorage.setItem("lastVoiceFile", pick);
        return pick;
      }

      function show(id) {
        document.getElementById(id).style.display = "flex";
      }
      function hide(id) {
        document.getElementById(id).style.display = "none";
      }

      function glitch(duration) {
        const overlay = document.getElementById("glitch-overlay");
        overlay.style.transition = "none";
        overlay.style.opacity = "0.85";
        setTimeout(() => {
          overlay.style.transition = `opacity ${duration}ms ease`;
          overlay.style.opacity = "0";
        }, 30);
      }

      const sfxDialup = new Audio("/audio/dialup-modem.mp3");
      function startDialup() {
        try {
          sfxDialup.currentTime = 0;
          sfxDialup.play();
        } catch (e) {}
      }
      function stopDialup() {
        try {
          sfxDialup.pause();
          sfxDialup.currentTime = 0;
        } catch (e) {}
      }

      function runDialup(callback) {
        const bar = document.getElementById("dialup-bar");
        const label = document.getElementById("dialup-label");
        const status = document.getElementById("dialup-status");
        let pct = 0;
        const STATUSES = [
          [0, "ESTABLISHING CONNECTION..."],
          [20, "HANDSHAKING..."],
          [45, "AUTHENTICATING..."],
          [70, "DECRYPTING RESTRICTED CONTENT..."],
          [90, "BREACH SUCCESSFUL · LOADING ARCHIVE..."],
        ];
        const interval = setInterval(() => {
          if (!introActive) {
            clearInterval(interval);
            return;
          }
          pct += 1 + Math.random() * 3;
          if (pct >= 100) {
            pct = 100;
            clearInterval(interval);
            setTimeout(callback, 500);
          }
          bar.style.width = pct + "%";
          label.textContent = Math.floor(pct) + "%";
          STATUSES.forEach(([threshold, msg]) => {
            if (pct >= threshold) status.textContent = msg;
          });
        }, 55);
      }

      function advanceToDialup() {
        introPhase = "dialup";
        hide("screen-video");
        glitch(200);
        setTimeout(() => {
          show("screen-dialup");
          startDialup();
          runDialup(() => {
            if (introActive) finishIntro();
          });
        }, 200);
      }

      function finishIntro() {
        if (!introActive) return;
        introActive = false;
        stopDialup();
        glitch(300);
        setTimeout(() => {
          window.location.href = "/papadomo.html";
        }, 250);
      }

      function skipIntro() {
        if (!introActive) return;
        introActive = false;
        hide("screen-gate");
        const vid = document.getElementById("warning-video");
        const voice = document.getElementById("voice-track");
        vid.pause();
        voice.pause();
        stopDialup();
        window.location.href = "/papadomo.html";
      }

      function startVideoIntro() {
        const vid = document.getElementById("warning-video");
        const voice = document.getElementById("voice-track");
        voice.src = "/audio/" + pickVoiceFile();
        // vid.play()/voice.play() must be called synchronously inside the
        // user-gesture handler (the gate tap) — mobile browsers (iPadOS
        // Safari, Fire OS Silk, Android Chrome) block unmuted autoplay
        // otherwise, and a swallowed rejection here means the video never
        // starts, "ended" never fires, and the sequence hangs forever.
        Promise.all([vid.play(), voice.play()]).catch(() => {});
        vid.addEventListener("ended", () => {
          if (introActive && introPhase === "video") advanceToDialup();
        });
      }

      function enterFromGate() {
        hide("screen-gate");
        startVideoIntro();
      }

      document.getElementById("screen-gate").addEventListener(
        "click",
        enterFromGate,
        { once: true }
      );
    </script>
  </body>
</html>
