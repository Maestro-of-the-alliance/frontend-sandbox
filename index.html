<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCESS DENIED</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        color: #fff;
        font-family: "Courier New", monospace;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }
      #screen-video {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #screen-video video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      #vcr-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .vcr-btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.2);
        font-family: "Courier New", monospace;
        font-size: clamp(16px, 3vw, 22px);
        padding: 6px 10px;
        cursor: pointer;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .vcr-btn:hover {
        color: rgba(255, 255, 255, 0.6);
        border-color: rgba(255, 255, 255, 0.35);
      }
      .vcr-btn-label {
        font-family: "Courier New", monospace;
        font-size: 8px;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.15);
        text-transform: uppercase;
        text-align: center;
        display: block;
        margin-top: 3px;
      }
      .vcr-btn-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #glitch-overlay {
        position: fixed;
        inset: 0;
        z-index: 500;
        pointer-events: none;
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="vcr-controls">
      <div class="vcr-btn-wrap">
        <button class="vcr-btn" onclick="skipIntro()" title="Skip intro">
          &#9654;&#9654;
        </button>
        <span class="vcr-btn-label">skip</span>
      </div>
    </div>

    <div id="screen-video">
      <video
        id="warning-video"
        src="/warning.mp4"
        playsinline
      ></video>
      <audio id="voice-track"></audio>
    </div>

    <div id="glitch-overlay"></div>

    <script>
      console.log("FIRING: index.html");
      let introActive = true;

      const VOICE_COUNT = 11;
      function pickVoiceFile() {
        const last = sessionStorage.getItem("lastVoiceFile");
        let pick;
        do {
          pick =
            "voice-" +
            String(Math.floor(Math.random() * VOICE_COUNT) + 1).padStart(2, "0") +
            ".MP3";
        } while (pick === last && VOICE_COUNT > 1);
        sessionStorage.setItem("lastVoiceFile", pick);
        return pick;
      }

      function glitch(duration) {
        const overlay = document.getElementById("glitch-overlay");
        overlay.style.transition = "none";
        overlay.style.opacity = "0.85";
        setTimeout(() => {
          overlay.style.transition = `opacity ${duration}ms ease`;
          overlay.style.opacity = "0";
        }, 30);
      }

      function proceedToHandshake() {
        if (!introActive) return;
        introActive = false;
        glitch(300);
        setTimeout(() => {
          window.location.href = "/papadomo.html";
        }, 250);
      }

      function skipIntro() {
        if (!introActive) return;
        const vid = document.getElementById("warning-video");
        const voice = document.getElementById("voice-track");
        vid.pause();
        voice.pause();
        proceedToHandshake();
      }

      function startVideoIntro() {
        const vid = document.getElementById("warning-video");
        const voice = document.getElementById("voice-track");
        voice.src = "/audio/" + pickVoiceFile();
        Promise.all([vid.play(), voice.play()]).catch(() => {});
        vid.addEventListener("ended", proceedToHandshake);
      }

      window.addEventListener("load", () => {
        startVideoIntro();
      });
    </script>
  </body>
</html>
