<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE SYSTEM — THE ALLIANCE</title>
    <link rel="stylesheet" href="/papadomo-choice.css" />
    <script type="module" crossorigin src="/the-system/assets/index-N4Iz-CSY.js"></script>
    <link rel="stylesheet" crossorigin href="/the-system/assets/index-4gp6i92a.css">
  </head>
  <body>
    <div id="root"></div>

    <!--
      GLOBAL LOAD/CRASH SAFETY NET — deliberately outside React.

      Why this needs to live here rather than only as a React error
      boundary: a React boundary can't catch errors thrown inside the
      Three.js animation loop (a requestAnimationFrame callback isn't
      part of React's render cycle), and it can't do anything if React
      itself never manages to mount in the first place. Mobile GPU
      failures on real devices don't always fire a clean WebGL
      "context lost" event (SolarSystemCanvas.tsx already handles that
      specific case) -- some just hang silently or throw somewhere
      React can't see. This is the backstop for everything else:
      any uncaught error, or the scene simply never appearing at all,
      gets the same one thing every failure mode in here should get:
      a way out, not a blank screen.
    -->
    <div id="load-fallback" style="
      display:none; position:fixed; inset:0; z-index:999999;
      background:rgba(3,3,8,0.97); color:#d6d3d1;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:24px; gap:16px;
    ">
      <p style="max-width:340px; font-size:15px; line-height:1.5; margin:0;">
        THE SYSTEM isn't loading on this device — this 3D view needs more
        than some mobile browsers can reliably give it. Nothing was lost
        on your end.
      </p>
      <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <button onclick="window.location.reload()" style="
          padding:12px 24px; border-radius:12px; border:none; cursor:pointer;
          background:#f59e0b; color:#0c0a09; font-weight:700; font-size:14px;
        ">Try Again</button>
        <button onclick="window.location.href='/tours/'" style="
          padding:12px 24px; border-radius:12px; cursor:pointer;
          background:transparent; color:#d6d3d1; font-weight:700; font-size:14px;
          border:1px solid #78716c;
        ">Skip to Tours</button>
        <button onclick="window.location.href='/landing.html'" style="
          padding:12px 24px; border-radius:12px; cursor:pointer;
          background:transparent; color:#d6d3d1; font-weight:700; font-size:14px;
          border:1px solid #78716c;
        ">Back to Landing</button>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var shown = false;
        function showFallback() {
          if (shown) return;
          shown = true;
          document.getElementById("load-fallback").style.display = "flex";
        }

        // Any uncaught error or promise rejection, anywhere -- including
        // inside the Three.js render loop, which a React error boundary
        // cannot see.
        window.addEventListener("error", showFallback);
        window.addEventListener("unhandledrejection", showFallback);

        // Hard loading timeout: if no canvas with real pixel dimensions
        // has appeared within 12s, either React never mounted, crashed
        // before rendering, or the scene is silently hung. Whatever the
        // cause, a blank screen with no explanation is the wrong result.
        setTimeout(function () {
          if (shown) return;
          var canvas = document.querySelector("#root canvas");
          var rendered = canvas && canvas.clientWidth > 0 && canvas.clientHeight > 0;
          if (!rendered) showFallback();
        }, 12000);
      })();
    </script>

    <script src="/ambient-glitch.js"></script>
    <script src="/papadomo-choice.js"></script>
  </body>
</html>
