<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THE HOLOSPHERE — The ALLIANCE For The Future</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Press+Start+2P&display=swap');

  html, body {
    margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%;
    background: #000; font-family: 'Georgia', serif;
  }
  #holosphere-canvas { position: fixed; inset: 0; display: block; cursor: grab; }
  #holosphere-canvas:active { cursor: grabbing; }

  /* Calibration tools, only for finding hotspot coordinates -- not
     part of the real experience. Hidden by default now that the
     confirmed positions are locked in; set display:none -> block on
     both rules below if a future hotspot needs re-calibrating. */
  #debug-readout {
    display: none;
    position: fixed; top: 12px; left: 12px; z-index: 90;
    color: #0f0; font-family: monospace; font-size: 0.85rem;
    background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px;
    pointer-events: none;
  }
  #center-crosshair {
    display: none;
    position: fixed; top: 50%; left: 50%; width: 24px; height: 24px;
    margin: -12px 0 0 -12px; z-index: 90; pointer-events: none;
  }
  #center-crosshair::before, #center-crosshair::after {
    content: ''; position: absolute; background: #0f0;
  }
  #center-crosshair::before { top: 50%; left: 0; right: 0; height: 2px; margin-top: -1px; }
  #center-crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; }
  #loading-overlay {
    position: fixed; inset: 0; background: #000; color: #d4af37;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; letter-spacing: 0.3em; z-index: 100;
    transition: opacity 0.8s ease;
  }

  /* 3D hotspot markers -- positioned in world space via raycasting,
     not fixed screen positions. Both the telescope and intercom are
     now genuinely rendered in the panorama art itself. */
  .hotspot-marker {
    position: fixed;
    border-radius: 50%;
    cursor: pointer; z-index: 20; pointer-events: auto;
    /* Invisible in the real experience -- confirmed via the debug
       crosshair earlier, no longer needed as a visible glow. Still a
       real, clickable target at this exact size and position, just
       not shown, so discovering the telescope/intercom/balcony are
       clickable feels like your own find rather than the UI pointing
       at it. */
    opacity: 0;
  }
  /* Individually sized per object -- a shared small fixed dot made
     these frustratingly precise to hit. Each is sized to roughly
     cover the actual thing it represents, not just its center point.
     clamp() with viewport units instead of one fixed pixel size, so
     these scale sensibly on a narrow phone instead of a desktop-sized
     value dominating most of a small screen. */
  #balcony-hotspot {
    width: clamp(220px, 55vw, 480px); height: clamp(160px, 30vh, 400px);
    margin-top: calc(clamp(160px, 30vh, 400px) / -2);
    margin-left: calc(clamp(220px, 55vw, 480px) / -2);
    border-radius: 8%;
  }
  #telescope-hotspot {
    width: clamp(90px, 22vw, 160px); height: clamp(160px, 35vh, 320px);
    margin-top: calc(clamp(160px, 35vh, 320px) / -2);
    margin-left: calc(clamp(90px, 22vw, 160px) / -2);
    border-radius: 20%;
  }
  #intercom-hotspot {
    width: clamp(70px, 18vw, 110px); height: clamp(70px, 18vw, 110px);
    margin-top: calc(clamp(70px, 18vw, 110px) / -2);
    margin-left: calc(clamp(70px, 18vw, 110px) / -2);
  }

  /* Balcony video reveal -- zoom transition into a video player */
  #video-panel {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: #000;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #video-panel.showing { opacity: 1; }
  #video-panel video {
    width: 100%; height: 100%; object-fit: cover;
    transform: scale(1.15); transition: transform 0.8s ease;
  }
  #video-panel.showing video { transform: scale(1); }
  /* On narrow/portrait screens, this landscape video would get
     cropped down to a tiny sliver by object-fit: cover fighting the
     phone's tall aspect ratio. Switch to contain there instead --
     letterboxed (black bars top/bottom) but the whole video visible,
     rather than zoomed into one corner of it. */
  @media (max-aspect-ratio: 4/5) {
    #video-panel video { object-fit: contain; }
  }
  #video-close {
    position: fixed; top: 30px; right: 30px; z-index: 61;
    color: #fff; font-size: 2rem; cursor: pointer;
    background: none; border: none; display: none; text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  /* Door cutscene -- full pre-rendered scene photos (closed, then open
     with PapaDOMO), not a small in-scene sprite, since that's the
     actual asset shape. Crossfades over the live view briefly before
     handing off to the tour page. */
  #door-panel {
    position: fixed; inset: 0; z-index: 65; display: none;
    align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #door-panel img {
    width: 100%; height: 100%; object-fit: contain; background: #000;
    transition: opacity 0.8s ease;
    position: absolute; inset: 0;
  }
  /* door-closed.jpg / door-open-papadomo.jpg are fixed portrait photos
     (1080x1920), not content meant to crop-fill. object-fit: cover was
     only ever correct by accident on viewports close to that aspect
     ratio -- on a narrow phone it cropped PapaDOMO out of frame
     entirely (reported as the view getting "parked in the corner"),
     and on a wide laptop it did the mirror-image version: stretched
     the narrow image to fill the wide container's width, producing
     an extreme, cropped-in zoom (reported directly, confirmed via
     screenshot). contain has no failure mode here since the asset's
     shape is fixed -- letterboxing on an odd aspect ratio is a much
     smaller cost than losing the subject entirely. */
  /* PapaDOMO's own lines get a classic retro JRPG textbox -- distinct
     from the golden neon script used for the tour invitation, which
     stays as-is. Now uses the real finished textbox art (portrait
     tab baked in) as a background image instead of building the
     frame out of CSS borders. */
  #papadomo-textbox {
    position: relative; z-index: 66; width: 92vw; max-width: 720px;
    aspect-ratio: 2172 / 724;
    margin-bottom: 4vh;
    background-image: url('papadomo-textbox.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    opacity: 0; transition: opacity 1s ease;
  }
  #papadomo-text-area {
    position: absolute; left: 8%; right: 8%; top: 40%; bottom: 12%;
    display: flex; flex-direction: column; justify-content: center;
  }
  #door-dialogue {
    font-family: 'Press Start 2P', monospace; font-size: 0.7rem;
    line-height: 1.8; color: #fff;
    text-shadow: 2px 2px 0 #1a222c;
  }
  #door-continue-hint {
    position: absolute; right: 3%; bottom: 6%;
    width: 0; height: 0; cursor: pointer;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 10px solid #fff;
    opacity: 0;
  }
  /* Applied via JS once the hint should start blinking, kept separate
     from the initial opacity so the fade-in and the infinite blink
     don't fight over the same property at the same time. */
  #door-continue-hint.pulsing {
    animation: continueHintBlink 0.9s steps(1) infinite;
  }
  @keyframes continueHintBlink {
    0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; }
  }
  /* Fully opaque black -- a real telescope shows you something
     completely separate from your surroundings, so nothing of the
     live scene should show through at all, not even dimmed. */
  #boat-panel {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center;
    background: #000;
    opacity: 0; filter: blur(16px);
    transition: opacity 0.5s ease, filter 0.5s ease;
  }
  #boat-panel.showing { opacity: 1; filter: blur(0); }
  /* Fixed-size circular "porthole" -- the mask and size live here,
     so the window itself never changes size. Only the image inside
     it zooms, simulating the telescope finding focus on its subject. */
  #boat-window {
    /* min() guarantees a genuinely square box on any screen shape --
       the previous approach mixed vw for width/height with vh for
       max-width/max-height plus a redundant aspect-ratio, which
       different browsers can resolve inconsistently. On a narrow
       portrait phone that mismatch produced a non-square box, which
       turned the circular mask into a warped, sliced-off shape
       instead of a clean circle. */
    width: min(70vw, 70vh); height: min(70vw, 70vh);
    border-radius: 50%; overflow: hidden;
    -webkit-mask-image: radial-gradient(circle, black 62%, transparent 92%);
    mask-image: radial-gradient(circle, black 62%, transparent 92%);
  }
  #boat-panel img, #boat-panel video {
    width: 100%; height: 100%; object-fit: cover;
    transform-origin: center center;
    /* No transition here -- pinch/wheel zoom needs to track the
       user's input in real time, not ease toward a fixed value. */
    cursor: grab;
    /* Without this, the browser's own native pinch-to-zoom gesture
       fights the custom JS pinch handling below -- this is exactly
       the kind of thing that only shows up on a real phone, not in
       a syntax check. */
    touch-action: none;
    /* Belt-and-suspenders alongside the mousedown preventDefault() --
       covers browsers that respect the CSS property specifically. */
    -webkit-user-drag: none;
    user-drag: none;
  }
  #boat-panel img:active, #boat-panel video:active { cursor: grabbing; }
  /* The pool is now entirely video -- suppress native browser chrome
     (play button flash, download/fullscreen affordances) so it reads
     as a porthole image that happens to move, not a video player. */
  #boat-panel video::-webkit-media-controls { display: none !important; }
  #boat-close {
    position: fixed; top: 30px; right: 30px; z-index: 61;
    color: #d4af37; font-size: 2rem; cursor: pointer;
    background: none; border: none; display: none;
  }

  /* Glowing neon tour-choice prompt -- floats directly over the live
     panorama, no dark backdrop, matching the "Care for a Tour with
     your guide PapaDOMO?" reference. */

  #welcome-panel {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    pointer-events: none;
  }
  #welcome-text {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(1.8rem, 5vw, 3.2rem); text-align: center;
    line-height: 1.3; color: #ffd76b;
    text-shadow: 0 0 8px rgba(255,215,107,0.9), 0 0 20px rgba(255,180,50,0.7), 0 0 40px rgba(255,150,20,0.4);
    opacity: 0; transition: opacity 1.4s ease;
    max-width: 90vw;
  }
  #welcome-choices {
    display: flex; gap: 60px; margin-top: 24px;
    opacity: 0; transition: opacity 1s ease;
    pointer-events: auto;
  }
  .choice-btn {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    background: none; border: none; cursor: pointer; padding: 0;
    color: #ffd76b;
    text-shadow: 0 0 8px rgba(255,215,107,0.9), 0 0 20px rgba(255,180,50,0.7), 0 0 40px rgba(255,150,20,0.4);
    transition: text-shadow 0.2s ease, transform 0.2s ease;
  }
  .choice-btn:hover {
    text-shadow: 0 0 12px rgba(255,235,150,1), 0 0 30px rgba(255,200,80,0.9), 0 0 60px rgba(255,160,40,0.6);
    transform: scale(1.05);
  }
  /* Dissolve: the chosen word breaks apart into small glowing blocks
     and fades, rather than just vanishing -- a lighter approximation
     of the reference video's particle-dissolve effect. */
  .choice-btn.dissolving {
    position: relative; color: transparent; pointer-events: none;
  }
  .dissolve-block {
    position: absolute; background: #ffd76b;
    box-shadow: 0 0 6px rgba(255,215,107,0.9);
    animation: dissolveOut 0.7s ease-out forwards;
  }
  @keyframes dissolveOut {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
  }
</style>
</head>
<body>

<div id="loading-overlay">ENTERING THE HOLOSPHERE&hellip;</div>
<div id="debug-readout">lon: 0 &nbsp; lat: 0</div>
<div id="center-crosshair"></div>
<canvas id="holosphere-canvas"></canvas>

<div id="intercom-hotspot" class="hotspot-marker" style="display:none;"></div>
<div id="telescope-hotspot" class="hotspot-marker" style="display:none;"></div>
<div id="balcony-hotspot" class="hotspot-marker" style="display:none;"></div>
<div id="door3d-hotspot" class="hotspot-marker" style="display:none;"></div>
<div id="visitor-center-hotspot" class="hotspot-marker" style="display:none;"></div>

<!-- Shared canvas for the scene-to-scene transition effects (fireworks,
     shimmer, zoom-blur). One canvas, different draw routines per
     transition type, rather than three separate overlay elements. -->
<canvas id="fx-canvas" style="position:fixed; inset:0; z-index:70; pointer-events:none; display:none;"></canvas>

<!-- Same under-construction placard as town-20.html's own Visitor
     Center hotspot -- shown here too since the 60%-town scene's
     Visitor Center has nowhere further to send visitors yet either. -->
<div id="construction-panel" style="position:fixed; inset:0; z-index:80; background:#111; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.6s ease;">
  <img src="../papadomo-under-construction.png" alt="Sequence under construction" style="max-width:80vw; max-height:80vh; object-fit:contain;" />
</div>

<div id="video-panel">
  <video id="welcome-video" src="welcome.mp4" playsinline></video>
</div>
<button id="video-close" aria-label="Close">&times;</button>

<div id="door-panel">
  <img id="door-image" src="door-closed.jpg" alt="A door opens" />
  <div id="papadomo-textbox">
    <div id="papadomo-text-area">
      <div id="door-dialogue"></div>
      <div id="door-continue-hint"></div>
    </div>
  </div>
</div>

<div id="boat-panel">
  <div id="boat-window">
    <video id="boat-image" loop playsinline webkit-playsinline aria-label="A distant sight through the telescope"></video>
  </div>
</div>
<button id="boat-close" aria-label="Close">&times;</button>

<div id="welcome-panel">
  <div id="welcome-text">Care for a Tour<br />with your guide PapaDOMO?</div>
  <div id="welcome-choices">
    <button class="choice-btn" id="choice-wander">No</button>
    <button class="choice-btn" id="choice-tour">Yes</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  const canvas = document.getElementById("holosphere-canvas");
  const loadingOverlay = document.getElementById("loading-overlay");
  const debugEl = document.getElementById("debug-readout");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );

  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Inverted sphere so the texture renders on the INSIDE, visible from
  // the camera sitting at its center.
  const geometry = new THREE.SphereGeometry(500, 60, 40);
  geometry.scale(-1, 1, 1);

  const loader = new THREE.TextureLoader();
  let sphere = null; // populated once the initial load resolves; scene
                      // transitions later swap sphere.material.map
                      // directly rather than rebuilding the mesh.
  loader.load(
    "panorama.png",
    function (texture) {
      const material = new THREE.MeshBasicMaterial({ map: texture });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);
      loadingOverlay.style.opacity = "0";
      setTimeout(() => { loadingOverlay.style.display = "none"; }, 800);
    },
    undefined,
    function (err) {
      loadingOverlay.textContent = "Couldn't load the HoloSphere. Please refresh.";
      console.error(err);
    }
  );

  camera.position.set(0, 0, 0);

  // --- Drag-to-look-around, rotation only, no zoom/pan ---
  // Starting view -- using the balcony's own confirmed coordinates
  // (lon -180.2, lat -0.8) directly, since that's the actual
  // crosshair-verified "great sunset view" position, not another
  // guess. The earlier split-the-difference attempt (lon -160) was
  // still not landing right.
  let lon = -180.2, lat = -0.8;
  let isDragging = false;
  let prevX = 0, prevY = 0;

  function onPointerDown(x, y) {
    isDragging = true;
    prevX = x; prevY = y;
  }
  function onPointerMove(x, y) {
    if (!isDragging) return;
    const dx = x - prevX;
    const dy = y - prevY;
    lon -= dx * 0.15;
    lat += dy * 0.15;
    lat = Math.max(-85, Math.min(85, lat));
    prevX = x; prevY = y;
  }
  function onPointerUp() { isDragging = false; }

  canvas.addEventListener("mousedown", (e) => onPointerDown(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", onPointerUp);

  canvas.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 1) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  canvas.addEventListener("touchend", onPointerUp);

  // Hotspots sit on top of the canvas, so any touch/click starting on
  // one is captured by the hotspot element, not the canvas -- the
  // canvas's own mousedown/touchstart never fires for that touch, no
  // matter how the hotspot is sized. That created a real dead zone
  // for camera dragging wherever a hotspot sat, reported directly as
  // "can't move around on mobile" once the hotspots were enlarged.
  //
  // Fix: each hotspot now also starts the same shared drag (so
  // dragging from a hotspot rotates the camera exactly like dragging
  // from open canvas), and only fires its own action if the gesture
  // stayed within a small movement threshold -- a genuine tap, not a
  // drag that happened to start on top of it.
  const TAP_MOVE_THRESHOLD = 8;
  function makeHotspotInteractive(el, activate) {
    let startX = 0, startY = 0, moved = false;
    function start(x, y) {
      startX = x; startY = y; moved = false;
      onPointerDown(x, y);
    }
    function move(x, y) {
      if (Math.hypot(x - startX, y - startY) > TAP_MOVE_THRESHOLD) moved = true;
      onPointerMove(x, y);
    }
    function end() {
      onPointerUp();
      if (!moved) activate();
    }
    el.addEventListener("mousedown", (e) => { e.stopPropagation(); start(e.clientX, e.clientY); });
    el.addEventListener("mousemove", (e) => { if (isDragging) move(e.clientX, e.clientY); });
    el.addEventListener("mouseup", (e) => { e.stopPropagation(); end(); });
    el.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (e.touches.length === 1) move(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    el.addEventListener("touchend", end);
  }

  // --- 3D hotspot markers ---
  // Positions computed from the actual panorama image: cropped and
  // pixel-measured to find the telescope and intercom, then converted
  // from image UV coordinates to spherical lon/lat. Placed at a radius
  // just inside the panorama sphere so they sit "on" the objects they
  // represent rather than floating in front of them.
  function lonLatToVector3(lonDeg, latDeg, radius) {
    const phi = THREE.MathUtils.degToRad(90 - latDeg);
    const theta = THREE.MathUtils.degToRad(lonDeg);
    return new THREE.Vector3(
      radius * Math.sin(phi) * Math.cos(theta),
      radius * Math.cos(phi),
      radius * Math.sin(phi) * Math.sin(theta)
    );
  }

  const HOTSPOT_RADIUS = 480;
  // Real, crosshair-confirmed coordinates -- read directly off the
  // live debug readout with the center crosshair, not derived from
  // Blender or estimated from the raw image. The earlier two rounds
  // of guessed positions were both confirmed wrong; these replace
  // them entirely.
  const telescopePos = lonLatToVector3(-266.6, -4.5, HOTSPOT_RADIUS);
  const intercomPos = lonLatToVector3(-138.5, -35.4, HOTSPOT_RADIUS);
  // The middle balcony/sunset window.
  const balconyPos = lonLatToVector3(-180.2, -0.8, HOTSPOT_RADIUS);

  // Pixel-estimated from the raw panorama-door.png source, cross-checked
  // against the telescope/intercom's own confirmed coordinates for
  // calibration -- NOT yet live-crosshair-confirmed. Same caveat as
  // every other pixel-only guess in this project: expect to nudge
  // this once it's actually checked on the live deployed scene.
  const door3dPos = lonLatToVector3(-83, -4.5, HOTSPOT_RADIUS);
  // Visitor Center sign in panorama-town-60.png -- pixel-measured from
  // the source image (sign centered ~x=480, y=300 of 1774x887), same
  // calibration as everything else here. Same live-confirmation caveat.
  const visitorCenterPos = lonLatToVector3(-252, 24, HOTSPOT_RADIUS);
  // Confirmed but not yet wired up: the spot near the desk where the
  // 16-bit tour door should appear on the "yes" choice -- lon: -116.6,
  // lat: -23.4. Saved here so it isn't lost before that feature gets built.

  const telescopeEl = document.getElementById("telescope-hotspot");
  const intercomEl = document.getElementById("intercom-hotspot");
  const balconyEl = document.getElementById("balcony-hotspot");
  const door3dEl = document.getElementById("door3d-hotspot");
  const visitorCenterEl = document.getElementById("visitor-center-hotspot");
  telescopeEl.style.display = "block";
  intercomEl.style.display = "block";
  balconyEl.style.display = "block";

  function projectToScreen(vec3, el) {
    const projected = vec3.clone().project(camera);
    // Behind the camera -- hide rather than show a flipped/wrapped position.
    if (projected.z > 1) {
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
    el.style.left = x + "px";
    el.style.top = y + "px";
  }

  // projectToScreen unconditionally sets display:"block" whenever a
  // hotspot is in view, with no awareness of a deliberate manual hide
  // elsewhere in the code. That was invisible before (whatever it
  // incorrectly re-showed sat underneath an opaque panel anyway), but
  // it's a real bug once hotspots need to be permanently retired
  // mid-session (e.g. telescope/intercom/balcony once the tour is
  // committed to). Track retirement explicitly rather than relying on
  // style.display, which projectToScreen treats as its own to manage.
  const retiredHotspots = new Set();
  function retireHotspot(el) {
    retiredHotspots.add(el);
    el.style.display = "none";
  }

  function animate() {
    requestAnimationFrame(animate);
    const phi = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    const target = new THREE.Vector3(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);
    debugEl.textContent = `lon: ${lon.toFixed(1)}   lat: ${lat.toFixed(1)}`;
    if (!retiredHotspots.has(telescopeEl)) projectToScreen(telescopePos, telescopeEl);
    if (!retiredHotspots.has(intercomEl)) projectToScreen(intercomPos, intercomEl);
    if (!retiredHotspots.has(balconyEl)) projectToScreen(balconyPos, balconyEl);
    if (!retiredHotspots.has(door3dEl)) projectToScreen(door3dPos, door3dEl);
    if (!retiredHotspots.has(visitorCenterEl)) projectToScreen(visitorCenterPos, visitorCenterEl);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // --- Scene transitions (fireworks, shimmer, ...) ---
  //
  // The HOLOSPHERE moves through a sequence of scenes on the same
  // live sphere -- office -> office-with-door -> town-60% -> (future)
  // town video -- by swapping sphere.material.map rather than
  // reloading the page or rebuilding the mesh. Each transition:
  //   1. Starts loading the next texture immediately (in the
  //      background) so it's ready well before it's needed.
  //   2. Plays a full-screen effect on #fx-canvas that builds to a
  //      fully-obscuring peak.
  //   3. Swaps the texture at that peak, invisibly.
  //   4. Fades the effect out, revealing the new scene.
  // If the texture isn't done loading by the time the effect wants
  // to peak, the peak hold is extended rather than swapping early to
  // a still-blank texture -- a late-but-clean swap beats an on-time
  // glitch.

  const fxCanvas = document.getElementById("fx-canvas");
  const fxCtx = fxCanvas.getContext("2d");

  function preloadTexture(url) {
    return new Promise((resolve, reject) => {
      loader.load(url, resolve, undefined, reject);
    });
  }

  function swapSphereTexture(newTexture) {
    if (!sphere) return;
    const oldMap = sphere.material.map;
    sphere.material.map = newTexture;
    sphere.material.needsUpdate = true;
    if (oldMap) oldMap.dispose();
  }

  function resizeFxCanvas() {
    fxCanvas.width = window.innerWidth;
    fxCanvas.height = window.innerHeight;
  }

  // --- Fireworks: intercom "Yes" -> office-with-door ---
  //
  // Several bursts of particles arcing up and out with gravity, timed
  // to overlap, building to a full white peak-flash, then fading to
  // reveal the new scene underneath. Runs entirely on #fx-canvas;
  // nothing here depends on the DOM beyond that one element.
  function runFireworksTransition(nextTextureUrl, onRevealed) {
    resizeFxCanvas();
    fxCanvas.style.display = "block";
    fxCanvas.style.opacity = "1";

    const texturePromise = preloadTexture(nextTextureUrl);
    let textureReady = null;
    texturePromise.then((tex) => { textureReady = tex; });

    const W = fxCanvas.width, H = fxCanvas.height;
    const startTime = performance.now();
    const BUILD_MS = 2200;   // bursts firing and climbing
    const PEAK_MS = 500;     // minimum full-white hold
    const FADE_MS = 900;     // fade back to reveal the new scene

    const particles = [];
    function spawnBurst(cx, cy, hue) {
      const count = 60 + Math.floor(Math.random() * 30);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
        const speed = 2.5 + Math.random() * 3.5;
        particles.push({
          x: cx, y: cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          hue, born: performance.now(), life: 900 + Math.random() * 500,
        });
      }
    }

    // Stagger several bursts across the build window.
    const burstPlan = [
      { t: 0,    x: 0.5, y: 0.55, hue: 45 },   // gold, center
      { t: 350,  x: 0.3, y: 0.4,  hue: 280 },  // violet, left
      { t: 650,  x: 0.7, y: 0.35, hue: 190 },  // cyan, right
      { t: 1000, x: 0.5, y: 0.3,  hue: 45 },   // gold, center-high
      { t: 1350, x: 0.4, y: 0.5,  hue: 320 },  // magenta
      { t: 1600, x: 0.6, y: 0.45, hue: 45 },
    ];
    const fired = new Set();

    function frame(now) {
      const elapsed = now - startTime;
      fxCtx.fillStyle = "rgba(5, 2, 12, 0.25)"; // trailing fade, not a hard clear
      fxCtx.fillRect(0, 0, W, H);

      burstPlan.forEach((b, i) => {
        if (!fired.has(i) && elapsed >= b.t) {
          fired.add(i);
          spawnBurst(b.x * W, b.y * H, b.hue);
        }
      });

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const age = now - p.born;
        if (age > p.life) { particles.splice(i, 1); continue; }
        p.x += p.vx; p.y += p.vy; p.vy += 0.045; // gravity
        const t = age / p.life;
        const alpha = 1 - t;
        fxCtx.beginPath();
        fxCtx.fillStyle = `hsla(${p.hue}, 90%, ${60 + t * 20}%, ${alpha})`;
        fxCtx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        fxCtx.fill();
      }

      if (elapsed < BUILD_MS) {
        requestAnimationFrame(frame);
        return;
      }

      // Peak: ramp to full white, holding until the texture is ready
      // AND the minimum peak hold has elapsed.
      const peakElapsed = elapsed - BUILD_MS;
      const peakRamp = Math.min(1, peakElapsed / 250);
      fxCtx.fillStyle = `rgba(255, 255, 255, ${peakRamp})`;
      fxCtx.fillRect(0, 0, W, H);

      if (peakElapsed < PEAK_MS || !textureReady) {
        requestAnimationFrame(frame);
        return;
      }

      // Swap happens here, fully hidden under solid white.
      swapSphereTexture(textureReady);
      fadeReveal(now);
    }

    function fadeReveal(peakEndTime) {
      function fadeFrame(now) {
        const t = Math.min(1, (now - peakEndTime) / FADE_MS);
        fxCanvas.style.opacity = String(1 - t);
        fxCtx.fillStyle = "rgba(255, 255, 255, 1)";
        fxCtx.fillRect(0, 0, W, H);
        if (t < 1) {
          requestAnimationFrame(fadeFrame);
        } else {
          fxCanvas.style.display = "none";
          fxCtx.clearRect(0, 0, W, H);
          if (onRevealed) onRevealed();
        }
      }
      requestAnimationFrame(fadeFrame);
    }

    requestAnimationFrame(frame);
  }

  // --- Shimmer: door tap -> town scene ---
  //
  // A softer, quicker beat than the fireworks -- a golden shimmer
  // sweep + fade, matching the project's existing gold-neon visual
  // language (the intercom's "Care for a Tour?" prompt) rather than
  // reusing the fireworks' bigger, louder effect. Same preload-then-
  // swap-at-peak mechanism underneath.
  function runShimmerTransition(nextTextureUrl, onRevealed) {
    resizeFxCanvas();
    fxCanvas.style.display = "block";
    fxCanvas.style.opacity = "1";

    const texturePromise = preloadTexture(nextTextureUrl);
    let textureReady = null;
    texturePromise.then((tex) => { textureReady = tex; });

    const W = fxCanvas.width, H = fxCanvas.height;
    const startTime = performance.now();
    const BUILD_MS = 900;
    const PEAK_MS = 300;
    const FADE_MS = 700;

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / BUILD_MS);
      fxCtx.clearRect(0, 0, W, H);

      // Diagonal gold shimmer sweep, widening as it builds.
      const sweepX = -W * 0.3 + t * W * 1.6;
      const grad = fxCtx.createLinearGradient(sweepX - W * 0.25, 0, sweepX + W * 0.25, H);
      grad.addColorStop(0, "rgba(212, 175, 55, 0)");
      grad.addColorStop(0.5, `rgba(255, 223, 130, ${0.15 + t * 0.55})`);
      grad.addColorStop(1, "rgba(212, 175, 55, 0)");
      fxCtx.fillStyle = grad;
      fxCtx.fillRect(0, 0, W, H);

      // Overall warm wash builds alongside the sweep toward full peak.
      fxCtx.fillStyle = `rgba(255, 244, 214, ${t * t * 0.85})`;
      fxCtx.fillRect(0, 0, W, H);

      if (elapsed < BUILD_MS) {
        requestAnimationFrame(frame);
        return;
      }

      const peakElapsed = elapsed - BUILD_MS;
      const peakRamp = Math.min(1, peakElapsed / 200);
      fxCtx.fillStyle = `rgba(255, 250, 235, ${0.85 + peakRamp * 0.15})`;
      fxCtx.fillRect(0, 0, W, H);

      if (peakElapsed < PEAK_MS || !textureReady) {
        requestAnimationFrame(frame);
        return;
      }

      swapSphereTexture(textureReady);
      fadeReveal(now);
    }

    function fadeReveal(peakEndTime) {
      function fadeFrame(now) {
        const t = Math.min(1, (now - peakEndTime) / FADE_MS);
        fxCanvas.style.opacity = String(1 - t);
        fxCtx.fillStyle = "rgba(255, 250, 235, 1)";
        fxCtx.fillRect(0, 0, W, H);
        if (t < 1) {
          requestAnimationFrame(fadeFrame);
        } else {
          fxCanvas.style.display = "none";
          fxCtx.clearRect(0, 0, W, H);
          if (onRevealed) onRevealed();
        }
      }
      requestAnimationFrame(fadeFrame);
    }

    requestAnimationFrame(frame);
  }

  // --- Intercom interaction ---
  const welcomePanel = document.getElementById("welcome-panel");
  const welcomeText = document.getElementById("welcome-text");
  const welcomeChoices = document.getElementById("welcome-choices");

  makeHotspotInteractive(intercomEl, () => {
    pushOverlayState("welcome");
    telescopeEl.style.display = "none";
    intercomEl.style.display = "none";
    welcomePanel.style.display = "flex";
    requestAnimationFrame(() => {
      welcomeText.style.opacity = "1";
      setTimeout(() => { welcomeChoices.style.opacity = "1"; }, 900);
    });
  });

  // Dissolve the chosen word into small glowing blocks, then navigate.
  // A lighter, native approximation of the reference video's particle
  // break-up effect -- no fixed video needed, works at any screen size.
  function dissolveAndGo(button, onComplete) {
    const rect = button.getBoundingClientRect();
    button.classList.add("dissolving");
    const blockSize = 6;
    const cols = Math.ceil(rect.width / blockSize);
    const rows = Math.ceil(rect.height / blockSize);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const block = document.createElement("div");
        block.className = "dissolve-block";
        block.style.left = (rect.left + c * blockSize) + "px";
        block.style.top = (rect.top + r * blockSize) + "px";
        block.style.width = blockSize + "px";
        block.style.height = blockSize + "px";
        block.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
        block.style.setProperty("--dy", (Math.random() * -60 - 20) + "px");
        block.style.animationDelay = (Math.random() * 0.15) + "s";
        document.body.appendChild(block);
      }
    }
    welcomeChoices.style.opacity = "0";
    setTimeout(onComplete, 750);
  }

  const doorPanel = document.getElementById("door-panel");
  const doorImage = document.getElementById("door-image");
  const papadomoTextbox = document.getElementById("papadomo-textbox");
  const doorDialogue = document.getElementById("door-dialogue");
  const doorContinueHint = document.getElementById("door-continue-hint");

  // A pool of things PapaDOMO might say once the door opens -- picked
  // at random each visit, matching the same randomized-pool pattern
  // used elsewhere (the boat images, the PBE's own message pools).
  // Each entry is [setup] or [setup, punchline] -- lines with a real
  // comedic turn get split, so the punchline lands as its own beat
  // after a click, rather than the whole joke dumping out at once.
  const PAPADOMO_LINES = [
    ["Come on, then &mdash; let's go see what's worth seeing."],
    ["Did you know PapaDOMO's tour of the N.C.E.ncyclopedia has a perfect rating on Trust Advisor."],
    ["After the tour we have a short survey we'd love for you to fill out.", "It only takes about two hours."],
    ["MAESTRO's known to make surprise appearances.", "Maybe today we'll get lucky."],
    ["You think I'm funny looking?", "You should see MamaDOMO."],
    ["What do you have there, glooshoos?", "Glue shoes. Let's go!"],
  ];

  // Typewriter effect -- reveals text one character at a time rather
  // than the whole line appearing at once, matching classic JRPG
  // textbox pacing. innerHTML is set incrementally by walking the
  // source string; entity references like &mdash; are handled by
  // decoding first so they don't get split mid-entity.
  function typeText(el, html, onComplete, speed) {
    const div = document.createElement("div");
    div.innerHTML = html;
    const text = div.textContent;
    el.textContent = "";
    let i = 0;
    const interval = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(interval);
        if (onComplete) onComplete();
      }
    }, speed || 28);
    return interval;
  }

  document.getElementById("choice-tour").addEventListener("click", (e) => {
    dissolveAndGo(e.currentTarget, () => {
      // NOTE: back-button behavior through this whole new sequence
      // (fireworks -> door -> shimmer -> town -> visitor center) is
      // genuinely unhandled -- pushOverlayState/closeOverlayUI only
      // know about the old immediate-door-panel flow. Clearing the
      // stale "welcome" tracking here so a back-press at least doesn't
      // wrongly resurrect the welcome panel and old hotspots on top of
      // whatever new scene is showing, but a real design pass for
      // back/forward through these stages still needs to happen.
      currentOverlay = null;
      welcomePanel.style.display = "none";

      // Committed to the tour now -- retire the base-scene hotspots
      // rather than leave them tappable underneath what's coming.
      retireHotspot(telescopeEl);
      retireHotspot(intercomEl);
      retireHotspot(balconyEl);

      runFireworksTransition("panorama-door.png", () => {
        door3dEl.style.display = "block";
        makeHotspotInteractive(door3dEl, () => {
          retireHotspot(door3dEl);
          runShimmerTransition("panorama-town-60.png", () => {
            visitorCenterEl.style.display = "block";
            makeHotspotInteractive(visitorCenterEl, () => {
              // Visitor Center reached -- same placard/hold/handoff
              // pattern as town-20.html's own Visitor Center hotspot,
              // landing at /tours/ (the tour-choice card index)
              // instead of foundation.html, since this is the
              // returning-visitor path, not the first-time onboarding
              // path.
              const constructionPanel = document.getElementById("construction-panel");
              constructionPanel.style.opacity = "1";
              setTimeout(() => {
                constructionPanel.style.opacity = "0";
                setTimeout(() => {
                  window.location.href = "/tours/";
                }, 700);
              }, 4000);
            });
          });
        });
      });
    });
  });

  // --- Retired for now, not deleted ---
  // The old immediate door-photo/PapaDOMO-textbox sequence (door-
  // closed.jpg -> door-open-papadomo.jpg -> typewriter dialogue ->
  // /tours/) that used to fire directly on "Yes". Superseded by the
  // fireworks/shimmer/town flow above, but left defined and callable
  // rather than deleted, since whether it's formally retired for good
  // (and whether its PapaDOMO dialogue lines move somewhere in the new
  // flow) hasn't been decided yet.
  function legacyDoorPapadomoSequence() {
    doorImage.src = "door-closed.jpg";
    doorImage.style.opacity = "1";
    papadomoTextbox.style.opacity = "0";
    doorDialogue.textContent = "";
    doorContinueHint.style.opacity = "0";
    doorContinueHint.classList.remove("pulsing");
    pushOverlayState("door");
    doorPanel.style.display = "flex";
    doorImage.style.cursor = "pointer";
    requestAnimationFrame(() => { doorPanel.style.opacity = "1"; });

    const [setupLine, punchLine] = PAPADOMO_LINES[Math.floor(Math.random() * PAPADOMO_LINES.length)];
    let phase = "typing"; // "typing" -> "awaiting-punchline" -> "awaiting-proceed"

    function showContinueHint() {
      phase = "awaiting-proceed";
      doorContinueHint.style.opacity = "1";
      doorContinueHint.classList.add("pulsing");
    }

    function proceedToTours() {
      doorPanel.removeEventListener("click", onPanelClick);
      doorPanel.style.opacity = "0";
      setTimeout(() => {
        window.location.href = "/tours/";
      }, 800);
    }

    function onPanelClick() {
      if (phase === "awaiting-punchline") {
        phase = "typing";
        typeText(doorDialogue, punchLine, showContinueHint);
      } else if (phase === "awaiting-proceed") {
        proceedToTours();
      }
      // While phase === "typing", clicks are ignored -- let the
      // line finish typing rather than skipping it.
    }

    function openTheDoor() {
      doorImage.removeEventListener("click", openTheDoor);
      doorImage.style.cursor = "default";
      doorImage.src = "door-open-papadomo.jpg";
      setTimeout(() => {
        papadomoTextbox.style.opacity = "1";
        typeText(doorDialogue, setupLine, () => {
          if (punchLine) {
            phase = "awaiting-punchline";
          } else {
            showContinueHint();
          }
        });
      }, 1200);
      doorPanel.style.cursor = "pointer";
      doorPanel.addEventListener("click", onPanelClick);
    }
    doorImage.addEventListener("click", openTheDoor);
  }
  document.getElementById("choice-wander").addEventListener("click", (e) => {
    dissolveAndGo(e.currentTarget, () => {
      window.location.href = "/s3";
    });
  });

  // --- Telescope interaction ---
  const boatPanel = document.getElementById("boat-panel");
  const boatClose = document.getElementById("boat-close");
  const boatImage = document.getElementById("boat-image");

  // Pool of boat clips -- converted from static PNGs to looping video,
  // hosted on the nce-media R2 bucket. All 9 confirmed live (Sep 1
  // 2026). Add more URLs here as they're generated; picked randomly
  // each time the telescope is used.
  const R2_BASE = "https://pub-bb8a474a69904ed98a408132316f149b.r2.dev";
  const BOAT_MEDIA = [
    `${R2_BASE}/floaty.mp4`,      // life preserver / pina colada man
    `${R2_BASE}/ski.mp4`,         // 7 skiers building a pyramid
    `${R2_BASE}/fatman.mp4`,      // new gag, content TBD
    `${R2_BASE}/periscope.mp4`,   // lone periscope
    `${R2_BASE}/mermaid.mp4`,     // mermaid floating
    `${R2_BASE}/alien.mp4`,       // aliens fishing from a UFO
    `${R2_BASE}/sharkbite.mp4`,   // shark in floaties and sunglasses
    `${R2_BASE}/tug.mp4`,         // tugboat towing a yacht
    `${R2_BASE}/grumpy.mp4`,      // two old guys fishing
  ];

  // Real, user-driven zoom and reposition -- mouse wheel + drag on
  // desktop, pinch + single-finger drag on touch -- rather than a
  // fixed automatic animation. Applies to the img generically, so it
  // works the same way for whichever boat image is currently loaded.
  const ZOOM_MIN = 1, ZOOM_MAX = 5;
  let boatZoom = 1, boatPanX = 0, boatPanY = 0;

  const boatWindowEl = document.getElementById("boat-window");

  // Pan bounds -- the image element is sized to exactly fill the
  // container (width/height: 100%, object-fit: cover), so at zoom 1
  // it has zero overhang: ANY pan at all immediately drags its edge
  // past the container boundary and exposes the opaque black
  // #boat-panel behind it. The fix is standard "pan within a zoomed
  // image" math: at a given zoom, the image overhangs the container
  // by (zoom - 1) * containerSize / 2 on each side (transform-origin
  // is center by default), so that's the true maximum pan distance
  // before the edge reaches the container edge.
  //
  // PAN_SAFETY pulls the allowed pan in a little further than that
  // theoretical max -- a small vignette margin so subpixel rounding
  // during a fast drag/pinch never sneaks a hairline of black past
  // the edge. The visible circle is effectively a touch smaller than
  // the image's true bounds at all times.
  const PAN_SAFETY = 0.94;

  function clampBoatPan() {
    const containerSize = boatWindowEl.getBoundingClientRect().width;
    const maxPan = Math.max(0, containerSize * (boatZoom - 1) / 2) * PAN_SAFETY;
    boatPanX = Math.min(maxPan, Math.max(-maxPan, boatPanX));
    boatPanY = Math.min(maxPan, Math.max(-maxPan, boatPanY));
  }

  function applyBoatTransform() {
    clampBoatPan();
    boatImage.style.transform =
      `translate(${boatPanX}px, ${boatPanY}px) scale(${boatZoom})`;
  }

  function resetBoatZoom() {
    boatZoom = 1; boatPanX = 0; boatPanY = 0;
    applyBoatTransform();
  }

  boatImage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    boatZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, boatZoom + delta));
    applyBoatTransform();
  }, { passive: false });

  // Mouse drag-to-pan, so an off-center subject can actually be
  // recentered once zoomed in, not just magnified in place.
  //
  // <img> elements have native browser drag-to-save behavior on by
  // default, which fights with custom mouse-based dragging -- a
  // native drag doesn't fire regular mousemove events the same way,
  // so mouseup can end up not resetting isDraggingBoat cleanly. That's
  // almost certainly what caused the "click toggles it instead of
  // hold-and-drag" behavior reported. preventDefault() on mousedown
  // stops the native drag from ever starting.
  let isDraggingBoat = false, boatDragStartX = 0, boatDragStartY = 0;
  boatImage.addEventListener("mousedown", (e) => {
    e.preventDefault();
    isDraggingBoat = true;
    boatDragStartX = e.clientX - boatPanX;
    boatDragStartY = e.clientY - boatPanY;
  });
  window.addEventListener("mousemove", (e) => {
    if (!isDraggingBoat) return;
    boatPanX = e.clientX - boatDragStartX;
    boatPanY = e.clientY - boatDragStartY;
    applyBoatTransform();
  });
  window.addEventListener("mouseup", () => { isDraggingBoat = false; });

  // Pinch-to-zoom (two fingers) and drag-to-pan (one finger) --
  // distinguished by touch count, same element.
  //
  // Real fingers almost never lift at exactly the same instant, so a
  // pinch gesture very often collapses from 2 touches to 1 for a
  // moment before fully ending. The original version only set up its
  // "start" reference point in touchstart, so when that collapse
  // happened mid-gesture, the single remaining finger would suddenly
  // compute its pan position against a stale (or zero) reference,
  // causing a jarring jump right at that instant -- exactly the
  // "wonky, no forgiveness" feeling reported. Fix: recalibrate the
  // relevant reference point every time the touch count itself
  // changes, not just on a fresh touchstart, so 2-to-1 or 1-to-2
  // transitions are always smooth regardless of timing.
  let pinchStartDist = null, pinchStartZoom = 1;
  let boatTouchStartX = 0, boatTouchStartY = 0;
  let lastTouchCount = 0;
  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
  }
  function recalibrateTouch(touches) {
    if (touches.length === 2) {
      pinchStartDist = touchDist(touches);
      pinchStartZoom = boatZoom;
    } else if (touches.length === 1) {
      boatTouchStartX = touches[0].clientX - boatPanX;
      boatTouchStartY = touches[0].clientY - boatPanY;
    }
  }
  boatImage.addEventListener("touchstart", (e) => {
    recalibrateTouch(e.touches);
    lastTouchCount = e.touches.length;
  }, { passive: true });
  boatImage.addEventListener("touchmove", (e) => {
    if (e.touches.length !== lastTouchCount) {
      recalibrateTouch(e.touches);
      lastTouchCount = e.touches.length;
    }
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      const newDist = touchDist(e.touches);
      const ratio = newDist / pinchStartDist;
      boatZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinchStartZoom * ratio));
      applyBoatTransform();
    } else if (e.touches.length === 1) {
      e.preventDefault();
      boatPanX = e.touches[0].clientX - boatTouchStartX;
      boatPanY = e.touches[0].clientY - boatTouchStartY;
      applyBoatTransform();
    }
  }, { passive: false });
  boatImage.addEventListener("touchend", (e) => {
    lastTouchCount = e.touches.length;
    if (e.touches.length < 2) pinchStartDist = null;
  });

  makeHotspotInteractive(telescopeEl, () => {
    const choice = BOAT_MEDIA[Math.floor(Math.random() * BOAT_MEDIA.length)];
    boatImage.src = choice;
    boatImage.currentTime = 0;
    // Muted, same as the ambient boat pool was silent before as static
    // images -- these clips are meant to read as a moving photograph
    // seen through a lens, not a video with its own soundtrack. If
    // that changes, play() is already called synchronously within
    // this tap gesture's call stack, so unmuting later needs no
    // further autoplay-policy workaround (same pattern as welcomeVideo).
    boatImage.muted = true;
    const playPromise = boatImage.play();
    if (playPromise !== undefined) {
      playPromise.catch((err) => {
        console.warn("Boat video play was blocked:", err);
      });
    }
    resetBoatZoom();
    pushOverlayState("boat");
    boatPanel.style.display = "flex";
    boatClose.style.display = "block";
    requestAnimationFrame(() => {
      boatPanel.classList.add("showing");
    });
  });

  // Routes through history.back() rather than hiding directly -- the
  // single popstate handler below is the one place that actually
  // hides overlay UI, so the X button and the phone's back gesture
  // both close this the same way instead of two separate code paths
  // that could drift out of sync.
  boatClose.addEventListener("click", () => { history.back(); });

  // --- Balcony video interaction ---
  const videoPanel = document.getElementById("video-panel");
  const videoClose = document.getElementById("video-close");
  const welcomeVideo = document.getElementById("welcome-video");

  makeHotspotInteractive(balconyEl, () => {
    pushOverlayState("video");
    videoPanel.style.display = "flex";
    videoClose.style.display = "block";
    // Play is called synchronously within the same tap gesture's call
    // stack (no async boundary crossed inside makeHotspotInteractive),
    // so this still counts as a direct user gesture for the browser's
    // autoplay policy, same as before.
    welcomeVideo.currentTime = 0;
    welcomeVideo.muted = false;
    const playPromise = welcomeVideo.play();
    if (playPromise !== undefined) {
      playPromise.catch((err) => {
        console.warn("Video play was blocked:", err);
      });
    }
    requestAnimationFrame(() => {
      videoPanel.classList.add("showing");
    });
  });

  // Same reasoning as the boat panel's close button -- routes through
  // history.back() rather than hiding directly, so there's one single
  // place (the popstate handler below) that actually closes overlay
  // UI, whether triggered by this button, the video ending, or the
  // phone's own back gesture.
  function closeVideo() { history.back(); }
  videoClose.addEventListener("click", closeVideo);
  welcomeVideo.addEventListener("ended", closeVideo);

  // --- Overlay history management ---
  // None of the four overlays (welcome/tour prompt, telescope/boat,
  // balcony video, door sequence) created a real browser history
  // entry of their own -- they're all just DOM show/hide within the
  // same page. That meant pressing back (or the phone's back gesture)
  // while one was open skipped past it entirely and fell through to
  // actual page history, landing all the way back on landing.html
  // instead of just closing the overlay -- reported directly with the
  // telescope, but the same underlying gap existed for all four.
  //
  // Fix: opening an overlay pushes a fake history state; popstate
  // closes whichever overlay is currently open instead of letting the
  // browser navigate away. Explicit close buttons (boatClose,
  // videoClose) now route through history.back() rather than hiding
  // directly, so there's one single source of truth for "how an
  // overlay actually closes" instead of two paths that could drift
  // out of sync with each other.
  let currentOverlay = null;

  function pushOverlayState(name) {
    currentOverlay = name;
    history.pushState({ holosphereOverlay: name }, "", location.href);
  }

  function closeOverlayUI(name) {
    if (name === "welcome") {
      welcomePanel.style.display = "none";
      telescopeEl.style.display = "block";
      intercomEl.style.display = "block";
    } else if (name === "boat") {
      boatImage.pause();
      boatPanel.classList.remove("showing");
      setTimeout(() => {
        boatPanel.style.display = "none";
        boatClose.style.display = "none";
      }, 500);
    } else if (name === "video") {
      welcomeVideo.pause();
      videoPanel.classList.remove("showing");
      setTimeout(() => {
        videoPanel.style.display = "none";
        videoClose.style.display = "none";
      }, 600);
    } else if (name === "door") {
      doorPanel.style.opacity = "0";
      setTimeout(() => { doorPanel.style.display = "none"; }, 800);
    }
  }

  window.addEventListener("popstate", () => {
    if (currentOverlay) {
      closeOverlayUI(currentOverlay);
      currentOverlay = null;
    }
    // If no overlay was open, this is a genuine back navigation (e.g.
    // away from the HOLOSPHERE entirely) -- let the browser handle it
    // normally, nothing extra needed here.
  });
})();
</script>
</body>
</html>
