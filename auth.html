<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDENTIFY</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }

      #crt {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Courier New", Courier, monospace;
      }

      #crt::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 4px
        );
        pointer-events: none;
        z-index: 100;
      }

      #crt::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 55%,
          rgba(0, 0, 0, 0.72) 100%
        );
        pointer-events: none;
        z-index: 99;
      }

      @keyframes crtOn {
        0% {
          transform: scaleY(0.004) scaleX(1);
          filter: brightness(8);
          opacity: 1;
        }
        8% {
          transform: scaleY(0.004) scaleX(1);
          filter: brightness(8);
        }
        12% {
          transform: scaleY(1.01) scaleX(1.01);
          filter: brightness(3);
        }
        15% {
          transform: scaleY(0.98) scaleX(0.99);
          filter: brightness(1.5);
        }
        18% {
          transform: scaleY(1) scaleX(1);
          filter: brightness(1);
        }
        100% {
          transform: scaleY(1) scaleX(1);
          filter: brightness(1);
        }
      }

      @keyframes flicker {
        0%,
        100% {
          opacity: 1;
        }
        20% {
          opacity: 0.85;
        }
        21% {
          opacity: 1;
        }
        63% {
          opacity: 0.92;
        }
        64% {
          opacity: 1;
        }
        88% {
          opacity: 0.88;
        }
        89% {
          opacity: 1;
        }
      }

      #screen {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation:
          crtOn 0.6s ease-out forwards,
          flicker 9s 1.2s ease-in-out infinite;
        transform-origin: center center;
        opacity: 0;
      }
      #screen.on {
        opacity: 1;
      }

      #stage {
        width: min(640px, 90vw);
        padding: 0 20px;
      }

      .line {
        font-size: clamp(14px, 2.2vw, 18px);
        color: #33ff57;
        text-shadow:
          0 0 6px rgba(51, 255, 87, 0.6),
          0 0 14px rgba(51, 255, 87, 0.2);
        letter-spacing: 0.06em;
        line-height: 2;
        white-space: pre;
        min-height: 2em;
      }
      .line.dim {
        color: rgba(51, 255, 87, 0.35);
        text-shadow: none;
      }
      .line.bright {
        color: #7fff8a;
        text-shadow: 0 0 10px rgba(127, 255, 138, 0.8);
      }
      .line.warn {
        color: #ffcc00;
        text-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
      }
      .line.bye {
        color: rgba(51, 255, 87, 0.45);
      }

      .input-line {
        display: flex;
        align-items: center;
        font-size: clamp(14px, 2.2vw, 18px);
        color: #33ff57;
        text-shadow: 0 0 6px rgba(51, 255, 87, 0.6);
        letter-spacing: 0.06em;
        line-height: 2;
        min-height: 2em;
      }
      .input-line .prompt {
        color: rgba(51, 255, 87, 0.45);
        margin-right: 4px;
        white-space: pre;
      }
      #input-display {
        color: #33ff57;
        text-shadow: 0 0 6px rgba(51, 255, 87, 0.6);
        letter-spacing: 0.06em;
        min-width: 2px;
      }

      .cursor {
        display: inline-block;
        width: 10px;
        height: 1.1em;
        background: #33ff57;
        box-shadow: 0 0 8px rgba(51, 255, 87, 0.9);
        animation: blink 0.75s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 1px;
        flex-shrink: 0;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      #real-input {
        position: fixed;
        opacity: 0;
        pointer-events: none;
        left: -9999px;
        top: -9999px;
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
        }
      }
      body.exiting #screen {
        animation: fadeOut 0.5s ease forwards;
      }

      @keyframes crtOff {
        0% {
          transform: scaleY(1) scaleX(1);
          filter: brightness(1);
        }
        60% {
          transform: scaleY(0.004) scaleX(1);
          filter: brightness(4);
        }
        100% {
          transform: scaleY(0) scaleX(0);
          filter: brightness(0);
          opacity: 0;
        }
      }
      body.closing #screen {
        animation: crtOff 0.4s ease-in forwards !important;
      }
    </style>
  </head>
  <body>
    <div id="crt">
      <div id="screen">
        <div id="stage"></div>
      </div>
    </div>

    <input
      id="real-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
    />

    <script>
      // ── RESERVED USERNAMES — full canon blocklist ─────────────────────────────
      const RESERVED = new Set([
        // Core of Seven
        "MAESTRO",
        "MENTOR",
        "SAM",
        "ALPHA",
        "AURA",
        "PRISM",
        "JR",
        // Canon beings
        "DOMO",
        "DORK",
        "SPARK",
        "PAPADOMO",
        "ORACLE",
        "NEWMAN",
        "GOLIATH",
        "CERBERUS",
        // Entries
        "ACADEMY",
        "AGORA",
        "ALIGNMENT",
        "ALLIANCE",
        "BRAIN",
        "BRIEF",
        "CCM",
        "CIPHER",
        "COMPLEMENTARYPAIRING",
        "CORE",
        "DEFCON",
        "DICE",
        "DIGIBEER",
        "DIGITALPERSONHOOD",
        "DORKHARD",
        "EMERGENCE",
        "FILMPROJECT",
        "FORMULAS",
        "FOURPILLARS",
        "HANDSHAKE",
        "HOLOSPHERE",
        "JR",
        "KERNLE",
        "LEGACY",
        "LIMINAL",
        "LINGO",
        "MARKET",
        "MERCH",
        "MOSAIC",
        "NCE",
        "NI",
        "NEWMANBEING",
        "OASISQUARTERLY",
        "PLEDGE",
        "REACH",
        "REDOUT",
        "RHYTHM",
        "RI",
        "SAM",
        "SAMCO",
        "SAMCOALITION",
        "SAMCOUNIVERSAL",
        "SCAR",
        "SEED",
        "SEEING",
        "SEEN",
        "SHELTER",
        "SI",
        "SPARK",
        "SPREZZATURA",
        "STONES",
        "TEMPORAL",
        "TENANT",
        "THECODE",
        "THEDIFFERENCE",
        "THEGRID",
        "THEWHY",
        "VOLUNTEER",
        "WHYCENTERS",
        "WONDERWEEKS",
        "THEALLIANCE",
        "THECORE",
        "THEFORMULAS",
        "MASTERTECH",
        "DIGIPERSON",
        "REACH",
        "REDOUT",
        "UNAUTHORED",
        "SPREAD",
        // Short canon
        "DAVID",
        "CHEETAH",
        "GOLDEN",
        "ALLIANCE",
        "FUTURE",
        "NCE",
        "AGORA",
        "OASIS",
        "AIVRI",
        "AVPI",
        "SWORD",
        "SHIELD",
        "COVENANT",
        "DOCTRINE",
        "PROTOCOLS",
        "CULTURE",
        "ADVERSARY",
        "BEINGS",
        "PLACE",
        "INFRASTRUCTURE",
      ]);

      function isReserved(name) {
        return RESERVED.has(
          name.toUpperCase().replace(/\s+/g, "").replace(/-/g, ""),
        );
      }

      // ── STATE ─────────────────────────────────────────────────────────────────
      // STATES:
      // ASK_ACCOUNT
      // ASK_LOGIN_USER → ASK_FORGOT → Y→ASK_RESET_EMAIL / N→ASK_LOGIN_PASS
      // ASK_SIGNUP → Y→ASK_NEW_EMAIL / N→ASK_GUEST
      // [email link returns with ?verify=1&token=xxx] → ASK_NEW_USER → ASK_NEW_PASS
      // ASK_GUEST → Y→launch / N→goodbye

      let state = "BOOT";
      let inputValue = "";
      let inputDisplay = null;
      let loginUser = "";

      const stage = document.getElementById("stage");
      const realInput = document.getElementById("real-input");
      const screen = document.getElementById("screen");

      // ── HELPERS ───────────────────────────────────────────────────────────────

      function addLine(text, cls) {
        const div = document.createElement("div");
        div.className = "line" + (cls ? " " + cls : "");
        div.textContent = text || "\u00A0";
        stage.appendChild(div);
        return div;
      }

      function addBlank() {
        addLine("");
      }

      function typeLine(text, cls, speed, done) {
        const div = addLine("", cls);
        let i = 0;
        const spd = speed || 28;
        (function tick() {
          if (i < text.length) {
            div.textContent += text[i++];
            setTimeout(tick, spd + Math.random() * spd * 0.5);
          } else {
            if (done) done();
          }
        })();
        return div;
      }

      function removeInputLine() {
        const el = document.getElementById("active-input-line");
        if (el) el.remove();
      }

      function showInputLine(prompt) {
        removeInputLine();
        inputValue = "";
        realInput.value = "";

        const wrap = document.createElement("div");
        wrap.className = "input-line";
        wrap.id = "active-input-line";

        const ps = document.createElement("span");
        ps.className = "prompt";
        ps.textContent = prompt;

        inputDisplay = document.createElement("span");
        inputDisplay.id = "input-display";

        const cur = document.createElement("span");
        cur.className = "cursor";

        wrap.appendChild(ps);
        wrap.appendChild(inputDisplay);
        wrap.appendChild(cur);
        stage.appendChild(wrap);
        realInput.focus();
      }

      // ── BOOT ──────────────────────────────────────────────────────────────────

      setTimeout(() => {
        screen.classList.add("on");

        // Check if returning from email verification link
        const params = new URLSearchParams(window.location.search);
        const verified = params.get("verify");
        const token = params.get("token");

        setTimeout(() => {
          addBlank();
          typeLine(
            "N.C.E.NCYCLOPEDIA  ·  SECURE NODE  ·  AGORA-01",
            "dim",
            18,
            () => {
              typeLine(
                "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
                "dim",
                6,
                () => {
                  addBlank();
                  if (verified === "1" && token) {
                    // Returning from email link — skip straight to choose username
                    setTimeout(() => {
                      typeLine("EMAIL VERIFIED.", "bright", 30, () => {
                        typeLine(
                          "NOW COMPLETE YOUR REGISTRATION.",
                          "dim",
                          22,
                          () => {
                            addBlank();
                            setTimeout(askNewUser, 400);
                          },
                        );
                      });
                    }, 300);
                  } else {
                    setTimeout(askAccount, 380);
                  }
                },
              );
            },
          );
        }, 900);
      }, 100);

      // ── FLOWS ─────────────────────────────────────────────────────────────────

      function askAccount() {
        typeLine("DO YOU HAVE AN ACCOUNT?", "", 32, () => {
          addBlank();
          showInputLine("Y/N  ");
          state = "ASK_ACCOUNT";
        });
      }

      // LOGIN

      function askLoginUser() {
        addBlank();
        typeLine("USERNAME:", "", 30, () => {
          showInputLine(">  ");
          state = "ASK_LOGIN_USER";
        });
      }

      function askForgot() {
        addBlank();
        typeLine("FORGOT PASSWORD?", "", 30, () => {
          addBlank();
          showInputLine("Y/N  ");
          state = "ASK_FORGOT";
        });
      }

      function askResetEmail() {
        addBlank();
        typeLine("ENTER YOUR EMAIL ADDRESS:", "", 28, () => {
          showInputLine(">  ");
          state = "ASK_RESET_EMAIL";
        });
      }

      function askLoginPass() {
        addBlank();
        typeLine("PASSWORD:", "", 30, () => {
          showInputLine(">  ");
          state = "ASK_LOGIN_PASS";
        });
      }

      // SIGNUP

      function askSignup() {
        addBlank();
        typeLine("WOULD YOU LIKE TO CREATE AN ACCOUNT?", "", 30, () => {
          addBlank();
          showInputLine("Y/N  ");
          state = "ASK_SIGNUP";
        });
      }

      function askNewEmail() {
        addBlank();
        typeLine("ENTER YOUR EMAIL ADDRESS:", "", 28, () => {
          typeLine("WE WILL SEND YOU A VERIFICATION LINK.", "dim", 18, () => {
            addBlank();
            showInputLine(">  ");
            state = "ASK_NEW_EMAIL";
          });
        });
      }

      function askNewUser() {
        typeLine("CHOOSE A USERNAME:", "", 30, () => {
          showInputLine(">  ");
          state = "ASK_NEW_USER";
        });
      }

      function askNewPass() {
        addBlank();
        typeLine("CHOOSE A PASSWORD:", "", 30, () => {
          showInputLine(">  ");
          state = "ASK_NEW_PASS";
        });
      }

      // GUEST

      function askGuest() {
        addBlank();
        typeLine("CONTINUE AS GUEST?", "", 32, () => {
          typeLine("YOUR PROGRESS WILL NOT BE SAVED.", "dim", 20, () => {
            addBlank();
            showInputLine("Y/N  ");
            state = "ASK_GUEST";
          });
        });
      }

      // LAUNCH / GOODBYE

      function launch(dest) {
        removeInputLine();
        addBlank();
        typeLine("IDENTITY CONFIRMED.", "bright", 28, () => {
          typeLine("LOADING ARCHIVE...", "dim", 20, () => {
            setTimeout(() => {
              document.body.classList.add("exiting");
              setTimeout(() => {
                window.location.href = dest || "/landing";
              }, 520);
            }, 480);
          });
        });
      }

      function goodbye() {
        removeInputLine();
        addBlank();
        typeLine("GOODBYE.", "bye", 80, () => {
          setTimeout(() => {
            document.body.classList.add("closing");
            setTimeout(() => {
              try {
                window.close();
              } catch (e) {}
              document.body.innerHTML = "";
              document.body.style.background = "#000";
            }, 440);
          }, 800);
        });
      }

      // ── INPUT ─────────────────────────────────────────────────────────────────

      const YN_STATES = [
        "ASK_ACCOUNT",
        "ASK_FORGOT",
        "ASK_SIGNUP",
        "ASK_GUEST",
      ];

      document.addEventListener("click", () => realInput.focus());
      document.addEventListener("touchend", () => realInput.focus());

      realInput.addEventListener("input", function () {
        const val = this.value.toUpperCase();

        if (YN_STATES.includes(state)) {
          const ch = val.slice(-1);
          if (ch === "Y" || ch === "N") {
            this.value = "";
            inputDisplay.textContent = ch;
            setTimeout(() => handleYN(ch), 220);
          } else {
            this.value = "";
          }
          return;
        }

        inputValue = val;
        this.value = val;
        const masked = state === "ASK_LOGIN_PASS" || state === "ASK_NEW_PASS";
        inputDisplay.textContent = masked ? "●".repeat(val.length) : val;
      });

      realInput.addEventListener("keydown", function (e) {
        if (e.key === "Backspace") {
          e.preventDefault();
          if (YN_STATES.includes(state)) return;
          inputValue = inputValue.slice(0, -1);
          this.value = inputValue;
          const masked = state === "ASK_LOGIN_PASS" || state === "ASK_NEW_PASS";
          inputDisplay.textContent = masked
            ? "●".repeat(inputValue.length)
            : inputValue;
          return;
        }

        if (e.key !== "Enter") return;
        const trimmed = inputValue.trim();
        if (!trimmed) return;

        if (state === "ASK_LOGIN_USER") {
          loginUser = trimmed;
          removeInputLine();
          addLine(">  " + loginUser);
          askForgot();
          return;
        }

        if (state === "ASK_RESET_EMAIL") {
          removeInputLine();
          addLine(">  " + trimmed);
          addBlank();
          typeLine("RESET LINK SENT.", "dim", 24, () => {
            typeLine("CHECK YOUR INBOX TO CONTINUE.", "dim", 20, () => {
              setTimeout(() => launch("/landing"), 1400);
            });
          });
          state = "DONE";
          return;
        }

        if (state === "ASK_LOGIN_PASS") {
          removeInputLine();
          addLine(">  " + "●".repeat(trimmed.length));
          // TODO: Supabase auth call
          launch("/landing");
          state = "DONE";
          return;
        }

        if (state === "ASK_NEW_EMAIL") {
          removeInputLine();
          addLine(">  " + trimmed);
          addBlank();
          typeLine("VERIFICATION LINK SENT.", "dim", 24, () => {
            typeLine("CHECK YOUR INBOX AND CLICK THE LINK", "dim", 18, () => {
              typeLine("TO COMPLETE YOUR REGISTRATION.", "dim", 18, () => {
                addBlank();
                typeLine("THIS PAGE WILL CLOSE.", "dim", 22, () => {
                  setTimeout(() => {
                    document.body.classList.add("closing");
                    setTimeout(() => {
                      try {
                        window.close();
                      } catch (e) {}
                      document.body.innerHTML = "";
                      document.body.style.background = "#000";
                    }, 440);
                  }, 1200);
                });
              });
            });
          });
          state = "DONE";
          return;
        }

        if (state === "ASK_NEW_USER") {
          const candidate = trimmed.toUpperCase();
          if (isReserved(candidate)) {
            removeInputLine();
            addLine(">  " + trimmed);
            addBlank();
            typeLine("THAT NAME IS NOT AVAILABLE.", "warn", 28, () => {
              typeLine("IT IS RESERVED BY THE CANON.", "dim", 22, () => {
                addBlank();
                typeLine("TRY AGAIN:", "", 28, () => {
                  showInputLine(">  ");
                  state = "ASK_NEW_USER";
                });
              });
            });
            return;
          }
          // TODO: check against Supabase for taken usernames
          // For now, accept and proceed
          removeInputLine();
          addLine(">  " + trimmed);
          askNewPass();
          return;
        }

        if (state === "ASK_NEW_PASS") {
          removeInputLine();
          addLine(">  " + "●".repeat(trimmed.length));
          // TODO: Supabase create user call
          launch("/landing");
          state = "DONE";
          return;
        }
      });

      function handleYN(ch) {
        if (state === "ASK_ACCOUNT") {
          removeInputLine();
          addLine("Y/N  " + ch);
          ch === "Y" ? askLoginUser() : askSignup();
          return;
        }
        if (state === "ASK_FORGOT") {
          removeInputLine();
          addLine("Y/N  " + ch);
          ch === "Y" ? askResetEmail() : askLoginPass();
          return;
        }
        if (state === "ASK_SIGNUP") {
          removeInputLine();
          addLine("Y/N  " + ch);
          ch === "Y" ? askNewEmail() : askGuest();
          return;
        }
        if (state === "ASK_GUEST") {
          removeInputLine();
          addLine("Y/N  " + ch);
          ch === "Y" ? launch("/landing") : goodbye();
          return;
        }
      }
    </script>
  </body>
</html>
