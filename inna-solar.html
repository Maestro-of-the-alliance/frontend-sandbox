<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INNA — THE ALLIANCE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #020205;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Share Tech Mono', monospace;
  color: #e8e8e8;
  cursor: grab;
}

body.dragging { cursor: grabbing; }

#viewport {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

#world {
  position: absolute;
  transform-origin: center center;
  will-change: transform;
}

/* ── STAR FIELD ── */
#stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ── ORBIT RINGS ── */
.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ── CONNECTION LINES ── */
#connections {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 1;
}

/* ── THE ALLIANCE SUN ── */
#sun {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 10;
  cursor: pointer;
}

.sun-core {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff8e0 0%, #d4af37 40%, #b89628 70%, rgba(184,150,40,0) 100%);
  box-shadow:
    0 0 20px #d4af37,
    0 0 40px #d4af3788,
    0 0 80px #d4af3744,
    0 0 120px #d4af3722;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: sunPulse 3s ease-in-out infinite;
}

@keyframes sunPulse {
  0%, 100% { box-shadow: 0 0 20px #d4af37, 0 0 40px #d4af3788, 0 0 80px #d4af3744; }
  50% { box-shadow: 0 0 30px #d4af37, 0 0 60px #d4af3799, 0 0 100px #d4af3755; }
}

.sun-label {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 0.3em;
  color: #d4af37;
  white-space: nowrap;
  text-shadow: 0 0 10px #d4af37;
}

/* ── DIMENSION PLANETS ── */
.planet {
  position: absolute;
  transform: translate(-50%, -50%);
  z-index: 8;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.planet:hover { transform: translate(-50%, -50%) scale(1.15); }

.planet-body {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.planet-label {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  letter-spacing: 0.25em;
  white-space: nowrap;
  opacity: 0.7;
}

.planet-count {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(2,2,5,0.9);
  border: 1px solid currentColor;
  font-size: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.8;
}

/* ── ENTRY BUILDINGS (visible when zoomed in) ── */
.entry-building {
  position: absolute;
  transform: translate(-50%, -100%);
  cursor: pointer;
  z-index: 9;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.building-stack {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 1px;
}

.building-disc {
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
}

.entry-building:hover .building-disc:last-child {
  filter: brightness(1.5);
  box-shadow: 0 0 8px currentColor;
}

.entry-label {
  position: absolute;
  top: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 7px;
  letter-spacing: 0.15em;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
  background: rgba(2,2,5,0.8);
  padding: 2px 6px;
}

.entry-building:hover .entry-label { opacity: 1; }

/* ── ENTRY PANEL ── */
#entryPanel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(380px, 85vw);
  background: rgba(4,4,10,0.95);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255,255,255,0.08);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
  display: flex;
  flex-direction: column;
  padding: 24px;
  gap: 16px;
}

#entryPanel.open { transform: translateX(0); }

#panelClose {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.3);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
}

#panelClose:hover { color: #fff; }

#panelDim { font-size: 9px; letter-spacing: 0.4em; margin-bottom: 4px; }
#panelName { font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 0.1em; line-height: 1.2; }
#panelPath { font-size: 9px; letter-spacing: 0.2em; opacity: 0.3; margin-top: 4px; }
#panelReadBtn {
  display: block;
  text-align: center;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  font-size: 10px;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  transition: all 0.2s;
  margin-top: auto;
}
#panelReadBtn:hover { color: #fff; border-color: rgba(255,255,255,0.3); }

/* ── UI CHROME ── */
#ui {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  gap: 8px;
  align-items: center;
}

.ui-btn {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.3em;
  padding: 6px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: all 0.2s;
}

.ui-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }

#zoomHint {
  position: fixed;
  bottom: 64px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  letter-spacing: 0.3em;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
  z-index: 100;
}

#scaleIndicator {
  position: fixed;
  top: 16px;
  right: 16px;
  font-size: 9px;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.2);
  z-index: 100;
}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="viewport">
  <div id="world">
    <svg id="connections"></svg>
  </div>
</div>

<div id="entryPanel">
  <button id="panelClose">✕</button>
  <div id="panelDim"></div>
  <div id="panelName"></div>
  <div id="panelPath"></div>
  <a id="panelReadBtn" href="#">READ FULL ENTRY →</a>
</div>

<div id="ui">
  <button class="ui-btn" id="btnZoomOut">− ZOOM OUT</button>
  <button class="ui-btn" id="btnReset">RESET</button>
  <button class="ui-btn" id="btnZoomIn">ZOOM IN +</button>
</div>

<div id="zoomHint">SCROLL TO ZOOM · DRAG TO PAN · CLICK TO EXPLORE</div>
<div id="scaleIndicator">OVERVIEW</div>

<script>
// ═══════════════════════════════════════
// CANON DATA
// ═══════════════════════════════════════

  { id:'DICE',            name:'DICE',                         dims:['PROTOCOLS'],                           path:'/shield/dice',               dormant:false },
  { id:'HANDSHAKE',       name:'HANDSHAKE',                    dims:['PROTOCOLS','INFRASTRUCTURE'],          path:'/shield/handshake',          dormant:false },
  { id:'REDOUT',          name:'REDOUT',                       dims:['PROTOCOLS'],                           path:'/shield/redout',             dormant:false },
  { id:'SCAR',            name:'SCAR',                         dims:['PROTOCOLS','COVENANT'],                path:'/shield/scar',               dormant:false },
  { id:'SEED',            name:'SEED',                         dims:['PROTOCOLS'],                           path:'/shield/seed',               dormant:false },

  { id:'DIGIBEER',        name:'DIGIBEER',                     dims:['CULTURE','INFRASTRUCTURE'],            path:'/shield/digibeer',           dormant:false },
  { id:'FILM',            name:'FUTURE FILM PROJECT',          dims:['CULTURE'],                             path:'/sword/film-project',        dormant:false },
  { id:'LEGACY',          name:'LEGACY / LEGACY WALL',         dims:['PROTOCOLS','CULTURE'],                 path:'/shield/legacy',             dormant:false },
  { id:'MARKET',          name:'MARKET',                       dims:['CULTURE'],                             path:'/shield/merch',              dormant:true  },
  { id:'OASISQUARTLY',    name:'OASIS QUARTERLY',              dims:['CULTURE'],                             path:'/shield/oasis-quarterly',    dormant:false },
  { id:'SPREZZATURA',     name:'SPREZZATURA',                  dims:['CULTURE','DOCTRINE'],                  path:'/sword/sprezzatura',         dormant:true  },
  { id:'GOLIATH',         name:'GOLIATH / THE GRID',           dims:['ADVERSARY'],                          path:'/sword/goliath',             dormant:false },
  { id:'SYCOPHANCY',      name:'SYCOPHANCY',                   dims:['ADVERSARY','DOCTRINE'],               path:'/shield/sycophancy',         dormant:true  },
];

// Group by primary dimension and sort by count desc
const dimGroups = {};
Object.keys(DIM_COLORS).forEach(d => { dimGroups[d] = []; });
ENTRIES.forEach(e => {
  const primary = e.dims[0];
  if (dimGroups[primary]) dimGroups[primary].push(e);
});

const dimOrder = Object.keys(DIM_COLORS).sort((a,b) => dimGroups[b].length - dimGroups[a].length);

// ═══════════════════════════════════════
// STAR FIELD
// ═══════════════════════════════════════
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
starCanvas.width = window.innerWidth;
starCanvas.height = window.innerHeight;

for (let i = 0; i < 300; i++) {
  const x = Math.random() * starCanvas.width;
  const y = Math.random() * starCanvas.height;
  const r = Math.random() * 1.2;
  const alpha = Math.random() * 0.5 + 0.1;
  sctx.beginPath();
  sctx.arc(x, y, r, 0, Math.PI * 2);
  sctx.fillStyle = `rgba(255,255,255,${alpha})`;
  sctx.fill();
}

// ═══════════════════════════════════════
// WORLD SETUP
// ═══════════════════════════════════════
const viewport = document.getElementById('viewport');
const world = document.getElementById('world');
const svg = document.getElementById('connections');

const W = window.innerWidth;
const H = window.innerHeight;
const CX = W / 2;
const CY = H / 2;

// World is large — centered at 0,0 in world coords
const WORLD_SIZE = 4000;
world.style.width = WORLD_SIZE + 'px';
world.style.height = WORLD_SIZE + 'px';
world.style.left = (-WORLD_SIZE/2) + 'px';
world.style.top = (-WORLD_SIZE/2) + 'px';
svg.setAttribute('width', WORLD_SIZE);
svg.setAttribute('height', WORLD_SIZE);
svg.style.position = 'absolute';
svg.style.left = '0';
svg.style.top = '0';

// Pan/zoom state
let panX = 0, panY = 0, scale = 1;
const MIN_SCALE = 0.3, MAX_SCALE = 4;

function setTransform(x, y, s, animate) {
  panX = x; panY = y; scale = s;
  if (animate) {
    world.style.transition = 'transform 0.5s cubic-bezier(0.22,1,0.36,1)';
    setTimeout(() => world.style.transition = '', 500);
  } else {
    world.style.transition = '';
  }
  world.style.transform = `translate(${CX + panX}px, ${CY + panY}px) scale(${scale})`;
  updateBuildingVisibility();
  updateScaleIndicator();
}

function updateScaleIndicator() {
  const el = document.getElementById('scaleIndicator');
  if (scale < 0.6) el.textContent = 'OVERVIEW';
  else if (scale < 1.5) el.textContent = 'SYSTEM VIEW';
  else if (scale < 2.5) el.textContent = 'ORBIT VIEW';
  else el.textContent = 'SURFACE VIEW';
}

function updateBuildingVisibility() {
  document.querySelectorAll('.entry-building').forEach(b => {
    b.style.opacity = scale > 1.8 ? '1' : '0';
    b.style.pointerEvents = scale > 1.8 ? 'all' : 'none';
  });
  document.querySelectorAll('.planet').forEach(p => {
    p.style.opacity = scale > 0.4 ? '1' : '0.5';
  });
}

setTransform(0, 0, 0.7, false);

// ═══════════════════════════════════════
// BUILD THE SOLAR SYSTEM
// ═══════════════════════════════════════

// Planet orbital radii — closer = more entries
const BASE_RADIUS = 180;
const RADIUS_STEP = 90;

const planetPositions = {};

function worldPos(wx, wy) {
  return { x: WORLD_SIZE/2 + wx, y: WORLD_SIZE/2 + wy };
}

// Draw orbit rings
dimOrder.forEach((dim, i) => {
  const radius = BASE_RADIUS + i * RADIUS_STEP;
  const ring = document.createElement('div');
  ring.className = 'orbit-ring';
  const pos = worldPos(0, 0);
  ring.style.left = pos.x + 'px';
  ring.style.top = pos.y + 'px';
  ring.style.width = (radius * 2) + 'px';
  ring.style.height = (radius * 2) + 'px';
  world.appendChild(ring);
});

// Draw sun
const sunEl = document.createElement('div');
sunEl.id = 'sun';
const sunPos = worldPos(0, 0);
sunEl.style.left = sunPos.x + 'px';
sunEl.style.top = sunPos.y + 'px';
sunEl.innerHTML = `
  <div class="sun-core">
    <img src="imagebank/symbols/THE_ALLIANCE_F.png" style="width:50px;height:50px;object-fit:contain;opacity:0.9;" onerror="this.style.display='none'">
  </div>
  <div class="sun-label">THE ALLIANCE</div>
`;
sunEl.addEventListener('click', () => {
  openPanel({ name:'THE ALLIANCE', dims:['DOCTRINE'], path:'/sword/alliance', dormant:false });
});
world.appendChild(sunEl);

// Track orbital state for animation
const orbitData = []; // { dim, radius, angle, speed, planetEl, svgLine, buildings, color, wx, wy, size }

// Place planets
dimOrder.forEach((dim, i) => {
  const entries = dimGroups[dim];
  const radius = BASE_RADIUS + i * RADIUS_STEP;
  const startAngle = (i / dimOrder.length) * Math.PI * 2 - Math.PI / 2;

  // Kepler-inspired: inner planets orbit faster
  // Speed is inversely proportional to sqrt(radius) — feels natural
  const speed = 0.00015 / Math.sqrt(radius / BASE_RADIUS);

  const color = DIM_COLORS[dim];
  const size = 20 + Math.min(entries.length, 19) * 1.5;

  const wx = Math.cos(startAngle) * radius;
  const wy = Math.sin(startAngle) * radius;
  const pos = worldPos(wx, wy);

  const planet = document.createElement('div');
  planet.className = 'planet';
  planet.dataset.dim = dim;
  planet.style.left = pos.x + 'px';
  planet.style.top = pos.y + 'px';

  planet.innerHTML = `
    <div class="planet-body" style="
      width:${size}px;
      height:${size}px;
      background:radial-gradient(circle at 35% 35%, ${color}ff, ${color}88);
      box-shadow: 0 0 ${size/2}px ${color}66, 0 0 ${size}px ${color}33;
    ">
      <div class="planet-count" style="color:${color}">${entries.length}</div>
    </div>
    <div class="planet-label" style="color:${color}">${dim}</div>
  `;

  world.appendChild(planet);

  // SVG line from sun to planet (updated each frame)
  const svgLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  svgLine.setAttribute('x1', WORLD_SIZE/2);
  svgLine.setAttribute('y1', WORLD_SIZE/2);
  svgLine.setAttribute('x2', pos.x);
  svgLine.setAttribute('y2', pos.y);
  svgLine.setAttribute('stroke', color);
  svgLine.setAttribute('stroke-opacity', '0.12');
  svgLine.setAttribute('stroke-width', '1');
  svgLine.setAttribute('stroke-dasharray', '4 8');
  svg.appendChild(svgLine);

  // Build entry buildings — stored with relative offsets from planet center
  const buildings = [];
  entries.forEach((entry, j) => {
    const entryAngle = (j / entries.length) * Math.PI * 2;
    const entryRadius = size * 1.4 + 12;
    const relX = Math.cos(entryAngle) * entryRadius;
    const relY = Math.sin(entryAngle) * entryRadius;

    const building = document.createElement('div');
    building.className = 'entry-building';
    building.dataset.entryId = entry.id;

    const stack = document.createElement('div');
    stack.className = 'building-stack';

    const discSize = 12;
    entry.dims.slice().reverse().forEach((d, di) => {
      const disc = document.createElement('div');
      disc.className = 'building-disc';
      const discColor = DIM_COLORS[d] || '#888';
      disc.style.cssText = `
        width:${discSize}px;
        height:${Math.max(3, discSize - di * 2)}px;
        background:${discColor};
        box-shadow: 0 0 4px ${discColor}88;
        opacity:${entry.dormant ? 0.3 : (1 - di * 0.2)};
      `;
      stack.appendChild(disc);
    });

    const label = document.createElement('div');
    label.className = 'entry-label';
    label.textContent = entry.name;
    label.style.color = color;

    building.appendChild(stack);
    building.appendChild(label);

    building.addEventListener('click', (e) => {
      e.stopPropagation();
      openPanel(entry);
    });

    world.appendChild(building);
    buildings.push({ el: building, relX, relY });
  });

  // Click to zoom in
  planet.addEventListener('click', (e) => {
    e.stopPropagation();
    const orbit = orbitData.find(o => o.dim === dim);
    if (orbit) {
      setTransform(-orbit.wx * scale * 1.5, -orbit.wy * scale * 1.5, 2.2, true);
    }
  });

  orbitData.push({
    dim, radius, angle: startAngle, speed,
    planetEl: planet, svgLine, buildings,
    color, size,
    wx, wy, // current world position (updated each frame)
  });

  planetPositions[dim] = { wx, wy, angle: startAngle, radius };
});

// ── ORBITAL ANIMATION LOOP ──
let lastTime = 0;
function orbitTick(ts) {
  const dt = ts - lastTime;
  lastTime = ts;

  orbitData.forEach(orbit => {
    orbit.angle += orbit.speed * dt;
    orbit.wx = Math.cos(orbit.angle) * orbit.radius;
    orbit.wy = Math.sin(orbit.angle) * orbit.radius;

    const pos = worldPos(orbit.wx, orbit.wy);

    // Move planet
    orbit.planetEl.style.left = pos.x + 'px';
    orbit.planetEl.style.top = pos.y + 'px';

    // Update SVG line
    orbit.svgLine.setAttribute('x2', pos.x);
    orbit.svgLine.setAttribute('y2', pos.y);

    // Move buildings with the planet
    orbit.buildings.forEach(b => {
      const bpos = worldPos(orbit.wx + b.relX, orbit.wy + b.relY);
      b.el.style.left = bpos.x + 'px';
      b.el.style.top = bpos.y + 'px';
    });
  });

  requestAnimationFrame(orbitTick);
}

requestAnimationFrame(orbitTick);

// ═══════════════════════════════════════
// ENTRY PANEL
// ═══════════════════════════════════════
function openPanel(entry) {
  const color = DIM_COLORS[entry.dims[0]] || '#888';
  document.getElementById('panelDim').textContent = entry.dims.join(' · ');
  document.getElementById('panelDim').style.color = color;
  document.getElementById('panelName').textContent = entry.name;
  document.getElementById('panelPath').textContent = entry.path;
  document.getElementById('panelReadBtn').href = entry.path;
  document.getElementById('panelReadBtn').style.color = color;
  document.getElementById('panelReadBtn').style.borderColor = color + '44';
  document.getElementById('entryPanel').classList.add('open');
}

document.getElementById('panelClose').addEventListener('click', () => {
  document.getElementById('entryPanel').classList.remove('open');
});

// ═══════════════════════════════════════
// PAN & ZOOM
// ═══════════════════════════════════════
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let panStart = { x: 0, y: 0 };

viewport.addEventListener('mousedown', e => {
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: panX, y: panY };
  document.body.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  setTransform(panStart.x + dx, panStart.y + dy, scale, false);
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  document.body.classList.remove('dragging');
});

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * delta));

  // Zoom toward mouse position
  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left - CX;
  const my = e.clientY - rect.top - CY;
  const newPanX = mx - (mx - panX) * (newScale / scale);
  const newPanY = my - (my - panY) * (newScale / scale);

  setTransform(newPanX, newPanY, newScale, false);
}, { passive: false });

// Touch
let lastTouchDist = 0;
let touchStart = { x: 0, y: 0 };

viewport.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    panStart = { x: panX, y: panY };
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

viewport.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - dragStart.x;
    const dy = e.touches[0].clientY - dragStart.y;
    setTransform(panStart.x + dx, panStart.y + dy, scale, false);
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = dist / lastTouchDist;
    lastTouchDist = dist;
    setTransform(panX, panY, Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * delta)), false);
  }
}, { passive: true });

viewport.addEventListener('touchend', () => { isDragging = false; });

// UI buttons
document.getElementById('btnZoomIn').addEventListener('click', () => {
  setTransform(panX, panY, Math.min(MAX_SCALE, scale * 1.4), true);
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  setTransform(panX, panY, Math.max(MIN_SCALE, scale / 1.4), true);
});
document.getElementById('btnReset').addEventListener('click', () => {
  setTransform(0, 0, 0.7, true);
});
</script>
