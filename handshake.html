<html lang="en">
  <head>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #000;
        font-family: "IBM Plex Mono", monospace;
      }

      body {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px 16px 120px;
      }

      /* ── CRT SHELL ── */
      .crt-shell {
        position: relative;
        width: min(820px, 100%);
        background: #080909;
        border-radius: 18px;
        border: 2px solid #1a1c1c;
        box-shadow:
          0 0 0 6px #111,
          0 0 60px rgba(0, 0, 0, 0.9),
          inset 0 0 120px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        animation: flickerIn 0.9s ease-out forwards;
      }

      @keyframes flickerIn {
        0% {
          opacity: 0;
        }
        8% {
          opacity: 0.9;
        }
        12% {
          opacity: 0.2;
        }
        18% {
          opacity: 0.95;
        }
        22% {
          opacity: 0.5;
        }
        28% {
          opacity: 1;
        }
        100% {
          opacity: 1;
        }
      }

      /* ── CRT SCREEN ── */
      .crt-screen {
        position: relative;
        margin: 18px;
        background: #030404;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
      }

      /* scanlines */
      .crt-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.18) 2px,
          rgba(0, 0, 0, 0.18) 4px
        );
      }

      /* vignette */
      .crt-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 11;
        background: radial-gradient(
          ellipse at center,
          transparent 60%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }

      .scan-roll {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;
        background: rgba(215, 168, 75, 0.06);
        z-index: 12;
        animation: scanRoll 7s linear infinite;
        pointer-events: none;
      }
      @keyframes scanRoll {
        0% {
          top: -3px;
        }
        100% {
          top: 100%;
        }
      }

      /* ── TERMINAL ── */
      .terminal {
        position: relative;
        padding: 28px 32px 32px;
        z-index: 5;
      }

      .terminal-header {
        font-size: 9px;
        letter-spacing: 0.3em;
        color: rgba(215, 168, 75, 0.45);
        text-transform: uppercase;
        margin-bottom: 22px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(215, 168, 75, 0.12);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }

      .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d7a84b;
        box-shadow: 0 0 8px #d7a84b;
        margin-right: 8px;
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .output {
        font-size: clamp(11px, 1.8vw, 14px);
        line-height: 2;
        color: #d7a84b;
        white-space: pre-wrap;
        word-break: break-word;
        text-shadow: 0 0 8px rgba(215, 168, 75, 0.4);
        min-height: 200px;
      }

      .cursor {
        display: inline-block;
        width: 8px;
        height: 1.1em;
        background: #d7a84b;
        vertical-align: text-bottom;
        margin-left: 2px;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .last-line {
        color: #eee2bd;
        text-shadow: 0 0 14px rgba(238, 226, 189, 0.8);
        font-weight: 500;
      }

      /* ── BETWEEN VIGNETTE BUTTON ── */
      .next-tx-wrap {
        display: flex;
        justify-content: center;
        padding: 24px 32px 28px;
        opacity: 0;
        transition: opacity 0.8s ease;
        pointer-events: none;
      }
      .next-tx-wrap.visible {
        opacity: 1;
        pointer-events: all;
      }

      .tx-btn {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #d7a84b;
        cursor: pointer;
        padding: 12px 28px;
        border: 1px solid rgba(215, 168, 75, 0.4);
        background: transparent;
        text-shadow: 0 0 10px rgba(215, 168, 75, 0.5);
        transition: all 0.2s ease;
      }
      .tx-btn:hover {
        background: rgba(215, 168, 75, 0.08);
        border-color: rgba(215, 168, 75, 0.7);
      }

      /* ── FINAL CHOICES ── */
      .choice-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 18px 24px 24px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.98));
        opacity: 0;
        transition: opacity 0.8s ease;
        pointer-events: none;
        z-index: 50;
      }
      .choice-bar.visible {
        opacity: 1;
        pointer-events: all;
      }

      .choice {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(215, 168, 75, 0.5);
        cursor: pointer;
        padding: 10px 18px;
        border: 1px solid transparent;
        background: transparent;
        transition: all 0.2s ease;
        user-select: none;
      }
      .choice.primary {
        color: #d7a84b;
        border-color: rgba(215, 168, 75, 0.4);
        text-shadow: 0 0 10px rgba(215, 168, 75, 0.5);
      }
      .choice:hover {
        color: #eee2bd;
        border-color: rgba(215, 168, 75, 0.4);
      }

      /* ── PIN LIGHT ── */
      .pinlight {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 100;
        pointer-events: none;
        opacity: 0;
      }
      .pinlight.collapsing {
        animation: pinCollapse 1.2s ease-in forwards;
      }
      @keyframes pinCollapse {

          background: radial-gradient(

        40% {

            #d7a84b 0%,

          );
        }
        70% {
          background: radial-gradient(
            ellipse 8% 6% at center,
            #d7a84b 0%,
            #000 100%
          );
        }
        85% {
          background: radial-gradient(
            ellipse 2% 1% at center,
            #fff 0%,
            #000 100%
          );
        }
        100% {
          background: #000;
          opacity: 1;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 12px 8px 120px;
        }
        .terminal {
          padding: 20px 18px 24px;
        }
        .terminal-header {
          font-size: 8px;
        }
      }
    </style>

        const now = new Date();

      // ── VIGNETTES ──
      // Each vignette is an array of SEGMENTS
      // Each segment: { text, delay_before, char_delay }
      // delay_before = pause BEFORE this segment starts (ms)
      // char_delay = base ms per character for this segment

      function makeVignette(text) {
        // Parse the raw text into segments based on structure
        // We split on double-newlines (speaker changes) and single newlines
        // and apply different rhythms to each
        const segments = [];
        const blocks = text.split("\n\n");

        blocks.forEach((block, bi) => {
          if (bi > 0) {
            // speaker change — long pause before next block
            segments.push({ text: "\n\n", delay_before: 900, char_delay: 0 });
          }
          const lines = block.split("\n");
          lines.forEach((line, li) => {
            if (li > 0) {
              // line break within same speaker — medium pause
              segments.push({ text: "\n", delay_before: 420, char_delay: 0 });
            }

            // detect line type by indentation / content
            const trimmed = line.trim();
            const indent = line.length - line.trimStart().length;

            let charDelay, delayBefore;

            if (indent >= 12) {
              // deep indent — responding DOMO — slowest, most deliberate
              charDelay = [52, 38];
              delayBefore = li === 0 ? 320 : 0;
            } else if (indent >= 6) {
              // medium indent — routing / MTS lines
              charDelay = [44, 30];
              delayBefore = li === 0 ? 220 : 0;
            } else if (
              trimmed.startsWith("DOMO") ||
              trimmed.startsWith("MasterTech") ||
              trimmed.startsWith("SPARK")
            ) {
              // transmission lines
              charDelay = [38, 24];
              delayBefore = 0;
            } else {
              // standard
              charDelay = [34, 20];
              delayBefore = 0;
            }

            segments.push({
              text: line,
              delay_before: delayBefore,
              char_delay: charDelay,
              isDash: false,
            });
          });
        });
        return segments;
      }

      // ── TRACKING ──
      const SEEN_KEY = "atf_hs_seen";
      const COMP_KEY = "atf_completion";

      function getSeenList() {
        try {
          return JSON.parse(localStorage.getItem(SEEN_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }
      function markSeen(idx) {
        let seen = getSeenList();
        if (!seen.includes(idx)) seen.push(idx);
        if (seen.length >= RAW_VIGNETTES.length) seen = [];
        localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
        try {
          let c = JSON.parse(localStorage.getItem(COMP_KEY) || "{}");
          if (!c.handshake) c.handshake = [];
          if (!c.handshake.includes(idx)) c.handshake.push(idx);
          localStorage.setItem(COMP_KEY, JSON.stringify(c));
        } catch (e) {}
      }
      function getNextUnseen(exclude = []) {
        const seen = getSeenList();
        const allEx = [...seen, ...exclude];
        const unseen = RAW_VIGNETTES.map((_, i) => i).filter(
          (i) => !allEx.includes(i),
        );
        if (!unseen.length) {
          const avail = RAW_VIGNETTES.map((_, i) => i).filter(
            (i) => !exclude.includes(i),
          );
          return avail[Math.floor(Math.random() * avail.length)];
        }
        return unseen[Math.floor(Math.random() * unseen.length)];
      }

      // ── STATE ──
      let vigQueue = [];
      let typing = false;
      let typeTimeout = null;

      function initQueue() {
        const first = getNextUnseen([]);
        const second = getNextUnseen([first]);
        vigQueue = [first, second];
      }

      // ── TYPING ENGINE ──
      function getLastLine(text) {
        const lines = text
          .trim()
          .split("\n")
          .filter((l) => l.trim());
        return lines[lines.length - 1];
      }

      function clearOutput() {
        document.getElementById("output").innerHTML =
          '<span class="cursor"></span>';
        document.getElementById("nextTxWrap").classList.remove("visible");
        document.getElementById("choiceBar").classList.remove("visible");
      }

      // Character-level delay based on context
      function getCharDelay(ch, indentLevel) {
        // dash gets a micro pause — feels like punctuation being spoken
        if (ch === "—") return 110;
        if (ch === "-") return 70;
        if (ch === " ") {
          if (indentLevel >= 12) return 48;
          if (indentLevel >= 6) return 36;
          return 28;
        }
        if (indentLevel >= 12) return Math.random() * 28 + 48; // deepest indent = slowest
        if (indentLevel >= 6) return Math.random() * 22 + 38;
        return Math.random() * 18 + 28;
      }

      function typeVignette(idx, onDone) {
        typing = true;
        markSeen(idx);
        clearOutput();

        const raw = RAW_VIGNETTES[idx];
        const output = document.getElementById("output");

        // split into blocks by double newline
        const blocks = raw.split("\n\n");
        let blockIdx = 0;
        let lineIdx = 0;
        let charIdx = 0;
        let currentText = "";
        let lastLineText = getLastLine(raw);

        function getCurrentLine() {
          if (blockIdx >= blocks.length) return null;
          const lines = blocks[blockIdx].split("\n");
          if (lineIdx >= lines.length) return null;
          return lines[lineIdx];
        }

        function getIndent(line) {
          return line ? line.length - line.trimStart().length : 0;
        }

        function render(extra) {
          const safe = (currentText + (extra || ""))
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
          // check if we're on the last line
          const isLastLine =
            blockIdx === blocks.length - 1 &&
            lineIdx === blocks[blocks.length - 1].split("\n").length - 1 &&
            extra === undefined;

          if (isLastLine) {
            // split off last line and highlight it
            const lastSafe = lastLineText
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            const beforeLast = safe.slice(0, safe.lastIndexOf(lastSafe));
            output.innerHTML =
              beforeLast + `<span class="last-line">${lastSafe}</span>`;
          } else {
            output.innerHTML = safe + '<span class="cursor"></span>';
          }
        }

        function typeChar() {
          if (!typing) return;
          const line = getCurrentLine();
          if (line === null) {
            // done
            render(undefined);
            setTimeout(() => {
              typing = false;
              onDone && onDone();
            }, 2800);
            return;
          }

          const indent = getIndent(line);

          if (charIdx < line.length) {
            const ch = line[charIdx++];
            currentText += ch;
            render(line.slice(charIdx)); // show rest as ghost? No — just render what we have
            output.innerHTML =
              currentText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;") + '<span class="cursor"></span>';

            // dash pause
            if (ch === "—") {
              typeTimeout = setTimeout(typeChar, 280);
            } else {
              typeTimeout = setTimeout(typeChar, getCharDelay(ch, indent));
            }
          } else {
            // end of line — move to next
            const lines = blocks[blockIdx].split("\n");
            lineIdx++;
            charIdx = 0;
            currentText += "\n";

            if (lineIdx >= lines.length) {
              // end of block
              blockIdx++;
              lineIdx = 0;
              if (blockIdx < blocks.length) {
                // speaker change pause
                currentText += "\n";
                output.innerHTML =
                  currentText
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;") + '<span class="cursor"></span>';
                typeTimeout = setTimeout(typeChar, 1100); // long pause between speakers
              } else {
                // truly done
                render(undefined);
                setTimeout(() => {
                  typing = false;
                  onDone && onDone();
                }, 2800);
              }
            } else {
              // next line within same block
              output.innerHTML =
                currentText
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;") + '<span class="cursor"></span>';
              typeTimeout = setTimeout(typeChar, 480); // line break pause
            }
          }
        }

        typeChar();
      }

      // ── SEQUENCE ──
      function runSequence() {
        initQueue();
        typeVignette(vigQueue[0], () => {
          document.getElementById("nextTxWrap").classList.add("visible");
        });
      }

      document.getElementById("btnNextTx").addEventListener("click", () => {
        document.getElementById("nextTxWrap").classList.remove("visible");
        setTimeout(() => {
          typeVignette(vigQueue[1], () => {
            document.getElementById("choiceBar").classList.add("visible");
          });
        }, 500);
      });

      document.getElementById("btnProceed").addEventListener("click", () => {
        collapse(() => {
          window.location.href = "/madlib.html";
        });
      });

      document.getElementById("btnRestart").addEventListener("click", () => {
        typing = false;
        if (typeTimeout) clearTimeout(typeTimeout);
        runSequence();
      });

      function collapse(cb) {
        const p = document.getElementById("pinlight");
        p.classList.add("collapsing");
        setTimeout(cb, 1300);
      }

      window.addEventListener("load", () => {
        setTimeout(runSequence, 800);
      });
    </script>
  </body>
</html>
