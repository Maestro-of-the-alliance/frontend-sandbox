.crt-screen::before {

.crt-screen::after {

.scan-roll {

// ── TRACKING ──
const SEEN_KEY = 'atf_hs_seen';
const COMP_KEY = 'atf_completion';

function getSeenList() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'); } catch(e){ return []; } }
function markSeen(idx) {
  let seen = getSeenList();
  if(!seen.includes(idx)) seen.push(idx);
  if(seen.length >= VIGNETTES.length) seen = [];
  localStorage.setItem(SEEN_KEY, JSON.stringify(seen));
  try {
    let c = JSON.parse(localStorage.getItem(COMP_KEY)||'{}');
    if(!c.handshake) c.handshake = [];
    if(!c.handshake.includes(idx)) c.handshake.push(idx);
    localStorage.setItem(COMP_KEY, JSON.stringify(c));
  } catch(e) {}
}
function getNextUnseen(exclude=[]) {
  const seen = getSeenList();
  const allEx = [...seen, ...exclude];
  const unseen = VIGNETTES.map((_,i)=>i).filter(i=>!allEx.includes(i));
  if(!unseen.length) {
    const avail = VIGNETTES.map((_,i)=>i).filter(i=>!exclude.includes(i));
    return avail[Math.floor(Math.random()*avail.length)];
  }
  return unseen[Math.floor(Math.random()*unseen.length)];
}

// ── AUTO SCROLL ──
function scrollToBottom() {

  wrap.scrollTop = wrap.scrollHeight;
}

// ── TYPING ──
function getCharDelay(ch, indent) {
  if(ch === '—') return 120;
  if(ch === '\n') return indent >= 12 ? 380 : 280;
  if(ch === ' ') return indent >= 12 ? 44 : indent >= 6 ? 34 : 26;
  if(indent >= 12) return Math.random()*30+50;
  if(indent >= 6)  return Math.random()*24+40;
  return Math.random()*18+28;
}

function getIndent(line) { return line ? line.length - line.trimStart().length : 0; }

function getLastLine(text) {
  const lines = text.trim().split('\n').filter(l=>l.trim());
  return lines[lines.length-1];
}

function clearOutput() {
  document.getElementById('output').innerHTML = '<span class="cursor"></span>';
  document.getElementById('outputWrap').scrollTop = 0;
  document.getElementById('nextTxWrap').classList.remove('visible');
  document.getElementById('choiceBar').classList.remove('visible');
}

function typeText(text, onDone, isBuffer) {
  typing = true;
  const output = document.getElementById('output');
  const lastLine = isBuffer ? null : getLastLine(text);
  let currentText = '';
  const chars = text.split('');
  let ci = 0;

  function getIndentAt(pos) {
    // find start of current line
    let lineStart = currentText.lastIndexOf('\n') + 1;
    const lineText = text.slice(lineStart, pos);
    return lineText.length - lineText.trimStart().length;
  }

  function render() {
    const safe = currentText.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if(!isBuffer && lastLine && currentText.includes(lastLine) && ci >= text.length) {
      const lastSafe = lastLine.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const idx = safe.lastIndexOf(lastSafe);
      output.innerHTML = safe.slice(0,idx) + `<span class="last-line">${lastSafe}</span>`;
    } else {
      output.innerHTML = safe + '<span class="cursor"></span>';
    }
    scrollToBottom();
  }

  function next() {
    if(!typing) return;
    if(ci >= chars.length) {
      render();
      setTimeout(() => { typing = false; onDone && onDone(); }, isBuffer ? 1800 : 2800);
      return;
    }
    const ch = chars[ci++];
    currentText += ch;

    // special pause after double newline (speaker change)
    const isBlockBreak = ch === '\n' && chars[ci] === '\n';
    const indent = getIndentAt(ci);

    render();

    if(isBlockBreak) {
      typeTimeout = setTimeout(next, 1100);
    } else {
      typeTimeout = setTimeout(next, getCharDelay(ch, indent));
    }
  }
  next();
}

function runSequence() {
  initQueue();
  clearOutput();
  // type buffer first
  typeText(BUFFER, () => {
    setTimeout(() => {
      clearOutput();
      setTimeout(() => {
        typeText(VIGNETTES[vigQueue[0]], () => {
          document.getElementById('nextTxWrap').classList.add('visible');
        }, false);
      }, 500);
    }, 400);
  }, true);
}

});

  collapse(() => window.location.href = '/madlib.html');
});
document.getElementById('btnRestart').addEventListener('click', () => {
  typing = false;
  if(typeTimeout) clearTimeout(typeTimeout);
  runSequence();
});

function collapse(cb) {
  const p = document.getElementById('pinlight');
  p.classList.add('collapsing');
  setTimeout(cb, 1300);
}

window.addEventListener('load', () => { setTimeout(runSequence, 600); });
</script>
</body>
</html>
