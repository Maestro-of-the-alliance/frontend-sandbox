<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PapaDOMO's Free Tours</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #050a1f;
    --gold: #ffb81c;
    --cyan: #35e6ff;
    --vh: 1vh;
    /* One unit = 1% of the kiosk art's width. Everything inside the stage
       is sized in these units so it scales exactly with the picture. */
    --u: calc(min(100vw, calc(var(--vh) * 100 * 1024 / 1536)) / 100);
    --font: "Barlow Condensed", "Rajdhani", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  @supports (height: 100dvh) { :root { --vh: 1dvh; } }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--navy);
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: grid;
    place-items: center;
    font-family: var(--font);
    background:
      radial-gradient(ellipse at 50% 38%, #0b1c55 0%, #071236 45%, #050a1f 80%);
  }

  /* The kiosk: the art is the picture, real buttons sit exactly on its rows. */
  #stage {
    position: relative;
    width: calc(var(--u) * 100);
    aspect-ratio: 1024 / 1536;
    animation: arrive 0.6s ease-out both;
  }
  html.embedded #stage { animation: none; }
  @keyframes arrive {
    from { opacity: 0; transform: scale(0.965); }
    to   { opacity: 1; transform: scale(1); }
  }
  #art {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  /* Rows: real buttons, invisible on purpose. The art shows the row; the
     button only adds the selected glow, focus ring, and hold-to-preview cue. */
  .row {
    position: absolute;
    left: 23.54%;
    width: 52.83%;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: transparent;
    font: inherit;
    cursor: pointer;
    border-radius: calc(var(--u) * 1.7);
    outline: none;
    touch-action: none;               /* the board never scrolls; keeps holds from being stolen as a pan */
  }
  .row::after {                       /* selected glow */
    content: "";
    position: absolute;
    inset: calc(var(--u) * -0.25);
    border-radius: inherit;
    border: calc(var(--u) * 0.75) solid var(--cyan);
    box-shadow:
      0 0 calc(var(--u) * 2.2) var(--cyan),
      0 0 calc(var(--u) * 4.5) rgba(20, 160, 255, 0.55),
      inset 0 0 calc(var(--u) * 1.8) rgba(53, 230, 255, 0.55);
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
  }
  .row.selected::after { opacity: 1; }
  .row:focus-visible { outline: 2px solid #fff; outline-offset: calc(var(--u) * 0.6); }
  .row:focus-visible::after { opacity: 1; }
  .row::before {                      /* press-and-hold charging cue */
    content: "";
    position: absolute;
    left: 5%; right: 5%; bottom: calc(var(--u) * 0.15);
    height: calc(var(--u) * 0.8);
    background: linear-gradient(90deg, var(--cyan), #ffffff);
    box-shadow: 0 0 calc(var(--u) * 1.2) var(--cyan);
    transform: scaleX(0);
    transform-origin: left;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .row.charging::before { opacity: 1; animation: charge 0.4s linear 0.1s forwards; }
  @keyframes charge { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* Twinkling lights: pixel-stepped glints laid over the art's own lights. */
  .glint {
    position: absolute;
    width: calc(var(--u) * var(--s, 1.1));
    aspect-ratio: 1;
    color: #ffd86b;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0);
    background:
      linear-gradient(currentColor, currentColor) center / 16% 100% no-repeat,
      linear-gradient(currentColor, currentColor) center / 100% 16% no-repeat,
      linear-gradient(currentColor, currentColor) center / 44% 44% no-repeat;
    filter: drop-shadow(0 0 calc(var(--u) * 0.6) currentColor);
    animation: twinkle var(--d, 3.6s) steps(3, end) var(--dl, 0s) infinite;
    will-change: transform, opacity;
  }
  .glint.blue { color: #bff6ff; }
  @keyframes twinkle {
    0%   { transform: translate(-50%, -50%) scale(0);    opacity: 0; }
    8%   { transform: translate(-50%, -50%) scale(0.55); opacity: 1; }
    16%  { transform: translate(-50%, -50%) scale(1);    opacity: 1; }
    24%  { transform: translate(-50%, -50%) scale(0.55); opacity: 1; }
    32%, 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  }
  body.paused .glint { animation-play-state: paused; }

  /* ---- Old-Vegas marquee: chaser bulbs, LED ticker, whole-sign flash ---- */
  #lights, #marquee { position: absolute; inset: 0; pointer-events: none; }
  .bulb {
    position: absolute;
    width: calc(var(--u) * 1.15);
    aspect-ratio: 1;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 40% 38%, #ffffff 0%, #fff0b8 38%, #ffc933 100%);
    box-shadow: 0 0 calc(var(--u) * 0.9) rgba(255, 205, 80, 0.95), 0 0 calc(var(--u) * 2) rgba(255, 170, 30, 0.45);
    opacity: 0.22;
    animation: chase 0.96s steps(1, end) var(--bd, 0s) infinite;
  }
  @keyframes chase { 0% { opacity: 1; } 33.34%, 100% { opacity: 0.22; } }
  /* Old marquee letters: a tighter, quicker two-step alternation that hugs
     PapaDOMO's and Free Tours directly, smaller so they read as trim bulbs
     against the letters instead of the bigger sign-border lights. */
  .bulb-word {
    width: calc(var(--u) * 0.85);
    box-shadow: 0 0 calc(var(--u) * 0.7) rgba(255, 205, 80, 0.95), 0 0 calc(var(--u) * 1.5) rgba(255, 170, 30, 0.5);
    animation: chase-word 0.56s steps(1, end) var(--bd, 0s) infinite;
  }
  @keyframes chase-word { 0% { opacity: 1; } 50%, 100% { opacity: 0.18; } }
  #marquee.flash .bulb { animation: bulbflash 0.36s steps(1, end) 5; }
  @keyframes bulbflash { 0% { opacity: 1; } 50% { opacity: 0.12; } }
  #signglow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 52% 11% at 50% 14%, rgba(255, 214, 102, 0.6), rgba(255, 214, 102, 0) 100%),
                radial-gradient(ellipse 46% 5% at 50% 92%, rgba(255, 214, 102, 0.4), rgba(255, 214, 102, 0) 100%);
    mix-blend-mode: screen;
    opacity: 0;
  }
  #marquee.flash ~ #signglow, #stage.flash #signglow { animation: bulbflash 0.36s steps(1, end) 5; }
  #ticker {
    position: absolute;
    left: 21.68%; width: 56.05%;
    top: 91.54%; height: 2.66%;
    overflow: hidden;
    pointer-events: none;
    border-radius: calc(var(--u) * 0.6);
    background:
      radial-gradient(circle, rgba(0, 0, 0, 0.42) 34%, rgba(0, 0, 0, 0) 38%) 0 0 / calc(var(--u) * 0.5) calc(var(--u) * 0.5),
      linear-gradient(180deg, #03082a, #001a5d);
    box-shadow: inset 0 0 calc(var(--u) * 1.2) rgba(0, 0, 0, 0.7);
    font-family: var(--font);
    font-weight: 700;
    font-size: calc(var(--u) * 3.3);
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    white-space: nowrap;
    color: #ffe08a;
    text-shadow: 0 0 calc(var(--u) * 0.9) rgba(255, 190, 60, 0.9);
  }
  #tk-track, #tk-spell {
    position: absolute; left: 0; top: 0; height: 100%;
    display: flex; align-items: center;
  }
  #tk-track { animation: tkscroll var(--tk-dur, 30s) linear infinite; will-change: transform; }
  @keyframes tkscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  #tk-track span { display: inline-flex; align-items: center; }
  .dia {
    display: inline-block;
    width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5);
    margin: 0 calc(var(--u) * 2.4);
    background: #35e6ff;
    transform: rotate(45deg) scale(0.8);
    box-shadow: 0 0 calc(var(--u) * 0.9) #35e6ff;
  }
  #tk-spell { width: 100%; justify-content: center; opacity: 0; }
  #tk-spell i { font-style: normal; opacity: 0.14; transition: opacity 0.05s; }
  #tk-spell i.on { opacity: 1; color: #fff3c4; }
  #ticker.spelling #tk-track { visibility: hidden; }
  #ticker.spelling #tk-spell { opacity: 1; }
  #ticker.flash { animation: bulbflash 0.36s steps(1, end) 5; }
  body.paused #tk-track { animation-play-state: paused; }

  /* Quiet hint under the kiosk. */
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: #8fd2ff;
    opacity: 0.8;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #hint.gone { opacity: 0; }

  /* Breakout card. */
  #sheet[hidden] { display: none; }
  #sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; }
  #scrim { position: absolute; inset: 0; background: rgba(2, 6, 20, 0.72); animation: fade 0.18s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #card {
    position: relative;
    width: min(94vw, 480px);
    max-height: calc(var(--vh) * 92);
    margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    padding: 18px 20px 20px;
    overflow: auto;
    text-align: center;
    color: #fff;
    background: linear-gradient(180deg, #0c2a7a 0%, #08194f 100%);
    border: 3px solid var(--gold);
    border-radius: 16px;
    box-shadow: 0 0 0 3px #0a1440, 0 0 26px rgba(53, 230, 255, 0.55), inset 0 0 22px rgba(53, 230, 255, 0.18);
    animation: rise 0.22s ease-out;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  #close {
    position: absolute; top: 8px; right: 10px;
    width: 40px; height: 40px;
    border: 2px solid var(--gold); border-radius: 10px;
    background: #071a4a; color: var(--gold);
    font: 700 20px/1 var(--font); cursor: pointer;
  }
  #k-num { margin: 0 0 4px; font-size: 14px; letter-spacing: 0.22em; color: var(--gold); font-weight: 600; }
  #sheet-title { margin: 0 34px 10px; font-size: 30px; line-height: 1.05; font-weight: 700; text-shadow: 0 0 12px rgba(53, 230, 255, 0.6); }
  #sprite-wrap {
    height: clamp(150px, calc(var(--vh) * 46), 460px);
    margin: 6px 0 8px;
    display: grid; place-items: center;
  }
  /* PapaDOMO's routine lives here. Until the pixel sprite sheet arrives this
     shows his welcoming pose with a stepped bob. To swap in the real sprite:
     set --sheet, --frames, --fw, --fh on #sprite (see setSprite in the script). */
  #sprite {
    width: 100%; height: 100%;
    background: var(--art, none) center / contain no-repeat;
    animation: bob 0.9s steps(2, jump-none) infinite;
  }
  @keyframes bob { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
  #sprite.sheet {
    width: calc(var(--fw) * 1px); height: calc(var(--fh) * 1px);
    background: var(--art) 0 0 / auto 100% no-repeat;
    image-rendering: pixelated;
    animation: play var(--dur, 0.9s) steps(var(--frames)) infinite;
    transform-origin: center;
  }
  @keyframes play { to { background-position: calc(var(--fw) * var(--frames) * -1px) 0; } }
  #k-stops {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0 0 8px; padding: 8px 16px; min-height: 40px;
    font: 600 16px/1 var(--font); letter-spacing: 0.16em; color: #8fd2ff;
    background: rgba(53, 230, 255, 0.10);
    border: 2px solid rgba(143, 210, 255, 0.55); border-radius: 999px;
    cursor: pointer;
  }
  #k-stops::after { content: "\25BE"; font-size: 14px; transition: transform 0.15s; }
  #k-stops[aria-expanded="true"]::after { transform: rotate(180deg); }
  #k-stops:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #stops-list {
    list-style: none; margin: 0 0 12px; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
  }
  #stops-list[hidden] { display: none; }
  #stops-list li {
    padding: 5px 10px; font: 600 15px/1.1 var(--font); letter-spacing: 0.06em;
    color: #eaf3ff; background: #0a2470; border: 1px solid rgba(143, 210, 255, 0.5); border-radius: 8px;
  }
  #stops-list li b { color: var(--gold); margin-right: 6px; font-weight: 700; }
  #k-text {
    margin: 0 4px 16px; font-size: 18px; line-height: 1.3; color: #eaf3ff;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  #enter {
    width: 100%; min-height: 52px;
    border: 3px solid #fff3c4; border-radius: 12px;
    background: linear-gradient(180deg, #ffc93a, #ee9a08);
    color: #1a1204;
    font: 700 22px/1 var(--font); letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(255, 184, 28, 0.55);
  }
  #enter:active { transform: translateY(1px); }
  #close:focus-visible, #enter:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    #stage, #card, #scrim { animation: none; }
    /* Gentle, slow, non-flashing versions instead of turning the lights off. */
    .glint { animation-timing-function: ease-in-out !important; animation-duration: 7s !important; }
    .bulb { animation: softchase 3.2s ease-in-out var(--bd, 0s) infinite; }
    @keyframes softchase { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    #tk-track { animation: none; }
    #sprite { animation: none; }
    .row.charging::before { animation: none; transform: scaleX(1); }
  }
</style>
</head>
<body>
  <h1 class="sr-only">PapaDOMO's Free Tours</h1>

  <div id="stage">
    <img id="art" src="/imagebank/papadomo-tour-kiosk.png" alt="" draggable="false">
    <nav id="rows" aria-label="Guided tours"></nav>
    <div id="lights" aria-hidden="true"></div>
    <div id="marquee" aria-hidden="true"></div>
    <div id="signglow" aria-hidden="true"></div>
    <div id="ticker" aria-hidden="true"><div id="tk-track"></div><div id="tk-spell"></div></div>
  </div>

  <div id="hint">Hold to preview &bull; Double-tap to enter</div>

  <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div id="scrim"></div>
    <section id="card">
      <button id="close" type="button" aria-label="Close preview">&#x2715;</button>
      <p id="k-num"></p>
      <h2 id="sheet-title"></h2>
      <div id="sprite-wrap" aria-hidden="true"><div id="sprite"></div></div>
      <button id="k-stops" type="button" aria-expanded="false" aria-controls="stops-list"></button>
      <ol id="stops-list" hidden></ol>
      <p id="k-text"></p>
      <button id="enter" type="button">Enter this tour</button>
    </section>
  </div>

<script>
  // When papatour.html shows this page in its frame, the host does the fade-in.
  if (window.parent !== window) document.documentElement.classList.add("embedded");
</script>
<script src="/tours/tours-data.js"></script>
<script>
(function () {
  "use strict";

  // Row hit areas, as percentages of the kiosk art (1024 x 1536). Measured
  // from the art itself; the buttons sit on top of the rows the picture shows.
  var ROWS = [
    [24.023, 4.036], [28.385, 4.036], [32.747, 4.036], [37.109, 4.102],
    [41.536, 4.102], [45.898, 4.102], [50.326, 4.036], [54.688, 4.036],
    [59.049, 4.102], [63.477, 4.232], [68.034, 4.297], [72.591, 4.297]
  ];

  // Optional per-tour PapaDOMO sprite sheets: { "tour-id": { src, frames, w, h, dur } }.
  // Empty until the pixel routine frames are ready; the card falls back gracefully.
  var SPRITES = {};
  var FALLBACK_ART = "/imagebank/papadomo-welcoming.png";

  // Tour data comes straight from the site's real tour data. Nothing invented.
  function previewFor(id) {
    var list = (typeof TOUR_INTROS !== "undefined" && TOUR_INTROS[id]) || [];
    var line = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].text && list[i].text.length >= 60) { line = list[i]; break; }
    }
    return (line || list[0] || { text: "" }).text;
  }
  var tours = TOURS.map(function (t) {
    return {
      id: t.id, title: t.title, stops: t.stops.length, preview: previewFor(t.id),
      labels: t.stops.map(function (s) { return s.label; })
    };
  });

  var host = window.TourMenuHost || {};
  function enterTour(id) {
    if (host.onEnter) { host.onEnter(id); return; }
    // ?start goes straight into the tour (PapaDOMO's intro, then the first stop)
    // instead of landing on the Choose a Tour list.
    var url = "/tours/?start=" + encodeURIComponent(id);
    try { (window.top || window).location.href = url; } catch (e) { window.location.href = url; }
  }

  var rowsEl = document.getElementById("rows");
  var hint = document.getElementById("hint");
  var sheet = document.getElementById("sheet");
  var buttons = [];
  var selected = -1;
  var lastTap = { i: -1, t: 0 };
  var openIndex = -1;
  var openedAt = 0;

  function quietHint() { hint.classList.add("gone"); }

  function select(i) {
    if (selected >= 0) buttons[selected].classList.remove("selected");
    selected = i;
    if (i >= 0) { buttons[i].classList.add("selected"); buttons[i].setAttribute("aria-current", "true"); }
    buttons.forEach(function (b, k) { if (k !== i) b.removeAttribute("aria-current"); });
  }

  // ---------- breakout ----------
  function setSprite(t) {
    var el = document.getElementById("sprite");
    var s = SPRITES[t.id];
    el.className = "";
    el.removeAttribute("style");
    if (s) {
      el.classList.add("sheet");
      el.style.setProperty("--art", "url(" + s.src + ")");
      el.style.setProperty("--frames", s.frames);
      el.style.setProperty("--fw", s.w);
      el.style.setProperty("--fh", s.h);
      el.style.setProperty("--dur", (s.dur || 0.9) + "s");
    } else {
      el.style.setProperty("--art", "url(" + FALLBACK_ART + ")");
    }
  }
  function openSheet(i) {
    var t = tours[i];
    openIndex = i;
    openedAt = Date.now();
    document.getElementById("k-num").textContent = "TOUR " + (i + 1) + " OF " + tours.length;
    document.getElementById("sheet-title").textContent = t.title;
    var stopsBtn = document.getElementById("k-stops");
    var stopsList = document.getElementById("stops-list");
    stopsBtn.textContent = t.stops + (t.stops === 1 ? " STOP" : " STOPS");
    stopsBtn.setAttribute("aria-expanded", "false");
    stopsList.hidden = true;
    stopsList.innerHTML = "";
    t.labels.forEach(function (label, n) {
      var li = document.createElement("li");
      var num = document.createElement("b");
      num.textContent = String(n + 1);
      li.appendChild(num);
      li.appendChild(document.createTextNode(label));
      stopsList.appendChild(li);
    });
    document.getElementById("k-text").textContent = t.preview;
    setSprite(t);
    sheet.hidden = false;
    document.body.classList.add("paused");
    document.getElementById("enter").focus({ preventScroll: true });
    quietHint();
    if (host.onPreview) host.onPreview(t.id);
  }
  function hideSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    document.body.classList.remove("paused");
    var b = buttons[openIndex];
    openIndex = -1;
    if (b) b.focus({ preventScroll: true });
    if (host.onClose) host.onClose();
  }
  function closeSheet() {
    if (sheet.hidden) return;
    hideSheet();
  }
  document.getElementById("k-stops").addEventListener("click", function () {
    var btn = document.getElementById("k-stops");
    var list = document.getElementById("stops-list");
    var open = list.hidden;                       // hidden now -> about to open
    list.hidden = !open;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { try { list.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {} }
  });
  document.getElementById("close").addEventListener("click", closeSheet);
  document.getElementById("scrim").addEventListener("click", function () {
    if (Date.now() - openedAt > 400) closeSheet();
  });
  document.getElementById("enter").addEventListener("click", function () {
    if (openIndex >= 0) enterTour(tours[openIndex].id);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !sheet.hidden) { e.preventDefault(); closeSheet(); }
  });

  // ---------- rows ----------
  tours.forEach(function (t, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    b.style.top = ROWS[i][0] + "%";
    b.style.height = ROWS[i][1] + "%";
    b.setAttribute("data-tour", t.id);
    b.setAttribute("aria-label", "Tour " + (i + 1) + " of " + tours.length + ", " + t.title + ", " + t.stops + " stops");
    rowsEl.appendChild(b);
    buttons.push(b);

    var timer = null, down = null, longFired = false;
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
      b.classList.remove("charging");
      down = null;
    }
    function fireLong() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (longFired) return;
      longFired = true;
      down = null;
      b.classList.remove("charging");
      select(i);
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (er) {} }
      openSheet(i);
    }
    b.addEventListener("pointerdown", function (e) {
