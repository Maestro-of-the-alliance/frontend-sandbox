<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PapaDOMO Welcome</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #welcome-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Coordinates measured against well-hello.mp4's own 1920x1080 frame
     at the 3.10s pause point (the fully-resolved closed door, before
     it begins to open), expressed as percentages so the target tracks
     correctly under object-fit: contain at any window size. */
  #door-click-target {
    position: absolute;
    left: 37.0%;
    top: 11.5%;
    width: 25.9%;
    height: 72.3%;
    cursor: pointer;
    display: none;
  }

  #door-click-target.active {
    display: block;
  }

  #skip-note {
    position: absolute;
    top: 18px;
    right: 22px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-family: system-ui, sans-serif;
    letter-spacing: 0.03em;
    cursor: pointer;
    z-index: 10;
  }
  #skip-note:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>
<script src="/orientation-gate.js"></script>
<div id="stage">
  <video
    id="welcome-video"
    src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/well-hello.mp4"
    playsinline
    preload="auto"
  ></video>

  <div id="door-click-target"></div>

  <div id="skip-note" onclick="location.href='foundation.html'">skip &rarr;</div>
</div>

<script>
  const PAUSE_AT = 3.10;
  const video = document.getElementById("welcome-video");
  const doorTarget = document.getElementById("door-click-target");
  let hasPaused = false;

  video.addEventListener("timeupdate", () => {
    if (!hasPaused && video.currentTime >= PAUSE_AT) {
      video.pause();
      // Snap exactly to the intended pause point -- timeupdate fires
      // at irregular intervals, so currentTime may have drifted a few
      // frames past 9.0 by the time this listener runs.
      video.currentTime = PAUSE_AT;
      hasPaused = true;
      doorTarget.classList.add("active");
    }
  });

  doorTarget.addEventListener("click", () => {
    doorTarget.classList.remove("active");
    video.play();
  });

  video.addEventListener("ended", () => {
    window.location.href = "foundation.html";
  });

  video.play().catch((err) => {
    // Autoplay-with-sound can be blocked before any user gesture on
    // some browsers. If so, fall back to a tap-to-start gate rather
    // than leaving a frozen black frame with no explanation.
    console.warn("Autoplay blocked, waiting for interaction:", err);
    const startOnce = () => {
      video.play();
      window.removeEventListener("click", startOnce);
    };
    window.addEventListener("click", startOnce);
  });
</script>
</body>
</html>
