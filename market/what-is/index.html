<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The ALLIANCE Market</title>

    <!--
      MARKET FRONT DOOR

      FLOW
      ----
      1. Storefront photograph
      2. Visitor taps/clicks the doors
      3. "COME ON IN" interior screen
      4. Visitor chooses:
         - What Is MARKET? -> canonical text entry
         - A merchandise category -> product viewer
      5. Product viewer advances one product at a time

      DATA
      ----
      Product data is NOT hardcoded in this page.

      This page reads:
        /market-images/manifest.json

      The existing GitHub workflow and Node generator rebuild that
      manifest automatically from the folders under /market-images/.

      Therefore:
        drop image into market-images/t-shirts/
        push
        manifest regenerates
        image appears here

      No page redesign is required when the catalog grows.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #090806;
        --panel: #15120d;
        --panel-soft: #1c1811;
        --text: #eee7da;
        --muted: #948b7d;
        --gold: #d99821;
        --gold-bright: #f2be53;
        --gold-faint: rgba(217, 152, 33, 0.18);
        --rule: rgba(217, 152, 33, 0.24);

        --display: "Bebas Neue", sans-serif;
        --poster: "Anton", sans-serif;
        --body: "Rajdhani", sans-serif;
        --mono: "Share Tech Mono", monospace;

        --nw-page-accent: var(--gold);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        overflow: hidden;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
      }

      /* ---------------------------------------------------------
         SHARED VIEW SYSTEM
         --------------------------------------------------------- */

      .mkt-view {
        position: fixed;
        inset: 0;
        display: none;
      }

      .mkt-view.active {
        display: block;
      }

      /* ---------------------------------------------------------
         STOREFRONT
         --------------------------------------------------------- */

      #view-storefront {
        background: #000;
      }

      .mkt-storefront-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        filter: saturate(0.88) contrast(1.06) brightness(0.76);
      }

      .mkt-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0.35),
            transparent 22%,
            transparent 70%,
            rgba(0, 0, 0, 0.55)
          ),
          radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(8, 7, 5, 0.28) 67%,
            rgba(8, 7, 5, 0.88) 100%
          );
      }

      .mkt-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        padding:
          max(18px, env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          18px
          max(18px, env(safe-area-inset-left));

        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255, 244, 218, 0.63);
      }

      .mkt-header-dot {
        width: 6px;
        height: 6px;
        margin-right: 9px;
        border-radius: 50%;
        background: var(--gold-bright);
        box-shadow: 0 0 10px var(--gold-bright);
        animation: mktBlink 2.2s ease-in-out infinite;
      }

      @keyframes mktBlink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.28;
        }
      }

      /*
        The door hotspot is intentionally invisible.

        We are not drawing fake doors over the photograph.
        The photograph itself remains the interface.
      */

      .mkt-doors-hotspot {
        position: absolute;
        left: 50%;
        top: 55%;
        z-index: 3;

        width: min(40vw, 380px);
        height: min(60vh, 520px);

        transform: translate(-50%, -50%);

        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .mkt-doors-hint {
        position: absolute;
        left: 50%;
        bottom: max(9vh, 54px);
        z-index: 4;

        transform: translateX(-50%);

        padding: 9px 14px;

        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.25em;
        line-height: 1.5;
        white-space: nowrap;
        text-transform: uppercase;
        text-align: center;

        color: var(--gold-bright);
        background: rgba(0, 0, 0, 0.24);
        text-shadow: 0 0 12px rgba(242, 190, 83, 0.68);

        animation: mktHintPulse 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes mktHintPulse {
        0%,
        100% {
          opacity: 0.52;
        }

        50% {
          opacity: 1;
        }
      }

      /* ---------------------------------------------------------
         DOOR TRANSITION
         --------------------------------------------------------- */

      .mkt-flash {
        position: fixed;
        inset: 0;
        z-index: 999999;

        background: #fff7df;
        opacity: 0;
        pointer-events: none;
      }

      .mkt-flash.firing {
        animation: mktFlash 0.55s ease-out forwards;
      }

      @keyframes mktFlash {
        0% {
          opacity: 0;
        }

        32% {
          opacity: 0.92;
        }

        100% {
          opacity: 0;
        }
      }

      /* ---------------------------------------------------------
         COME ON IN / CATEGORY VIEW
         --------------------------------------------------------- */

      #view-categories {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;

        background:
          radial-gradient(
            circle at 50% 28%,
            rgba(255, 255, 255, 0.12),
            transparent 30%
          ),
          #f4efe6;

        color: #050505;
      }

      #view-categories.active {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mkt-cat-wrap {
        width: min(92vw, 560px);
        margin: auto;
        padding:
          max(52px, env(safe-area-inset-top))
          20px
          max(48px, env(safe-area-inset-bottom));

        text-align: center;
      }

      .mkt-eyebrow {
        margin-bottom: 18px;

        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.4em;
        text-transform: uppercase;

        color: rgba(0, 0, 0, 0.4);
      }

      .mkt-come-on-in {
        margin-bottom: 28px;

        font-family: var(--poster);
        font-weight: 400;
        line-height: 0.86;
        text-transform: uppercase;
        color: #050505;
      }

      .mkt-come-on-in div {
        font-size: clamp(52px, 15vw, 96px);
      }

      /*
        "What Is MARKET?" is now an actual choice.

        It no longer exposes the canonical copy directly inside
        the merchandise interface.
      */

      .mkt-what-is {
        display: inline-block;
        margin: 4px 0 28px;
        padding: 8px 4px;

        border: 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.28);
        background: transparent;

        font-family: var(--body);
        font-size: clamp(16px, 4vw, 21px);
        font-weight: 700;
        letter-spacing: 0.055em;
        text-transform: uppercase;

        color: #050505;
        cursor: pointer;

        transition:
          color 0.18s ease,
          border-color 0.18s ease;
      }

      .mkt-what-is:hover,
      .mkt-what-is:focus-visible {
        color: #a76600;
        border-color: #a76600;
        outline: none;
      }

      .mkt-divider {
        width: 48px;
        height: 1px;
        margin: 0 auto 22px;

        background: rgba(0, 0, 0, 0.18);
      }

      .mkt-browse-label {
        margin-bottom: 10px;

        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.28em;
        text-transform: uppercase;

        color: rgba(0, 0, 0, 0.35);
      }

      .mkt-cat-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /*
        Empty categories are simply not rendered.

        We do NOT fill the interface with "COMING SOON."
        If there is nothing in a category, there is no reason
        to advertise an empty shelf.
      */

      .mkt-cat-btn {
        position: relative;
        display: block;
        width: 100%;

        padding: 9px 8px;

        border: 0;
        background: transparent;

        font-family: var(--body);
        font-size: clamp(24px, 6vw, 33px);
        font-weight: 700;
        letter-spacing: 0.015em;
        line-height: 1.05;
        text-transform: uppercase;

        color: #050505;
        cursor: pointer;

        transition:
          color 0.15s ease,
          transform 0.15s ease;
      }

      .mkt-cat-btn:hover,
      .mkt-cat-btn:focus-visible {
        color: #a76600;
        transform: translateX(4px);
        outline: none;
      }

      .mkt-cat-count {
        display: block;
        margin-top: 2px;

        font-family: var(--mono);
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;

        color: rgba(0, 0, 0, 0.34);
      }

      .mkt-no-stock {
        display: none;

        margin: 18px auto 0;
        max-width: 320px;

        font-size: 14px;
        line-height: 1.55;

        color: rgba(0, 0, 0, 0.48);
      }

      .mkt-no-stock.visible {
        display: block;
      }

      .mkt-exit-store {
        margin-top: 36px;
        padding: 10px;

        border: 0;
        background: transparent;

        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;

        color: rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }

      .mkt-exit-store:hover,
      .mkt-exit-store:focus-visible {
        color: #000;
        outline: none;
      }

      /* ---------------------------------------------------------
         PRODUCT VIEWER
         --------------------------------------------------------- */

      #view-viewer {
        background:
          radial-gradient(
            circle at 50% 42%,
            rgba(217, 152, 33, 0.08),
            transparent 34%
          ),
          var(--bg);
      }

      #view-viewer.active {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .mkt-viewer-shell {
        width: min(94vw, 760px);
        padding:
          max(38px, env(safe-area-inset-top))
          20px
          max(26px, env(safe-area-inset-bottom));

        text-align: center;
      }

      .mkt-viewer-eyebrow {
        margin-bottom: 13px;

        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;

        color: var(--gold);
      }

      /*
        Product image stage.

        Transparent PNG/WebP products work naturally here.
        The background belongs to MARKET, not the source image.
      */

      .mkt-viewer-stage {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;

        width: min(76vw, 560px);
        height: min(57vh, 520px);
        margin: 0 auto;

        overflow: hidden;

        border: 1px solid var(--rule);
        background:
          radial-gradient(
            circle at 50% 40%,
            rgba(255, 255, 255, 0.045),
            transparent 58%
          ),
          var(--panel);

        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.52),
          inset 0 0 60px rgba(255, 255, 255, 0.015);
      }

      .mkt-viewer-stage::after {
        content: "";
        position: absolute;
        left: 15%;
        right: 15%;
        bottom: 7%;
        height: 5%;

        border-radius: 50%;
        background: rgba(0, 0, 0, 0.32);
        filter: blur(10px);

        pointer-events: none;
      }

      .mkt-viewer-stage img {
        position: relative;
        z-index: 2;

        display: block;

        max-width: 92%;
        max-height: 92%;
        width: auto;
        height: auto;

        object-fit: contain;

        filter:
          drop-shadow(0 20px 18px rgba(0, 0, 0, 0.28))
          drop-shadow(0 4px 5px rgba(0, 0, 0, 0.22));
      }

      .mkt-viewer-title {
        margin-top: 17px;

        font-family: var(--display);
        font-size: clamp(22px, 5vw, 30px);
        letter-spacing: 0.035em;

        color: var(--text);
      }

      .mkt-viewer-caption {
        max-width: 500px;
        min-height: 20px;
        margin: 3px auto 0;

        font-size: 14px;
        line-height: 1.55;

        color: var(--muted);
      }

      .mkt-viewer-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;

        margin-top: 19px;
      }

      .mkt-ctrl-btn {
        display: flex;
        align-items: center;
        justify-content: center;

        width: 48px;
        height: 48px;

        border: 1px solid var(--rule);
        background: var(--panel);

        color: var(--text);
        cursor: pointer;

        transition:
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.15s ease;
      }

      .mkt-ctrl-btn:hover:not(:disabled),
      .mkt-ctrl-btn:focus-visible:not(:disabled) {
        border-color: var(--gold);
        color: var(--gold-bright);
        box-shadow: 0 0 18px var(--gold-faint);
        transform: scale(1.05);
        outline: none;
      }

      .mkt-ctrl-btn:disabled {
        opacity: 0.22;
        cursor: default;
      }

      .mkt-ctrl-btn svg {
        width: 17px;
        height: 17px;
      }

      .mkt-ctrl-exit {
        font-family: var(--mono);
        font-size: 17px;
      }

      .mkt-ctrl-count {
        margin-top: 10px;

        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.12em;

        color: var(--muted);
      }

      .mkt-swipe-hint {
        margin-top: 6px;

        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.15em;
        text-transform: uppercase;

        color: rgba(255, 255, 255, 0.18);
      }

      /* ---------------------------------------------------------
         MOBILE
         --------------------------------------------------------- */

      @media (max-width: 600px) {
        .mkt-storefront-photo {
          /*
            Center remains the default because the current source
            storefront is composed around the doors.

            This can be changed to something like "52% center"
            later if the final storefront crop demands it.
          */
          object-position: center center;
        }

        .mkt-doors-hotspot {
          width: 58vw;
          height: 58vh;
        }

        .mkt-doors-hint {
          bottom: max(7vh, 46px);
          font-size: 9px;
        }

        .mkt-cat-wrap {
          width: 96vw;
          padding-left: 16px;
          padding-right: 16px;
        }

        .mkt-viewer-shell {
          width: 100vw;
          padding-left: 12px;
          padding-right: 12px;
        }

        .mkt-viewer-stage {
          width: 91vw;
          height: 48vh;
          max-height: 500px;
        }

        .mkt-viewer-controls {
          margin-top: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mkt-header-dot,
        .mkt-doors-hint {
          animation: none;
        }

        .mkt-flash.firing {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>

  <body>
    <!-- Door-transition flash -->
    <div class="mkt-flash" id="mkt-flash"></div>

    <!-- =======================================================
         VIEW 1 — STOREFRONT
         ======================================================= -->

    <section class="mkt-view active" id="view-storefront">
      <img
        class="mkt-storefront-photo"
        src="/market-images/storefront.jpg"
        alt="The ALLIANCE Market storefront"
      />

      <div class="mkt-vignette"></div>

      <div class="mkt-header">
        <span class="mkt-header-dot"></span>
        <span>The ALLIANCE Market</span>
      </div>

      <button
        class="mkt-doors-hotspot"
        id="mkt-doors"
        type="button"
        aria-label="Enter The ALLIANCE Market"
      ></button>

      <div class="mkt-doors-hint">
        Tap the doors to enter
      </div>
    </section>

    <!-- =======================================================
         VIEW 2 — COME ON IN / CATEGORIES
         ======================================================= -->

    <section class="mkt-view" id="view-categories">
      <div class="mkt-cat-wrap">
        <div class="mkt-eyebrow">
          The ALLIANCE Market
        </div>

        <div class="mkt-come-on-in" aria-label="Come On In">
          <div>Come</div>
          <div>On</div>
          <div>In</div>
        </div>

        <button
          class="mkt-what-is"
          id="mkt-what-is"
          type="button"
        >
          What Is MARKET?
        </button>

        <div class="mkt-divider"></div>

        <div class="mkt-browse-label">
          Browse
        </div>

        <!--
          JavaScript inserts only categories that currently
          contain at least one product image.
        -->
        <div
          class="mkt-cat-list"
          id="mkt-cat-list"
        ></div>

        <div
          class="mkt-no-stock"
          id="mkt-no-stock"
        >
          The shelves are quiet at the moment.
        </div>

        <button
          class="mkt-exit-store"
          id="mkt-exit-store"
          type="button"
        >
          ← Back outside
        </button>
      </div>
    </section>

    <!-- =======================================================
         VIEW 3 — PRODUCT VIEWER
         ======================================================= -->

    <section class="mkt-view" id="view-viewer">
      <div class="mkt-viewer-shell">
        <div
          class="mkt-viewer-eyebrow"
          id="mkt-viewer-category"
        ></div>

        <div
          class="mkt-viewer-stage"
          id="mkt-viewer-stage"
        ></div>

        <div
          class="mkt-viewer-title"
          id="mkt-viewer-title"
        ></div>

        <div
          class="mkt-viewer-caption"
          id="mkt-viewer-caption"
        ></div>

        <div class="mkt-viewer-controls">
          <button
            class="mkt-ctrl-btn"
            id="mkt-prev"
            type="button"
            aria-label="Previous product"
          >
            <svg
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M15 4 6 12l9 8V4z"></path>
            </svg>
          </button>

          <button
            class="mkt-ctrl-btn mkt-ctrl-exit"
            id="mkt-exit-category"
            type="button"
            aria-label="Return to Market categories"
          >
            ×
          </button>

          <button
            class="mkt-ctrl-btn"
            id="mkt-next"
            type="button"
            aria-label="Next product"
          >
            <svg
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="m9 4 9 8-9 8V4z"></path>
            </svg>
          </button>
        </div>

        <div
          class="mkt-ctrl-count"
          id="mkt-ctrl-count"
        ></div>

        <div class="mkt-swipe-hint">
          Swipe left or right on mobile
        </div>
      </div>
    </section>

    <script>
      (() => {
        "use strict";

        /*
          Cache the DOM nodes we use repeatedly.
        */

        const flash = document.getElementById("mkt-flash");

        const viewStorefront =
          document.getElementById("view-storefront");

        const viewCategories =
          document.getElementById("view-categories");

        const viewViewer =
          document.getElementById("view-viewer");

        const categoryList =
          document.getElementById("mkt-cat-list");

        const noStock =
          document.getElementById("mkt-no-stock");

        /*
          Runtime state.

          manifest:
            JSON generated automatically from /market-images/.

          currentCategory:
            category currently being browsed.

          currentIndex:
            position inside that category's image array.
        */

        let manifest = null;
        let currentCategory = null;
        let currentIndex = 0;

        /*
          Utility: show exactly one full-screen view.
        */

        function showView(view) {
          [
            viewStorefront,
            viewCategories,
            viewViewer,
          ].forEach((candidate) => {
            candidate.classList.remove("active");
          });

          view.classList.add("active");
        }

        /*
          Short flash to imply passing through the doors.
        */

        function fireFlash(callback) {
          flash.classList.add("firing");

          window.setTimeout(() => {
            flash.classList.remove("firing");
          }, 550);

          window.setTimeout(callback, 220);
        }

        /*
          Read the automatically generated product manifest.

          cache: "no-store"
          prevents the browser from stubbornly showing yesterday's
          merchandise list after new product images have been pushed.
        */

        async function loadManifest() {
          if (manifest) {
            return manifest;
          }

          const response = await fetch(
            "/market-images/manifest.json",
            {
              cache: "no-store",
            },
          );

          if (!response.ok) {
            throw new Error(
              `MARKET manifest failed: ${response.status}`,
            );
          }

          manifest = await response.json();

          return manifest;
        }

        /*
          Build category buttons.

          Important:
          Empty categories are NOT displayed.

          This avoids clutter and avoids advertising inventory
          states that do not need explanation.
        */

        function renderCategories(data) {
          categoryList.innerHTML = "";

          const populatedCategories =
            data.categories.filter((category) => {
              return (
                Array.isArray(category.images) &&
                category.images.length > 0
              );
            });

          noStock.classList.toggle(
            "visible",
            populatedCategories.length === 0,
          );

          populatedCategories.forEach((category) => {
            const button =
              document.createElement("button");

            button.type = "button";
            button.className = "mkt-cat-btn";

            const itemWord =
              category.images.length === 1
                ? "item"
                : "items";

            button.innerHTML = `
              <span>${escapeHTML(category.label)}</span>
              <span class="mkt-cat-count">
                ${category.images.length} ${itemWord}
              </span>
            `;

            button.addEventListener("click", () => {
              openCategory(category);
            });

            categoryList.appendChild(button);
          });
        }

        /*
          The manifest controls the labels, so escape text before
          inserting it with innerHTML.

          The data is ours, but this also keeps the page robust
          if odd filenames or labels are added later.
        */

        function escapeHTML(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        /*
          Enter the storefront.

          Loads product data before showing the category screen.
        */

        async function enterStore(useFlash = true) {
          const enter = async () => {
            try {
              const data = await loadManifest();
              renderCategories(data);
            } catch (error) {
              console.error(error);

              categoryList.innerHTML = "";
              noStock.classList.add("visible");
            }

            showView(viewCategories);
          };

          if (useFlash) {
            fireFlash(enter);
          } else {
            await enter();
          }
        }

        /*
          Open one merchandise category.
        */

        function openCategory(category) {
          currentCategory = category;
          currentIndex = 0;

          showView(viewViewer);
          renderItem();
        }

        /*
          Render the current merchandise image.
        */

        function renderItem() {
          const stage =
            document.getElementById("mkt-viewer-stage");

          const title =
            document.getElementById("mkt-viewer-title");

          const caption =
            document.getElementById(
              "mkt-viewer-caption",
            );

          const counter =
            document.getElementById("mkt-ctrl-count");

          const categoryTitle =
            document.getElementById(
              "mkt-viewer-category",
            );

          const previous =
            document.getElementById("mkt-prev");

          const next =
            document.getElementById("mkt-next");

          if (
            !currentCategory ||
            !Array.isArray(currentCategory.images) ||
            currentCategory.images.length === 0
          ) {
            return;
          }

          const item =
            currentCategory.images[currentIndex];

          categoryTitle.textContent =
            currentCategory.label;

          stage.innerHTML = "";

          const image = document.createElement("img");

          image.src =
            "/market-images/" +
            currentCategory.slug +
            "/" +
            item.file;

          image.alt = item.title || currentCategory.label;

          image.draggable = false;

          stage.appendChild(image);

          title.textContent = item.title || "";

          caption.textContent =
            item.caption || "";

          counter.textContent =
            `${currentIndex + 1} / ` +
            `${currentCategory.images.length}`;

          /*
            One-item categories do not need active arrows.
          */

          const onlyOne =
            currentCategory.images.length <= 1;

          previous.disabled = onlyOne;
          next.disabled = onlyOne;
        }

        /*
          Advance through products.

          The gallery wraps:
          last -> first
          first -> last
        */

        function navigate(direction) {
          if (
            !currentCategory ||
            !currentCategory.images.length
          ) {
            return;
          }

          currentIndex =
            (
              currentIndex +
              direction +
              currentCategory.images.length
            ) %
            currentCategory.images.length;

          renderItem();
        }

        /*
          IMPORTANT RETURN BEHAVIOR

          Before we leave MARKET for the canonical text page,
          change the current browser-history entry from:

            /market/

          to:

            /market/?inside=1

          That means Back returns to COME ON IN,
          not all the way back outside.
        */

        function openCanonicalMarketEntry() {
          window.history.replaceState(
            null,
            "",
            "/market/?inside=1",
          );

          window.location.href = "/entries/market";
        }

        /*
          Buttons.
        */

        document
          .getElementById("mkt-doors")
          .addEventListener("click", () => {
            enterStore(true);
          });

        document
          .getElementById("mkt-what-is")
          .addEventListener(
            "click",
            openCanonicalMarketEntry,
          );

        document
          .getElementById("mkt-exit-store")
          .addEventListener("click", () => {
            window.history.replaceState(
              null,
              "",
              "/market/",
            );

            showView(viewStorefront);
          });

        document
          .getElementById("mkt-exit-category")
          .addEventListener("click", () => {
            showView(viewCategories);
          });

        document
          .getElementById("mkt-prev")
          .addEventListener("click", () => {
            navigate(-1);
          });

        document
          .getElementById("mkt-next")
          .addEventListener("click", () => {
            navigate(1);
          });

        /*
          Keyboard controls.
        */

        document.addEventListener("keydown", (event) => {
          if (
            !viewViewer.classList.contains("active")
          ) {
            return;
          }

          if (event.key === "ArrowLeft") {
            navigate(-1);
          }

          if (event.key === "ArrowRight") {
            navigate(1);
          }

          if (event.key === "Escape") {
            showView(viewCategories);
          }
        });

        /*
          Mobile swipe controls.

          Swipe more than 45 pixels horizontally to move.
        */

        let touchStartX = 0;
        let touchStartY = 0;

        viewViewer.addEventListener(
          "touchstart",
          (event) => {
            const touch = event.touches[0];

            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
          },
          {
            passive: true,
          },
        );

        viewViewer.addEventListener(
          "touchend",
          (event) => {
            const touch =
              event.changedTouches[0];

            const deltaX =
              touch.clientX - touchStartX;

            const deltaY =
              touch.clientY - touchStartY;

            /*
              Only treat it as gallery navigation when
              the gesture is primarily horizontal.
            */

            if (
              Math.abs(deltaX) > 45 &&
              Math.abs(deltaX) >
                Math.abs(deltaY)
            ) {
              navigate(deltaX < 0 ? 1 : -1);
            }
          },
          {
            passive: true,
          },
        );

        /*
          If browser Back returns from /entries/market,
          the URL is /market/?inside=1.

          Open directly onto COME ON IN.
        */

        const params =
          new URLSearchParams(
            window.location.search,
          );

        if (params.get("inside") === "1") {
          enterStore(false);
        }
      })();
    </script>

    <!-- Existing site-wide navigation systems -->
    <script src="/portal-transition.js"></script>
    <script src="/nav-wheel.js"></script>
    <script src="/hub-menu.js"></script>
  </body>
</html>
