      // ── SCENE SETUP ──
      const canvas = document.getElementById("innaCanvas");

        antialias: true,

      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(

      );
      camera.position.set(0, 0, 3.8);

      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 5, 5);

      const SPHERE_RADIUS = 1.4;
      const COIN_RADIUS = 0.065;
      const COIN_HEIGHT = 0.014;

      function fibonacciSphere(n, radius) {
        const pts = [];
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const r = Math.sqrt(1 - y * y);
          const theta = goldenAngle * i;
          pts.push(
            new THREE.Vector3(
              Math.cos(theta) * r * radius,
              y * radius,
              Math.sin(theta) * r * radius,
            ),
          );
        }
        return pts;
      }

      const positions = fibonacciSphere(ENTRIES.length, SPHERE_RADIUS);
      const coinGroup = new THREE.Group();
      scene.add(coinGroup);
      const edgeGroup = new THREE.Group();
      scene.add(edgeGroup);

      const coinMeshes = [];
      const nodeMap = {};

      function getHex(dimStr) {
        return parseInt((DIM_COLORS[dimStr] || "#888888").replace("#", ""), 16);
      }

      function updateProgress(pct, msg) {
        document.getElementById("loadFill").style.width = pct + "%";
        document.getElementById("loadStatus").textContent = msg;
      }

      async function buildCoins() {
        updateProgress(10, "LOADING MEDALLIONS...");
        const texLoader = new THREE.TextureLoader();

        function loadTex(url) {
          return new Promise((resolve) =>
            texLoader.load(url, resolve, undefined, () => resolve(null)),
          );
        }

        for (let i = 0; i < ENTRIES.length; i++) {
          const entry = ENTRIES[i];
          const pos = positions[i];
          const primaryDim = entry.dims[0];
          const dimColor = getHex(primaryDim);

          const fUrl = `imagebank/symbols/${entry.id}_F.png`;
          const bUrl = `imagebank/symbols/${entry.id}_B.png`;
          const [texF, texB] = await Promise.all([
            loadTex(fUrl),
            loadTex(bUrl),
          ]);

          const edgeMat = new THREE.MeshStandardMaterial({
            color: entry.dormant ? 0x222228 : dimColor,
            metalness: 0.9,
            roughness: 0.1,
            emissive: entry.dormant ? 0x000000 : dimColor,
            emissiveIntensity: entry.dormant ? 0 : 0.5,
          });

          const frontMat = new THREE.MeshStandardMaterial({
            color: texF ? 0xffffff : entry.dormant ? 0x111118 : 0x1a1a24,
            metalness: 0.5,
            roughness: 0.4,
            map: texF || null,
            transparent: !!texF,
            emissive: texF ? 0x000000 : dimColor,
            emissiveIntensity: texF ? 0 : 0.04,
          });

          const backMat = new THREE.MeshStandardMaterial({
            color: texB ? 0xffffff : entry.dormant ? 0x111118 : 0x1a1a24,
            metalness: 0.5,
            roughness: 0.4,
            map: texB || null,
            transparent: !!texB,
            emissive: texB ? 0x000000 : dimColor,
            emissiveIntensity: texB ? 0 : 0.04,
          });

          const geo = new THREE.CylinderGeometry(
            COIN_RADIUS,
            COIN_RADIUS,
            COIN_HEIGHT,
            64,
          );

          // Fix UV mapping on caps
          const uv = geo.attributes.uv;
          const pos3 = geo.attributes.position;
          for (let v = 0; v < pos3.count; v++) {
            const x = pos3.getX(v);
            const y = pos3.getY(v);
            const z = pos3.getZ(v);
            if (Math.abs(Math.abs(y) - COIN_HEIGHT / 2) < 0.001) {
              uv.setXY(
                v,
                (x / COIN_RADIUS) * 0.5 + 0.5,
                (z / COIN_RADIUS) * 0.5 + 0.5,
              );
            }
          }
          uv.needsUpdate = true;

          const coin = new THREE.Mesh(geo, [edgeMat, frontMat, backMat]);
          coin.position.copy(pos);
          coin.lookAt(0, 0, 0);
          coin.rotateX(Math.PI / 2);

          // Subtle aura — much smaller than before, coin is the star
          const glowGeo = new THREE.SphereGeometry(COIN_RADIUS * 1.3, 12, 12);
          const glowMat = new THREE.MeshBasicMaterial({
            color: dimColor,
            transparent: true,
            opacity: entry.dormant ? 0.015 : 0.03,
          });
          const glowMesh = new THREE.Mesh(glowGeo, glowMat);
          glowMesh.position.copy(pos);

          coinGroup.add(coin);
          coinGroup.add(glowMesh);

          const record = {
            mesh: coin,
            glowMesh,
            entry,
            index: i,
            baseGlow: entry.dormant ? 0.015 : 0.03,
          };
          coinMeshes.push(record);
          nodeMap[entry.id] = record;

          if (i % 5 === 0) {
            updateProgress(
              10 + (i / ENTRIES.length) * 50,
              `PLACING NODE ${i + 1} OF ${ENTRIES.length}...`,
            );
            await new Promise((r) => setTimeout(r, 0));
          }
        }
      }

      function buildEdges() {
        updateProgress(65, "DRAWING CONNECTIONS...");
        for (const conn of CONNECTIONS) {
          const fromNode = nodeMap[conn.from];
          const toNode = nodeMap[conn.to];
          if (!fromNode || !toNode) continue;

          const fromPos = fromNode.mesh.position;
          const toPos = toNode.mesh.position;
          const mid = fromPos
            .clone()
            .add(toPos)
            .multiplyScalar(0.5)
            .normalize()
            .multiplyScalar(SPHERE_RADIUS * 1.04);
          const curve = new THREE.CatmullRomCurve3([
            fromPos.clone(),
            mid,
            toPos.clone(),
          ]);
          const pts = curve.getPoints(32);
          const geom = new THREE.BufferGeometry().setFromPoints(pts);
          const edgeHex = parseInt(
            (EDGE_COLORS[conn.type] || "#555566").replace("#", ""),
            16,
          );
          const mat = new THREE.LineBasicMaterial({
            color: edgeHex,
            transparent: true,
            opacity: 0.15,
          });
          const line = new THREE.Line(geom, mat);
          line.userData = { conn, fromNode, toNode };
          edgeGroup.add(line);
        }
      }

      // ── SVPO ──
      const svpoGroup = new THREE.Group();
      scene.add(svpoGroup);
      let svpoRing1, svpoRing2, svpoRing3Mesh, svpoCore;
      let svpoSpinVelocity = 0;

      function buildSVPO() {
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          metalness: 1.0,
          roughness: 0.05,
          emissive: 0xb89628,
          emissiveIntensity: 0.3,

        svpoRing1 = new THREE.Mesh(
          new THREE.TorusGeometry(0.52, 0.012, 16, 80),
          ringMat,
        );
        svpoGroup.add(svpoRing1);
        svpoRing2 = new THREE.Mesh(
          new THREE.TorusGeometry(0.38, 0.009, 16, 64),
          ringMat.clone(),
        );
        svpoRing2.rotation.x = Math.PI / 2;
        svpoGroup.add(svpoRing2);
        svpoRing3Mesh = new THREE.Mesh(
          new THREE.TorusGeometry(0.45, 0.007, 16, 64),
          ringMat.clone(),
        );
        svpoRing3Mesh.rotation.x = Math.PI / 4;
        svpoRing3Mesh.rotation.z = Math.PI / 4;
        svpoGroup.add(svpoRing3Mesh);
        svpoCore = new THREE.Mesh(
          new THREE.SphereGeometry(0.13, 32, 32),
          new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 1.0,
            roughness: 0.05,
            emissive: 0xb89628,
            emissiveIntensity: 0.5,
          }),
        );
        svpoGroup.add(svpoCore);
      }

      // ── INTERACTION ──
      let isDragging = false;
      let prevMouse = { x: 0, y: 0 };
      let sphereVelocity = { x: 0, y: 0 };
      let sphereRotation = { x: 0, y: 0 };

      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        prevMouse = { x: e.clientX, y: e.clientY };
        sphereVelocity = { x: 0, y: 0 };
      });
      canvas.addEventListener("mousemove", (e) => {
        if (isDragging) {
          const dx = e.clientX - prevMouse.x;
          const dy = e.clientY - prevMouse.y;
          sphereVelocity.x = dy * 0.003;
          sphereVelocity.y = dx * 0.003;
          sphereRotation.x += dy * 0.003;
          sphereRotation.y += dx * 0.003;
          prevMouse = { x: e.clientX, y: e.clientY };
          const speed = Math.sqrt(dx * dx + dy * dy);
          svpoSpinVelocity = Math.min(svpoSpinVelocity + speed * 0.008, 0.18);
        }
        // Raycasting for hover
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        { passive: false },

        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;

        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(coinMeshes.map((c) => c.mesh));
        if (hits.length > 0) {
          const hit = coinMeshes.find((c) => c.mesh === hits[0].object);
          if (hit) openEntryPanel(hit);
        }
      });

          sphereVelocity = { x: 0, y: 0 };

        { passive: true },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (!isDragging) return;
          const dx = e.touches[0].clientX - prevMouse.x;
          const dy = e.touches[0].clientY - prevMouse.y;
          sphereVelocity.x = dy * 0.003;
          sphereVelocity.y = dx * 0.003;
          sphereRotation.x += dy * 0.003;
          sphereRotation.y += dx * 0.003;
          prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          svpoSpinVelocity = Math.min(
            svpoSpinVelocity + Math.sqrt(dx * dx + dy * dy) * 0.008,

      // ── RAYCASTING ──
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById("nodeTooltip");
      let hoveredNode = null;

      function doHover(cx, cy) {
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(coinMeshes.map((c) => c.mesh));
        if (hits.length > 0) {
          const hit = coinMeshes.find((c) => c.mesh === hits[0].object);
          if (hit !== hoveredNode) {
            if (hoveredNode)
              hoveredNode.glowMesh.material.opacity = hoveredNode.baseGlow;
            hoveredNode = hit;
            hit.glowMesh.material.opacity = 0.2;
            canvas.style.cursor = "pointer";
          }
          tooltip.textContent = hit.entry.name;
          tooltip.style.left = cx + 16 + "px";
          tooltip.style.top = cy - 8 + "px";
          tooltip.classList.add("visible");
        } else {
          if (hoveredNode) {
            hoveredNode.glowMesh.material.opacity = hoveredNode.baseGlow;
            hoveredNode = null;
          }
          canvas.style.cursor = isDragging ? "grabbing" : "grab";
          tooltip.classList.remove("visible");
        }
      }

      function openEntryPanel(node) {
        selectedNode = node;
        const entry = node.entry;
        const primaryDim = entry.dims[0];

        document.getElementById("panelClassBadge").textContent =
          entry.dims.join(" · ");

        document.getElementById("panelEntryName").textContent = entry.name;

          : "NCE ENTRY";

        const front = document.getElementById("coinFront");
        const back = document.getElementById("coinBack");
        front.style.borderColor = dimColor + "44";
        back.style.borderColor = dimColor + "44";

        if (entry.dormant) {
          front.innerHTML = `<span style="color:${dimColor};opacity:0.4;font-size:18px">◌</span><span>PENDING</span>`;
          back.innerHTML = `<span style="color:${dimColor};opacity:0.4;font-size:18px">◌</span><span>PENDING</span>`;
        } else {
          front.innerHTML = `<img src="imagebank/symbols/${entry.id}_F.png" onerror="this.style.display='none'" />`;
          back.innerHTML = `<img src="imagebank/symbols/${entry.id}_B.png" onerror="this.style.display='none'" />`;
        }

        document.getElementById("panelSummary").textContent = "";

        const connList = document.getElementById("connList");
        connList.innerHTML = "";
        const conns = CONNECTIONS.filter(
          (c) => c.from === entry.id || c.to === entry.id,
        );
        if (conns.length === 0) {
          connList.innerHTML = `<div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:0.3em;">NO CONNECTIONS MAPPED YET</div>`;
        } else {
          conns.forEach((conn) => {
            const otherId = conn.from === entry.id ? conn.to : conn.from;
            const other = ENTRIES.find((e) => e.id === otherId);
            if (!other) return;
            const edgeColor = EDGE_COLORS[conn.type] || "#888888";
            const item = document.createElement("div");
            item.className = "conn-item";
            item.innerHTML = `<div class="conn-dot" style="background:${edgeColor}"></div><span>${other.name}</span><span class="conn-type">${conn.type}</span>`;
            item.addEventListener("click", () => {
              const t = nodeMap[otherId];
              if (t) openEntryPanel(t);
            });
            connList.appendChild(item);
          });
        }

        document.getElementById("panelReadBtn").href = entry.path;
        panel.classList.add("open");
        backBtn.classList.add("visible");
        highlightConnected(entry.id);
      }

      document
        .getElementById("panelClose")
        .addEventListener("click", closePanel);
      backBtn.addEventListener("click", closePanel);

      function closePanel() {
        panel.classList.remove("open");
        backBtn.classList.remove("visible");
        selectedNode = null;
        resetEdges();
      }

      function highlightConnected(entryId) {
        // Dim all
        edgeGroup.children.forEach((l) => (l.material.opacity = 0.03));
        coinMeshes.forEach((n) => {
          n.glowMesh.material.opacity = 0.008;
        });
        // Brighten connected
        const connectedIds = new Set();
        edgeGroup.children.forEach((l) => {
          const conn = l.userData.conn;
          if (conn && (conn.from === entryId || conn.to === entryId)) {
            l.material.opacity = 0.75;
            connectedIds.add(conn.from === entryId ? conn.to : conn.from);
          }
        });
        connectedIds.forEach((id) => {
          const n = nodeMap[id];
          if (n) n.glowMesh.material.opacity = 0.25;
        });
        const self = nodeMap[entryId];
        if (self) self.glowMesh.material.opacity = 0.35;
      }

      function resetEdges() {
        edgeGroup.children.forEach((l) => (l.material.opacity = 0.15));
        coinMeshes.forEach((n) => {
          if (n.mesh.visible) n.glowMesh.material.opacity = n.baseGlow;
        });
      }

      // ── FILTER — dim instead of hide ──
      let activeFilter = "ALL";
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.dataset.dim;
          applyFilter(activeFilter);
        });
      });

      function applyFilter(dim) {
        coinMeshes.forEach((node) => {
          const match = dim === "ALL" || node.entry.dims.includes(dim);
          if (match) {
            node.mesh.material.forEach &&
              node.mesh.material.forEach((m) => {
                if (m) m.opacity = undefined;
              });
            node.glowMesh.material.opacity =
              dim === "ALL" ? node.baseGlow : 0.2;
          } else {
            // Subordinate — don't hide, just dim heavily
            node.glowMesh.material.opacity = 0.005;
          }
        });

        edgeGroup.children.forEach((line) => {
          const conn = line.userData.conn;
          if (!conn || dim === "ALL") {
            line.material.opacity = 0.15;
            return;
          }
          const fromMatch = nodeMap[conn.from]?.entry.dims.includes(dim);
          const toMatch = nodeMap[conn.to]?.entry.dims.includes(dim);
          line.material.opacity = fromMatch || toMatch ? 0.35 : 0.03;
        });

        const count =
          dim === "ALL"
            ? ENTRIES.length
            : ENTRIES.filter((e) => e.dims.includes(dim)).length;
        document.getElementById("countNum").textContent = count;
      }

      // ── ANIMATION ──
      const clock = new THREE.Clock();
      let arrived = false;
      let arrivalTimer = 0;

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        if (!arrived) {
          arrivalTimer += delta;
          if (arrivalTimer >= 1.618) arrived = true;
          else {
            renderer.render(scene, camera);
            return;
          }
        }

        if (!isDragging) {
          sphereVelocity.x *= 0.94;
          sphereVelocity.y *= 0.94;
          sphereRotation.x += sphereVelocity.x;
          sphereRotation.y += sphereVelocity.y;
          const spd = Math.sqrt(sphereVelocity.x ** 2 + sphereVelocity.y ** 2);
          if (spd < 0.001) sphereRotation.y += 0.0008;
          svpoSpinVelocity *= 0.97;
        }

        coinGroup.rotation.x = sphereRotation.x;
        coinGroup.rotation.y = sphereRotation.y;
        edgeGroup.rotation.x = sphereRotation.x;
        edgeGroup.rotation.y = sphereRotation.y;

        const totalSpin = 0.004 + svpoSpinVelocity;
        if (svpoRing1) svpoRing1.rotation.y += totalSpin;
        if (svpoRing2) svpoRing2.rotation.x -= totalSpin * 0.7;
        if (svpoRing3Mesh) svpoRing3Mesh.rotation.z += totalSpin * 0.5;
        if (svpoCore) {
          svpoCore.rotation.y += 0.001;
          svpoCore.scale.setScalar(1 + Math.sin(elapsed * 1.2) * 0.05);
        }

        centerLight.intensity = 1.2 + Math.sin(elapsed * 0.6) * 0.3;

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      async function init() {
        updateProgress(5, "LOADING INNA...");
        await new Promise((r) => setTimeout(r, 100));
        await buildCoins();
        buildEdges();
        buildSVPO();
        updateProgress(90, "CALIBRATING SPHERE...");
        await new Promise((r) => setTimeout(r, 200));
        updateProgress(100, "SPHERE READY");
        await new Promise((r) => setTimeout(r, 400));
        const loadScreen = document.getElementById("loadScreen");
        loadScreen.classList.add("fade-out");
        setTimeout(() => {
          loadScreen.style.display = "none";
        }, 900);
        clock.start();
        animate();
      }

      init();
    </script>
  </body>
</html>
