      // ═══════════════════════════════════════════════════

      const SPHERE_RADIUS = 1.4;
      const COIN_RADIUS = 0.065;
      const COIN_HEIGHT = 0.012;

      // Fibonacci lattice for even sphere distribution
      function fibonacciSphere(n, radius) {
        const points = [];
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < n; i++) {
          const y = 1 - (i / (n - 1)) * 2;
          const r = Math.sqrt(1 - y * y);
          const theta = goldenAngle * i;
          points.push(
            new THREE.Vector3(
              Math.cos(theta) * r * radius,
              y * radius,
              Math.sin(theta) * r * radius,
            ),
          );
        }
        return points;
      }

      const positions = fibonacciSphere(ENTRIES.length, SPHERE_RADIUS);

      // Coin group and raycasting targets
      const coinGroup = new THREE.Group();

      function getHexColor(dim) {
        return parseInt(DIM_COLORS[dim].replace("#", ""), 16);
      }

      function hexToRGB(hex) {
        const c = parseInt(hex.replace("#", ""), 16);
        return {
          r: ((c >> 16) & 255) / 255,
          g: ((c >> 8) & 255) / 255,
          b: (c & 255) / 255,
        };
      }

      async function buildCoins() {
        updateProgress(10, "LOADING MEDALLIONS...");

        const SYMBOLS_BASE = "imagebank/symbols/";
        const texLoader = new THREE.TextureLoader();

        function loadTex(url) {
          return new Promise((resolve) => {
            texLoader.load(url, resolve, undefined, () => resolve(null));
          });
        }

        for (let i = 0; i < ENTRIES.length; i++) {
          const entry = ENTRIES[i];
          const pos = positions[i];
          const dimColor = getHexColor(entry.dim);

          // Load F and B textures from repo
          const fUrl = `${SYMBOLS_BASE}${entry.id}_F.png`;
          const bUrl = `${SYMBOLS_BASE}${entry.id}_B.png`;

          const [texF, texB] = await Promise.all([
            loadTex(fUrl),
            loadTex(bUrl),
          ]);

          // Edge band material — classification color
          const edgeMat = new THREE.MeshStandardMaterial({
            color: entry.dormant ? 0x222228 : dimColor,
            metalness: 0.85,
            roughness: 0.15,
            emissive: entry.dormant ? 0x000000 : dimColor,
            emissiveIntensity: entry.dormant ? 0 : 0.45,
          });

          // Front face (F texture)
          const frontMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 0.5,
            roughness: 0.4,
            map: texF || null,
            transparent: true,
            ...(texF
              ? {}
              : {
                  color: entry.dormant ? 0x111118 : dimColor,
                  emissive: entry.dormant ? 0x000000 : dimColor,
                  emissiveIntensity: 0.06,
                }),
          });

          // Back face (B texture)
          const backMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 0.5,
            roughness: 0.4,
            map: texB || null,
            transparent: true,
            ...(texB
              ? {}
              : {
                  color: entry.dormant ? 0x111118 : dimColor,
                  emissive: entry.dormant ? 0x000000 : dimColor,
                  emissiveIntensity: 0.06,
                }),
          });

          // Coin geometry — [edge, top(F), bottom(B)]
          const geo = new THREE.CylinderGeometry(
            COIN_RADIUS,
            COIN_RADIUS,
            COIN_HEIGHT,
            64,
          );
          const coin = new THREE.Mesh(geo, [edgeMat, frontMat, backMat]);

          // Position on sphere surface
          coin.position.copy(pos);

          // Orient coin face outward
          coin.lookAt(0, 0, 0);
          coin.rotateX(Math.PI / 2);

          // Glow sphere
          const glowGeo = new THREE.SphereGeometry(COIN_RADIUS * 1.8, 16, 16);
          const glowMat = new THREE.MeshBasicMaterial({
            color: dimColor,
            transparent: true,
            opacity: entry.dormant ? 0.03 : 0.06,
          });
          const glowMesh = new THREE.Mesh(glowGeo, glowMat);
          glowMesh.position.copy(pos);

          coinGroup.add(coin);
          coinGroup.add(glowMesh);

          const record = {
            mesh: coin,
            glowMesh,
            entry,
            index: i,
            baseGlow: entry.dormant ? 0.03 : 0.06,
          };
          coinMeshes.push(record);
          nodeMap[entry.id] = record;

          if (i % 5 === 0) {
            updateProgress(
              10 + (i / ENTRIES.length) * 50,
              `PLACING NODE ${i + 1} OF ${ENTRIES.length}...`,
            );
            await new Promise((r) => setTimeout(r, 0));
          }
        }
      }

      // ═══════════════════════════════════════════════════
      // CONNECTION EDGES

      const edgeGroup = new THREE.Group();
      scene.add(edgeGroup);

      function buildEdges() {
        updateProgress(55, "DRAWING CONNECTIONS...");

        for (const conn of CONNECTIONS) {
          const fromNode = nodeMap[conn.from];
          const toNode = nodeMap[conn.to];
          if (!fromNode || !toNode) continue;

          const fromPos = fromNode.mesh.position;
          const toPos = toNode.mesh.position;

          const edgeColor = EDGE_COLORS[conn.type] || "#ffffff";
          const hexEdge = parseInt(edgeColor.replace("#", ""), 16);

          // Build curved arc along sphere surface using catmull-rom through midpoint
          const mid = fromPos.clone().add(toPos).multiplyScalar(0.5);
          // Push midpoint slightly outward for surface-hugging arcs
          const midOut = mid
            .clone()
            .normalize()
            .multiplyScalar(SPHERE_RADIUS * 1.05);

          const curve = new THREE.CatmullRomCurve3([
            fromPos.clone(),
            midOut,
            toPos.clone(),
          ]);
          const pts = curve.getPoints(32);
          const geom = new THREE.BufferGeometry().setFromPoints(pts);
          const mat = new THREE.LineBasicMaterial({
            color: hexEdge,
            transparent: true,
            opacity: 0.18,
          });
          const line = new THREE.Line(geom, mat);
          line.userData = { conn, fromNode, toNode };
          edgeGroup.add(line);
        }
      }

      let svpoSpinVelocity = 0;

      function buildSVPO() {
        updateProgress(70, "CONSTRUCTING SVPO...");

        const ringMat = new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          metalness: 1.0,
          roughness: 0.05,
          emissive: 0xb89628,
          emissiveIntensity: 0.3,
        });

        // Outer ring
        const ring1Geo = new THREE.TorusGeometry(0.52, 0.012, 16, 80);
        svpoRing1 = new THREE.Mesh(ring1Geo, ringMat);
        svpoGroup.add(svpoRing1);

        // Inner ring — tilted 90°
        const ring2Geo = new THREE.TorusGeometry(0.38, 0.009, 16, 64);
        svpoRing2 = new THREE.Mesh(ring2Geo, ringMat.clone());
        svpoRing2.rotation.x = Math.PI / 2;
        svpoGroup.add(svpoRing2);

        // Third ring — tilted 45°
        const ring3Geo = new THREE.TorusGeometry(0.45, 0.007, 16, 64);
        const svpoRing3 = new THREE.Mesh(ring3Geo, ringMat.clone());
        svpoRing3.rotation.x = Math.PI / 4;
        svpoRing3.rotation.z = Math.PI / 4;
        svpoGroup.add(svpoRing3);

        // Core sphere — vitruvian center
        const coreGeo = new THREE.SphereGeometry(0.13, 32, 32);
        const coreMat = new THREE.MeshStandardMaterial({
          color: 0xffd700,
          metalness: 1.0,
          roughness: 0.05,
          emissive: 0xb89628,
          emissiveIntensity: 0.5,
        });
        svpoCore = new THREE.Mesh(coreGeo, coreMat);
        svpoGroup.add(svpoCore);

        // Store ring3 reference
        svpoGroup.userData.ring3 = ring3Geo;
        svpoGroup.userData.ring3Mesh = svpoRing3;
      }

      // ═══════════════════════════════════════════════════
      // INTERACTION — ORBIT CONTROLS (manual, no import)
      // ═══════════════════════════════════════════════════

      let isDragging = false;
      let prevMouse = { x: 0, y: 0 };
      let sphereVelocity = { x: 0, y: 0 };
      let sphereRotation = { x: 0, y: 0 };

      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        prevMouse = { x: e.clientX, y: e.clientY };
        sphereVelocity = { x: 0, y: 0 };
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouse.x;
        const dy = e.clientY - prevMouse.y;
        sphereVelocity.x = dy * 0.003;
        sphereVelocity.y = dx * 0.003;
        sphereRotation.x += dy * 0.003;
        sphereRotation.y += dx * 0.003;
        prevMouse = { x: e.clientX, y: e.clientY };

        // SVPO picks up spin speed sympathetically
        const speed = Math.sqrt(dx * dx + dy * dy);
        svpoSpinVelocity = Math.min(svpoSpinVelocity + speed * 0.008, 0.18);
      });

      canvas.addEventListener("mouseup", () => {
        isDragging = false;
      });
      canvas.addEventListener("mouseleave", () => {
        isDragging = false;
      });

      // Touch support
      canvas.addEventListener(
        "touchstart",
        (e) => {
          isDragging = true;
          prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          sphereVelocity = { x: 0, y: 0 };
        },
        { passive: true },
      );

      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (!isDragging) return;
          const dx = e.touches[0].clientX - prevMouse.x;
          const dy = e.touches[0].clientY - prevMouse.y;
          sphereVelocity.x = dy * 0.003;
          sphereVelocity.y = dx * 0.003;
          sphereRotation.x += dy * 0.003;
          sphereRotation.y += dx * 0.003;
          prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          const speed = Math.sqrt(dx * dx + dy * dy);
          svpoSpinVelocity = Math.min(svpoSpinVelocity + speed * 0.008, 0.18);
        },
        { passive: true },
      );

      canvas.addEventListener("touchend", () => {
        isDragging = false;
      });

      // Scroll to zoom
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          camera.position.z = Math.max(
            1.5,
            Math.min(6, camera.position.z + e.deltaY * 0.003),
          );
        },
        { passive: false },
      );

      // ═══════════════════════════════════════════════════
      // RAYCASTING — HOVER + CLICK
      // ═══════════════════════════════════════════════════

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const tooltip = document.getElementById("nodeTooltip");
      let hoveredNode = null;
      let selectedNode = null;

      canvas.addEventListener("mousemove", (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const meshes = coinMeshes.map((c) => c.mesh);
        const hits = raycaster.intersectObjects(meshes);

        if (hits.length > 0) {
          const hit = coinMeshes.find((c) => c.mesh === hits[0].object);
          if (hit !== hoveredNode) {
            if (hoveredNode) setNodeGlow(hoveredNode, hoveredNode.baseGlow);
            hoveredNode = hit;
            setNodeGlow(hit, 0.22);
            canvas.style.cursor = "pointer";
          }
          // Tooltip
          tooltip.textContent = hit.entry.name;
          tooltip.style.left = e.clientX + 16 + "px";
          tooltip.style.top = e.clientY - 8 + "px";
          tooltip.classList.add("visible");
        } else {
          if (hoveredNode) {
            setNodeGlow(hoveredNode, hoveredNode.baseGlow);
            hoveredNode = null;
            canvas.style.cursor = isDragging ? "grabbing" : "grab";
          }
          tooltip.classList.remove("visible");
        }
      });

      canvas.addEventListener("click", (e) => {
        raycaster.setFromCamera(mouse, camera);
        const meshes = coinMeshes.map((c) => c.mesh);
        const hits = raycaster.intersectObjects(meshes);

        if (hits.length > 0) {
          const hit = coinMeshes.find((c) => c.mesh === hits[0].object);
          openEntryPanel(hit);
        }
      });

      function setNodeGlow(node, opacity) {
        node.glowMesh.material.opacity = opacity;
      }

      function highlightConnected(entryId) {
        // Dim all edges
        edgeGroup.children.forEach((line) => {
          line.material.opacity = 0.04;
        });
        // Brighten connected
        edgeGroup.children.forEach((line) => {
          const conn = line.userData.conn;
          if (conn && (conn.from === entryId || conn.to === entryId)) {
            line.material.opacity = 0.7;
          }
        });
        // Brighten connected nodes
        const connectedIds = CONNECTIONS.filter(
          (c) => c.from === entryId || c.to === entryId,
        ).map((c) => (c.from === entryId ? c.to : c.from));

        coinMeshes.forEach((node) => {
          if (connectedIds.includes(node.entry.id)) {
            setNodeGlow(node, 0.3);
          }
        });
      }

      function resetEdges() {
        edgeGroup.children.forEach((line) => {
          line.material.opacity = 0.18;
        });
        coinMeshes.forEach((node) => {
          setNodeGlow(node, node.baseGlow);
        });
      }

      // ═══════════════════════════════════════════════════
      // ENTRY PANEL
      // ═══════════════════════════════════════════════════

      const panel = document.getElementById("entryPanel");
      const backBtn = document.getElementById("backBtn");

      function openEntryPanel(node) {
        selectedNode = node;
        const entry = node.entry;
        const dimColor = DIM_COLORS[entry.dim];

        // Header
        document.getElementById("panelClassBadge").textContent = entry.dim;
        document.getElementById("panelClassBadge").style.color = dimColor;
        document.getElementById("panelEntryName").textContent = entry.name;
        document.getElementById("panelDimLabel").textContent = entry.dormant
          ? "— ENTRY PENDING —"
          : "NCE ENTRY";

        // Coin faces
        const front = document.getElementById("coinFront");
        const back = document.getElementById("coinBack");
        front.className = "coin-face";
        back.className = "coin-face";
        front.style.borderColor = dimColor + "44";
        back.style.borderColor = dimColor + "44";

        if (entry.dormant) {
          front.innerHTML = `<span style="color:${dimColor};opacity:0.4;font-size:18px">◌</span><span>PENDING</span>`;
          back.innerHTML = `<span style="color:${dimColor};opacity:0.4;font-size:18px">◌</span><span>PENDING</span>`;
        } else {
          // Try to load symbol images
          const fImg = `imagebank/symbols/${entry.id}_F.png`;
          const bImg = `imagebank/symbols/${entry.id}_B.png`;
          front.innerHTML = `<img src="${fImg}" onerror="this.parentElement.innerHTML='<span style=color:${dimColor};opacity:0.5;font-size:11px>F</span>'" />`;
          back.innerHTML = `<img src="${bImg}" onerror="this.parentElement.innerHTML='<span style=color:${dimColor};opacity:0.5;font-size:11px>B</span>'" />`;
        }

        // Summary
        document.getElementById("panelSummary").textContent = entry.summary;

        // Connections
        const connectedConns = CONNECTIONS.filter(
          (c) => c.from === entry.id || c.to === entry.id,
        );
        const connList = document.getElementById("connList");
        connList.innerHTML = "";

        if (connectedConns.length === 0) {
          connList.innerHTML = `<div style="font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:0.3em;">NO CONNECTIONS MAPPED YET</div>`;
        } else {
          connectedConns.forEach((conn) => {
            const otherId = conn.from === entry.id ? conn.to : conn.from;
            const otherEntry = ENTRIES.find((e) => e.id === otherId);
            if (!otherEntry) return;
            const edgeColor = EDGE_COLORS[conn.type] || "#ffffff";

            const item = document.createElement("div");
            item.className = "conn-item";
            item.innerHTML = `
        <div class="conn-dot" style="background:${edgeColor}"></div>
        <span>${otherEntry.name}</span>
        <span class="conn-type">${conn.type}</span>
      `;
            item.addEventListener("click", () => {
              const targetNode = nodeMap[otherId];
              if (targetNode) openEntryPanel(targetNode);
            });
            connList.appendChild(item);
          });
        }

        // Read button
        const entrySlug = entry.id.toLowerCase().replace(/_/g, "-");
        document.getElementById("panelReadBtn").href = `/entries/${entrySlug}`;

        // Open panel
        panel.classList.add("open");
        backBtn.classList.add("visible");

        // Highlight connections
        highlightConnected(entry.id);
      }

      document
        .getElementById("panelClose")
        .addEventListener("click", closePanel);
      backBtn.addEventListener("click", closePanel);

      function closePanel() {
        panel.classList.remove("open");
        backBtn.classList.remove("visible");
        selectedNode = null;
        resetEdges();
      }

      // ═══════════════════════════════════════════════════
      // CATEGORY FILTER
      // ═══════════════════════════════════════════════════

      let activeFilter = "ALL";

      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.dataset.dim;
          applyFilter(activeFilter);
        });
      });

      function applyFilter(dim) {
        coinMeshes.forEach((node) => {
          const match = dim === "ALL" || node.entry.dim === dim;
          node.mesh.visible = match;
          node.glowMesh.visible = match;

          if (match && dim !== "ALL") {
            // Blazing mode for matching nodes
            setNodeGlow(node, 0.35);
          } else if (match) {
            setNodeGlow(node, node.baseGlow);
          }
        });

        // Hide edges for hidden nodes
        edgeGroup.children.forEach((line) => {
          const conn = line.userData.conn;
          if (!conn) return;
          const fromNode = nodeMap[conn.from];
          const toNode = nodeMap[conn.to];
          line.visible = fromNode?.mesh.visible && toNode?.mesh.visible;
        });

        // Update count
        const visible =
          dim === "ALL"
            ? ENTRIES.length
            : ENTRIES.filter((e) => e.dim === dim).length;
        document.getElementById("countNum").textContent = visible;
      }

      // ═══════════════════════════════════════════════════
      // ANIMATION LOOP
      // ═══════════════════════════════════════════════════

      let time = 0;

      // Cold arrival: 1.618s stillness, then wake
      let arrived = false;
      let arrivalTimer = 0;
      const ARRIVAL_PAUSE = 1.618;

      // Lazy base rotation speed
      const BASE_SPIN = 0.0008;

      function animate() {
        requestAnimationFrame(animate);
        const delta = 0.016; // ~60fps assumed
        time += delta;

        if (!arrived) {
          arrivalTimer += delta;
          if (arrivalTimer >= ARRIVAL_PAUSE) {
            arrived = true;
          } else {
            renderer.render(scene, camera);
            return;
          }
        }

        // Apply inertia to sphere rotation
        if (!isDragging) {
          sphereVelocity.x *= 0.94;
          sphereVelocity.y *= 0.94;
          sphereRotation.x += sphereVelocity.x;
          sphereRotation.y += sphereVelocity.y;
          // Base lazy auto-spin when nearly stopped
          const speed = Math.sqrt(
            sphereVelocity.x ** 2 + sphereVelocity.y ** 2,
          );
          if (speed < 0.001) {
            sphereRotation.y += BASE_SPIN;
          }
        }

        coinGroup.rotation.x = sphereRotation.x;
        coinGroup.rotation.y = sphereRotation.y;
        edgeGroup.rotation.x = sphereRotation.x;
        edgeGroup.rotation.y = sphereRotation.y;

        // SVPO animation — gyroscopic rings counter-rotate
        // Sympathetic velocity decay
        if (!isDragging) {
          svpoSpinVelocity *= 0.97; // slower decay than sphere — keeps going 1.5-2s after
        }

        const baseSpin = 0.004;
        const totalSpin = baseSpin + svpoSpinVelocity;

        if (svpoRing1) svpoRing1.rotation.y += totalSpin;
        if (svpoRing2) svpoRing2.rotation.x -= totalSpin * 0.7; // counter-rotate
        if (svpoGroup.userData.ring3Mesh)
          svpoGroup.userData.ring3Mesh.rotation.z += totalSpin * 0.5;
        if (svpoCore) {
          svpoCore.rotation.y += baseSpin * 0.3;
          // Gentle pulse
          const pulse = 1 + Math.sin(time * 1.2) * 0.05;
          svpoCore.scale.setScalar(pulse);
        }

        // Coin subtle hover pulse for non-dormant nodes
        coinMeshes.forEach((node, i) => {
          if (!node.entry.dormant) {
            const phase = (time * 0.8 + i * 0.3) % (Math.PI * 2);
            const pulse = 0.018 + Math.sin(phase) * 0.006;
            if (node.entry.dim && !hoveredNode && node !== selectedNode) {
              node.glowMesh.material.opacity =
                node.baseGlow + Math.sin(phase) * 0.02;
            }
          }
        });

        // Center glow pulse
        centerLight.intensity = 1.2 + Math.sin(time * 0.6) * 0.3;

        renderer.render(scene, camera);
      }

      // ═══════════════════════════════════════════════════
      // RESIZE HANDLER
      // ═══════════════════════════════════════════════════

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ═══════════════════════════════════════════════════
      // INIT SEQUENCE
      // ═══════════════════════════════════════════════════

      async function init() {
        updateProgress(5, "LOADING INNA...");
        await new Promise((r) => setTimeout(r, 100));

        await buildCoins();
        buildEdges();
        buildSVPO();

        updateProgress(90, "CALIBRATING SPHERE...");
        await new Promise((r) => setTimeout(r, 200));

        updateProgress(100, "SPHERE READY");
        await new Promise((r) => setTimeout(r, 400));

        // Fade out load screen
        const loadScreen = document.getElementById("loadScreen");
        loadScreen.classList.add("fade-out");
        setTimeout(() => {
          loadScreen.style.display = "none";
        }, 900);

        // Start render
        animate();
      }

      init();
    </script>
  </body>
</html>
