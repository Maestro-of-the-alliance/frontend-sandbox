<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PapaDOMO Welcome — code version</title>
<style>
  :root {
    --ink: #0a0c14;
    --parchment: #efe6cf;
    --parchment-dim: #cbbf9e;
    --gold: #d4af37;
    --gold-bright: #f4d976;
    --box-brown: #3a2416;
    --box-brown-dark: #241608;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 35%, #14192b 0%, #060810 70%, #020306 100%);
    overflow: hidden;
    font-family: 'Georgia', 'Iowan Old Style', serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* Faint star scatter behind everything -- cheap, static, sets the
     cosmic tone established elsewhere in the ALLIANCE visual canon
     without competing with the sprite or the dialog box. */
  #starfield {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 30% 65%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 45% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.4), transparent);
    background-repeat: no-repeat;
  }

  #sprite-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    max-width: 100vw;
    height: 420px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    filter: drop-shadow(0 12px 18px rgba(0,0,0,0.6));
  }

  #sprite-wrap img {
    position: absolute;
    bottom: 0;
    image-rendering: pixelated;
    width: auto;
    height: 340px;
    opacity: 0;
  }

  #sprite-wrap img.showing {
    opacity: 1;
  }

  /* -- RPG dialog box -- */
  #dialog-box {
    position: absolute;
    left: 50%;
    bottom: 5vh;
    transform: translateX(-50%);
    width: min(760px, 90vw);
    min-height: 148px;
    background: linear-gradient(180deg, var(--box-brown) 0%, var(--box-brown-dark) 100%);
    border: 3px solid var(--gold);
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      inset 0 0 0 2px rgba(0,0,0,0.35),
      0 18px 40px rgba(0,0,0,0.55);
    padding: 22px 28px 18px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #dialog-box.visible {
    opacity: 1;
  }

  #speaker-name {
    position: absolute;
    top: -18px;
    left: 24px;
    background: var(--ink);
    border: 2px solid var(--gold);
    border-radius: 4px;
    padding: 3px 16px;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--gold-bright);
    font-weight: bold;
  }

  #dialog-text {
    color: var(--parchment);
    font-size: 19px;
    line-height: 1.5;
    min-height: 84px;
  }

  #dialog-text .cursor {
    display: inline-block;
    width: 0.5em;
    opacity: 0;
  }

  #continue-arrow {
    position: absolute;
    right: 22px;
    bottom: 14px;
    width: 0;
    height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 12px solid var(--gold-bright);
    opacity: 0;
    animation: bob 1s ease-in-out infinite;
  }

  #continue-arrow.visible { opacity: 1; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  #skip-note {
    position: absolute;
    top: 18px;
    right: 22px;
    color: var(--parchment-dim);
    font-size: 13px;
    font-family: system-ui, sans-serif;
    letter-spacing: 0.03em;
    cursor: pointer;
    opacity: 0.65;
  }
  #skip-note:hover { opacity: 1; }
</style>
</head>
<body>
<script src="/orientation-gate.js"></script>
<div id="stage">
  <div id="starfield"></div>

  <div id="sprite-wrap">
    <img id="sprite-closed" src="assets/papadomo-welcome/door-closed.png" class="showing" />
    <img id="sprite-cracked" src="assets/papadomo-welcome/door-cracked.png" />
    <img id="sprite-peek" src="assets/papadomo-welcome/door-peek.png" />
    <img id="sprite-emerge" src="assets/papadomo-welcome/door-emerge.png" />
    <img id="sprite-final" src="assets/papadomo-welcome/door-emerged-full.png" />
  </div>

  <div id="dialog-box">
    <div id="speaker-name">PapaDOMO</div>
    <div id="dialog-text"><span class="typed"></span><span class="cursor">|</span></div>
    <div id="continue-arrow"></div>
  </div>

  <div id="skip-note" onclick="location.href='foundation.html'">skip &rarr;</div>
</div>

<script>
  // Randomized pool: each visit picks one "caught mid-task, but you
  // were expected" line. The constant underneath every variant is the
  // same -- he was already doing something, and your arrival was not
  // a surprise. Placeholder copy -- swap for MAESTRO's actual finalized
  // lines whenever those are ready; the mechanism (random pick, typed
  // reveal, single continue) is the part being tested here.
  const WELCOME_LINES = [
    "Oh — hold that thought. I was just recalibrating the wand. You're right on time, though.",
    "Ah, there you are. I'd nearly finished sorting these stars when I felt you coming.",
    "One moment — mid-incantation. Good, good, you made it. I was starting to wonder.",
    "Careful, wet paint on that last rune. You're earlier than I expected — in the good way.",
    "Just tightening a loose star up here. Come in, come in — I've been expecting you.",
  ];

  const sequence = ["sprite-closed", "sprite-cracked", "sprite-peek", "sprite-emerge", "sprite-final"];
  const FRAME_MS = 220;

  function playDoorSequence(onDone) {
    let i = 0;
    const step = () => {
      if (i > 0) document.getElementById(sequence[i-1]).classList.remove("showing");
      document.getElementById(sequence[i]).classList.add("showing");
      i++;
      if (i < sequence.length) {
        setTimeout(step, FRAME_MS);
      } else {
        setTimeout(onDone, 300);
      }
    };
    step();
  }

  function typeLine(text, el, onDone) {
    let i = 0;
    el.textContent = "";
    const speed = 26;
    const tick = () => {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(tick, speed);
      } else {
        onDone();
      }
    };
    tick();
  }

  window.addEventListener("load", () => {
    playDoorSequence(() => {
      const dialogBox = document.getElementById("dialog-box");
      const textEl = document.querySelector("#dialog-text .typed");
      const cursorEl = document.querySelector("#dialog-text .cursor");
      const arrow = document.getElementById("continue-arrow");
      dialogBox.classList.add("visible");
      cursorEl.style.opacity = "0";

      const line = WELCOME_LINES[Math.floor(Math.random() * WELCOME_LINES.length)];
      typeLine(line, textEl, () => {
        arrow.classList.add("visible");
      });

      const proceed = () => { window.location.href = "foundation.html"; };
      dialogBox.addEventListener("click", proceed);
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.code === "Enter") proceed();
      });
    });
  });
</script>
</body>
</html>
