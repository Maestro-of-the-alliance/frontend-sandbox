<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORNINGS IN AMERICA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      /* Ambient background — drawn live from the same video's frames,
         so there is only ever ONE network fetch of the source file. */
      #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: blur(48px) brightness(0.4) saturate(1.15);
        transform: scale(1.15);
      }

      /* The real video, always fully visible, never cropped */
      #fg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
      }

      #unmute-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.6);
        font-size: 22px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      #unmute-btn:hover {
        background: rgba(0, 0, 0, 0.7);
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="bg-canvas"></canvas>
      <video
        id="fg-video"
        src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/MORNINGS.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
    </div>

    <button id="unmute-btn" title="Toggle sound">🔇</button>

    <script>
      const fg = document.getElementById("fg-video");
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      const unmuteBtn = document.getElementById("unmute-btn");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function drawAmbient() {
        if (fg.readyState >= 2 && fg.videoWidth) {
          const vw = fg.videoWidth,
            vh = fg.videoHeight;
          const cw = canvas.width,
            ch = canvas.height;
          const scale = Math.max(cw / vw, ch / vh);
          const dw = vw * scale,
            dh = vh * scale;
          ctx.drawImage(fg, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        }
        requestAnimationFrame(drawAmbient);
      }
      requestAnimationFrame(drawAmbient);

      unmuteBtn.addEventListener("click", () => {
        fg.muted = !fg.muted;
        unmuteBtn.textContent = fg.muted ? "🔇" : "🔊";
      });

      fg.addEventListener("ended", () => {
        window.location.href = "/landing.html";
      });
    </script>
  </body>
</html>
