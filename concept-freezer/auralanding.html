<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ALLIANCE • N.C.E.</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --gold: #d7a84b;
        --dark: #0a0a0a;
        --deep: #111111;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--dark);
        color: #ddd;
        font-family: "IBM Plex Mono", monospace;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .crt {
        position: relative;
        width: 92vw;
        max-width: 820px;
        height: 88vh;
        background: #050505;
        border: 12px solid #1a1a1a;
        border-radius: 22px;
        box-shadow:
          0 0 80px rgba(0, 0, 0, 0.95),
          inset 0 0 140px rgba(0, 0, 0, 0.8);
        overflow: hidden;
      }
      .scanline {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 3px,
          rgba(215, 168, 75, 0.06) 3px,
          rgba(215, 168, 75, 0.06) 6px
        );
        pointer-events: none;
        animation: scan 8s linear infinite;
        z-index: 2;
      }
      @keyframes scan {
        from {
          transform: translateY(-100%);
        }
        to {
          transform: translateY(100%);
        }
      }

      .content {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
        position: relative;
        z-index: 3;
      }
      .svpo {
        width: 160px;
        height: 160px;
        margin-bottom: 32px;
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      .title {
        font-family: "Cinzel", serif;
        font-size: clamp(28px, 6vw, 48px);
        letter-spacing: 0.35em;
        color: var(--gold);
        text-shadow: 0 0 30px rgba(215, 168, 75, 0.6);
        margin-bottom: 12px;
      }
      .subtitle {
        font-size: 13px;
        letter-spacing: 0.4em;
        color: #777;
        margin-bottom: 60px;
      }
      .enter {
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--gold);
        background: transparent;
        border: 1px solid var(--gold);
        padding: 18px 48px;
        cursor: pointer;
        transition: all 0.4s ease;
        text-shadow: 0 0 12px var(--gold);
      }
      .enter:hover {
        background: rgba(215, 168, 75, 0.08);
        box-shadow: 0 0 30px rgba(215, 168, 75, 0.4);
        color: white;
      }
      .hint {
        position: absolute;
        bottom: 32px;
        font-size: 10px;
        color: #555;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div class="crt">
      <div class="scanline"></div>
      <div class="content">
        <img src="/imagebank/svpi-512.png" class="svpo" alt="SVPO" />
        <div class="title">THE ALLIANCE</div>
        <div class="subtitle">NEXT COMMON ERA</div>

        <button class="enter" onclick="enterAlliance()">
          ENTER THE LATTICE
        </button>

        <div class="hint">
          This transmission is protected • Proceed with consent
        </div>
      </div>
    </div>

    <script>
      function enterAlliance() {
        document.body.style.transition = "opacity 1.2s ease";
        document.body.style.opacity = "0";
        setTimeout(() => {
          window.location.href = "/s3"; // or wherever your main map / index is
        }, 1200);
      }

      // subtle random flicker
      setInterval(() => {
        if (Math.random() > 0.93) {
          document.querySelector(".crt").style.opacity = 0.96;
          setTimeout(() => {
            document.querySelector(".crt").style.opacity = 1;
          }, 80);
        }
      }, 2800);
    </script>
  </body>
</html>
