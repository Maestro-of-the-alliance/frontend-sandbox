<!DOCTYPE html>
<html lang="en" class="nwx">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ALLIANCE - Canon Search</title>
  
  <!-- Fonts: Share Tech Mono, Rajdhani, Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['Figtree', 'system-ui', 'sans-serif'],
            sans: ['Figtree', 'system-ui', 'sans-serif'],
            rajdhani: ['Figtree', 'system-ui', 'sans-serif'],
            orbitron: ['Syne', 'system-ui', 'sans-serif'],
          },
          colors: {
            void: '#060a22',
            cyberCyan: '#ffc24a',
            cyberAmber: '#ff7a59',
            terminalBg: '#14103a',
            cyan: { 400:'#ffe9a8', 500:'#ffc24a', 600:'#e7d9ff', 700:'#c9b8f5', 800:'#6a56b8', 900:'#9b88dc', 950:'#2a2060' },
            amber: { 950:'#3a1830' },
          }
        }
      }
    }
  </script>
  
  <style>
    html{background:linear-gradient(180deg,#060a22 0%,#1b1b5c 45%,#5a2a78 78%,#a8405f 100%) fixed}
    body{background:transparent!important;font-family:'Figtree',system-ui,sans-serif;font-size:17px}
    .glow-cyan{box-shadow:0 8px 40px rgba(0,0,0,.35);border-color:rgba(255,233,168,.3)}
    .glow-cyan:focus{box-shadow:0 0 0 3px rgba(255,194,74,.25);border-color:#ffc24a}
    .glow-amber{box-shadow:0 8px 40px rgba(0,0,0,.35);border-color:rgba(255,122,89,.4)}
    .glow-amber-active{box-shadow:0 0 0 3px rgba(255,122,89,.25);border-color:#ff7a59}
    .terminal-scrollbar::-webkit-scrollbar{width:8px}
    .terminal-scrollbar::-webkit-scrollbar-track{background:transparent}
    .terminal-scrollbar::-webkit-scrollbar-thumb{background:rgba(255,233,168,.3);border-radius:8px}
    mark{background-color:rgba(255,194,74,.28);color:#ffe9a8;font-weight:700;border-bottom:2px solid #ffc24a;padding:0 2px;border-radius:3px}
    .cursor-blink{animation:none}
    .uppercase{text-transform:none!important}.tracking-widest,.tracking-wider{letter-spacing:.005em!important}
    header.sticky{background:rgba(10,15,46,.72)!important;border-color:rgba(255,233,168,.18)!important}
    h1{letter-spacing:-.015em!important;font-weight:800!important}
    .rounded,.rounded-lg{border-radius:18px!important}
    button.px-4{border-radius:99px;font-size:15px!important;font-weight:600}
    input#search-input{font-size:18px!important;border-radius:99px!important;background:rgba(255,255,255,.08)!important;color:#fff4dc!important;border-color:rgba(255,233,168,.35)!important}
    input#search-input::placeholder{color:rgba(255,244,220,.5)!important}
    .text-gray-400{color:rgba(255,244,220,.82)!important}.text-gray-300{color:#fff4dc}
    @media(max-width:640px){header .max-w-6xl{padding-right:72px!important}h1{font-size:21px!important;overflow-wrap:anywhere}header .text-xl{font-size:17px!important}}
    #results-container a,.hover\:text-cyberCyan:hover{color:#ffe9a8}
  </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-cyan-950 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-cyberCyan text-xl font-orbitron tracking-widest font-black">The ALLIANCE</span>
        <span class="text-xs bg-cyan-950 text-cyberCyan px-2 py-0.5 border border-cyan-800 font-mono">Canon search</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8">
    
    <!-- Title / Prompt -->
    <div class="mb-8 text-center sm:text-left">
      <h1 class="text-3xl font-orbitron font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyberCyan to-cyan-500 tracking-wider uppercase mb-2">
        N.C.E.ncyclopedia search
      </h1>
      <p class="text-sm font-mono text-cyan-600">
        Index: <span id="doc-count-loading">loading…</span>
      </p>
    </div>

    <!-- Search Input Panel -->
    <div class="bg-terminalBg border border-cyan-950 p-6 rounded-lg mb-8 glow-cyan relative overflow-hidden">
      <!-- Cyber decoration -->
      <div class="absolute top-0 right-0 w-16 h-16 pointer-events-none overflow-hidden">
        <div class="absolute top-0 right-0 w-[100px] h-[100px] bg-cyan-500/5 rotate-45 translate-x-12 -translate-y-12 border-l border-cyan-500/30"></div>
      </div>
      
      <!-- Search Tabs -->
      <div class="flex space-x-2 mb-4 border-b border-cyan-950 pb-3">
        <button id="tab-literal" class="px-4 py-2 font-mono text-sm uppercase flex items-center space-x-2 border border-cyberCyan bg-cyan-950/40 text-cyberCyan glow-cyan transition-all duration-200">
          <span class="w-2 h-2 bg-cyberCyan rounded-full"></span>
          <span>Word for word</span>
        </button>
        <button id="tab-semantic" class="px-4 py-2 font-mono text-sm uppercase flex items-center space-x-2 border border-transparent hover:border-cyan-800 text-cyan-600 hover:text-cyberCyan transition-all duration-200">
          <span class="w-2 h-2 bg-transparent border border-cyan-800 rounded-full" id="semantic-dot"></span>
          <span>By idea</span>
        </button>
      </div>

      <!-- Input Field -->
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-mono text-cyberCyan text-lg font-bold">
          &gt;
        </span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search the canon (try “REDOUT” or “what happens if my partner leaves”)" 
          class="w-full bg-black/50 border border-cyan-900 rounded py-3 pl-10 pr-12 font-mono text-cyberCyan placeholder-cyan-900/60 focus:outline-none glow-cyan text-base"
          autocomplete="off"
        >
        <button id="clear-btn" class="absolute right-4 top-1/2 -translate-y-1/2 text-cyan-700 hover:text-cyberCyan transition-all hidden">
          Clear
        </button>
      </div>

      <!-- Mode explanation -->
      <div id="mode-explanation" class="mt-3 text-xs font-mono text-cyan-700 flex items-center space-x-1">
        <span class="text-cyberCyan">▲</span>
        <span id="explanation-text">Exact matching: finds literal words, phrases, or codenames anywhere in canon.</span>
      </div>
    </div>

    <!-- Results Area -->
    <div id="results-container">
      <div class="text-center py-12 text-cyan-900 border border-dashed border-cyan-950 rounded-lg bg-black/10">
        <div class="font-mono mb-2 animate-pulse">Ready when you are</div>
        <div class="text-xs font-mono">Type above to search the whole canon</div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-cyan-950 py-6 bg-black/40 text-xs font-mono text-cyan-800 text-center">
    <div class="max-w-6xl mx-auto px-4">
      The ALLIANCE · N.C.E.ncyclopedia
    </div>
  </footer>

  <!-- Search Engine Script -->
  <script src="search.js"></script>
  <script src="/portal-transition.js"></script>
  <script src="/nav-wheel.js"></script>
  <script src="/hub-menu.js"></script>
  <script src="/command-panel.js"></script>
  <script>
    (function () {
      const el = document.getElementById("sys-ver");
      if (!el) return;
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      el.textContent = `SYS_VER: ${y}.${m}.${day} // RECON_ACTIVE`;
    })();
  </script>
</body>
</html>
