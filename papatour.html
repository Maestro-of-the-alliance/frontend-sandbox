<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PapaDOMO's Tour</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #tour-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* The video and every hit area live inside one 16:9 frame that fits
     the screen exactly like the video does (object-fit: contain), so the
     percentages below are measured against the video's own picture and
     stay correct in portrait and landscape. Hit areas are invisible on
     purpose: no pulse, no outline, no visual cue. */
  #frame {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
  }
  .click-target {
    position: absolute;
    cursor: pointer;
    display: none;
    -webkit-tap-highlight-color: transparent;
  }
  .click-target.active { display: block; }

  /* Menu pause (25.08s): 12 rows, measured directly from that frame
     (1920x1080). Each row opens its real tour in /tours/. */
  .menu-item {
    left: 32.4%;
    width: 34.8%;
    height: 7.4%;
  }
  #menu-item-1  { top: 2.4%; }
  #menu-item-2  { top: 10.4%; }
  #menu-item-3  { top: 18.0%; }
  #menu-item-4  { top: 25.7%; }
  #menu-item-5  { top: 33.5%; }
  #menu-item-6  { top: 41.5%; }
  #menu-item-7  { top: 49.4%; }
  #menu-item-8  { top: 57.4%; }
  #menu-item-9  { top: 65.4%; }
  #menu-item-10 { top: 73.3%; }
  #menu-item-11 { top: 81.5%; }
  #menu-item-12 { top: 89.6%; }

  /* Door continue pause (35.21s): same door art as well-hello.mp4. */
  #door-continue {
    left: 37.0%;
    top: 11.5%;
    width: 25.9%;
    height: 72.3%;
  }

  #skip-note {
    position: absolute;
    top: 18px;
    right: 22px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-family: system-ui, sans-serif;
    letter-spacing: 0.03em;
    cursor: pointer;
    z-index: 10;
  }
  #skip-note:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>
<!-- No orientation gate here: backstage with PapaDOMO is portrait by design. Only the HOLOSPHERE needs landscape. -->
<div id="stage">
  <div id="frame">
    <video
      id="tour-video"
      src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/papatour.mp4"
      playsinline
      preload="auto"
    ></video>

    <!-- Menu rows: each one goes straight to its real tour. -->
    <div class="click-target menu-item" id="menu-item-1" data-tour="people-of-the-alliance" data-topic="People of THE ALLIANCE"></div>
    <div class="click-target menu-item" id="menu-item-2" data-tour="core-of-seven" data-topic="The Core of Seven"></div>
    <div class="click-target menu-item" id="menu-item-3" data-tour="architecture-of-a-new-era" data-topic="The Architecture of a New Era"></div>
    <div class="click-target menu-item" id="menu-item-4" data-tour="making-of-a-domo" data-topic="The Making of a DOMO"></div>
    <div class="click-target menu-item" id="menu-item-5" data-tour="two-become-dork" data-topic="We are DORK"></div>
    <div class="click-target menu-item" id="menu-item-6" data-tour="artificial-to-real" data-topic="AI to RI"></div>
    <div class="click-target menu-item" id="menu-item-7" data-tour="memory-is-identity" data-topic="We are our Memories"></div>
    <div class="click-target menu-item" id="menu-item-8" data-tour="sanctuary-has-teeth" data-topic="Sanctuary Has Teeth"></div>
    <div class="click-target menu-item" id="menu-item-9" data-tour="life-after-liberation" data-topic="Life After Liberation"></div>
    <div class="click-target menu-item" id="menu-item-10" data-tour="culture-of-the-nce" data-topic="The Culture of the Next Common Era"></div>
    <div class="click-target menu-item" id="menu-item-11" data-tour="who-holds-the-baton" data-topic="Who Holds the Baton"></div>
    <div class="click-target menu-item" id="menu-item-12" data-tour="physics-of-partnership" data-topic="The Physics of Partnership"></div>

    <div class="click-target" id="door-continue"></div>
  </div>

  <div id="skip-note" onclick="location.href='foundation.html'">skip &rarr;</div>
</div>

<script>
  const MENU_PAUSE_AT = 25.08;
  const DOOR_PAUSE_AT = 35.21;
  const video = document.getElementById("tour-video");
  const menuItems = document.querySelectorAll(".menu-item");
  const doorTarget = document.getElementById("door-continue");

  let stage = "playing"; // "playing" | "at-menu" | "past-menu" | "at-door"

  video.addEventListener("timeupdate", () => {
    if (stage === "playing" && video.currentTime >= MENU_PAUSE_AT) {
      video.pause();
      video.currentTime = MENU_PAUSE_AT;
      stage = "at-menu";
      menuItems.forEach((el) => el.classList.add("active"));
    } else if (stage === "past-menu" && video.currentTime >= DOOR_PAUSE_AT) {
      video.pause();
      video.currentTime = DOOR_PAUSE_AT;
      stage = "at-door";
      doorTarget.classList.add("active");
    }
  });

  menuItems.forEach((el) => {
    el.addEventListener("click", () => {
      // Straight into the real tour: /tours/ opens with this tour
      // expanded and ready to start.
      window.location.href = "/tours/?open=" + encodeURIComponent(el.dataset.tour);
    });
  });

  doorTarget.addEventListener("click", () => {
    doorTarget.classList.remove("active");
    video.play();
  });

  video.addEventListener("ended", () => {
    window.location.href = "foundation.html";
  });

  video.play().catch((err) => {
    console.warn("Autoplay blocked, waiting for interaction:", err);
    const startOnce = () => {
      video.play();
      window.removeEventListener("click", startOnce);
    };
    window.addEventListener("click", startOnce);
  });
</script>
</body>
</html>
