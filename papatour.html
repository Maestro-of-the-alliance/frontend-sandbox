<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PapaDOMO's Tour</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #tour-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* The video and every hit area live inside one 16:9 frame that fits
     the screen exactly like the video does (object-fit: contain), so the
     percentages below are measured against the video's own picture and
     stay correct in portrait and landscape. Hit areas are invisible on
     purpose: no pulse, no outline, no visual cue. */
  #frame {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(100vw, calc(100vh * 16 / 9));
    aspect-ratio: 16 / 9;
    transform: translate(-50%, -50%);
  }
  .click-target {
    position: absolute;
    cursor: pointer;
    display: none;
    -webkit-tap-highlight-color: transparent;
  }
  .click-target.active { display: block; }

  /* The interactive tour menu (tour-menu.html) lives in this frame. It stays
     hidden while the video plays, then fades in over the menu freeze frame. */
  #menu-app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #050a1f;
    z-index: 5;
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
    transition: opacity 0.6s ease-out, transform 0.6s ease-out;
  }
  #menu-app.show { opacity: 1; transform: none; pointer-events: auto; }

  /* Door continue pause (35.21s): same door art as well-hello.mp4. */
  #door-continue {
    left: 37.0%;
    top: 11.5%;
    width: 25.9%;
    height: 72.3%;
  }

  #skip-note {
    position: absolute;
    top: 18px;
    right: 22px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    font-family: system-ui, sans-serif;
    letter-spacing: 0.03em;
    cursor: pointer;
    z-index: 10;
  }
  #skip-note:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>
<script>try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock();}catch(e){}</script>
<!-- No orientation gate here: backstage with PapaDOMO is portrait by design. Only the HOLOSPHERE needs landscape. -->
<div id="stage">
  <div id="frame">
    <video
      id="tour-video"
      src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/papatour.mp4"
      playsinline
      preload="auto"
    ></video>

    <div class="click-target" id="door-continue"></div>
  </div>

  <iframe id="menu-app" title="PapaDOMO's Free Tours menu" src="about:blank"></iframe>

  <div id="skip-note" onclick="location.href='foundation.html'">skip &rarr;</div>
</div>

<script>
  const MENU_PAUSE_AT = 25.08;
  const DOOR_PAUSE_AT = 35.21;
  const video = document.getElementById("tour-video");
  const menuApp = document.getElementById("menu-app");
  const doorTarget = document.getElementById("door-continue");

  let stage = "playing"; // "playing" | "at-menu" | "past-menu" | "at-door"

  video.addEventListener("timeupdate", () => {
    if (stage === "playing" && video.currentTime >= MENU_PAUSE_AT) {
      video.pause();
      video.currentTime = MENU_PAUSE_AT;
      stage = "at-menu";
      revealMenu();
    } else if (stage === "past-menu" && video.currentTime >= DOOR_PAUSE_AT) {
      video.pause();
      video.currentTime = DOOR_PAUSE_AT;
      stage = "at-door";
      doorTarget.classList.add("active");
    }
  });

  // The menu is a real app now (tour-menu.html), not video with tap areas.
  // Load it quietly while the video plays, then fade it in at the freeze.
  menuApp.src = "/tour-menu.html";
  function revealMenu() {
    menuApp.classList.add("show");
  }

  doorTarget.addEventListener("click", () => {
    doorTarget.classList.remove("active");
    video.play();
  });

  video.addEventListener("ended", () => {
    window.location.href = "foundation.html";
  });

  video.play().catch((err) => {
    console.warn("Autoplay blocked, waiting for interaction:", err);
    const startOnce = () => {
      video.play();
      window.removeEventListener("click", startOnce);
    };
    window.addEventListener("click", startOnce);
  });
</script>
</body>
</html>
