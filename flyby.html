      function svgToImage(svgStr, color) {
        // replace fill:#000000 with desired color for silhouette
        const colored = svgStr.replace(/fill:#000000/g, "fill:" + color);
        const blob = new Blob([colored], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            resolve(img);
          };
          img.src = url;
        });
      }

      // ── STARS ──
      const stars = [];
      for (let i = 0; i < 300; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random() * 0.85,
          r: Math.random() * 1.4 + 0.3,
          twinkle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.016 + 0.005,
        });
      }

      // ── CITY ──
      let buildings = [],
        windows = [];
      function buildCity() {
        const w = canvas.width,
          h = canvas.height;
        const hy = h * 0.88;
        buildings = [];
        windows = [];
        let x = 0;
        while (x < w) {
          const isSpire = Math.random() < 0.07;
          const bw = isSpire
            ? Math.random() * w * 0.018 + w * 0.008
            : Math.random() * w * 0.055 + w * 0.018;
          const bh = isSpire
            ? Math.random() * h * 0.32 + h * 0.12
            : Math.random() * h * 0.22 + h * 0.04;
          const by = hy - bh;
          buildings.push({ x, y: by, w: bw, h: bh, isSpire });
          if (!isSpire) {
            const cols = Math.floor(bw / (w * 0.012));
            const rows = Math.floor(bh / (h * 0.028));
            for (let r = 0; r < rows; r++)
              for (let c = 0; c < cols; c++) {
                if (Math.random() < 0.52) {
                  windows.push({
                    x: x + (c + 0.5) * (bw / cols),
                    y: by + (r + 0.5) * (bh / rows),
                    w: (bw / cols) * 0.38,
                    h: (bh / rows) * 0.42,
                    litAt: 0.3 + Math.random() * 0.6,
                    flicker: Math.random() < 0.1,
                    flickerPhase: Math.random() * Math.PI * 2,
                  });
                }
              }
          }
          x += bw + Math.random() * w * 0.004;
        }
      }

      function lerp(a, b, t) {
        return a + (b - a) * Math.min(1, Math.max(0, t));
      }
      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }

      function skyGradient(t) {
        const w = canvas.width,
          h = canvas.height;
        const g = ctx.createLinearGradient(0, 0, 0, h * 0.88);
        g.addColorStop(
          0,
          `rgb(${lerp(10, 2, t)},${lerp(14, 5, t)},${lerp(52, 20, t)})`,
        );
        g.addColorStop(
          0.28,
          `rgb(${lerp(32, 8, t)},${lerp(22, 10, t)},${lerp(82, 42, t)})`,
        );
        g.addColorStop(
          0.58,
          `rgb(${lerp(90, 20, t)},${lerp(42, 14, t)},${lerp(95, 52, t)})`,
        );
        g.addColorStop(
          0.8,
          `rgb(${lerp(230, 42, t)},${lerp(95, 24, t)},${lerp(48, 60, t)})`,
        );
        g.addColorStop(
          0.92,
          `rgb(${lerp(255, 65, t)},${lerp(145, 32, t)},${lerp(22, 44, t)})`,
        );
        g.addColorStop(
          1,
          `rgb(${lerp(20, 5, t)},${lerp(10, 3, t)},${lerp(14, 5, t)})`,
        );
        return g;
      }

      function drawSun(t) {
        const w = canvas.width,
          h = canvas.height,
          hy = h * 0.88;
        const sp = t / 0.75;
        const sy = lerp(hy * 0.72, hy + h * 0.06, clamp(sp, 0, 1));
        const sx = w * 0.54,
          sr = w * 0.044;
        const alpha = clamp(1 - sp * 1.1, 0, 1);
        if (alpha <= 0) return;
        const atmo = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 9);
        atmo.addColorStop(0, `rgba(255,170,30,${0.22 * alpha})`);
        atmo.addColorStop(0.3, `rgba(255,90,10,${0.12 * alpha})`);
        atmo.addColorStop(1, "rgba(255,40,0,0)");
        ctx.fillStyle = atmo;
        ctx.fillRect(0, 0, w, h);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w, hy);
        ctx.clip();
        const disc = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
        disc.addColorStop(0, `rgba(255,248,200,${alpha})`);
        disc.addColorStop(0.55, `rgba(255,190,50,${alpha})`);
        disc.addColorStop(1, "rgba(255,100,0,0)");
        ctx.fillStyle = disc;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawStars(t, now) {
        const w = canvas.width,
          h = canvas.height;
        const fi = clamp((t - 0.15) * 2.4, 0, 1);
        if (fi <= 0) return;
        stars.forEach((s) => {
          s.twinkle += s.speed;
          const a = fi * (0.45 + 0.55 * Math.sin(s.twinkle));
          ctx.beginPath();
          ctx.arc(s.x * w, s.y * h * 0.86, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,248,230,${a})`;
          ctx.fill();
        });
      }

      function drawCity(t) {
        const w = canvas.width,
          h = canvas.height,
          hy = h * 0.88;
        ctx.fillStyle = "#000";
        buildings.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h + 2));
        windows.forEach((win) => {
          const fi = clamp((t - win.litAt) * 8, 0, 1);
          if (fi <= 0) return;
          let a = fi * 0.88;
          if (win.flicker) {
            win.flickerPhase += 0.08;
            a *= 0.6 + 0.4 * Math.sin(win.flickerPhase * 7.3);
          }
          ctx.fillStyle = `rgba(255,220,120,${a * 0.18})`;
          ctx.fillRect(
            win.x - win.w * 2,
            win.y - win.h * 2,
            win.w * 4,
            win.h * 4,
          );
          ctx.fillStyle = `rgba(255,225,130,${a})`;
          ctx.fillRect(win.x - win.w / 2, win.y - win.h / 2, win.w, win.h);
        });
        const gr = ctx.createLinearGradient(0, hy, 0, h);
        gr.addColorStop(
          0,
          `rgb(${lerp(14, 3, t)},${lerp(10, 2, t)},${lerp(10, 2, t)})`,
        );
        gr.addColorStop(1, "#000");
        ctx.fillStyle = gr;
        ctx.fillRect(0, hy, w, h - hy);
      }

      // ── SVPI FLYBY STATE ──
      // phases: sky-establish, ring-approach, fig-approach, hold, race-past, title-1, title-2, glitch, done
      let phase = "sky-establish";
      let phaseStart = 0;
      let powerImg = null,
        figImg = null;
      let assetsLoaded = false;

      // ease functions
      function easeOut(t) {
        return 1 - (1 - t) * (1 - t);
      }
      function easeIn(t) {
        return t * t;
      }
      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      let figSepX = 0;

      function getLogoSize(z, baseSize) {
        // z=0 tiny dot, z=0.85 fills about 60% of screen, z=1 = past camera
        const s = Math.pow(z, 2.2) * baseSize;

      }

      function drawSvpi(img, viewW, viewH, scale, offsetX, alpha) {
        if (!img || alpha <= 0) return;
        const w = canvas.width,
          h = canvas.height;
        const size = scale * h;
        const cx = w / 2 + offsetX;
        const cy = h * 0.44;
        const aspect = img.naturalWidth / img.naturalHeight;
        const iw = size * aspect,
          ih = size;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
        ctx.restore();
      }

      function setTitle(id, opacity, duration) {

      function runGlitch(cb) {

        let t = 0;
        const frames = [
          { op: 0.9, dur: 60 },

            () => {
              fi++;
              nextFrame();
            },
            frames[fi - 1]?.dur || frames[fi].dur,
          );
        }
        // also add some color shifting
        overlay.style.background = "#fff";
        nextFrame();
      }

      // ── MAIN LOOP ──
      let startTime = null;

      function frame(now) {
        if (!startTime) startTime = now;
        if (!assetsLoaded) {
          requestAnimationFrame(frame);
          return;
        }

        const elapsed = now - startTime;
        const w = canvas.width,
          h = canvas.height;

        // sky t always progresses over full sequence
        const totalDur =
          SKY_ESTABLISH + RING_APPROACH + FIG_CATCH + HOLD_DUR + RACE_PAST;
        skyT = clamp(elapsed / (totalDur * 1.4), 0, 1);

        ctx.clearRect(0, 0, w, h);

        // sky
        ctx.fillStyle = skyGradient(skyT);
        ctx.fillRect(0, 0, w, h);
        drawSun(skyT);
        drawStars(skyT, now);
        drawCity(skyT);

        if (phase === "sky-establish") {
          if (elapsed >= SKY_ESTABLISH) {
            phase = "ring-approach";
            phaseStart = now;
          }
        } else if (phase === "ring-approach") {
          const p = clamp((now - phaseStart) / RING_APPROACH, 0, 1);
          const ez = easeOut(p);
          // ring goes from 0.04 to 0.28 scale (still small — approaching)
          ringScale = lerp(0.04, 0.28, ez);
          ringZ = ez;
          drawSvpi(powerImg, w, h, ringScale, 0, 1);
          if (p >= 1) {
            phase = "fig-catch";
            phaseStart = now;
          }
        } else if (phase === "fig-catch") {
          const p = clamp((now - phaseStart) / FIG_CATCH, 0, 1);
          const ez = easeOut(p);
          // ring stays at 0.28, fig catches up from behind
          figScale = lerp(0.04, 0.26, ez);
          // ring slightly ahead — fig closes gap
          const ringOffX = lerp(0, 0, p); // ring stays centered
          const figOffX = lerp(-w * 0.08, 0, easeOut(p)); // fig comes from slightly behind/left
          drawSvpi(powerImg, w, h, 0.28, ringOffX, 1);
          drawSvpi(figImg, w, h, figScale, figOffX, ez);
          if (p >= 1) {
            phase = "hold";
            phaseStart = now;
          }
        } else if (phase === "hold") {
          const p = clamp((now - phaseStart) / HOLD_DUR, 0, 1);
          // both grow slowly to near-full during hold — 0.28 → 0.52
          const scale = lerp(0.28, 0.52, easeInOut(p));
          drawSvpi(powerImg, w, h, scale * 1.04, 0, 1); // ring very slightly larger
          drawSvpi(figImg, w, h, scale, 0, 1);
          if (p >= 1) {
            phase = "race-past";
            phaseStart = now;
          }
        } else if (phase === "race-past") {
          const p = clamp((now - phaseStart) / RACE_PAST, 0, 1);
          const ez = easeIn(p);
          // accelerate from 0.52 → 4.0 (blows past camera)
          const scale = lerp(0.52, 4.0, ez);
          const alpha = clamp(1 - (p - 0.7) * 3.3, 0, 1); // fade as they blow past
          drawSvpi(powerImg, w, h, scale * 1.04, 0, alpha);
          drawSvpi(figImg, w, h, scale, 0, alpha);
          if (p >= 1) {
            phase = "title-1";
            phaseStart = now;
            setTitle("t1", 1, 800);
          }
        } else if (phase === "title-1") {
          // sky still slowly darkening, city lights on, stars visible
          // THE ALLIANCE holds
          if (now - phaseStart >= TITLE1_DUR - 600) {
            // start crossfading to FOR THE FUTURE
            setTitle("t1", 0, 600);
            setTitle("t2", 1, 600);
          }
          if (now - phaseStart >= TITLE1_DUR) {
            phase = "title-2";
            phaseStart = now;
          }
        } else if (phase === "title-2") {
          if (now - phaseStart >= TITLE2_DUR - 500) {
            setTitle("t2", 0, 500);
            // fade sky to black
            ctx.fillStyle = `rgba(0,0,0,${clamp((now - phaseStart - (TITLE2_DUR - 500)) / 500, 0, 1)})`;
            ctx.fillRect(0, 0, w, h);
          }
          if (now - phaseStart >= TITLE2_DUR) {
            phase = "glitch";
            phaseStart = now;
            runGlitch(() => {
              setTimeout(() => {
                window.location.href = "/preamble/prologue.html";
              }, 200);
            });
          }
        } else if (phase === "glitch") {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, w, h);
        }

        if (phase !== "done") requestAnimationFrame(frame);
      }

      // ── INIT ──
      buildCity();
      Promise.all([
        svgToImage(POWER_SVG, "#000000"),
        svgToImage(FIG_SVG, "#000000"),
      ]).then(([p, f]) => {
        powerImg = p;
        figImg = f;
        assetsLoaded = true;
        requestAnimationFrame(frame);
      });
    </script>
  </body>
</html>
