<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PapaDomo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      /* Ambient background — drawn live from the same video's frames,
         so there is only ever ONE network fetch of the source file.
         This fills the viewport on wide desktop windows instead of
         showing flat black bars around a portrait-shot video. */
      #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: blur(48px) brightness(0.4) saturate(1.15);
        transform: scale(1.15);
      }

      /* The real video, always fully visible, never cropped */
      #fg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
      }

      /* Skip button — consistent top-right style across the intro sequence */
      #skip-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.55);
        border: 1.5px solid #00e5ff;
        color: #00e5ff;
        font-family: "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 7px 12px;
        border-radius: 3px;
        cursor: pointer;
        box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease;
      }
      #skip-btn:hover,
      #skip-btn:focus-visible {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
      }

      /* Tap-to-open prompt — a soft pulsing glow, no text, sits over
         the door once it's paused full-frame */
      #door-prompt {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #door-prompt.active {
        display: flex;
      }
      #door-prompt .glow-ring {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 2px solid rgba(255, 210, 130, 0.55);
        box-shadow:
          0 0 24px rgba(255, 200, 120, 0.35),
          inset 0 0 24px rgba(255, 200, 120, 0.2);
        animation: doorPulse 1.8s ease-in-out infinite;
      }
      @keyframes doorPulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="bg-canvas"></canvas>
      <video
        id="fg-video"
        src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/office.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
    </div>

    <div id="door-prompt"><div class="glow-ring"></div></div>

    <button id="skip-btn" title="Skip">skip</button>

    <script>
      const fg = document.getElementById("fg-video");
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      const skipBtn = document.getElementById("skip-btn");
      const doorPrompt = document.getElementById("door-prompt");

      // Timestamp (seconds) where the door reaches full frame.
      // Estimated from the source cut — nudge this after watching it live.
      const DOOR_PAUSE_TIME = 26;

      let doorTriggered = false; // has the pause-at-door fired yet
      let doorPaused = false; // are we currently sitting paused at the door
      let rafId = null;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function drawAmbient() {
        if (fg.readyState >= 2 && fg.videoWidth) {
          const vw = fg.videoWidth,
            vh = fg.videoHeight;
          const cw = canvas.width,
            ch = canvas.height;
          const scale = Math.max(cw / vw, ch / vh);
          const dw = vw * scale,
            dh = vh * scale;
          ctx.drawImage(fg, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        }
        rafId = requestAnimationFrame(drawAmbient);
      }
      rafId = requestAnimationFrame(drawAmbient);

      function goNext() {
        window.location.href = "/foundation.html";
      }

      fg.addEventListener("timeupdate", () => {
        if (!doorTriggered && fg.currentTime >= DOOR_PAUSE_TIME) {
          doorTriggered = true;
          doorPaused = true;
          fg.pause();
          doorPrompt.classList.add("active");
        }
      });

      function openDoor() {
        if (!doorPaused) return;
        doorPaused = false;
        doorPrompt.classList.remove("active");
        fg.play().catch(() => {});
      }
      doorPrompt.addEventListener("click", openDoor);

      skipBtn.addEventListener("click", goNext);

      fg.addEventListener("ended", goNext);
    </script>
  </body>
</html>
