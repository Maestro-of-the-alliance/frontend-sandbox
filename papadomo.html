<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAPADOMO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #papadomo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .rotate-screen {
      position: fixed;
      inset: 0;

      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #000;
      color: #d4af37;

      z-index: 9999;

      font-family: monospace;
      text-align: center;
      padding: 2rem;
    }

    .rotate-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: spinHint 2s ease-in-out infinite;
    }

    .rotate-text {
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    @keyframes spinHint {
      0% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(90deg);
      }

      100% {
        transform: rotate(90deg);
      }
    }

    @media (orientation: portrait) {
      .rotate-screen {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <div class="rotate-screen">
    <div class="rotate-icon">📱↻</div>
    <div class="rotate-text">
      ROTATE TO SEE THE WAY
    </div>
  </div>

  <video
    id="papadomo"
    src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/office.mp4"
    muted
    playsinline
    preload="auto"
  ></video>

  <script>
    const vid = document.getElementById("papadomo");

    function updateOrientation() {
      if (window.matchMedia("(orientation: landscape)").matches) {

        if (vid.paused) {
          vid.play().catch(() => {});
        }

      } else {

        vid.pause();
        vid.currentTime = 0;

      }
    }

    window.addEventListener("resize", updateOrientation);
    window.addEventListener("orientationchange", updateOrientation);

    updateOrientation();

    vid.addEventListener("ended", () => {
      window.location.href = "/preamble/prologue.html";
    });
  </script>

</body>
</html>
