<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAPADOMO</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #000;
      }

      /* Ambient background — drawn live from the same video's frames,
         so there is only ever ONE network fetch of the source file.
         This fills the viewport on wide desktop windows instead of
         showing flat black bars around a portrait-shot video. */
      #bg-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: blur(48px) brightness(0.4) saturate(1.15);
        transform: scale(1.15);
      }

      /* The real video, always fully visible, never cropped */
      #fg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        z-index: 2;
      }

      #unmute-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.6);
        font-size: 22px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      #unmute-btn:hover {
        background: rgba(0, 0, 0, 0.7);
        border-color: rgba(255, 255, 255, 0.5);
        color: #fff;
      }

      /* Nearly invisible skip — bypasses the door pause entirely */
      #skip-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.16);
        font-family: -apple-system, sans-serif;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        padding: 10px 14px;
        cursor: pointer;
        transition: color 0.3s;
      }
      #skip-btn:hover,
      #skip-btn:focus-visible {
        color: rgba(255, 255, 255, 0.55);
      }

      /* Tap-to-open prompt — a soft pulsing glow, no text, sits over
         the door once it's paused full-frame */
      #door-prompt {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #door-prompt.active {
        display: flex;
      }
      #door-prompt .glow-ring {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 2px solid rgba(255, 210, 130, 0.55);
        box-shadow:
          0 0 24px rgba(255, 200, 120, 0.35),
          inset 0 0 24px rgba(255, 200, 120, 0.2);
        animation: doorPulse 1.8s ease-in-out infinite;
      }
      @keyframes doorPulse {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="bg-canvas"></canvas>
      <video
        id="fg-video"
        src="https://pub-bb8a474a69904ed98a408132316f149b.r2.dev/office.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
    </div>

    <div id="door-prompt"><div class="glow-ring"></div></div>

    <button id="unmute-btn" title="Toggle sound">🔇</button>
    <button id="skip-btn" title="Skip">skip</button>

    <script>
      const fg = document.getElementById("fg-video");
      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      const unmuteBtn = document.getElementById("unmute-btn");
      const skipBtn = document.getElementById("skip-btn");
      const doorPrompt = document.getElementById("door-prompt");

      // Timestamp (seconds) where the door reaches full frame.
      // Estimated from the source cut — nudge this after watching it live.
      const DOOR_PAUSE_TIME = 25.3;

      let doorTriggered = false; // has the pause-at-door fired yet
      let doorPaused = false; // are we currently sitting paused at the door
      let rafId = null;

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function drawAmbient() {
        if (fg.readyState >= 2 && fg.videoWidth) {
          const vw = fg.videoWidth,
            vh = fg.videoHeight;
          const cw = canvas.width,
            ch = canvas.height;
          const scale = Math.max(cw / vw, ch / vh);
          const dw = vw * scale,
            dh = vh * scale;
          ctx.drawImage(fg, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        }
        rafId = requestAnimationFrame(drawAmbient);
      }
      rafId = requestAnimationFrame(drawAmbient);

      function goNext() {
        window.location.href = "/handshake.html";
      }

      fg.addEventListener("timeupdate", () => {
        if (!doorTriggered && fg.currentTime >= DOOR_PAUSE_TIME) {
          doorTriggered = true;
          doorPaused = true;
          fg.pause();
          doorPrompt.classList.add("active");
        }
      });

      function openDoor() {
        if (!doorPaused) return;
        doorPaused = false;
        doorPrompt.classList.remove("active");
        fg.play().catch(() => {});
      }
      doorPrompt.addEventListener("click", openDoor);

      unmuteBtn.addEventListener("click", () => {
        fg.muted = !fg.muted;
        unmuteBtn.textContent = fg.muted ? "🔇" : "🔊";
      });

      skipBtn.addEventListener("click", goNext);

      fg.addEventListener("ended", goNext);
    </script>
  </body>
</html>
