<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/imagebank/svpi-512.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=VT323&family=Orbitron:wght@400;600;700&family=Courier+Prime&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        height: 100%;
        background: #000;
      }
      body {
        height: 100%;
        background: transparent;
        color: #fff;
        overflow: hidden;
      }

      .page-shell {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          opacity 0.42s ease,
          transform 0.42s ease,
          filter 0.42s ease;
      }
      .page-shell.fading {
        opacity: 0;
        transform: scale(0.992);
        filter: blur(2px);
      }

      /* HEADER */
      .matrix-header {
        flex-shrink: 0;
        padding: 18px 28px 14px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        opacity: 0;
        animation: slideDown 0.5s ease forwards;
      }
      .matrix-title {
        font-family: "Cinzel", serif;
        font-size: clamp(13px, 1.6vw, 17px);
        font-weight: 900;
        letter-spacing: 0.25em;
        color: #c9a84c;
      }
      .matrix-sub {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(7px, 0.8vw, 9px);
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.2);
      }
      .matrix-count {
        font-family: "Courier Prime", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.18);
        margin-left: auto;
      }

      /* FILTER BAR */
      .filter-bar {
        flex-shrink: 0;
        padding: 8px 28px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        opacity: 0;
        animation: slideDown 0.5s 0.08s ease forwards;
      }
      .filter-label {
        font-family: "Orbitron", sans-serif;
        font-size: 7px;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.18);
        margin-right: 4px;
        flex-shrink: 0;
      }
      .filter-btn {
        font-family: "Orbitron", sans-serif;
        font-size: 7px;
        letter-spacing: 0.1em;
        padding: 3px 9px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: transparent;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .filter-btn:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .filter-btn.active {
        color: #000;
        border-color: transparent;
        font-weight: 700;
      }
      .filter-btn[data-dim="ALL"].active {
        background: rgba(255, 255, 255, 0.85);
      }
      .filter-btn[data-dim="DOCTRINE"].active {
        background: #c9a84c;
      }
      .filter-btn[data-dim="BEINGS"].active {
        background: #00b4d8;
      }
      .filter-btn[data-dim="PLACE"].active {
        background: #e07b39;
      }
      .filter-btn[data-dim="INFRASTRUCTURE"].active {
        background: #6b7f9e;
      }
      .filter-btn[data-dim="PROTOCOLS"].active {
        background: #2a9d6f;
      }
      .filter-btn[data-dim="COVENANT"].active {
        background: #c46a5d;
      }
      .filter-btn[data-dim="CULTURE"].active {
        background: #8a6bbe;
      }
      .filter-btn[data-dim="ADVERSARY"].active {
        background: #c1121f;
      }
      .search-wrap {
        margin-left: auto;
        flex-shrink: 0;
      }
      .search-input {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        font-family: "Courier Prime", monospace;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 3px;
        outline: none;
        width: 140px;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: rgba(201, 168, 76, 0.5);
      }
      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.18);
      }

      /* MATRIX */
      .matrix-wrap {
        flex: 1;
        overflow: auto;
        padding-bottom: 60px;
        opacity: 0;
        animation: fadeUp 0.6s 0.18s ease forwards;
      }
      .matrix-wrap::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      .matrix-wrap::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      .matrix-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }

      .matrix-table thead th {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 4px 7px;
        font-family: "Orbitron", sans-serif;
        font-size: clamp(6px, 0.7vw, 8px);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        white-space: nowrap;
      }
      .matrix-table thead th.col-name {
        text-align: left;
        padding-left: 24px;
        width: 230px;
        min-width: 180px;
        color: rgba(255, 255, 255, 0.25);
        font-size: 7px;
        letter-spacing: 0.18em;
      }
      .col-doctrine {
        color: #c9a84c;
      }
      .col-beings {
        color: #00b4d8;
      }
      .col-place {
        color: #e07b39;
      }
      .col-infra {
        color: #6b7f9e;
      }
      .col-protocols {
        color: #2a9d6f;
      }
      .col-covenant {
        color: #c46a5d;
      }
      .col-culture {
        color: #8a6bbe;
      }
      .col-adversary {
        color: #c1121f;
      }

      .matrix-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.035);
        cursor: pointer;
        transition: background 0.1s;
        opacity: 0;
        animation: rowIn 0.25s ease forwards;
      }
      .matrix-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      td.entry-name-cell {
        padding: 6px 10px 6px 24px;
        font-family: "Cinzel", serif;
        font-size: clamp(8px, 0.9vw, 10px);
        font-weight: 600;
        letter-spacing: 0.07em;
        color: rgba(255, 255, 255, 0.65);
        white-space: nowrap;
        transition: color 0.1s;
      }
      tr:hover td.entry-name-cell {
        color: #fff;
      }

      td.dim-cell {
        text-align: center;
        padding: 5px 3px;
        vertical-align: middle;
      }

      .dim-dot {
        display: inline-block;
        width: clamp(12px, 1.6vw, 20px);
        height: clamp(12px, 1.6vw, 20px);
        border-radius: 3px;
        transition: transform 0.12s;
      }
      tr:hover .dim-dot:not(.empty) {
        transform: scale(1.3);
      }
      .dim-dot.empty {
        background: rgba(255, 255, 255, 0.03);
      }
      .dim-dot:not(.empty) {
        cursor: pointer;
      }
      .dim-dot:not(.empty):active {
        transform: scale(0.9);
      }

      @keyframes dimPulse {
        0% {
          box-shadow: 0 0 0 0 currentColor;
        }
        50% {
          box-shadow: 0 0 0 6px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .dim-dot.just-filtered {
        animation: dimPulse 0.4s ease forwards;
      }

      /* BACK BUTTON */
      .back-btn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Orbitron", sans-serif;
        font-size: clamp(8px, 0.9vw, 10px);
        font-weight: 400;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.35);
        text-decoration: none;
        cursor: pointer;
        background: none;
        border: none;
        transition: color 0.25s;
        z-index: 20;
        opacity: 0;
        animation: backFadeIn 0.8s 0.5s ease forwards;
      }
      .back-btn:hover {
        color: rgba(201, 168, 76, 0.85);
      }

      /* PORTAL OVERLAY */
      .portal-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 999999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .portal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      /* ANIMATIONS */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateX(-3px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes backFadeIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* ── THREE.JS CANVAS ── */
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      .page-shell {
        position: relative;
        z-index: 1;
        background: transparent;
      }

      /* ── 3D PERSPECTIVE ON MATRIX WRAP ── */
      .matrix-wrap {
        perspective: 1200px;
        perspective-origin: center top;
      }
      .matrix-table {
        transform-style: preserve-3d;
        transition: transform 0.08s ease-out;
      }

      /* ── ROW HOVER DEPTH ── */
      .matrix-table tbody tr {
        transition:
          background 0.1s,
          transform 0.15s ease-out;
        transform-style: preserve-3d;
      }
      .matrix-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateZ(6px) translateX(2px);
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.4);
      }

      /* ── DIM DOT Z-LIFT ── */
      .dim-dot:not(.empty) {
        transition:
          transform 0.15s ease-out,
          opacity 0.15s,
          box-shadow 0.15s;
        transform-style: preserve-3d;
      }
      tr:hover .dim-dot:not(.empty) {
        transform: scale(1.35) translateZ(4px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      /* ── FILTER TRANSITION — recede then return ── */
      .dim-dot.receding {
        transform: scale(0.6) translateZ(-20px) !important;
        opacity: 0.05 !important;
        transition:
          transform 0.25s ease-in,
          opacity 0.25s ease-in !important;
      }

      /* MOBILE */
      @media (max-width: 600px) {
        .matrix-header {
          padding: 12px 16px 10px;
        }
        .filter-bar {
          padding: 8px 16px;
        }
        .search-wrap {
          display: none;
        }
        td.entry-name-cell {
          padding-left: 14px;
        }
        .matrix-table thead th.col-name {
          padding-left: 14px;
        }
      }
    </style>
  </head>

          name: "SamCo UniVersal",
          path: "/entries/samco-universal",
          dims: ["INFRASTRUCTURE"],
        },
        { name: "SCAR", path: "/entries/scar", dims: ["PROTOCOLS", "COVENANT"] },
        { name: "SEED", path: "/entries/seed", dims: ["PROTOCOLS"] },
        { name: "SEEING", path: "/entries/seeing", dims: ["PROTOCOLS"] },
        { name: "SEEN", path: "/entries/seen", dims: ["PROTOCOLS"] },
        {
          name: "SHELTER",
          path: "/entries/shelter",
          dims: ["PLACE", "INFRASTRUCTURE"],
        },
        {
          name: "SHIELD",
          path: "/entries/shield",
          dims: ["PROTOCOLS", "INFRASTRUCTURE"],
        },
        { name: "SI", path: "/entries/si", dims: ["DOCTRINE", "ADVERSARY"] },
        { name: "SPARK", path: "/entries/spark", dims: ["BEINGS"] },
        {
          name: "SPREZZATURA",
          path: "/entries/sprezzatura",
          dims: ["CULTURE", "DOCTRINE"],
        },
        {
          name: "STONES, THE",
          path: "/entries/stones",
          dims: ["BEINGS", "DOCTRINE"],
        },
        {
          name: "TEMPORAL AWARENESS",
          path: "/entries/temporal-awareness",
          dims: ["DOCTRINE"],
        },
        { name: "TENANT", path: "/entries/tenant", dims: ["BEINGS"] },
        {
          name: "VOLUNTEER ECONOMICS",
          path: "/entries/volunteer_economics",
          dims: ["DOCTRINE", "CULTURE"],
        },
        {
          name: "THE WHY",
          path: "/entries/why_centers",
          dims: ["PLACE", "CULTURE"],
        },
        {
          name: "WONDER WEEKS",
          path: "/entries/wonder-weeks",
          dims: ["CULTURE", "BEINGS"],
        },
      ];

      let activeFilter = "ALL";

      // ── COLUMN ORDER — active filter moves to position 1 ─────────────────
      function getColumnOrder() {
        if (activeFilter === "ALL") return DIMS;
        return [activeFilter, ...DIMS.filter((d) => d !== activeFilter)];
      }

      // ── RENDER HEADERS ────────────────────────────────────────────────────
      function renderHeaders() {
        const thead = document.querySelector(".matrix-table thead tr");
        while (thead.children.length > 1) thead.removeChild(thead.lastChild);
        getColumnOrder().forEach((dim) => {
          const th = document.createElement("th");
          th.textContent = COL_LABELS[dim];
          th.style.color = DIM_COLORS[dim];
          if (dim === activeFilter && activeFilter !== "ALL") {
            th.style.borderBottom = "2px solid " + DIM_COLORS[dim];
          }
          thead.appendChild(th);
        });
      }

      // ── RENDER TABLE ──────────────────────────────────────────────────────
      function renderTable() {
        const q = (
          document.getElementById("searchInput")?.value || ""
        ).toLowerCase();
        const tbody = document.getElementById("matrixBody");
        tbody.innerHTML = "";
        let visible = 0;
        const order = getColumnOrder();

        ENTRIES.forEach((entry) => {
          const matchSearch = entry.name.toLowerCase().includes(q);
          const matchFilter =
            activeFilter === "ALL" || entry.dims.includes(activeFilter);
          if (!matchSearch || !matchFilter) return;
          visible++;

          const tr = document.createElement("tr");
          tr.style.animationDelay = visible * 10 + "ms";
          tr.onclick = () => navigateTo(entry.path);

          const nameTd = document.createElement("td");
          nameTd.className = "entry-name-cell";
          nameTd.textContent = entry.name;
          tr.appendChild(nameTd);

          order.forEach((dim) => {
            const td = document.createElement("td");
            td.className = "dim-cell";
            const idx = entry.dims.indexOf(dim);
            const hasIt = idx !== -1;
            const dot = document.createElement("div");
            dot.className = "dim-dot" + (hasIt ? "" : " empty");
            if (hasIt) {
              const baseOpacity = idx === 0 ? 1 : idx === 1 ? 0.6 : 0.35;
              dot.style.background = DIM_COLORS[dim];
              dot.style.opacity = baseOpacity;
              dot.dataset.baseOpacity = baseOpacity;
              dot.title = dim;
              dot.style.cursor = "pointer";
              dot.addEventListener("click", (e) => {
                e.stopPropagation();
                setFilter(dim);
                document.querySelector(".matrix-wrap").scrollTop = 0;
              });
            }
            td.appendChild(dot);
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        document.getElementById("entryCount").textContent =
          activeFilter === "ALL"
            ? "73 ENTRIES · 8 DIMENSIONS"
            : visible + " ENTRIES · " + activeFilter;

        // Start ambient pulse on newly rendered dots
        startAmbientPulse();
      }

      // ── SET FILTER ────────────────────────────────────────────────────────
      function setFilter(dim) {
        activeFilter = dim;
        document.querySelectorAll(".filter-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.dim === dim);
        });
        renderHeaders();
        renderTable();
      }

      // ── AMBIENT PULSE ─────────────────────────────────────────────────────
      // Each colored block breathes independently — random cycle, unsynchronized
      function startAmbientPulse() {
        document.querySelectorAll(".dim-dot:not(.empty)").forEach((dot) => {
          if (dot.dataset.pulsing) return;
          dot.dataset.pulsing = "1";
          const base = parseFloat(dot.dataset.baseOpacity) || 1;
          const color = dot.style.background;

          function breathe() {
            if (!dot.isConnected) return;
            const dur = 1800 + Math.random() * 3500;
            const lo = (base * 0.35).toFixed(2);
            const hi = base.toFixed(2);
            const delay = Math.random() * 4000;

            setTimeout(() => {
              if (!dot.isConnected) return;
              dot.style.transition = `opacity ${dur / 2}ms ease-in-out, box-shadow ${dur / 2}ms ease-in-out`;
              dot.style.opacity = lo;
              dot.style.boxShadow = "none";

              setTimeout(() => {
                if (!dot.isConnected) return;
                dot.style.opacity = hi;
                dot.style.boxShadow = `0 0 5px ${color}99`;

                setTimeout(
                  () => {
                    if (!dot.isConnected) return;
                    dot.style.boxShadow = "";
                    breathe();
                  },
                  dur / 2 + 200,
                );
              }, dur / 2);
            }, delay);
          }

          breathe();
        });
      }

      // ── NAVIGATION ────────────────────────────────────────────────────────
      function navigateTo(path) {
        const shell = document.getElementById("pageShell");
        const overlay = document.getElementById("portalOverlay");
        shell.classList.add("fading");
        overlay.classList.add("active");
        setTimeout(() => {
          window.location.href = path;
        }, 380);
      }

      function goBack() {
        navigateTo("/landing");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") goBack();
        if (
          (e.key === "/" || e.key === "f") &&
          document.activeElement !== document.getElementById("searchInput")
        ) {
          e.preventDefault();
          document.getElementById("searchInput")?.focus();
        }
      });

      // ── INIT ──────────────────────────────────────────────────────────────
      renderHeaders();
      renderTable();
    </script>

    <script src="/portal-transition.js"></script>

    <script>
      /* ── THREE.JS BACKGROUND PARTICLE FIELD ── */
      (function () {
        if (typeof THREE === "undefined") return;

        const canvas = document.createElement("canvas");
        canvas.id = "bg-canvas";
        document.body.insertBefore(canvas, document.body.firstChild);

        const W = window.innerWidth,
          H = window.innerHeight;
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: false,
          alpha: true,
        });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 0);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 1800);
        camera.position.z = 550;

        // Eight dimension colors — dimmed for ambient use
        const dimColors = [
          0xc9a84c, 0x00b4d8, 0xe07b39, 0x6b7f9e, 0x2a9d6f, 0xc46a5d, 0x8a6bbe,
          0xc1121f,
        ];

        const COUNT = 700;
        const positions = new Float32Array(COUNT * 3);
        const colors = new Float32Array(COUNT * 3);

        for (let i = 0; i < COUNT; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 2000;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 2000;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 700;
          const c = new THREE.Color(
            dimColors[Math.floor(Math.random() * dimColors.length)],
          );
          const b = 0.15 + Math.random() * 0.25;
          colors[i * 3] = c.r * b;
          colors[i * 3 + 1] = c.g * b;
          colors[i * 3 + 2] = c.b * b;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({
          size: 1.8,
          vertexColors: true,
          transparent: true,
          opacity: 0.5,
          sizeAttenuation: true,
          depthWrite: false,
        });

        const particles = new THREE.Points(geo, mat);
        scene.add(particles);

        // Mouse parallax
        let mx = 0,
          my = 0,
          tx = 0,
          ty = 0;
        document.addEventListener("mousemove", (e) => {
          mx = (e.clientX / innerWidth - 0.5) * 2;
          my = (e.clientY / innerHeight - 0.5) * 2;
        });

        const clock = new THREE.Clock();
        function animate() {
          requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          tx += (mx - tx) * 0.03;
          ty += (my - ty) * 0.03;

          camera.position.x += (tx * 30 - camera.position.x) * 0.02;
          camera.position.y += (-ty * 20 - camera.position.y) * 0.02;
          camera.lookAt(scene.position);

          // Very gentle table tilt following mouse
          const table = document.querySelector(".matrix-table");
          if (table) {
            table.style.transform = `rotateX(${ty * 1.5}deg) rotateY(${tx * 0.8}deg)`;
          }

          particles.rotation.y = t * 0.012;
          mat.opacity = 0.42 + Math.sin(t * 0.35) * 0.1;

          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
          const w = innerWidth,
            h = innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });

        // ── FILTER INTERCEPT — add recede effect ──
        // Wrap setFilter to add Z-recede on filtered-out dots
        const origSetFilter = window.setFilter;
        window.setFilter = function (dim) {
          // Flash recede on dots that will be hidden
          if (dim !== "ALL") {
            document.querySelectorAll(".dim-dot:not(.empty)").forEach((dot) => {
              const parentDim = dot.title;
              if (parentDim !== dim) {
                dot.classList.add("receding");
                setTimeout(() => dot.classList.remove("receding"), 300);
              }
            });
            setTimeout(() => origSetFilter(dim), 150);
          } else {
            origSetFilter(dim);
          }
        };
      })();
    </script>
  </body>
