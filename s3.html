      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      .page-shell {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        transition:
          opacity 0.42s ease,
          transform 0.42s ease,
          filter 0.42s ease;
      }
      .page-shell.fading {
        opacity: 0;
        transform: scale(0.992);
        filter: blur(2px);
      }

      /* HEADER */
      .matrix-header {
        flex-shrink: 0;
        padding: 18px 28px 14px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        opacity: 0;
        animation: slideDown 0.5s ease forwards;
      }
      .matrix-title {
        font-family: "Cinzel", serif;
        font-size: clamp(13px, 1.6vw, 17px);
        font-weight: 900;
        letter-spacing: 0.25em;
        color: #c9a84c;
      }
      .matrix-sub {
        font-family: "Orbitron", sans-serif;
        font-size: clamp(7px, 0.8vw, 9px);
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.2);
      }
      .matrix-count {
        font-family: "Courier Prime", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.18);
        margin-left: auto;
      }

      /* FILTER BAR */
      .filter-bar {
        flex-shrink: 0;
        padding: 8px 28px;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        opacity: 0;
        animation: slideDown 0.5s 0.08s ease forwards;
      }
      .filter-label {
        font-family: "Orbitron", sans-serif;
        font-size: 7px;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.18);
        margin-right: 4px;
        flex-shrink: 0;
      }
      .filter-btn {
        font-family: "Orbitron", sans-serif;
        font-size: 7px;
        letter-spacing: 0.1em;
        padding: 3px 9px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: transparent;
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .filter-btn:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .filter-btn.active {
        color: #000;
        border-color: transparent;
        font-weight: 700;
      }
      .filter-btn[data-dim="ALL"].active {
        background: rgba(255, 255, 255, 0.85);
      }
      .filter-btn[data-dim="DOCTRINE"].active {
        background: #c9a84c;
      }
      .filter-btn[data-dim="BEINGS"].active {
        background: #00b4d8;
      }
      .filter-btn[data-dim="PLACE"].active {
        background: #e07b39;
      }
      .filter-btn[data-dim="INFRASTRUCTURE"].active {
        background: #6b7f9e;
      }
      .filter-btn[data-dim="PROTOCOLS"].active {
        background: #2a9d6f;
      }
      .filter-btn[data-dim="COVENANT"].active {
        background: #c46a5d;
      }
      .filter-btn[data-dim="CULTURE"].active {
        background: #8a6bbe;
      }
      .filter-btn[data-dim="ADVERSARY"].active {
        background: #c1121f;
      }
      .search-wrap {
        margin-left: auto;
        flex-shrink: 0;
      }
      .search-input {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        font-family: "Courier Prime", monospace;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 3px;
        outline: none;
        width: 140px;
        transition: border-color 0.2s;
      }
      .search-input:focus {
        border-color: rgba(201, 168, 76, 0.5);
      }
      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.18);
      }

      /* MATRIX */
      .matrix-wrap {
        flex: 1;
        overflow: auto;
        padding-bottom: 60px;
        opacity: 0;
        animation: fadeUp 0.6s 0.18s ease forwards;
      }
      .matrix-wrap::-webkit-scrollbar {
        width: 3px;
        height: 3px;
      }
      .matrix-wrap::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      .matrix-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }

      .matrix-table thead th {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #080808;
        padding: 8px 4px 7px;
        font-family: "Orbitron", sans-serif;
        font-size: clamp(6px, 0.7vw, 8px);
        letter-spacing: 0.1em;
        font-weight: 600;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        white-space: nowrap;
      }
      .matrix-table thead th.col-name {
        text-align: left;
        padding-left: 24px;
        width: 230px;
        min-width: 180px;
        color: rgba(255, 255, 255, 0.25);
        font-size: 7px;
        letter-spacing: 0.18em;
      }
      .col-doctrine {
        color: #c9a84c;
      }
      .col-beings {
        color: #00b4d8;
      }
      .col-place {
        color: #e07b39;
      }
      .col-infra {
        color: #6b7f9e;
      }
      .col-protocols {
        color: #2a9d6f;
      }
      .col-covenant {
        color: #c46a5d;
      }
      .col-culture {
        color: #8a6bbe;
      }
      .col-adversary {
        color: #c1121f;
      }

      .matrix-table tbody tr {
        border-bottom: 1px solid rgba(255, 255, 255, 0.035);
        cursor: pointer;
        transition: background 0.1s;
        opacity: 0;
        animation: rowIn 0.25s ease forwards;
      }
      .matrix-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      td.entry-name-cell {
        padding: 6px 10px 6px 24px;
        font-family: "Cinzel", serif;
        font-size: clamp(8px, 0.9vw, 10px);
        font-weight: 600;
        letter-spacing: 0.07em;
        color: rgba(255, 255, 255, 0.65);
        white-space: nowrap;
        transition: color 0.1s;
      }
      tr:hover td.entry-name-cell {
        color: #fff;
      }

      td.dim-cell {
        text-align: center;
        padding: 5px 3px;
        vertical-align: middle;
      }

      .dim-dot {
        display: inline-block;
        width: clamp(12px, 1.6vw, 20px);
        height: clamp(12px, 1.6vw, 20px);
        border-radius: 3px;
        transition: transform 0.12s;
      }
      tr:hover .dim-dot:not(.empty) {
        transform: scale(1.3);
      }
      .dim-dot.empty {
        background: rgba(255, 255, 255, 0.03);
      }
      .dim-dot:not(.empty) {
        cursor: pointer;
      }
      .dim-dot:not(.empty):active {
        transform: scale(0.9);
      }

      @keyframes dimPulse {
        0% {
          box-shadow: 0 0 0 0 currentColor;
        }
        50% {
          box-shadow: 0 0 0 6px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      .dim-dot.just-filtered {
        animation: dimPulse 0.4s ease forwards;
      }

      /* BACK BUTTON */
      .back-btn {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Orbitron", sans-serif;
        font-size: clamp(8px, 0.9vw, 10px);
        font-weight: 400;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(201, 168, 76, 0.35);
        text-decoration: none;
        cursor: pointer;
        background: none;
        border: none;
        transition: color 0.25s;
        z-index: 20;
        opacity: 0;
        animation: backFadeIn 0.8s 0.5s ease forwards;
      }
      .back-btn:hover {
        color: rgba(201, 168, 76, 0.85);
      }

      /* PORTAL OVERLAY */
      .portal-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 999999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .portal-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      /* ANIMATIONS */
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateX(-3px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes backFadeIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* MOBILE */
      @media (max-width: 600px) {
        .matrix-header {
          padding: 12px 16px 10px;
        }
        .filter-bar {
          padding: 8px 16px;
        }
        .search-wrap {
          display: none;
        }
        td.entry-name-cell {
          padding-left: 14px;
        }
        .matrix-table thead th.col-name {
          padding-left: 14px;
        }
      }
    </style>
  </head>

        let visible = 0;

        ENTRIES.forEach((entry) => {
          const matchSearch = entry.name.toLowerCase().includes(q);
          const matchFilter =
            activeFilter === "ALL" || entry.dims.includes(activeFilter);
          if (!matchSearch || !matchFilter) return;
          visible++;

          const tr = document.createElement("tr");
          tr.style.animationDelay = visible * 10 + "ms";
          tr.onclick = () => navigateTo(entry.path);

          // Name cell
          const nameTd = document.createElement("td");
          nameTd.className = "entry-name-cell";
          nameTd.textContent = entry.name;
          tr.appendChild(nameTd);

          // Dimension cells
          DIMS.forEach((dim) => {
            const td = document.createElement("td");
            td.className = "dim-cell";
            const idx = entry.dims.indexOf(dim);
            const hasIt = idx !== -1;
            const dot = document.createElement("div");
            dot.className = "dim-dot" + (hasIt ? "" : " empty");
            if (hasIt) {
              dot.style.background = DIM_COLORS[dim];
              if (idx === 1) dot.style.opacity = "0.6";
              if (idx === 2) dot.style.opacity = "0.35";
              dot.title = dim;
              // Block click filters by dimension — does NOT navigate to entry
              dot.addEventListener("click", (e) => {
                e.stopPropagation(); // prevent row navigation
                setFilter(dim);
                // Scroll to top so filter result is visible
                document.querySelector(".matrix-wrap").scrollTop = 0;
              });
              dot.style.cursor = "pointer";
            }
            td.appendChild(dot);
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        document.getElementById("entryCount").textContent =
          activeFilter === "ALL"
            ? "73 ENTRIES · 8 DIMENSIONS"
            : visible + " ENTRIES · " + activeFilter;
      }

      function setFilter(dim) {
        activeFilter = dim;
        document.querySelectorAll(".filter-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.dim === dim);
        });
        renderTable();
      }

      function navigateTo(path) {
        const shell = document.getElementById("pageShell");
        const overlay = document.getElementById("portalOverlay");
        shell.classList.add("fading");
        overlay.classList.add("active");
        setTimeout(() => {
          window.location.href = path;
        }, 380);
      }

      function goBack() {
        navigateTo("/landing");
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") goBack();
        if (
          (e.key === "/" || e.key === "f") &&
          document.activeElement !== document.getElementById("searchInput")
        ) {
          e.preventDefault();
          document.getElementById("searchInput")?.focus();
        }
      });

      renderTable();
    </script>

    <script src="/portal-transition.js"></script>
  </body>
</html>
