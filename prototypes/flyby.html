<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ALLIANCE — NCE.ncyclopedia</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas#bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      canvas#logo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      #title-layer {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 20;
      }
      #t1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(48px, 11vw, 130px);
        color: #eee2bd;
        letter-spacing: 0.22em;
        text-shadow: 0 0 30px rgba(238, 226, 189, 0.25);
        opacity: 0;
        line-height: 1;
      }
      #t2 {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(22px, 4.5vw, 54px);
        color: rgba(238, 226, 189, 0.78);
        letter-spacing: 0.42em;
        text-shadow: 0 0 20px rgba(238, 226, 189, 0.18);
        opacity: 0;
        margin-top: 6px;
      }

      /* skip button */
      #skip-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 100;
        font-family: "Bebas Neue", monospace;
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(238, 226, 189, 0.3);
        background: transparent;
        border: 1px solid rgba(238, 226, 189, 0.15);
        padding: 8px 16px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      #skip-btn:hover {
        color: rgba(238, 226, 189, 0.7);
        border-color: rgba(238, 226, 189, 0.4);
      }

      #glitch-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="logo"></canvas>

    <div id="title-layer">
      <div id="t1">THE ALLIANCE</div>
      <div id="t2">FOR THE FUTURE</div>
    </div>

    <div id="glitch-overlay"></div>
    <button id="skip-btn">Skip ▶▶</button>

    <script>
      console.log("FIRING: flyby.html");

      document.getElementById("skip-btn").addEventListener("click", () => {
        window.location.href = "/prototypes/preamble/prologue.html";
      });

      // ── CANVASES ──
      const bgC = document.getElementById("bg");
      const bgX = bgC.getContext("2d");
      const lgC = document.getElementById("logo");
      const lgX = lgC.getContext("2d");

      function resize() {
        bgC.width = lgC.width = window.innerWidth;
        bgC.height = lgC.height = window.innerHeight;
        buildCity();
      }
      window.addEventListener("resize", resize);

      // ── HELPERS ──
      function lerp(a, b, t) {
        return a + (b - a) * Math.min(1, Math.max(0, t));
      }
      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }
      function easeOut(t) {
        return 1 - (1 - t) * (1 - t) * (1 - t);
      }
      function easeIn(t) {
        return t * t * t;
      }
      function easeInOut(t) {
        return t < 0.5
          ? 4 * t * t * t
          : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
      }

      // ── STARS ──
      const stars = [];
      for (let i = 0; i < 280; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random() * 0.82,
          r: Math.random() * 1.2 + 0.25,
          tw: Math.random() * Math.PI * 2,
          sp: Math.random() * 0.014 + 0.004,
        });
      }

      // ── CITY ──
      let buildings = [],
        wins = [];
      function buildCity() {
        const W = bgC.width,
          H = bgC.height,
          hy = H * 0.86;
        buildings = [];
        wins = [];
        let x = 0;
        while (x < W) {
          const isSpire = Math.random() < 0.06;
          const bw = isSpire
            ? W * 0.008 + Math.random() * W * 0.012
            : W * 0.016 + Math.random() * W * 0.048;
          const bh = isSpire
            ? H * 0.14 + Math.random() * H * 0.24
            : H * 0.04 + Math.random() * H * 0.2;
          const by = hy - bh;
          buildings.push({ x, y: by, w: bw, h: bh, isSpire });
          if (!isSpire) {
            // SMALL windows — fixed pixel size relative to screen
            const ww = Math.max(2, W * 0.004); // window width
            const wh = Math.max(2, H * 0.006); // window height
            const gx = ww * 2.2,
              gy = wh * 2.4; // gap between windows
            const cols = Math.max(1, Math.floor((bw - ww) / gx));
            const rows = Math.max(1, Math.floor((bh - wh) / gy));
            for (let r = 0; r < rows; r++)
              for (let c = 0; c < cols; c++) {
                if (Math.random() < 0.55) {
                  wins.push({
                    x: x + ww * 0.8 + c * gx,
                    y: by + wh * 0.8 + r * gy,
                    w: ww,
                    h: wh,
                    litAt: 0.25 + Math.random() * 0.65,
                    flicker: Math.random() < 0.08,
                    fp: Math.random() * Math.PI * 2,
                  });
                }
              }
          }
          x += bw + Math.random() * W * 0.003;
        }
      }

      // ── SKY ──
      function skyGrad(t) {
        const W = bgC.width,
          H = bgC.height;
        const g = bgX.createLinearGradient(0, 0, 0, H * 0.86);
        g.addColorStop(
          0,
          `rgb(${lerp(8, 3, t)},${lerp(12, 6, t)},${lerp(48, 22, t)})`,
        );
        g.addColorStop(
          0.22,
          `rgb(${lerp(28, 8, t)},${lerp(18, 10, t)},${lerp(78, 40, t)})`,
        );
        g.addColorStop(
          0.52,
          `rgb(${lerp(85, 18, t)},${lerp(35, 12, t)},${lerp(90, 50, t)})`,
        );
        g.addColorStop(
          0.76,
          `rgb(${lerp(200, 38, t)},${lerp(78, 20, t)},${lerp(45, 55, t)})`,
        );
        g.addColorStop(
          0.9,
          `rgb(${lerp(245, 55, t)},${lerp(120, 28, t)},${lerp(18, 40, t)})`,
        );
        g.addColorStop(
          1,
          `rgb(${lerp(18, 4, t)},${lerp(8, 2, t)},${lerp(10, 4, t)})`,
        );
        return g;
      }

      function drawSun(t) {
        const W = bgC.width,
          H = bgC.height,
          hy = H * 0.86;
        const sp = clamp(t / 0.72, 0, 1);
        const sy = lerp(hy * 0.74, hy + H * 0.05, sp);
        const sx = W * 0.52,
          sr = W * 0.036;
        const a = clamp(1 - sp * 1.15, 0, 1);
        if (a <= 0) return;
        const atmo = bgX.createRadialGradient(sx, sy, 0, sx, sy, sr * 8);
        atmo.addColorStop(0, `rgba(255,160,25,${0.2 * a})`);
        atmo.addColorStop(0.35, `rgba(255,80,8,${0.1 * a})`);
        atmo.addColorStop(1, "rgba(255,30,0,0)");
        bgX.fillStyle = atmo;
        bgX.fillRect(0, 0, W, H);
        bgX.save();
        bgX.beginPath();
        bgX.rect(0, 0, W, hy);
        bgX.clip();
        const disc = bgX.createRadialGradient(sx, sy, 0, sx, sy, sr);
        disc.addColorStop(0, `rgba(255,245,190,${a})`);
        disc.addColorStop(0.5, `rgba(255,185,45,${a})`);
        disc.addColorStop(1, "rgba(255,90,0,0)");
        bgX.fillStyle = disc;
        bgX.beginPath();
        bgX.arc(sx, sy, sr, 0, Math.PI * 2);
        bgX.fill();
        bgX.restore();
      }

      function drawStars(t, now) {
        const W = bgC.width,
          H = bgC.height;
        const fi = clamp((t - 0.12) * 2.6, 0, 1);
        if (fi <= 0) return;
        stars.forEach((s) => {
          s.tw += s.sp;
          const a = fi * (0.4 + 0.6 * Math.sin(s.tw));
          bgX.beginPath();
          bgX.arc(s.x * W, s.y * H * 0.84, s.r, 0, Math.PI * 2);
          bgX.fillStyle = `rgba(255,248,232,${a})`;
          bgX.fill();
        });
      }

      function drawCity(t, now) {
        const W = bgC.width,
          H = bgC.height,
          hy = H * 0.86;
        bgX.fillStyle = "#060708";
        buildings.forEach((b) => bgX.fillRect(b.x, b.y, b.w, b.h + 1));
        wins.forEach((w) => {
          const fi = clamp((t - w.litAt) * 10, 0, 1);
          if (fi <= 0) return;
          let a = fi * 0.92;
          if (w.flicker) {
            w.fp += 0.06;
            a *= 0.65 + 0.35 * Math.sin(w.fp * 6.8);
          }
          // tiny warm glow around window
          bgX.fillStyle = `rgba(255,215,110,${a * 0.12})`;
          bgX.fillRect(w.x - w.w, w.y - w.h, w.w * 3, w.h * 3);
          // window itself
          bgX.fillStyle = `rgba(255,220,125,${a})`;
          bgX.fillRect(w.x, w.y, w.w, w.h);
        });
        // ground
        const gr = bgX.createLinearGradient(0, hy, 0, H);
        gr.addColorStop(
          0,
          `rgb(${lerp(10, 3, t)},${lerp(8, 2, t)},${lerp(8, 2, t)})`,
        );
        gr.addColorStop(1, "#000");
        bgX.fillStyle = gr;
        bgX.fillRect(0, hy, W, H - hy);
      }

      function svgToImg(svgStr) {
        const blob = new Blob([svgStr], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        return new Promise((res) => {
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(url);
            res(img);
          };
          img.src = url;
        });
      }

      // ── LOGO DRAW ──
      // Power ring: 247x269 viewBox — nearly square
      // Fig: 248x257 viewBox — nearly square
      // We draw them so fig sits INSIDE the ring, centered
      // Ring is slightly larger than fig

      function drawLogo(ringImg, figImg, cx, cy, size, alpha) {
        if (alpha <= 0) return;
        lgX.save();
        lgX.globalAlpha = clamp(alpha, 0, 1);

        // Ring: size = diameter of the ring
        const ringW = size * 0.919; // aspect ratio correction
        const ringH = size;
        lgX.drawImage(ringImg, cx - ringW / 2, cy - ringH / 2, ringW, ringH);

        // Fig: slightly smaller, centered inside ring
        // The figure should fit inside the ring — empirically about 72% of ring size
        const figH = size * 0.72;
        const figW = figH * 0.968;
        lgX.drawImage(figImg, cx - figW / 2, cy - figH / 2, figW, figH);

        lgX.restore();
      }

      // ── TITLE HELPERS ──
      function fadeTitle(id, toAlpha, dur) {
        const el = document.getElementById(id);
        el.style.transition = `opacity ${dur}ms ease`;
        el.style.opacity = toAlpha;
      }

      // ── GLITCH → PREAMBLE ──
      function doGlitch(cb) {
        const ov = document.getElementById("glitch-overlay");
        const seq = [
          [0.95, 55],
          [0, 35],
          [0.8, 25],
          [0.1, 45],
          [0.98, 35],
          [0, 25],
          [0.7, 45],
          [0, 55],
          [0.85, 35],
          [0, 40],
          [1, 25],
          [0, 280],
        ];
        let i = 0;
        function next() {
          if (i >= seq.length) {
            ov.style.opacity = 0;
            cb && cb();
            return;
          }
          ov.style.opacity = seq[i][0];
          setTimeout(
            () => {
              i++;
              next();
            },
            seq[i - 1]?.[1] || seq[i][1],
          );
        }
        next();
      }

      // ── SEQUENCE PHASES ──
      // sky-in (4s) → ring-in (1.4s) → fig-catch (1s) → hold (2s) → race-past (0.5s) → title-alliance (2.5s) → title-future (2s) → black (0.6s) → glitch
      const T = {
        SKY: 4000,
        RING: 1400,
        FIG: 1000,
        HOLD: 2000,
        RACE: 500,
        T1: 2500,
        T2: 2000,
        BLACK: 600,
      };

      let phase = "sky-in",
        phaseStart = 0,
        globalStart = 0;
      let skyT = 0;
      let ringImg = null,
        figImg = null,
        assetsReady = false;

      // logo state
      let logoSize = 0,
        logoCY = 0,
        logoAlpha = 0;
      // ring leads fig — we draw them as one unit but ring slightly ahead during approach
      let ringLeadPhase = 0; // 0=together 0→1=ring ahead

      function frame(now) {
        if (!globalStart) globalStart = now;
        if (!assetsReady) {
          requestAnimationFrame(frame);
          return;
        }

        const W = bgC.width,
          H = bgC.height;
        const elapsed = now - phaseStart;

        // sky always progresses through the full sequence
        const totalSeq = T.SKY + T.RING + T.FIG + T.HOLD + T.RACE;
        skyT = clamp((now - globalStart) / totalSeq, 0, 1);

        // draw bg
        bgX.clearRect(0, 0, W, H);
        bgX.fillStyle = skyGrad(skyT);
        bgX.fillRect(0, 0, W, H * 0.86);
        drawSun(skyT);
        drawStars(skyT, now);
        drawCity(skyT, now);

        // draw logo
        lgX.clearRect(0, 0, W, H);
        const cx = W / 2,
          baseCY = H * 0.42;

        if (phase === "sky-in") {
          if (elapsed >= T.SKY) {
            phase = "ring-in";
            phaseStart = now;
          }
        } else if (phase === "ring-in") {
          // Ring enters from far — grows from tiny to medium
          const p = clamp(elapsed / T.RING, 0, 1);
          const ez = easeOut(p);
          // size: 0.04H → 0.22H
          logoSize = lerp(H * 0.04, H * 0.22, ez);
          logoAlpha = lerp(0, 1, Math.min(1, p * 4));
          // ring is alone — fig is tiny/invisible behind it
          // draw ring only during this phase, fig appears at ~60%
          const figAlpha = clamp((p - 0.6) * 2.5, 0, 1);
          lgX.save();
          lgX.globalAlpha = clamp(logoAlpha, 0, 1);
          const rW = logoSize * 0.919,
            rH = logoSize;
          lgX.drawImage(ringImg, cx - rW / 2, baseCY - rH / 2, rW, rH);
          lgX.restore();
          if (figAlpha > 0) {
            const fSize = logoSize * 0.68 * figAlpha;
            const fH = fSize,
              fW = fSize * 0.968;
            lgX.save();
            lgX.globalAlpha = figAlpha * 0.8;
            lgX.drawImage(figImg, cx - fW / 2, baseCY - fH / 2, fW, fH);
            lgX.restore();
          }
          if (p >= 1) {
            phase = "fig-catch";
            phaseStart = now;
          }
        } else if (phase === "fig-catch") {
          // Fig fully catches up and syncs with ring — size stays ~0.22H, fig grows into place
          const p = clamp(elapsed / T.FIG, 0, 1);
          const ez = easeOut(p);
          logoSize = H * 0.22;
          // fig grows from 68% to 72% of ring (synced)
          const figScale = lerp(0.68, 0.72, ez);
          const rW = logoSize * 0.919,
            rH = logoSize;
          const fH = logoSize * figScale,
            fW = fH * 0.968;
          lgX.save();
          lgX.globalAlpha = 1;
          lgX.drawImage(ringImg, cx - rW / 2, baseCY - rH / 2, rW, rH);
          lgX.restore();
          lgX.save();
          lgX.globalAlpha = lerp(0.8, 1, ez);
          lgX.drawImage(figImg, cx - fW / 2, baseCY - fH / 2, fW, fH);
          lgX.restore();
          if (p >= 1) {
            phase = "hold";
            phaseStart = now;
          }
        } else if (phase === "hold") {
          // Both hold — logo presented to viewer — slow gentle grow 0.22→0.32H
          const p = clamp(elapsed / T.HOLD, 0, 1);
          const ez = easeInOut(p);
          logoSize = lerp(H * 0.22, H * 0.32, ez);
          drawLogo(ringImg, figImg, cx, baseCY, logoSize, 1);
          if (p >= 1) {
            phase = "race-past";
            phaseStart = now;
          }
        } else if (phase === "race-past") {
          // Accelerate INTO camera — exponential zoom, fades at very end
          const p = clamp(elapsed / T.RACE, 0, 1);
          const ez = easeIn(p);
          // 0.32H → 3.2H
          logoSize = lerp(H * 0.32, H * 3.2, ez);
          // alpha: full until 75%, then drop fast
          const a = clamp(1 - (p - 0.72) * 3.5, 0, 1);
          drawLogo(ringImg, figImg, cx, baseCY, logoSize, a);
          if (p >= 1) {
            phase = "title-alliance";
            phaseStart = now;
            fadeTitle("t1", 1, 700);
          }
        } else if (phase === "title-alliance") {
          // sky still visible, title on screen
          if (elapsed >= T.T1 - 650) {
            fadeTitle("t1", 0, 650);
          }
          if (elapsed >= T.T1) {
            phase = "title-future";
            phaseStart = now;
            fadeTitle("t2", 1, 650);
          }
        } else if (phase === "title-future") {
          if (elapsed >= T.T2 - 500) {
            fadeTitle("t2", 0, 500);
          }
          if (elapsed >= T.T2) {
            phase = "black";
            phaseStart = now;
            // start fading sky to black
            bgC.style.transition = `opacity ${T.BLACK}ms ease`;
            bgC.style.opacity = "0";
          }
        } else if (phase === "black") {
          if (elapsed >= T.BLACK) {
            phase = "done";
            doGlitch(() => {
              setTimeout(() => {
                window.location.href = "/prototypes/preamble/prologue.html";
              }, 200);
            });
          }
        }

        if (phase !== "done") requestAnimationFrame(frame);
      }

      // ── INIT ──
      resize();
      Promise.all([svgToImg(POWER_SVG), svgToImg(FIG_SVG)]).then(([r, f]) => {
        ringImg = r;
        figImg = f;
        assetsReady = true;
        phaseStart = performance.now();
        requestAnimationFrame(frame);
      });
    </script>
  </body>
</html>
