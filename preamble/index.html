<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NCE · ARCHIVE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --void: #070604;
        --amber: #c8862a;
        --amber-soft: rgba(200, 134, 42, 0.72);
        --amber-dim: rgba(200, 134, 42, 0.28);
        --amber-faint: rgba(200, 134, 42, 0.12);
        --reader-top-safe: env(safe-area-inset-top, 0px);
        --reader-bottom-safe: env(safe-area-inset-bottom, 0px);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--void);
        font-family: "Courier New", Courier, monospace;
        touch-action: none;
      }

      button,
      input {
        font-family: inherit;
      }

      .machine {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at center,
            rgba(80, 50, 14, 0.1),
            transparent 55%
          ),
          #000;
      }

      .gate {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }

      .gate::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 134, 42, 0.16) 0%,
          rgba(120, 70, 18, 0.06) 38%,
          transparent 70%
        );
        opacity: 1;
        transition: opacity 420ms ease;
      }

      .gate.loaded::before {
        opacity: 0;
      }

      .projection-frame {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: calc(50% - 18px);
        transform: translate(-50%, -50%);
        width: min(90vw, 68vh);
        aspect-ratio: 3 / 4;
        overflow: hidden;
        background: #000;
        box-shadow:
          0 28px 84px rgba(0, 0, 0, 0.82),
          inset 0 0 0 1px rgba(255, 220, 140, 0.08),
          inset 0 0 72px rgba(0, 0, 0, 0.42);
      }

      @media (orientation: landscape) {
        .projection-frame {
          width: min(62vw, 70vh);
          top: 50%;
        }
      }

      @media (max-height: 720px) {
        .projection-frame {
          width: min(86vw, 64vh);
          top: calc(50% - 10px);
        }
      }

      .fiche-stage {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        opacity: 0;
        filter: brightness(0.8) contrast(1.05);
        transition: none;
        will-change: opacity, filter;
      }

      .fiche-stage.visible {
        opacity: 1;
        filter: brightness(1) contrast(1);
      }

      .fiche-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: center;
        opacity: 1;
        transform-origin: center center;
        will-change: transform, filter;
        user-select: none;
        -webkit-user-drag: none;
      }

      .scanlines,
      .vignette,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        z-index: 10;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.2) 2px,
          rgba(0, 0, 0, 0.2) 4px
        );
        mix-blend-mode: multiply;
      }

      .vignette {
        z-index: 11;
        background: radial-gradient(
          ellipse at center,
          transparent 48%,
          rgba(0, 0, 0, 0.4) 78%,
          rgba(0, 0, 0, 0.78) 100%
        );
      }

      .grain {
        z-index: 12;
        width: 180px;
        height: 180px;
        opacity: 0.08;
        image-rendering: pixelated;
        transform: scale(12);
        transform-origin: top left;
      }

      .gate.flickering .fiche-stage {
        animation: lamp-flicker 620ms ease-in-out forwards;
      }

      @keyframes lamp-flicker {
        0% {
          filter: brightness(1) contrast(1);
        }
        10% {
          filter: brightness(0.68) contrast(1.04);
        }
        20% {
          filter: brightness(0.95) contrast(1.02);
        }
        35% {
          filter: brightness(0.52) contrast(1.08);
        }
        50% {
          filter: brightness(1.08) contrast(0.98);
        }
        65% {
          filter: brightness(0.78) contrast(1.06);
        }
        100% {
          filter: brightness(1) contrast(1);
        }
      }

      /* ── Split glass rod loupe ───────────────────────────────────────────── */
      .loupe {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(74vw, 520px);
        height: 74px;
        transform: translate(-50%, -50%);
        z-index: 25;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
        filter: drop-shadow(0 13px 22px rgba(0, 0, 0, 0.52));
      }

      .loupe.active {
        opacity: 1;
        pointer-events: auto;
      }

      .loupe-glass {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 999px / 42px;
        border-top: 1px solid rgba(255, 224, 160, 0.54);
        border-bottom: 1px solid rgba(60, 33, 8, 0.92);
        background: linear-gradient(
          to bottom,
          rgba(255, 238, 188, 0.42) 0%,
          rgba(255, 239, 196, 0.16) 17%,
          rgba(255, 255, 255, 0.02) 47%,
          rgba(75, 42, 10, 0.14) 100%
        );
        box-shadow:
          inset 0 16px 22px rgba(255, 235, 185, 0.22),
          inset 0 -12px 18px rgba(32, 18, 5, 0.42),
          inset 0 0 34px rgba(255, 230, 170, 0.1),
          0 0 0 1px rgba(200, 134, 42, 0.22),
          0 0 28px rgba(200, 134, 42, 0.13);
        backdrop-filter: blur(0.6px);
      }

      .loupe-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .loupe-glass::before {
        content: "";
        position: absolute;
        left: 3%;
        right: 3%;
        top: 5px;
        height: 18px;
        border-radius: 999px;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.28),
          rgba(255, 255, 255, 0.04),
          transparent
        );
        mix-blend-mode: screen;
        z-index: 2;
      }

      .loupe-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0, 0, 0, 0.2) 78%,
            rgba(0, 0, 0, 0.36) 100%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.08) 0px,
            rgba(0, 0, 0, 0.08) 1px,
            transparent 1px,
            transparent 4px
          );
        z-index: 3;
      }

      .loupe-center-mark {
        position: absolute;
        left: 4%;
        right: 4%;
        top: 50%;
        height: 1px;
        background: rgba(200, 134, 42, 0.1);
        z-index: 4;
        pointer-events: none;
      }

      /* ── Controls ───────────────────────────────────────────────────────── */
      .skip-btn,
      .next-btn,
      .loupe-btn {
        position: absolute;
        z-index: 30;
        color: var(--amber-dim);
        background: none;
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .skip-btn {
        top: calc(18px + var(--reader-top-safe));
        right: 22px;
        font-size: 10px;
        letter-spacing: 0.32em;
        padding: 8px 4px;
      }

      .next-btn {
        bottom: calc(26px + var(--reader-bottom-safe));
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.42em;
        padding: 14px 26px;
      }

      .next-btn[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }

      .loupe-btn {
        right: 20px;
        bottom: calc(68px + var(--reader-bottom-safe));
        font-size: 23px;
        line-height: 1;
        padding: 10px;
      }

      .skip-btn:hover,
      .skip-btn:active,
      .next-btn:hover,
      .next-btn:active,
      .loupe-btn:hover,
      .loupe-btn:active,
      .loupe-btn.active {
        color: var(--amber-soft);
      }

      .next-btn .arrow {
        display: inline-block;
        margin-left: 7px;
        animation: arrow-pulse 1.8s ease-in-out infinite;
      }

      @keyframes arrow-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: translateX(0);
        }
        50% {
          opacity: 1;
          transform: translateX(4px);
        }
      }

      .focus-switch {
        position: absolute;
        z-index: 31;
        right: 18px;
        top: calc(50% + 96px);
        width: 38px;
        height: 132px;
        transform: translateY(-50%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .focus-switch.active {
        opacity: 0.78;
        pointer-events: auto;
      }

      .focus-switch::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 10px;
        bottom: 10px;
        width: 5px;
        border-radius: 999px;
        background: linear-gradient(
          to bottom,
          rgba(255, 220, 145, 0.18),
          rgba(200, 134, 42, 0.36),
          rgba(45, 25, 5, 0.66)
        );
        box-shadow:
          inset 0 0 4px rgba(0, 0, 0, 0.8),
          0 0 10px rgba(200, 134, 42, 0.12);
      }

      .focus-slider {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 120px;
        height: 34px;
        transform: translate(-50%, -50%) rotate(-90deg);
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        outline: none;
      }

      .focus-slider::-webkit-slider-runnable-track {
        height: 2px;
        background: transparent;
      }

      .focus-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 235, 186, 0.36);
        background:
          radial-gradient(
            ellipse at 45% 35%,
            rgba(255, 255, 255, 0.46),
            transparent 38%
          ),
          linear-gradient(
            to bottom,
            rgba(225, 215, 190, 0.96),
            rgba(150, 130, 105, 0.96)
          );
        box-shadow:
          0 6px 10px rgba(0, 0, 0, 0.58),
          inset 0 0 8px rgba(255, 255, 255, 0.18);
      }

      .focus-slider::-moz-range-thumb {
        width: 28px;
        height: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 235, 186, 0.36);
        background: rgba(210, 198, 170, 0.96);
      }

      .retrieval-caption {
        position: absolute;
        z-index: 30;
        left: 22px;
        bottom: calc(22px + var(--reader-bottom-safe));
        max-width: 42vw;
        font-size: 9px;
        letter-spacing: 0.22em;
        line-height: 1.5;
        color: rgba(200, 134, 42, 0.22);
        text-transform: uppercase;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        .retrieval-caption {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="machine">
      <div class="gate" id="gate">
        <div class="projection-frame fiche-document" id="projection-frame">
          <div class="fiche-stage" id="fiche-stage">
            <img class="fiche-img" id="fiche-img" alt="" draggable="false" />
          </div>

          <div class="scanlines"></div>
          <div class="vignette"></div>
          <canvas class="grain" id="grain-canvas"></canvas>

          <div class="loupe" id="loupe" aria-hidden="true">
            <div class="loupe-glass" id="loupe-glass">
              <canvas class="loupe-canvas" id="loupe-canvas"></canvas>
              <div class="loupe-center-mark"></div>
            </div>
          </div>
        </div>

        <button class="skip-btn" id="skip-btn" type="button">
          SKIP ALL ▶▶▶
        </button>
        <button
          class="loupe-btn"
          id="loupe-btn"
          type="button"
          title="Toggle split glass rod reader"
        >
          ⊕
        </button>

        <div
          class="focus-switch"
          id="focus-switch"
          aria-label="Lens focus control"
        >
          <input
            class="focus-slider"
            id="focus-slider"
            type="range"
            min="1.8"
            max="3.2"
            step="0.05"
            value="2.45"
            aria-label="Lens focus"
          />
        </div>

        <button class="next-btn" id="next-btn" type="button">
          NEXT <span class="arrow">▶▶</span>
        </button>

        <div class="retrieval-caption">
          Frame alignment · emulsion stable · retrieval continuing
        </div>
      </div>
    </div>

    <script>
      const SEQUENCE = [
        {
          card: "cover",
          img: "/imagebank/preamble/cover.png",
          next: "prologue",
        },
        {
          card: "prologue",
          img: "/imagebank/preamble/prologue.png",
          next: "difference-1",
        },
        {
          card: "difference-1",
          img: "/imagebank/preamble/difference-1.png",
          next: "difference-2",
        },
        {
          card: "difference-2",
          img: "/imagebank/preamble/difference-2.png",
          next: "charter-1",
        },
        {
          card: "charter-1",
          img: "/imagebank/preamble/charter-1.png",
          next: "charter-2",
        },
        {
          card: "charter-2",
          img: "/imagebank/preamble/charter-2.png",
          next: "charter-3",
        },
        {
          card: "charter-3",
          img: "/imagebank/preamble/charter-3.png",
          next: "charter-4",
        },
        {
          card: "charter-4",
          img: "/imagebank/preamble/charter-4.png",
          next: "charter-5",
        },
        {
          card: "charter-5",
          img: "/imagebank/preamble/charter-5.png",
          next: "charter-6",
        },
        {
          card: "charter-6",
          img: "/imagebank/preamble/charter-6.png",
          next: "charter-7",
        },
        {
          card: "charter-7",
          img: "/imagebank/preamble/charter-7.png",
          next: "charter-8",
        },
        {
          card: "charter-8",
          img: "/imagebank/preamble/charter-8.png",
          next: null,
        },
      ];

      const LANDING = "/landing";
      const AUDIO_SRC = "/audio/fiche-advance.wav";

      function getParams() {
        const p = new URLSearchParams(window.location.search);
        return {
          card: p.get("card") || "cover",
          preview: p.get("preview") === "1",
        };
      }

      const params = getParams();
      let currentEntry =
        SEQUENCE.find((s) => s.card === params.card) || SEQUENCE[0];

      const gate = document.getElementById("gate");
      const projectionFrame = document.getElementById("projection-frame");
      const ficheStage = document.getElementById("fiche-stage");
      const ficheImg = document.getElementById("fiche-img");
      const nextBtn = document.getElementById("next-btn");
      const skipBtn = document.getElementById("skip-btn");
      const grainCvs = document.getElementById("grain-canvas");
      const gCtx = grainCvs.getContext("2d", { willReadFrequently: true });

      let audioCtx = null;
      let audioBuffer = null;

      const viewState = {
        zoom: 1,
        panX: 0,
        panY: 0,
      };

      async function loadAudio() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const res = await fetch(AUDIO_SRC);
          const arr = await res.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(arr);
        } catch (_e) {}
      }

      function playAdvanceSound() {
        if (!audioCtx || !audioBuffer) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);
        src.start(0);
      }

      function resizeGrain() {
        grainCvs.width = 180;
        grainCvs.height = 180;
      }

      function drawGrain() {
        const w = grainCvs.width;
        const h = grainCvs.height;
        const imgd = gCtx.createImageData(w, h);
        const d = imgd.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 18;
        }
        gCtx.putImageData(imgd, 0, 0);
        setTimeout(() => requestAnimationFrame(drawGrain), 70);
      }

      function setNextLabel(entry) {
        if (!entry.next) {
          nextBtn.innerHTML = 'ENTER <span class="arrow">▶▶</span>';
        } else {
          nextBtn.innerHTML = 'NEXT <span class="arrow">▶▶</span>';
        }
      }

      function resetZoom() {
        viewState.zoom = 1;
        viewState.panX = 0;
        viewState.panY = 0;
        applyImageTransform();
      }

      function applyImageTransform() {
        ficheImg.style.transform = `translate(${viewState.panX}px, ${viewState.panY}px) scale(${viewState.zoom})`;
        window.NCEArchive?.syncLoupe?.();
      }

      function preloadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function mechanicalAdvanceTo(entry, options = {}) {
        const { firstLoad = false, updateUrl = false } = options;
        nextBtn.disabled = true;
        gate.classList.remove("loaded");

        window.NCEArchive?.deactivateLoupe?.();

        playAdvanceSound();
        window.NCEArchive?.deactivateLoupe?.();

        if (!firstLoad) {
          ficheStage.style.transition = "opacity 130ms ease, filter 130ms ease";
          ficheStage.style.opacity = "0";
          ficheStage.style.filter = "brightness(0.38) contrast(1.18)";
          await wait(140);
        } else {
          await wait(450);
        }

        try {
          await preloadImage(entry.img);
        } catch (_e) {}

        currentEntry = entry;
        setNextLabel(entry);
        resetZoom();
        ficheImg.src = entry.img;
        window.NCEArchive?.syncLoupe?.();

        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("card", entry.card);
          window.history.pushState({}, "", url.toString());
        }

        ficheStage.classList.remove("visible");
        ficheStage.style.transition = "none";
        ficheStage.style.opacity = "0";
        ficheStage.style.filter = "brightness(0.55) contrast(1.2) blur(0.35px)";
        ficheStage.offsetHeight;

        ficheStage.style.transition = "opacity 240ms ease, filter 360ms ease";
        ficheStage.style.opacity = "1";
        ficheStage.style.filter = "brightness(1.04) contrast(1.02) blur(0)";
        await wait(380);

        ficheStage.classList.add("visible");
        ficheStage.style.transition = "";
        ficheStage.style.opacity = "";
        ficheStage.style.filter = "";
        gate.classList.add("loaded");
        nextBtn.disabled = false;
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function advance() {
        if (nextBtn.disabled) return;
        if (!currentEntry.next) {
          nextBtn.disabled = true;
          playAdvanceSound();
          await wait(420);
          window.location.href = LANDING;
          return;
        }
        const next = SEQUENCE.find((s) => s.card === currentEntry.next);
        if (!next) return;
        await mechanicalAdvanceTo(next, { updateUrl: true });
      }

      nextBtn.addEventListener("click", advance);
      skipBtn.addEventListener("click", () => {
        window.location.href = LANDING;
      });

      window.addEventListener("popstate", () => {
        const p = new URLSearchParams(window.location.search);
        const card = p.get("card") || "cover";
        const entry = SEQUENCE.find((s) => s.card === card) || SEQUENCE[0];
        mechanicalAdvanceTo(entry, { firstLoad: false, updateUrl: false });
      });

      // ── Split cylindrical glass rod loupe. ─────────────────────────────────
      (function loupeSystem() {
        const loupe = document.getElementById("loupe");
        const loupeCanvas = document.getElementById("loupe-canvas");
        const loupeBtn = document.getElementById("loupe-btn");
        const focusSwitch = document.getElementById("focus-switch");
        const focusSlider = document.getElementById("focus-slider");
        const ctx = loupeCanvas.getContext("2d", { willReadFrequently: true });

        const TEXT_SAFE_LEFT = 0.118;
        const TEXT_SAFE_RIGHT = 0.918;

        let active = false;
        let centerY = 0;
        let dragging = false;
        let rafPending = false;

        function getContainedImageRect() {
          const frame = projectionFrame.getBoundingClientRect();
          const naturalW = ficheImg.naturalWidth || 1;
          const naturalH = ficheImg.naturalHeight || 1;
          const frameRatio = frame.width / frame.height;
          const imgRatio = naturalW / naturalH;

          let baseW;
          let baseH;

          if (imgRatio > frameRatio) {
            baseW = frame.width;
            baseH = frame.width / imgRatio;
          } else {
            baseH = frame.height;
            baseW = frame.height * imgRatio;
          }

          const baseLeft = (frame.width - baseW) / 2;
          const baseTop = (frame.height - baseH) / 2;
          const z = viewState.zoom;
          const renderedW = baseW * z;
          const renderedH = baseH * z;

          return {
            frame,
            naturalW,
            naturalH,
            renderedW,
            renderedH,
            renderedLeft: baseLeft - (renderedW - baseW) / 2 + viewState.panX,
            renderedTop: baseTop - (renderedH - baseH) / 2 + viewState.panY,
          };
        }

        function resizeLoupeCanvas() {
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const rect = loupe.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width * dpr));
          const h = Math.max(1, Math.round(rect.height * dpr));

          if (loupeCanvas.width !== w || loupeCanvas.height !== h) {
            loupeCanvas.width = w;
            loupeCanvas.height = h;
          }
        }

        function scheduleDraw() {
          if (!active || rafPending) return;
          rafPending = true;
          requestAnimationFrame(() => {
            rafPending = false;
            drawLoupe();
          });
        }

        function syncLoupe() {
          scheduleDraw();
        }

        function drawLoupe() {
          if (!active || !ficheImg.complete || !ficheImg.naturalWidth) return;

          resizeLoupeCanvas();

          const r = getContainedImageRect();
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const outW = loupeCanvas.width;
          const outH = loupeCanvas.height;

          centerY = Math.max(
            22,
            Math.min(r.frame.height - 22, centerY || r.frame.height / 2),
          );

          loupe.style.top = `${centerY}px`;

          const focus = parseFloat(focusSlider.value || "2.45");
          const verticalZoom = focus;
          const distortion = 0.14 + (focus - 1.8) * 0.08;

          const safeX = r.naturalW * TEXT_SAFE_LEFT;
          const safeW = r.naturalW * (TEXT_SAFE_RIGHT - TEXT_SAFE_LEFT);

          const naturalY =
            ((centerY - r.renderedTop) / Math.max(1, r.renderedH)) * r.naturalH;

          const naturalPixelsPerCssPixel =
            r.naturalH / Math.max(1, r.renderedH);
          const sourceH =
            ((outH / dpr) * naturalPixelsPerCssPixel) / verticalZoom;
          const sourceY = Math.max(
            0,
            Math.min(r.naturalH - sourceH, naturalY - sourceH / 2),
          );

          ctx.clearRect(0, 0, outW, outH);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          const strip = Math.max(2, Math.floor(outW / 220));

          for (let x = 0; x < outW; x += strip) {
            const w = Math.min(strip, outW - x);
            const t1 = x / outW;
            const t2 = (x + w) / outW;
            const u1 = cylinderMap(t1, distortion);
            const u2 = cylinderMap(t2, distortion);
            const sx = safeX + u1 * safeW;
            const sw = Math.max(1, (u2 - u1) * safeW);

            ctx.drawImage(ficheImg, sx, sourceY, sw, sourceH, x, 0, w, outH);
          }

          const glow = ctx.createLinearGradient(0, 0, 0, outH);
          glow.addColorStop(0, "rgba(255,246,214,0.22)");
          glow.addColorStop(0.22, "rgba(255,236,190,0.08)");
          glow.addColorStop(0.5, "rgba(255,255,255,0.00)");
          glow.addColorStop(1, "rgba(0,0,0,0.26)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, outW, outH);

          const edge = ctx.createRadialGradient(
            outW / 2,
            outH / 2,
            outW * 0.18,
            outW / 2,
            outH / 2,
            outW * 0.58,
          );
          edge.addColorStop(0, "rgba(255,255,255,0)");
          edge.addColorStop(0.78, "rgba(255,255,255,0)");
          edge.addColorStop(1, "rgba(0,0,0,0.28)");
          ctx.fillStyle = edge;
          ctx.fillRect(0, 0, outW, outH);
        }

        function cylinderMap(t, k) {
          const p = t * 2 - 1;
          const curved = p + k * (p * p * p - p);
          return Math.max(0, Math.min(1, (curved + 1) / 2));
        }

        function setY(clientY) {
          const frame = projectionFrame.getBoundingClientRect();
          centerY = clientY - frame.top;
          scheduleDraw();
        }

        loupeBtn.addEventListener("click", () => {
          active = !active;
          loupe.classList.toggle("active", active);
          loupeBtn.classList.toggle("active", active);
          focusSwitch.classList.toggle("active", active);

          if (active) {
            centerY = projectionFrame.getBoundingClientRect().height / 2;
            scheduleDraw();
          }
        });

        focusSlider.addEventListener("input", scheduleDraw);

        projectionFrame.addEventListener("pointerdown", (e) => {
          if (!active) return;
          dragging = true;
          setY(e.clientY);
          projectionFrame.setPointerCapture(e.pointerId);
        });

        projectionFrame.addEventListener("pointermove", (e) => {
          if (!active || !dragging) return;
          setY(e.clientY);
        });

        function stopDrag() {
          dragging = false;
        }

        projectionFrame.addEventListener("pointerup", stopDrag);
        projectionFrame.addEventListener("pointercancel", stopDrag);
        window.addEventListener("resize", scheduleDraw);

        window.NCEArchive = window.NCEArchive || {};
        window.NCEArchive.syncLoupe = syncLoupe;
        window.NCEArchive.isLoupeActive = () => active;
        window.NCEArchive.deactivateLoupe = () => {
          active = false;
          dragging = false;
          loupe.classList.remove("active");
          loupeBtn.classList.remove("active");
          if (ctx && loupecanvas) {
            ctx.clearRect(0, 0, loupecanvas.width, loupecanvas.height);
          }
        };
      })();

      (function lampSystem() {
        function flicker() {
          gate.classList.add("flickering");
          setTimeout(() => gate.classList.remove("flickering"), 700);
          const next = params.preview ? 5000 : (45 + Math.random() * 45) * 1000;
          setTimeout(flicker, next);
        }
        setTimeout(
          flicker,
          params.preview ? 1000 : (20 + Math.random() * 20) * 1000,
        );
      })();

      window.NCEArchive = window.NCEArchive || {};
      Object.assign(window.NCEArchive, {
        gate,
        projectionFrame,
        ficheStage,
        ficheImg,
        getCurrentEntry: () => currentEntry,
        syncLoupe: window.NCEArchive.syncLoupe,
      });

      resizeGrain();
      drawGrain();
      loadAudio();
      mechanicalAdvanceTo(currentEntry, { firstLoad: true, updateUrl: false });
    </script>
    <script src="/randanime_preamble.js"></script>
  </body>
