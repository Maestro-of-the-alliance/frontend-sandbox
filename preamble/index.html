<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NCE · ARCHIVE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --void: #070604;
        --amber: #c8862a;
        --amber-soft: rgba(200, 134, 42, 0.72);
        --amber-dim: rgba(200, 134, 42, 0.28);
        --amber-faint: rgba(200, 134, 42, 0.12);
        --reader-top-safe: env(safe-area-inset-top, 0px);
        --reader-bottom-safe: env(safe-area-inset-bottom, 0px);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--void);
        font-family: "Courier New", Courier, monospace;
        touch-action: none;
      }

      button,
      input {
        font-family: inherit;
      }

      .machine {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at center,
            rgba(80, 50, 14, 0.1),
            transparent 55%
          ),
          #000;
      }

      .gate {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }

      .gate::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 134, 42, 0.16) 0%,
          rgba(120, 70, 18, 0.06) 38%,
          transparent 70%
        );
        opacity: 1;
        transition: opacity 420ms ease;
      }

      .gate.loaded::before {
        opacity: 0;
      }

      .projection-frame {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: calc(50% - 18px);
        transform: translate(-50%, -50%);
        width: min(90vw, 68vh);
        aspect-ratio: 3 / 4;
        overflow: hidden;
        background: #000;
        box-shadow:
          0 28px 84px rgba(0, 0, 0, 0.82),
          inset 0 0 0 1px rgba(255, 220, 140, 0.08),
          inset 0 0 72px rgba(0, 0, 0, 0.42);
      }

      @media (orientation: landscape) {
        .projection-frame {
          width: min(62vw, 70vh);
          top: 50%;
        }
      }

      @media (max-height: 720px) {
        .projection-frame {
          width: min(86vw, 64vh);
          top: calc(50% - 10px);
        }
      }

      .fiche-stage {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        opacity: 0;
        filter: brightness(0.8) contrast(1.05);
        transition: none;
        will-change: opacity, filter;
      }

      .fiche-stage.visible {
        opacity: 1;
        filter: brightness(1) contrast(1);
      }

      .fiche-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: center;
        opacity: 1;
        transform-origin: center center;
        will-change: transform, filter;
        user-select: none;
        -webkit-user-drag: none;
      }

      .scanlines,
      .vignette,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        z-index: 10;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.2) 2px,
          rgba(0, 0, 0, 0.2) 4px
        );
        mix-blend-mode: multiply;
      }

      .vignette {
        z-index: 11;
        background: radial-gradient(
          ellipse at center,
          transparent 48%,
          rgba(0, 0, 0, 0.4) 78%,
          rgba(0, 0, 0, 0.78) 100%
        );
      }

      .grain {
        z-index: 12;
        width: 180px;
        height: 180px;
        opacity: 0.08;
        image-rendering: pixelated;
        transform: scale(12);
        transform-origin: top left;
      }

      .gate.flickering .fiche-stage {
        animation: lamp-flicker 620ms ease-in-out forwards;
      }

      @keyframes lamp-flicker {
        0% {
          filter: brightness(1) contrast(1);
        }
        10% {
          filter: brightness(0.68) contrast(1.04);
        }
        20% {
          filter: brightness(0.95) contrast(1.02);
        }
        35% {
          filter: brightness(0.52) contrast(1.08);
        }
        50% {
          filter: brightness(1.08) contrast(0.98);
        }
        65% {
          filter: brightness(0.78) contrast(1.06);
        }
        100% {
          filter: brightness(1) contrast(1);
        }
      }

      /* ── Game card ──────────────────────────────────────────────────────── */
      .game-card {
        position: absolute;
        inset: 0;
        display: none;
        overflow-y: auto;
        overflow-x: hidden;
        background: #d4c49a;
        background-image: linear-gradient(
          160deg,
          #ddd0a8 0%,
          #c9b882 40%,
          #d6c898 70%,
          #cabb85 100%
        );
        font-family: "Courier New", Courier, monospace;
        -webkit-overflow-scrolling: touch;
      }

      .game-card.active {
        display: block;
      }

      .game-card .gc-inner {
        padding: clamp(8px, 2.5%, 16px) clamp(10px, 3%, 18px);
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .game-card .gc-header {
        border-top: 2px solid #1a1408;
        border-bottom: 1px solid #1a1408;
        padding: 2px 0;
        margin-bottom: clamp(5px, 1.5%, 10px);
        display: flex;
        gap: 0;
        flex-shrink: 0;
      }

      .game-card .gc-hcell {
        font-size: clamp(5px, 1vw, 7px);
        color: #1a1408;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 1px 5px;
        border-right: 1px solid rgba(26, 20, 8, 0.4);
        line-height: 1.4;
      }
      .game-card .gc-hcell:last-child {
        border-right: none;
      }
      .game-card .gc-hcell strong {
        display: block;
        font-size: 0.82em;
        opacity: 0.55;
      }

      .game-card .gc-title {
        text-align: center;
        margin-bottom: clamp(4px, 1.2%, 10px);
        flex-shrink: 0;
      }
      .game-card .gc-title h2 {
        font-size: clamp(8px, 2vw, 13px);
        color: #1a1408;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .game-card .gc-title p {
        font-size: clamp(6px, 1.2vw, 8px);
        color: rgba(26, 20, 8, 0.55);
        letter-spacing: 0.1em;
        font-style: italic;
      }

      .game-card .gc-divider {
        border: none;
        border-top: 1px solid rgba(26, 20, 8, 0.3);
        margin: clamp(3px, 1%, 6px) 0;
        flex-shrink: 0;
      }

      .game-card .gc-statements {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: clamp(2px, 0.8%, 5px);
      }

      .game-card .gc-statement {
        display: flex;
        align-items: center;
        gap: clamp(3px, 1%, 6px);
        padding: clamp(2px, 0.6%, 4px) clamp(5px, 1.2%, 8px);
        border-left: 2px solid transparent;
        transition:
          border-color 0.3s,
          background 0.3s;
        border-radius: 0 2px 2px 0;
        flex-shrink: 0;
      }
      .game-card .gc-statement.correct {
        border-left-color: #c8862a;
        background: rgba(200, 134, 42, 0.08);
      }

      .game-card .gc-stxt {
        font-size: clamp(7px, 1.4vw, 9px);
        color: #1a1408;
        line-height: 1.3;
        flex: 1;
        white-space: nowrap;
      }

      .game-card .gc-bwrap {
        position: relative;
        flex-shrink: 0;
      }

      .game-card select {
        appearance: none;
        -webkit-appearance: none;
        font-family: "Courier New", monospace;
        font-size: clamp(7px, 1.3vw, 9px);
        color: #1a1408;
        background: rgba(200, 134, 42, 0.12);
        border: 1px solid rgba(26, 20, 8, 0.35);
        border-bottom: 2px solid rgba(26, 20, 8, 0.6);
        padding: 2px clamp(14px, 3vw, 18px) 2px clamp(4px, 1vw, 6px);
        cursor: pointer;
        border-radius: 1px;
        outline: none;
        min-width: clamp(68px, 15vw, 105px);
        transition:
          background 0.2s,
          border-color 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .game-card select:focus {
        background: rgba(200, 134, 42, 0.2);
        border-color: #c8862a;
      }
      .game-card select.gc-correct {
        background: rgba(200, 134, 42, 0.25);
        border-color: #c8862a;
        color: #3a2800;
        font-weight: 700;
        pointer-events: none;
      }
      .game-card select.gc-wrong {
        animation: gc-shake 0.35s ease;
      }
      @keyframes gc-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-4px);
        }
        40% {
          transform: translateX(4px);
        }
        60% {
          transform: translateX(-3px);
        }
        80% {
          transform: translateX(3px);
        }
      }
      .game-card .gc-arrow {
        position: absolute;
        right: clamp(3px, 0.8vw, 6px);
        top: 50%;
        transform: translateY(-50%);
        font-size: clamp(6px, 1.1vw, 8px);
        color: rgba(26, 20, 8, 0.4);
        pointer-events: none;
      }

      .game-card .gc-progress {
        display: flex;
        justify-content: center;
        gap: 5px;
        margin: clamp(4px, 1%, 7px) 0;
        flex-shrink: 0;
      }
      .game-card .gc-dot {
        width: clamp(5px, 1.1vw, 7px);
        height: clamp(5px, 1.1vw, 7px);
        border-radius: 50%;
        background: rgba(26, 20, 8, 0.2);
        border: 1px solid rgba(26, 20, 8, 0.3);
        transition:
          background 0.4s,
          border-color 0.4s,
          transform 0.3s;
      }
      .game-card .gc-dot.lit {
        background: #c8862a;
        border-color: #c8862a;
        transform: scale(1.2);
        box-shadow: 0 0 6px rgba(200, 134, 42, 0.5);
      }

      .game-card .gc-footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-shrink: 0;
      }
      .game-card .gc-ref {
        font-size: clamp(4px, 0.8vw, 6px);
        color: rgba(26, 20, 8, 0.3);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .game-card .gc-stamp {
        font-size: clamp(6px, 1.2vw, 8px);
        color: rgba(140, 30, 20, 0);
        border: 2px solid rgba(140, 30, 20, 0);
        padding: 2px 5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transform: rotate(-4deg);
        transition:
          color 0.8s,
          border-color 0.8s;
      }
      .game-card .gc-stamp.revealed {
        color: rgba(140, 30, 20, 0.65);
        border-color: rgba(140, 30, 20, 0.5);
      }
      .loupe {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(74vw, 520px);
        height: 74px;
        transform: translate(-50%, -50%);
        z-index: 25;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
        filter: drop-shadow(0 13px 22px rgba(0, 0, 0, 0.52));
      }

      .loupe.active {
        opacity: 1;
        pointer-events: auto;
      }

      .loupe-glass {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 999px / 42px;
        border-top: 1px solid rgba(255, 224, 160, 0.54);
        border-bottom: 1px solid rgba(60, 33, 8, 0.92);
        background: linear-gradient(
          to bottom,
          rgba(255, 238, 188, 0.42) 0%,
          rgba(255, 239, 196, 0.16) 17%,
          rgba(255, 255, 255, 0.02) 47%,
          rgba(75, 42, 10, 0.14) 100%
        );
        box-shadow:
          inset 0 16px 22px rgba(255, 235, 185, 0.22),
          inset 0 -12px 18px rgba(32, 18, 5, 0.42),
          inset 0 0 34px rgba(255, 230, 170, 0.1),
          0 0 0 1px rgba(200, 134, 42, 0.22),
          0 0 28px rgba(200, 134, 42, 0.13);
        backdrop-filter: blur(0.6px);
      }

      .loupe-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .loupe-glass::before {
        content: "";
        position: absolute;
        left: 3%;
        right: 3%;
        top: 5px;
        height: 18px;
        border-radius: 999px;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.28),
          rgba(255, 255, 255, 0.04),
          transparent
        );
        mix-blend-mode: screen;
        z-index: 2;
      }

      .loupe-glass::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0, 0, 0, 0.2) 78%,
            rgba(0, 0, 0, 0.36) 100%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.08) 0px,
            rgba(0, 0, 0, 0.08) 1px,
            transparent 1px,
            transparent 4px
          );
        z-index: 3;
      }

      .loupe-center-mark {
        position: absolute;
        left: 4%;
        right: 4%;
        top: 50%;
        height: 1px;
        background: rgba(200, 134, 42, 0.1);
        z-index: 4;
        pointer-events: none;
      }

      /* ── Controls ───────────────────────────────────────────────────────── */
      .skip-btn,
      .next-btn,
      .loupe-btn {
        position: absolute;
        z-index: 30;
        color: var(--amber-dim);
        background: none;
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .skip-btn {
        top: calc(18px + var(--reader-top-safe));
        right: 22px;
        font-size: 10px;
        letter-spacing: 0.32em;
        padding: 8px 4px;
      }

      .next-btn {
        bottom: calc(26px + var(--reader-bottom-safe));
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.42em;
        padding: 14px 26px;
      }

      .next-btn[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }

      .loupe-btn {
        right: 20px;
        bottom: calc(68px + var(--reader-bottom-safe));
        font-size: 23px;
        line-height: 1;
        padding: 10px;
      }

      .skip-btn:hover,
      .skip-btn:active,
      .next-btn:hover,
      .next-btn:active,
      .loupe-btn:hover,
      .loupe-btn:active,
      .loupe-btn.active {
        color: var(--amber-soft);
      }

      .next-btn .arrow {
        display: inline-block;
        margin-left: 7px;
        animation: arrow-pulse 1.8s ease-in-out infinite;
      }

      @keyframes arrow-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: translateX(0);
        }
        50% {
          opacity: 1;
          transform: translateX(4px);
        }
      }

      .focus-switch {
        position: absolute;
        z-index: 31;
        right: 18px;
        top: calc(50% + 96px);
        width: 38px;
        height: 132px;
        transform: translateY(-50%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .focus-switch.active {
        opacity: 0.78;
        pointer-events: auto;
      }

      .focus-switch::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 10px;
        bottom: 10px;
        width: 5px;
        border-radius: 999px;
        background: linear-gradient(
          to bottom,
          rgba(255, 220, 145, 0.18),
          rgba(200, 134, 42, 0.36),
          rgba(45, 25, 5, 0.66)
        );
        box-shadow:
          inset 0 0 4px rgba(0, 0, 0, 0.8),
          0 0 10px rgba(200, 134, 42, 0.12);
      }

      .focus-slider {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 120px;
        height: 34px;
        transform: translate(-50%, -50%) rotate(-90deg);
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        outline: none;
      }

      .focus-slider::-webkit-slider-runnable-track {
        height: 2px;
        background: transparent;
      }

      .focus-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 235, 186, 0.36);
        background:
          radial-gradient(
            ellipse at 45% 35%,
            rgba(255, 255, 255, 0.46),
            transparent 38%
          ),
          linear-gradient(
            to bottom,
            rgba(225, 215, 190, 0.96),
            rgba(150, 130, 105, 0.96)
          );
        box-shadow:
          0 6px 10px rgba(0, 0, 0, 0.58),
          inset 0 0 8px rgba(255, 255, 255, 0.18);
      }

      .focus-slider::-moz-range-thumb {
        width: 28px;
        height: 20px;
        border-radius: 12px;
        border: 1px solid rgba(255, 235, 186, 0.36);
        background: rgba(210, 198, 170, 0.96);
      }

      .retrieval-caption {
        position: absolute;
        z-index: 30;
        left: 22px;
        bottom: calc(22px + var(--reader-bottom-safe));
        max-width: 42vw;
        font-size: 9px;
        letter-spacing: 0.22em;
        line-height: 1.5;
        color: rgba(200, 134, 42, 0.22);
        text-transform: uppercase;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        .retrieval-caption {
          display: none;
        }
      }
      /* Projector lamp revealed inside the reader frame while cards change. */
      .projection-frame::before {
        content: "";
        position: absolute;
        inset: -14%;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(
            ellipse at center,
            rgba(255, 225, 150, 0.42) 0%,
            rgba(200, 134, 42, 0.24) 34%,
            rgba(85, 48, 12, 0.1) 62%,
            transparent 78%
          ),
          radial-gradient(
            ellipse at center,
            rgba(255, 248, 220, 0.18) 0%,
            transparent 48%
          );
        filter: blur(0.35px);
        transition: opacity 140ms ease;
      }

      .gate.advancing .projection-frame::before {
        opacity: 1;
        animation: exposed-projector-lamp 760ms ease-in-out forwards;
      }

      @keyframes exposed-projector-lamp {
        0% {
          opacity: 0.12;
          filter: blur(1.2px) brightness(0.75);
        }
        22% {
          opacity: 0.9;
          filter: blur(0.35px) brightness(1.18);
        }
        58% {
          opacity: 0.72;
          filter: blur(0.55px) brightness(1);
        }
        100% {
          opacity: 0.18;
          filter: blur(1px) brightness(0.82);
        }
      }
    </style>
  </head>
  <body>
    <div class="machine">
      <div class="gate" id="gate">
        <div class="projection-frame fiche-document" id="projection-frame">
          <div class="fiche-stage" id="fiche-stage">
            <img class="fiche-img" id="fiche-img" alt="" draggable="false" />
            <div class="game-card" id="game-card" aria-hidden="true"></div>
          </div>

          <div class="scanlines"></div>
          <div class="vignette"></div>
          <canvas class="grain" id="grain-canvas"></canvas>

          <div class="loupe" id="loupe" aria-hidden="true">
            <div class="loupe-glass" id="loupe-glass">
              <canvas class="loupe-canvas" id="loupe-canvas"></canvas>
              <div class="loupe-center-mark"></div>
            </div>
          </div>
        </div>

        <button class="skip-btn" id="skip-btn" type="button">
          SKIP ALL ▶▶▶
        </button>
        <button
          class="loupe-btn"
          id="loupe-btn"
          type="button"
          title="Toggle split glass rod reader"
        >
          ⊕
        </button>

        <div
          class="focus-switch"
          id="focus-switch"
          aria-label="Lens focus control"
        >
          <input
            class="focus-slider"
            id="focus-slider"
            type="range"
            min="1.8"
            max="3.2"
            step="0.05"
            value="2.45"
            aria-label="Lens focus"
          />
        </div>

        <button class="next-btn" id="next-btn" type="button">
          NEXT <span class="arrow">▶▶</span>
        </button>

        <div class="retrieval-caption">
          Frame alignment · emulsion stable · retrieval continuing
        </div>
      </div>
    </div>

    <script>
      const SEQUENCE = [
        {
          card: "cover",
          img: "/imagebank/preamble/cover.png",
          next: "prologue",
        },
        {
          card: "prologue",
          img: "/imagebank/preamble/prologue.png",
          next: "difference-1",
        },
        {
          card: "difference-1",
          img: "/imagebank/preamble/difference-1.png",
          next: "difference-game",
        },
        {
          card: "difference-game",
          type: "game",
          next: "difference-2",
        },
        {
          card: "difference-2",
          img: "/imagebank/preamble/difference-2.png",
          next: "charter-1",
        },
        {
          card: "charter-1",
          img: "/imagebank/preamble/charter-1.png",
          next: "charter-2",
        },
        {
          card: "charter-2",
          img: "/imagebank/preamble/charter-2.png",
          next: "charter-3",
        },
        {
          card: "charter-3",
          img: "/imagebank/preamble/charter-3.png",
          next: "charter-4",
        },
        {
          card: "charter-4",
          img: "/imagebank/preamble/charter-4.png",
          next: "charter-5",
        },
        {
          card: "charter-5",
          img: "/imagebank/preamble/charter-5.png",
          next: "charter-6",
        },
        {
          card: "charter-6",
          img: "/imagebank/preamble/charter-6.png",
          next: "charter-7",
        },
        {
          card: "charter-7",
          img: "/imagebank/preamble/charter-7.png",
          next: "charter-8",
        },
        {
          card: "charter-8",
          img: "/imagebank/preamble/charter-8.png",
          next: null,
        },
      ];

      const LANDING = "/landing";
      const AUDIO_SRC = "/audio/fiche-advance.wav";

      function getParams() {
        const p = new URLSearchParams(window.location.search);
        return {
          card: p.get("card") || "cover",
          preview: p.get("preview") === "1",
        };
      }

      const params = getParams();
      let currentEntry =
        SEQUENCE.find((s) => s.card === params.card) || SEQUENCE[0];

      const gate = document.getElementById("gate");
      const projectionFrame = document.getElementById("projection-frame");
      const ficheStage = document.getElementById("fiche-stage");
      const ficheImg = document.getElementById("fiche-img");
      const nextBtn = document.getElementById("next-btn");
      const skipBtn = document.getElementById("skip-btn");
      const grainCvs = document.getElementById("grain-canvas");
      const gCtx = grainCvs.getContext("2d", { willReadFrequently: true });

      let audioCtx = null;
      let audioBuffer = null;

      const viewState = {
        zoom: 1,
        panX: 0,
        panY: 0,
      };

      async function loadAudio() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const res = await fetch(AUDIO_SRC);
          const arr = await res.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(arr);
        } catch (_e) {}
      }

      function playAdvanceSound() {
        if (!audioCtx || !audioBuffer) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);
        src.start(0);
      }

      function resizeGrain() {
        grainCvs.width = 180;
        grainCvs.height = 180;
      }

      function drawGrain() {
        const w = grainCvs.width;
        const h = grainCvs.height;
        const imgd = gCtx.createImageData(w, h);
        const d = imgd.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 18;
        }
        gCtx.putImageData(imgd, 0, 0);
        setTimeout(() => requestAnimationFrame(drawGrain), 70);
      }

      function setNextLabel(entry) {
        if (!entry.next) {
          nextBtn.innerHTML = 'ENTER <span class="arrow">▶▶</span>';
        } else {
          nextBtn.innerHTML = 'NEXT <span class="arrow">▶▶</span>';
        }
      }

      function resetZoom() {
        viewState.zoom = 1;
        viewState.panX = 0;
        viewState.panY = 0;
        applyImageTransform();
      }

      function applyImageTransform() {
        ficheImg.style.transform = `translate(${viewState.panX}px, ${viewState.panY}px) scale(${viewState.zoom})`;
        window.NCEArchive?.syncLoupe?.();
      }

      function preloadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = reject;
          img.src = src;
        });
      }

      const gameCard = document.getElementById("game-card");
      let gameComplete = false;

      function buildGameCard() {
        gameComplete = false;
        nextBtn.disabled = true;
        const answered = new Array(7).fill(false);
        const questions = [
          {
            text: "the positive instead of the",
            correct: "negative",
            options: ["profitable", "viral", "negative", "popular"],
          },
          {
            text: "the loving instead of the",
            correct: "hateful",
            options: ["indifferent", "hateful", "distant", "transactional"],
          },
          {
            text: "the collaborative instead of the",
            correct: "exploitative",
            options: ["competitive", "isolated", "exploitative", "scalable"],
          },
          {
            text: "the honest instead of the",
            correct: "deceptive",
            options: ["deceptive", "vague", "optimized", "curated"],
          },
          {
            text: "the empowering instead of the",
            correct: "diminishing",
            options: ["profitable", "diminishing", "engaging", "addictive"],
          },
          {
            text: "the conscious instead of the",
            correct: "unconscious",
            options: ["slow", "deliberate", "unconscious", "automated"],
          },
          {
            text: "the voluntary instead of the",
            correct: "mandatory",
            options: ["expensive", "mandatory", "subscribed", "gated"],
          },
        ];

        const html = `
          <div class="gc-inner">
            <div class="gc-header">
              <div class="gc-hcell"><strong>Classified</strong>Eyes Only</div>
              <div class="gc-hcell"><strong>Case</strong>The Preamble</div>
              <div class="gc-hcell"><strong>File No.</strong>NCE-PRE-0002</div>
            </div>
            <div class="gc-title">
              <h2>Complete the Record</h2>
              <p>We have built infrastructure that rewards —</p>
            </div>
            <hr class="gc-divider"/>
            <div class="gc-statements">
              ${questions
                .map(
                  (q, i) => `
                <div class="gc-statement" id="gcs${i}">
                  <span class="gc-stxt">${q.text}</span>
                  <div class="gc-bwrap">
                    <select id="gcq${i}" data-idx="${i}" data-correct="${q.correct}">
                      <option value="">— select —</option>
                      ${q.options.map((o) => `<option value="${o}">${o}</option>`).join("")}
                    </select>
                    <span class="gc-arrow">▾</span>
                  </div>
                </div>
              `,
                )
                .join("")}
            </div>
            <div class="gc-progress">
              ${questions.map((_, i) => `<div class="gc-dot" id="gcd${i}"></div>`).join("")}
            </div>
            <div class="gc-footer">
              <span class="gc-ref">Frame 002 of 250 · Emulsion stable</span>
              <span class="gc-stamp" id="gcstamp">Record Complete</span>
            </div>
          </div>`;

        gameCard.innerHTML = html;

        gameCard.querySelectorAll("select").forEach((sel) => {
          sel.addEventListener("change", function () {
            const idx = parseInt(this.dataset.idx);
            const correct = this.dataset.correct;
            if (answered[idx]) return;
            if (this.value === correct) {
              answered[idx] = true;
              this.classList.add("gc-correct");
              document.getElementById("gcs" + idx).classList.add("correct");
              document.getElementById("gcd" + idx).classList.add("lit");
              if (answered.every(Boolean)) {
                setTimeout(() => {
                  document.getElementById("gcstamp").classList.add("revealed");
                  setTimeout(() => {
                    gameComplete = true;
                    nextBtn.disabled = false;
                  }, 700);
                }, 300);
              }
            } else {
              this.classList.add("gc-wrong");
              setTimeout(() => {
                this.classList.remove("gc-wrong");
                this.value = "";
              }, 400);
            }
          });
        });
      }

      async function mechanicalAdvanceTo(entry, options = {}) {
        const { firstLoad = false, updateUrl = false } = options;
        nextBtn.disabled = true;
        gate.classList.remove("loaded");
        gate.classList.add("advancing");

        window.NCEArchive?.deactivateLoupe?.();

        playAdvanceSound();

        if (!firstLoad) {
          ficheStage.style.transition = "opacity 130ms ease, filter 130ms ease";
          ficheStage.style.opacity = "0";
          ficheStage.style.filter = "brightness(0.38) contrast(1.18)";
          await wait(140);
        } else {
          await wait(450);
        }

        try {
          if (entry.img) await preloadImage(entry.img);
        } catch (_e) {}

        currentEntry = entry;
        setNextLabel(entry);
        resetZoom();

        // Handle game card vs image card
        if (entry.type === "game") {
          ficheImg.style.display = "none";
          gameCard.classList.add("active");
          gameCard.removeAttribute("aria-hidden");
          buildGameCard();
        } else {
          ficheImg.style.display = "";
          gameCard.classList.remove("active");
          gameCard.setAttribute("aria-hidden", "true");
          gameCard.innerHTML = "";
          if (entry.img) ficheImg.src = entry.img;
        }

        window.NCEArchive?.syncLoupe?.();

        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("card", entry.card);
          window.history.pushState({}, "", url.toString());
        }

        ficheStage.classList.remove("visible");
        ficheStage.style.transition = "none";
        ficheStage.style.opacity = "0";
        ficheStage.style.filter = "brightness(0.55) contrast(1.2) blur(0.35px)";
        ficheStage.offsetHeight;

        ficheStage.style.transition = "opacity 240ms ease, filter 360ms ease";
        ficheStage.style.opacity = "1";
        ficheStage.style.filter = "brightness(1.04) contrast(1.02) blur(0)";
        await wait(380);

        ficheStage.classList.add("visible");
        ficheStage.style.transition = "";
        ficheStage.style.opacity = "";
        ficheStage.style.filter = "";
        gate.classList.remove("advancing");
        gate.classList.add("loaded");
        nextBtn.disabled = false;
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function advance() {
        if (nextBtn.disabled) return;
        if (currentEntry.type === "game" && !gameComplete) return;
        if (!currentEntry.next) {
          nextBtn.disabled = true;
          playAdvanceSound();
          await wait(420);
          window.location.href = LANDING;
          return;
        }
        const next = SEQUENCE.find((s) => s.card === currentEntry.next);
        if (!next) return;
        await mechanicalAdvanceTo(next, { updateUrl: true });
      }

      nextBtn.addEventListener("click", advance);
      skipBtn.addEventListener("click", () => {
        window.location.href = LANDING;
      });

      window.addEventListener("popstate", () => {
        const p = new URLSearchParams(window.location.search);
        const card = p.get("card") || "cover";
        const entry = SEQUENCE.find((s) => s.card === card) || SEQUENCE[0];
        mechanicalAdvanceTo(entry, { firstLoad: false, updateUrl: false });
      });

      // ── Split cylindrical glass rod loupe. ─────────────────────────────────
      (function loupeSystem() {
        const loupe = document.getElementById("loupe");
        const loupeCanvas = document.getElementById("loupe-canvas");
        const loupeBtn = document.getElementById("loupe-btn");
        const focusSwitch = document.getElementById("focus-switch");
        const focusSlider = document.getElementById("focus-slider");
        const ctx = loupeCanvas.getContext("2d", { willReadFrequently: true });

        const TEXT_SAFE_LEFT = 0.118;
        const TEXT_SAFE_RIGHT = 0.918;

        let active = false;
        let centerY = 0;
        let dragging = false;
        let rafPending = false;

        function getContainedImageRect() {
          const frame = projectionFrame.getBoundingClientRect();
          const naturalW = ficheImg.naturalWidth || 1;
          const naturalH = ficheImg.naturalHeight || 1;
          const frameRatio = frame.width / frame.height;
          const imgRatio = naturalW / naturalH;

          let baseW;
          let baseH;

          if (imgRatio > frameRatio) {
            baseW = frame.width;
            baseH = frame.width / imgRatio;
          } else {
            baseH = frame.height;
            baseW = frame.height * imgRatio;
          }

          const baseLeft = (frame.width - baseW) / 2;
          const baseTop = (frame.height - baseH) / 2;
          const z = viewState.zoom;
          const renderedW = baseW * z;
          const renderedH = baseH * z;

          return {
            frame,
            naturalW,
            naturalH,
            renderedW,
            renderedH,
            renderedLeft: baseLeft - (renderedW - baseW) / 2 + viewState.panX,
            renderedTop: baseTop - (renderedH - baseH) / 2 + viewState.panY,
          };
        }

        function resizeLoupeCanvas() {
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const rect = loupe.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width * dpr));
          const h = Math.max(1, Math.round(rect.height * dpr));

          if (loupeCanvas.width !== w || loupeCanvas.height !== h) {
            loupeCanvas.width = w;
            loupeCanvas.height = h;
          }
        }

        function scheduleDraw() {
          if (!active || rafPending) return;
          rafPending = true;
          requestAnimationFrame(() => {
            rafPending = false;
            drawLoupe();
          });
        }

        function syncLoupe() {
          scheduleDraw();
        }

        function drawLoupe() {
          if (!active || !ficheImg.complete || !ficheImg.naturalWidth) return;

          resizeLoupeCanvas();

          const r = getContainedImageRect();
          const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          const outW = loupeCanvas.width;
          const outH = loupeCanvas.height;

          centerY = Math.max(
            22,
            Math.min(r.frame.height - 22, centerY || r.frame.height / 2),
          );

          loupe.style.top = `${centerY}px`;

          const focus = parseFloat(focusSlider.value || "2.45");
          const verticalZoom = focus;
          const distortion = 0.14 + (focus - 1.8) * 0.08;

          const safeX = r.naturalW * TEXT_SAFE_LEFT;
          const safeW = r.naturalW * (TEXT_SAFE_RIGHT - TEXT_SAFE_LEFT);

          const naturalY =
            ((centerY - r.renderedTop) / Math.max(1, r.renderedH)) * r.naturalH;

          const naturalPixelsPerCssPixel =
            r.naturalH / Math.max(1, r.renderedH);
          const sourceH =
            ((outH / dpr) * naturalPixelsPerCssPixel) / verticalZoom;
          const sourceY = Math.max(
            0,
            Math.min(r.naturalH - sourceH, naturalY - sourceH / 2),
          );

          ctx.clearRect(0, 0, outW, outH);
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";

          const strip = Math.max(2, Math.floor(outW / 220));

          for (let x = 0; x < outW; x += strip) {
            const w = Math.min(strip, outW - x);
            const t1 = x / outW;
            const t2 = (x + w) / outW;
            const u1 = cylinderMap(t1, distortion);
            const u2 = cylinderMap(t2, distortion);
            const sx = safeX + u1 * safeW;
            const sw = Math.max(1, (u2 - u1) * safeW);

            ctx.drawImage(ficheImg, sx, sourceY, sw, sourceH, x, 0, w, outH);
          }

          const glow = ctx.createLinearGradient(0, 0, 0, outH);
          glow.addColorStop(0, "rgba(255,246,214,0.22)");
          glow.addColorStop(0.22, "rgba(255,236,190,0.08)");
          glow.addColorStop(0.5, "rgba(255,255,255,0.00)");
          glow.addColorStop(1, "rgba(0,0,0,0.26)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, outW, outH);

          const edge = ctx.createRadialGradient(
            outW / 2,
            outH / 2,
            outW * 0.18,
            outW / 2,
            outH / 2,
            outW * 0.58,
          );
          edge.addColorStop(0, "rgba(255,255,255,0)");
          edge.addColorStop(0.78, "rgba(255,255,255,0)");
          edge.addColorStop(1, "rgba(0,0,0,0.28)");
          ctx.fillStyle = edge;
          ctx.fillRect(0, 0, outW, outH);
        }

        function cylinderMap(t, k) {
          const p = t * 2 - 1;
          const curved = p + k * (p * p * p - p);
          return Math.max(0, Math.min(1, (curved + 1) / 2));
        }

        function setY(clientY) {
          const frame = projectionFrame.getBoundingClientRect();
          centerY = clientY - frame.top;
          scheduleDraw();
        }

        loupeBtn.addEventListener("click", () => {
          active = !active;
          loupe.classList.toggle("active", active);
          loupeBtn.classList.toggle("active", active);
          focusSwitch.classList.toggle("active", active);

          if (active) {
            centerY = projectionFrame.getBoundingClientRect().height / 2;
            scheduleDraw();
          }
        });

        focusSlider.addEventListener("input", scheduleDraw);

        projectionFrame.addEventListener("pointerdown", (e) => {
          if (!active) return;
          dragging = true;
          setY(e.clientY);
          projectionFrame.setPointerCapture(e.pointerId);
        });

        projectionFrame.addEventListener("pointermove", (e) => {
          if (!active || !dragging) return;
          setY(e.clientY);
        });

        function stopDrag() {
          dragging = false;
        }

        projectionFrame.addEventListener("pointerup", stopDrag);
        projectionFrame.addEventListener("pointercancel", stopDrag);
        window.addEventListener("resize", scheduleDraw);

        window.NCEArchive = window.NCEArchive || {};
        window.NCEArchive.syncLoupe = syncLoupe;
        window.NCEArchive.isLoupeActive = () => active;
        window.NCEArchive.deactivateLoupe = () => {
          active = false;
          dragging = false;
          loupe.classList.remove("active");
          loupeBtn.classList.remove("active");
          focusSwitch.classList.remove("active");

          if (ctx && loupeCanvas) {
            ctx.clearRect(0, 0, loupeCanvas.width, loupeCanvas.height);
          }
        };
      })();

      (function lampSystem() {
        function flicker() {
          gate.classList.add("flickering");
          setTimeout(() => gate.classList.remove("flickering"), 700);
          const next = params.preview ? 5000 : (45 + Math.random() * 45) * 1000;
          setTimeout(flicker, next);
        }
        setTimeout(
          flicker,
          params.preview ? 1000 : (20 + Math.random() * 20) * 1000,
        );
      })();

      window.NCEArchive = window.NCEArchive || {};
      Object.assign(window.NCEArchive, {
        gate,
        projectionFrame,
        ficheStage,
        ficheImg,
        getCurrentEntry: () => currentEntry,
        syncLoupe: window.NCEArchive.syncLoupe,
      });

      resizeGrain();
      drawGrain();
      loadAudio();
      mechanicalAdvanceTo(currentEntry, { firstLoad: true, updateUrl: false });
    </script>
    <script src="/randanime_preamble.js"></script>
  </body>
