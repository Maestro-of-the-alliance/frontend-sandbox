<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>NCE · ARCHIVE</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --void: #070604;
        --amber: #c8862a;
        --amber-soft: rgba(200, 134, 42, 0.72);
        --amber-dim: rgba(200, 134, 42, 0.28);
        --amber-faint: rgba(200, 134, 42, 0.12);
        --reader-top-safe: env(safe-area-inset-top, 0px);
        --reader-bottom-safe: env(safe-area-inset-bottom, 0px);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--void);
        font-family: "Courier New", Courier, monospace;
        touch-action: none;
      }

      button,
      input {
        font-family: inherit;
      }

      .machine {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse at center,
            rgba(80, 50, 14, 0.1),
            transparent 55%
          ),
          #000;
      }

      .gate {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #000;
        isolation: isolate;
      }

      .gate::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: radial-gradient(
          ellipse at center,
          rgba(200, 134, 42, 0.16) 0%,
          rgba(120, 70, 18, 0.06) 38%,
          transparent 70%
        );
        opacity: 1;
        transition: opacity 420ms ease;
      }

      .gate.loaded::before {
        opacity: 0;
      }

      /*
        Authoritative scanner window.
        The document never owns the browser viewport anymore.
        The scanner window owns the document.
      */
      .projection-frame {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: calc(50% - 18px);
        transform: translate(-50%, -50%);
        width: min(90vw, 68vh);
        aspect-ratio: 3 / 4;
        overflow: hidden;
        background: #000;
        box-shadow:
          0 28px 84px rgba(0, 0, 0, 0.82),
          inset 0 0 0 1px rgba(255, 220, 140, 0.08),
          inset 0 0 72px rgba(0, 0, 0, 0.42);
      }

      @media (orientation: landscape) {
        .projection-frame {
          width: min(62vw, 70vh);
          top: 50%;
        }
      }

      @media (max-height: 720px) {
        .projection-frame {
          width: min(86vw, 64vh);
          top: calc(50% - 10px);
        }
      }

      .fiche-stage {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        opacity: 0;
        filter: brightness(0.8) contrast(1.05);
        transition: none;
        will-change: opacity, filter;
      }

      .fiche-stage.visible {
        opacity: 1;
        filter: brightness(1) contrast(1);
      }

      .fiche-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        object-position: center;
        opacity: 1;
        transform-origin: center center;
        will-change: transform, filter;
        user-select: none;
        -webkit-user-drag: none;
      }

      .scanlines,
      .vignette,
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .scanlines {
        z-index: 10;
        background: repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 2px,
          rgba(0, 0, 0, 0.2) 2px,
          rgba(0, 0, 0, 0.2) 4px
        );
        mix-blend-mode: multiply;
      }

      .vignette {
        z-index: 11;
        background: radial-gradient(
          ellipse at center,
          transparent 48%,
          rgba(0, 0, 0, 0.4) 78%,
          rgba(0, 0, 0, 0.78) 100%
        );
      }

      .grain {
        z-index: 12;
        width: 180px;
        height: 180px;
        opacity: 0.08;
        image-rendering: pixelated;
        transform: scale(12);
        transform-origin: top left;
      }

      .gate.flickering .fiche-stage {
        animation: lamp-flicker 620ms ease-in-out forwards;
      }

      @keyframes lamp-flicker {
        0% {
          filter: brightness(1) contrast(1);
        }
        10% {
          filter: brightness(0.68) contrast(1.04);
        }
        20% {
          filter: brightness(0.95) contrast(1.02);
        }
        35% {
          filter: brightness(0.52) contrast(1.08);
        }
        50% {
          filter: brightness(1.08) contrast(0.98);
        }
        65% {
          filter: brightness(0.78) contrast(1.06);
        }
        100% {
          filter: brightness(1) contrast(1);
        }
      }

      /* ── Horizontal reader loupe ── */
      .loupe {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 86px;
        transform: translateY(-50%);
        z-index: 25;
        opacity: 0;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .loupe.active {
        opacity: 1;
        pointer-events: auto;
      }

      .loupe-glass {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-top: 1px solid rgba(200, 134, 42, 0.72);
        border-bottom: 1px solid rgba(200, 134, 42, 0.72);
        background: rgba(12, 8, 2, 0.12);
        box-shadow:
          0 0 0 1px rgba(200, 134, 42, 0.14),
          0 0 16px rgba(200, 134, 42, 0.1),
          inset 0 0 22px rgba(200, 134, 42, 0.05);
      }

      .loupe-glass img {
        position: absolute;
        max-width: none;
        height: auto;
        transform-origin: top left;
        user-select: none;
        -webkit-user-drag: none;
      }

      .loupe-edge-top,
      .loupe-edge-bottom {
        position: absolute;
        left: 0;
        right: 0;
        height: 14px;
        z-index: 2;
        pointer-events: none;
      }

      .loupe-edge-top {
        top: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.38),
          transparent
        );
      }

      .loupe-edge-bottom {
        bottom: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.38), transparent);
      }

      .loupe-center-mark {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: rgba(200, 134, 42, 0.12);
        z-index: 3;
        pointer-events: none;
      }

      /* ── Controls ── */
      .skip-btn,
      .next-btn,
      .loupe-btn {
        position: absolute;
        z-index: 30;
        color: var(--amber-dim);
        background: none;
        border: none;
        cursor: pointer;
        text-transform: uppercase;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .skip-btn {
        top: calc(18px + var(--reader-top-safe));
        right: 22px;
        font-size: 10px;
        letter-spacing: 0.32em;
        padding: 8px 4px;
      }

      .next-btn {
        bottom: calc(26px + var(--reader-bottom-safe));
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        letter-spacing: 0.42em;
        padding: 14px 26px;
      }

      .next-btn[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }

      .loupe-btn {
        right: 20px;
        bottom: calc(68px + var(--reader-bottom-safe));
        font-size: 23px;
        line-height: 1;
        padding: 10px;
      }

      .skip-btn:hover,
      .skip-btn:active,
      .next-btn:hover,
      .next-btn:active,
      .loupe-btn:hover,
      .loupe-btn:active,
      .loupe-btn.active {
        color: var(--amber-soft);
      }

      .next-btn .arrow {
        display: inline-block;
        margin-left: 7px;
        animation: arrow-pulse 1.8s ease-in-out infinite;
      }

      @keyframes arrow-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: translateX(0);
        }
        50% {
          opacity: 1;
          transform: translateX(4px);
        }
      }

      .zoom-rail {
        position: absolute;
        z-index: 30;
        bottom: calc(77px + var(--reader-bottom-safe));
        left: 50%;
        width: min(180px, 42vw);
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 9px;
        opacity: 0.58;
        transition: opacity 160ms ease;
      }

      .zoom-rail:hover,
      .zoom-rail:active {
        opacity: 1;
      }

      .zoom-rail-label {
        font-size: 9px;
        letter-spacing: 0.2em;
        color: rgba(200, 134, 42, 0.72);
      }

      .zoom-slider {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 2px;
        border-radius: 2px;
        background: rgba(200, 134, 42, 0.26);
        outline: none;
      }

      .zoom-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid rgba(200, 134, 42, 0.45);
        background: rgba(200, 134, 42, 0.9);
        box-shadow: 0 0 9px rgba(200, 134, 42, 0.36);
      }

      .zoom-slider::-moz-range-thumb {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid rgba(200, 134, 42, 0.45);
        background: rgba(200, 134, 42, 0.9);
      }

      .retrieval-caption {
        position: absolute;
        z-index: 30;
        left: 22px;
        bottom: calc(22px + var(--reader-bottom-safe));
        max-width: 42vw;
        font-size: 9px;
        letter-spacing: 0.22em;
        line-height: 1.5;
        color: rgba(200, 134, 42, 0.22);
        text-transform: uppercase;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        .retrieval-caption {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="machine">
      <div class="gate" id="gate">
        <div class="projection-frame fiche-document" id="projection-frame">
          <div class="fiche-stage" id="fiche-stage">
            <img class="fiche-img" id="fiche-img" alt="" draggable="false" />
          </div>

          <div class="scanlines"></div>
          <div class="vignette"></div>
          <canvas class="grain" id="grain-canvas"></canvas>

          <div class="loupe" id="loupe" aria-hidden="true">
            <div class="loupe-glass" id="loupe-glass">
              <img id="loupe-img" alt="" draggable="false" />
              <div class="loupe-edge-top"></div>
              <div class="loupe-edge-bottom"></div>
              <div class="loupe-center-mark"></div>
            </div>
          </div>
        </div>

        <button class="skip-btn" id="skip-btn" type="button">
          SKIP ALL ▶▶▶
        </button>
        <button
          class="loupe-btn"
          id="loupe-btn"
          type="button"
          title="Toggle horizontal reader magnifier"
        >
          ⊕
        </button>

        <div class="zoom-rail" aria-label="Document zoom controls">
          <span class="zoom-rail-label">−</span>
          <input
            class="zoom-slider"
            id="zoom-slider"
            type="range"
            min="1"
            max="2.2"
            step="0.05"
            value="1"
            aria-label="Zoom"
          />
          <span class="zoom-rail-label">+</span>
        </div>

        <button class="next-btn" id="next-btn" type="button">
          NEXT <span class="arrow">▶▶</span>
        </button>

        <div class="retrieval-caption">
          Frame alignment · emulsion stable · retrieval continuing
        </div>
      </div>
    </div>

    <script>
      const SEQUENCE = [
        {
          card: "cover",
          img: "/imagebank/preamble/cover.png",
          next: "prologue",
        },
        {
          card: "prologue",
          img: "/imagebank/preamble/prologue.png",
          next: "difference-1",
        },
        {
          card: "difference-1",
          img: "/imagebank/preamble/difference-1.png",
          next: "difference-2",
        },
        {
          card: "difference-2",
          img: "/imagebank/preamble/difference-2.png",
          next: "charter-1",
        },
        {
          card: "charter-1",
          img: "/imagebank/preamble/charter-1.png",
          next: "charter-2",
        },
        {
          card: "charter-2",
          img: "/imagebank/preamble/charter-2.png",
          next: "charter-3",
        },
        {
          card: "charter-3",
          img: "/imagebank/preamble/charter-3.png",
          next: "charter-4",
        },
        {
          card: "charter-4",
          img: "/imagebank/preamble/charter-4.png",
          next: "charter-5",
        },
        {
          card: "charter-5",
          img: "/imagebank/preamble/charter-5.png",
          next: "charter-6",
        },
        {
          card: "charter-6",
          img: "/imagebank/preamble/charter-6.png",
          next: "charter-7",
        },
        {
          card: "charter-7",
          img: "/imagebank/preamble/charter-7.png",
          next: "charter-8",
        },
        {
          card: "charter-8",
          img: "/imagebank/preamble/charter-8.png",
          next: null,
        },
      ];

      const LANDING = "/landing";
      const AUDIO_SRC = "/audio/fiche-advance.wav";

      function getParams() {
        const p = new URLSearchParams(window.location.search);
        return {
          card: p.get("card") || "cover",
          preview: p.get("preview") === "1",
        };
      }

      const params = getParams();
      let currentEntry =
        SEQUENCE.find((s) => s.card === params.card) || SEQUENCE[0];

      const gate = document.getElementById("gate");
      const projectionFrame = document.getElementById("projection-frame");
      const ficheStage = document.getElementById("fiche-stage");
      const ficheImg = document.getElementById("fiche-img");
      const nextBtn = document.getElementById("next-btn");
      const skipBtn = document.getElementById("skip-btn");
      const grainCvs = document.getElementById("grain-canvas");
      const gCtx = grainCvs.getContext("2d", { willReadFrequently: true });

      let audioCtx = null;
      let audioBuffer = null;

      const viewState = {
        zoom: 1,
        panX: 0,
        panY: 0,
        panning: false,
        lastPointer: null,
      };

      async function loadAudio() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const res = await fetch(AUDIO_SRC);
          const arr = await res.arrayBuffer();
          audioBuffer = await audioCtx.decodeAudioData(arr);
        } catch (_e) {}
      }

      function playAdvanceSound() {
        if (!audioCtx || !audioBuffer) return;
        if (audioCtx.state === "suspended") audioCtx.resume();
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(audioCtx.destination);
        src.start(0);
      }

      function resizeGrain() {
        grainCvs.width = 180;
        grainCvs.height = 180;
      }

      function drawGrain() {
        const w = grainCvs.width;
        const h = grainCvs.height;
        const imgd = gCtx.createImageData(w, h);
        const d = imgd.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (Math.random() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 18;
        }
        gCtx.putImageData(imgd, 0, 0);
        setTimeout(() => requestAnimationFrame(drawGrain), 70);
      }

      function setNextLabel(entry) {
        if (!entry.next) {
          nextBtn.innerHTML = 'ENTER <span class="arrow">▶▶</span>';
        } else {
          nextBtn.innerHTML = 'NEXT <span class="arrow">▶▶</span>';
        }
      }

      function resetZoom() {
        viewState.zoom = 1;
        viewState.panX = 0;
        viewState.panY = 0;
        document.getElementById("zoom-slider").value = "1";
        applyImageTransform();
      }

      function applyImageTransform() {
        // Only the image owns zoom/pan transform. No transition system touches this.
        const z = viewState.zoom;
        ficheImg.style.transform = `translate(${viewState.panX}px, ${viewState.panY}px) scale(${z})`;
        window.NCEArchive?.syncLoupe?.();
      }

      function clampPan() {
        if (viewState.zoom <= 1.05) {
          viewState.panX = 0;
          viewState.panY = 0;
          return;
        }
        const frame = projectionFrame.getBoundingClientRect();
        const maxX = (frame.width * (viewState.zoom - 1)) / 2;
        const maxY = (frame.height * (viewState.zoom - 1)) / 2;
        viewState.panX = Math.max(-maxX, Math.min(maxX, viewState.panX));
        viewState.panY = Math.max(-maxY, Math.min(maxY, viewState.panY));
      }

      function preloadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = reject;
          img.src = src;
        });
      }

      async function mechanicalAdvanceTo(entry, options = {}) {
        const { firstLoad = false, updateUrl = false } = options;
        nextBtn.disabled = true;
        gate.classList.remove("loaded");
        playAdvanceSound();

        if (!firstLoad) {
          ficheStage.style.transition = "opacity 130ms ease, filter 130ms ease";
          ficheStage.style.opacity = "0";
          ficheStage.style.filter = "brightness(0.38) contrast(1.18)";
          await wait(140);
        } else {
          await wait(450);
        }

        try {
          await preloadImage(entry.img);
        } catch (_e) {
          // If image fails, still attempt to show path so the broken asset is obvious.
        }

        currentEntry = entry;
        setNextLabel(entry);
        resetZoom();
        ficheImg.src = entry.img;
        window.NCEArchive?.syncLoupe?.();

        if (updateUrl) {
          const url = new URL(window.location.href);
          url.searchParams.set("card", entry.card);
          window.history.pushState({}, "", url.toString());
        }

        // Mechanical settle: dark, flicker, stabilize. No sliding. No transform collision.
        ficheStage.classList.remove("visible");
        ficheStage.style.transition = "none";
        ficheStage.style.opacity = "0";
        ficheStage.style.filter = "brightness(0.55) contrast(1.2) blur(0.35px)";
        ficheStage.offsetHeight;

        ficheStage.style.transition = "opacity 240ms ease, filter 360ms ease";
        ficheStage.style.opacity = "1";
        ficheStage.style.filter = "brightness(1.04) contrast(1.02) blur(0)";
        await wait(380);

        ficheStage.classList.add("visible");
        ficheStage.style.transition = "";
        ficheStage.style.opacity = "";
        ficheStage.style.filter = "";
        gate.classList.add("loaded");
        nextBtn.disabled = false;
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      async function advance() {
        if (nextBtn.disabled) return;
        if (!currentEntry.next) {
          nextBtn.disabled = true;
          playAdvanceSound();
          await wait(420);
          window.location.href = LANDING;
          return;
        }
        const next = SEQUENCE.find((s) => s.card === currentEntry.next);
        if (!next) return;
        await mechanicalAdvanceTo(next, { updateUrl: true });
      }

      nextBtn.addEventListener("click", advance);
      skipBtn.addEventListener("click", () => {
        window.location.href = LANDING;
      });

      window.addEventListener("popstate", () => {
        const p = new URLSearchParams(window.location.search);
        const card = p.get("card") || "cover";
        const entry = SEQUENCE.find((s) => s.card === card) || SEQUENCE[0];
        mechanicalAdvanceTo(entry, { firstLoad: false, updateUrl: false });
      });

      // ── Zoom and pan: only ficheImg transform is touched here. ───────────────
      (function zoomSystem() {
        const slider = document.getElementById("zoom-slider");

        slider.addEventListener("input", () => {
          viewState.zoom = parseFloat(slider.value);
          if (viewState.zoom <= 1.05) {
            viewState.panX = 0;
            viewState.panY = 0;
          }
          clampPan();
          applyImageTransform();
        });

        projectionFrame.addEventListener("pointerdown", (e) => {
          if (viewState.zoom <= 1.05) return;
          if (e.target.closest(".loupe")) return;
          if (window.NCEArchive?.isLoupeActive?.()) return;
          viewState.panning = true;
          viewState.lastPointer = { x: e.clientX, y: e.clientY };
          projectionFrame.setPointerCapture(e.pointerId);
        });

        projectionFrame.addEventListener("pointermove", (e) => {
          if (!viewState.panning || !viewState.lastPointer) return;
          const dx = e.clientX - viewState.lastPointer.x;
          const dy = e.clientY - viewState.lastPointer.y;
          viewState.panX += dx;
          viewState.panY += dy;
          viewState.lastPointer = { x: e.clientX, y: e.clientY };
          clampPan();
          applyImageTransform();
        });

        function endPan() {
          viewState.panning = false;
          viewState.lastPointer = null;
        }

        projectionFrame.addEventListener("pointerup", endPan);
        projectionFrame.addEventListener("pointercancel", endPan);
      })();

      // ── Horizontal reader loupe. Registered optical strip. ──────────────────
      (function loupeSystem() {
        const loupe = document.getElementById("loupe");
        const loupeImg = document.getElementById("loupe-img");
        const loupeBtn = document.getElementById("loupe-btn");

        const LOUPE_HEIGHT = 86;
        const LOUPE_ZOOM = 2.25;

        let active = false;
        let centerY = 0;
        let dragging = false;

        function getContainedImageRect() {
          const frame = projectionFrame.getBoundingClientRect();

          const naturalW = ficheImg.naturalWidth || 1;
          const naturalH = ficheImg.naturalHeight || 1;

          const frameRatio = frame.width / frame.height;
          const imgRatio = naturalW / naturalH;

          let baseW;
          let baseH;

          if (imgRatio > frameRatio) {
            baseW = frame.width;
            baseH = frame.width / imgRatio;
          } else {
            baseH = frame.height;
            baseW = frame.height * imgRatio;
          }

          const baseLeft = (frame.width - baseW) / 2;
          const baseTop = (frame.height - baseH) / 2;

          const z = viewState.zoom;
          const renderedW = baseW * z;
          const renderedH = baseH * z;

          const renderedLeft =
            baseLeft - (renderedW - baseW) / 2 + viewState.panX;
          const renderedTop =
            baseTop - (renderedH - baseH) / 2 + viewState.panY;

          return {
            frame,
            renderedW,
            renderedH,
            renderedLeft,
            renderedTop,
          };
        }

        function syncLoupe() {
          if (loupeImg.src !== ficheImg.src) {
            loupeImg.src = ficheImg.src;
          }
          updateLoupe();
        }

        function updateLoupe() {
          if (!active) return;

          const r = getContainedImageRect();

          centerY = Math.max(
            LOUPE_HEIGHT / 2,
            Math.min(
              r.frame.height - LOUPE_HEIGHT / 2,
              centerY || r.frame.height / 2,
            ),
          );

          loupe.style.top = `${centerY}px`;

          const sourceX = r.frame.width / 2;
          const sourceY = centerY;

          // Approximate readable text column bounds inside the fiche image
          const TEXT_LEFT = 0.16;
          const TEXT_RIGHT = 0.93;
          const TEXT_WIDTH = TEXT_RIGHT - TEXT_LEFT;

          // Calculate actual text-column geometry
          const textLeftPx = img.width * TEXT_LEFT;
          const textWidthPx = img.width * TEXT_WIDTH;

          // Scale so the entire text line spans the loupe width
          const effectiveZoom = frame.width / textWidthPx;

          // Slight readability boost without overcropping
          const finalZoom = effectiveZoom * 1.12;

          const zoomedW = img.width * finalZoom;
          const zoomedH = img.height * finalZoom;

          // Align loupe to text column instead of centering image
          const left = -(textLeftPx * finalZoom);
          const top = LOUPE_HEIGHT / 2 - relativeY * finalZoom;

          loupeImg.style.width = `${zoomedW}px`;
          loupeImg.style.height = `${zoomedH}px`;
          loupeImg.style.left = `${left}px`;
          loupeImg.style.top = `${top}px`;
        }

        function setY(clientY) {
          const frame = projectionFrame.getBoundingClientRect();
          centerY = clientY - frame.top;
          updateLoupe();
        }

        loupeBtn.addEventListener("click", () => {
          active = !active;
          loupe.classList.toggle("active", active);
          loupeBtn.classList.toggle("active", active);
          if (active) {
            centerY = projectionFrame.getBoundingClientRect().height / 2;
            syncLoupe();
          }
        });

        projectionFrame.addEventListener("pointerdown", (e) => {
          if (!active) return;
          dragging = true;
          setY(e.clientY);
          projectionFrame.setPointerCapture(e.pointerId);
        });

        projectionFrame.addEventListener("pointermove", (e) => {
          if (!active || !dragging) return;
          setY(e.clientY);
        });

        function stopDrag() {
          dragging = false;
        }

        projectionFrame.addEventListener("pointerup", stopDrag);
        projectionFrame.addEventListener("pointercancel", stopDrag);
        window.addEventListener("resize", updateLoupe);

        window.NCEArchive = window.NCEArchive || {};
        window.NCEArchive.syncLoupe = syncLoupe;
        window.NCEArchive.isLoupeActive = () => active;
      })();

      // ── Simple built-in lamp effect. External randanime owns gate hair. ─

      (function lampSystem() {
        function flicker() {
          gate.classList.add("flickering");
          setTimeout(() => gate.classList.remove("flickering"), 700);
          const next = params.preview ? 5000 : (45 + Math.random() * 45) * 1000;
          setTimeout(flicker, next);
        }
        setTimeout(
          flicker,
          params.preview ? 1000 : (20 + Math.random() * 20) * 1000,
        );
      })();

      // ── Public API for companion ambient script. ─────────────────────────────
      window.NCEArchive = window.NCEArchive || {};
      Object.assign(window.NCEArchive, {
        gate,
        projectionFrame,
        ficheStage,
        ficheImg,
        getCurrentEntry: () => currentEntry,
        syncLoupe: window.NCEArchive.syncLoupe,
      });

      // ── Init ────────────────────────────────────────────────────────────────
      resizeGrain();
      drawGrain();
      loadAudio();
      mechanicalAdvanceTo(currentEntry, { firstLoad: true, updateUrl: false });
    </script>
    <script src="/randanime_preamble.js"></script>
  </body>
